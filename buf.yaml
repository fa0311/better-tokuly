version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Responses are frequently shared shapes (e.g. a Video) and request/response
    # pairs are still unique per RPC; keep the stricter naming rules otherwise.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_STANDARD_NAME
breaking:
  use:
    - WIRE_JSON
