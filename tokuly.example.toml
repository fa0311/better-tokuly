# Comments (and replies) one user may write per hour.
# (TOKULY_ENGAGEMENT_COMMENTS_PER_HOUR; console; restart: api, worker)
# comments_per_hour = 120

# Reports one user may file per hour.
# (TOKULY_ENGAGEMENT_REPORTS_PER_HOUR; console; restart: api, worker)
# reports_per_hour = 20

# Days after which an unanswered report no longer stops its reporter from reporting the same subject
# again.
# (TOKULY_ENGAGEMENT_REPORT_REPEAT_DAYS; console; restart: api, worker)
# report_repeat_days = 7

# Bookmark collections one user may have, counting the default one.
# (TOKULY_ENGAGEMENT_MAX_COLLECTIONS; console; restart: api, worker)
# max_collections = 100

# Subjects one bookmark collection may hold.
# (TOKULY_ENGAGEMENT_MAX_BOOKMARKS; console; restart: api, worker)
# max_bookmarks = 5000

# Distinct emoji one subject may carry. Once reached, only emoji already on it can be added
# (Discord's rule for messages).
# (TOKULY_ENGAGEMENT_REACTION_EMOJI_PER_SUBJECT; console; restart: api, worker)
# reaction_emoji_per_subject = 50

# Emoji one person may hold at once on a subject that takes several.
# (TOKULY_ENGAGEMENT_REACTIONS_PER_PERSON; console; restart: api, worker)
# reactions_per_person = 20

# Subject types on which one person may hold several distinct emoji (`SubjectType` names without the
# `SUBJECT_TYPE_` prefix, comma separated). Every other type takes one reaction per person.
# (TOKULY_ENGAGEMENT_MULTI_REACTION_TYPES; console; empty is a value; restart: api, worker)
# multi_reaction_types = ["COMMUNITY_THREAD", "COMMUNITY_REPLY", "COMMUNITY_EVENT", "PLAN"]
