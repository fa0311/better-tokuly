[package]
name = "tokuly-geo"
description = "Location ingest, ghost mode, places, visits, footprints, trips and safety."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokuly-core.workspace = true
tokuly-proto = { workspace = true, features = ["common", "geo", "identity", "media", "realtime"] }
tokuly-identity.workspace = true
tokuly-social.workspace = true
# Place photos and day-memo photos are media assets (already a dependency of identity).
tokuly-media.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
async-nats.workspace = true
futures.workspace = true
async-trait.workspace = true
connectrpc.workspace = true
buffa.workspace = true
sqlx.workspace = true
redis.workspace = true
clickhouse.workspace = true
reqwest.workspace = true
serde.workspace = true
# Positions round-trip through JSON (Valkey state, frozen pins in jsonb): they must come back bit for bit.
serde_json = { workspace = true, features = ["float_roundtrip"] }
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
# The workspace enables the async cache only; the caches here are read on synchronous paths.
moka = { workspace = true, features = ["sync"] }
parking_lot.workspace = true
h3o.workspace = true
geo.workspace = true
polyline.workspace = true
tzf-rs.workspace = true
# Bundled boundary and gazetteer data is gzip-compressed.
flate2 = "1.1"

[dev-dependencies]
tokuly-proto = { workspace = true, features = ["social"] }
tokuly-testkit.workspace = true
tokio = { workspace = true, features = ["test-util"] }
rand.workspace = true
