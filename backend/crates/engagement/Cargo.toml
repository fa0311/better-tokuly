[package]
name = "tokuly-engagement"
description = "Polymorphic comments, reactions, bookmarks, shares and reports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokuly-core.workspace = true
tokuly-proto = { workspace = true, features = ["common", "engagement", "media"] }
tokuly-identity.workspace = true
tokuly-media.workspace = true
tokuly-social.workspace = true
tokuly-stamp.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
connectrpc.workspace = true
buffa.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
unicode-segmentation.workspace = true
unicode-normalization.workspace = true

[dev-dependencies]
# A gateway and a WebSocket client, to see subscriptions end.
tokuly-realtime = { workspace = true, features = ["testing"] }
# A real domain whose content can be withdrawn after it reached people
# (unsent and edited messages), for the report path.
tokuly-chat.workspace = true
# API packages only the tests name.
tokuly-proto = { workspace = true, features = ["chat", "social", "stamp"] }
tokuly-testkit.workspace = true
