[package]
name = "tokuly-spaces"
description = "Drop-in audio rooms and always-on hangout rooms on LiveKit."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokuly-core.workspace = true
tokuly-proto = { workspace = true, features = ["common", "identity", "spaces"] }
tokuly-identity.workspace = true
tokuly-social.workspace = true
tokio.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
connectrpc.workspace = true
buffa.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
url.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]
# A gateway and a WebSocket client, to see subscriptions end.
tokuly-realtime = { workspace = true, features = ["testing"] }
# API packages only the tests name.
tokuly-proto = { workspace = true, features = ["social"] }
tokuly-testkit.workspace = true
futures.workspace = true
http.workspace = true
http-body-util.workspace = true
tower.workspace = true
# A signalling connection to LiveKit stands in for a client that joined a room.
tokio-tungstenite = "0.29"
