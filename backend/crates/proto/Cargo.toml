[package]
name = "tokuly-proto"
description = "Generated protobuf messages and Connect RPC service stubs for the Tokuly API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

# The library has no unit tests, benchmarks or doc tests (its tests are in
# `tests/`). Without this, `cargo test` and `cargo build --all-targets` compile
# the whole generated API a second time as an empty test harness, next to the
# library: two multi-GB compilers at once, which CI runners did not survive.
[lib]
test = false
bench = false
doctest = false

# One feature per proto package (`proto/tokuly/<package>`), listing the
# packages its `.proto` files import. A crate enables the packages it names in
# its own code; there is no default, so nothing compiles an API it does not use.
# `tests/features.rs` keeps this table in step with the proto tree.
[features]
admin = ["common"]
ask = ["common"]
chat = ["common", "media"]
common = []
community = ["common"]
dev = ["common"]
emoji = ["common"]
engagement = ["common"]
feed = ["common"]
geo = ["common", "identity"]
identity = ["common"]
live = ["common"]
media = ["common"]
notes = ["common", "media"]
notify = ["common"]
plans = ["common"]
quest = ["common"]
realtime = ["common"]
school = ["common"]
search = ["common"]
shorts = ["common", "media"]
social = ["common", "identity"]
spaces = ["common"]
stamp = ["common"]
video = ["common", "media"]
wallet = ["common"]
# The generated `<Service>Client` types, for calling the API over Connect.
client = []

[dependencies]
connectrpc.workspace = true
buffa.workspace = true
buffa-types.workspace = true
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
connectrpc-build.workspace = true
