[package]
name = "tokuly-realtime"
description = "Realtime gateway: WebTransport + WebSocket fan-out of live events."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# `tokuly_realtime::testing`: a gateway on ephemeral ports and a small
# WebSocket client, for other crates' tests (dev-dependency only).
testing = ["dep:tokio-tungstenite"]

[dependencies]
tokuly-core.workspace = true
# `geo`: location samples are checked before they enter the pipeline, and a
# friend's position is the one event that may be dropped under pressure.
tokuly-proto = { workspace = true, features = ["common", "geo", "realtime"] }
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
axum.workspace = true
http.workspace = true
bytes.workspace = true
connectrpc.workspace = true
buffa.workspace = true
# `quinn` exposes the QUIC transport settings (stream and datagram limits).
wtransport = { workspace = true, features = ["quinn"] }
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
url.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
dashmap.workspace = true
hex.workspace = true
tokio-tungstenite = { version = "0.29", optional = true }

[dev-dependencies]
tokuly-testkit.workspace = true
# The version axum uses, so the tests add no second copy of it.
tokio-tungstenite = "0.29"
async-nats.workspace = true
# Tests mint short-lived access tokens to exercise token expiry.
ed25519-dalek.workspace = true
tempfile.workspace = true
# Tests implement `tokuly_core::realtime::TopicGuard`.
async-trait.workspace = true
