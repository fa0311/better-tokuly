[package]
name = "tokuly-feed"
description = "Activity logs, map stories, personalized news and home feeds."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokuly-core.workspace = true
tokuly-proto = { workspace = true, features = ["common", "feed"] }
tokuly-identity.workspace = true
tokuly-social.workspace = true
tokio.workspace = true
futures.workspace = true
async-trait.workspace = true
connectrpc.workspace = true
buffa.workspace = true
sqlx.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
url.workspace = true
reqwest.workspace = true
bytes.workspace = true
unicode-normalization.workspace = true
# RSS / Atom / JSON Feed parsing for the news fetcher.
feed-rs = "3.0.0"
# One extra pass over feed documents for item thumbnails feed-rs drops
# (the version feed-rs itself uses, so nothing is compiled twice).
quick-xml = { version = "0.42.0", features = ["encoding"] }

[dev-dependencies]
# API packages only the tests name.
tokuly-proto = { workspace = true, features = ["social"] }
tokuly-testkit.workspace = true
axum.workspace = true
# Only for the payload structs of the events feed follows (tests build them
# from the producers' own types, so a renamed field fails a test).
tokuly-notes.workspace = true
tokuly-video.workspace = true
tokuly-shorts.workspace = true
tokuly-live.workspace = true
tokuly-stamp.workspace = true
tokuly-ask.workspace = true
