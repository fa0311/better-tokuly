[package]
name = "tokuly-testkit"
description = "Integration test harness: an isolated database, a wired-up Core and in-process RPC calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The workspace lints, except that `unsafe_code` is `deny` instead of `forbid`:
# registering the clean-up at process exit (`src/run.rs`) needs one `atexit` call.
[lints.rust]
refining_impl_trait_internal = "allow"
refining_impl_trait_reachable = "allow"
unsafe_code = "deny"

[lints.cargo]
unused_workspace_dependencies = "allow"
unused_dependencies = "allow"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
result_large_err = "allow"

[dependencies]
tokuly-core.workspace = true
tokuly-proto = { workspace = true, features = ["common", "realtime"] }
tokuly-identity.workspace = true
tokio.workspace = true
futures.workspace = true
axum.workspace = true
tower.workspace = true
http.workspace = true
http-body-util.workspace = true
bytes.workspace = true
connectrpc.workspace = true
buffa.workspace = true
sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
clap.workspace = true
rand.workspace = true
async-nats.workspace = true
clickhouse.workspace = true
anyhow.workspace = true
libc.workspace = true
