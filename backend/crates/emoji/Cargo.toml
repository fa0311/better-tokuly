[package]
name = "tokuly-emoji"
description = "Custom emoji: the catalogue, submissions and review, reaction decks."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
tokuly-core.workspace = true
tokuly-proto = { workspace = true, features = ["common", "emoji", "identity", "media"] }
tokuly-identity.workspace = true
tokuly-media.workspace = true
tokio.workspace = true
async-trait.workspace = true
connectrpc.workspace = true
buffa.workspace = true
sqlx.workspace = true
redis.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
clap.workspace = true
tracing.workspace = true
anyhow.workspace = true
parking_lot.workspace = true
tempfile.workspace = true
unicode-normalization.workspace = true
unicode-segmentation.workspace = true
# Emoji packs are ZIP archives (Misskey's export format). Deflate is the only
# compression such packs use; zopfli (the slow, smaller encoder that the
# crate's `deflate` feature adds) is not needed.
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokuly-testkit.workspace = true
futures.workspace = true
tracing-subscriber.workspace = true
# Fixture images for the import tests.
image.workspace = true
