// Which of the people inside to list.
enum ParticipantFilter {
  // Everyone: stage, raised hands, then the rest.
  PARTICIPANT_FILTER_UNSPECIFIED = 0;
  // Host, co-hosts and speakers.
  PARTICIPANT_FILTER_STAGE = 1;
  // Listeners whose hand is up, first raised first.
  PARTICIPANT_FILTER_HANDS = 2;
  // Listeners.
  PARTICIPANT_FILTER_AUDIENCE = 3;
  // People who were inside and are not any more (they left, dropped off,
  // were removed or banned, or the room ended), last to leave first: the
  // way to find someone to report or block after they are gone. Everyone
  // who may see the room gets those who were on stage at some point;
  // moderators get everyone. Works on rooms that ended, too.
  PARTICIPANT_FILTER_PAST = 4;
}

message ListParticipantsRequest {
  string space_id = 1;
  ParticipantFilter filter = 2;
  tokuly.common.v1.PageRequest page = 3;
}

message ListParticipantsResponse {
  repeated SpaceParticipant participants = 1;
  tokuly.common.v1.PageInfo page = 2;
  // Listeners left out of this page because they do not share their online
  // status. Always 0 for moderators, who see everyone.
  int32 hidden_count = 3;
}

