// ───────────────────────────── realtime ─────────────────────────────

// Pushed over the realtime gateway (tokuly.realtime.v1.ServerFrame.spaces).
//
// Events about a room go to the topic `space:<space id>`, which may be
// followed by anyone who may see the room (public rooms: anyone, signed in
// or not). Events about one person, and everything about hangouts, go to
// the users concerned.
message SpacesEvent {
  oneof event {
    // Topic: the room started, ended, was handed over, or its title, tags,
    // audience, schedule or pin changed.
    SpaceUpdated space_updated = 1;
    // Topic: someone came on stage, changed role, or raised or lowered a
    // hand. Listeners entering quietly are not announced one by one; see
    // `counts`.
    SpaceParticipantUpdated participant_updated = 2;
    // Topic, when the person was on stage or had a hand up; and always to
    // the person themselves when it was not their own doing.
    SpaceParticipantLeft participant_left = 3;
    // Topic: how many people are inside. Sent on every change in small
    // rooms and every few seconds at most in large ones.
    SpaceCounts counts = 4;
    // Topic: an emoji burst.
    SpaceReaction reaction = 5;
    // Topic: a moderator muted a speaker.
    SpeakerMuted speaker_muted = 6;
    // User: a moderator invited them on stage, or took the invitation back.
    StageInvitation stage_invitation = 7;
    // User: they were invited to a room.
    SpaceInvitation space_invitation = 8;
    // Members and invitees: the hangout or its members changed.
    HangoutUpdated hangout_updated = 9;
    // Members and invitees: the hangout is gone, or they are no longer part
    // of it.
    HangoutRemoved hangout_removed = 10;
    // Members: someone entered or left the voice room.
    HangoutPresence hangout_presence = 11;
    // User: they were invited to a hangout.
    HangoutInvitation hangout_invitation = 12;
  }
}

message SpaceUpdated {
  // Without `viewer`.
  Space space = 1;
}

message SpaceParticipantUpdated {
  string space_id = 1;
  SpaceParticipant participant = 2;
}

message SpaceParticipantLeft {
  string space_id = 1;
  string user_id = 2;
  SpaceLeaveReason reason = 3;
}

message SpaceCounts {
  string space_id = 1;
  int32 listener_count = 2;
  int32 speaker_count = 3;
  int32 hand_count = 4;
  int32 peak_listeners = 5;
}

message SpaceReaction {
  string space_id = 1;
  string user_id = 2;
  string emoji = 3;
}

message SpeakerMuted {
  string space_id = 1;
  string user_id = 2;
  string muted_by_id = 3;
}

message StageInvitation {
  string space_id = 1;
  // False when the invitation was taken back.
  bool invited = 2;
  tokuly.common.v1.UserSummary invited_by = 3;
}

message SpaceInvitation {
  // Without `viewer`.
  Space space = 1;
  tokuly.common.v1.UserSummary invited_by = 2;
}

message HangoutUpdated {
  // Without `viewer`.
  Hangout hangout = 1;
}

message HangoutRemoved {
  string hangout_id = 1;
}

message HangoutPresence {
  string hangout_id = 1;
  tokuly.common.v1.UserSummary user = 2;
  // True: entered; false: left.
  bool inside = 3;
  // People inside after the change.
  int32 inside_count = 4;
}

message HangoutInvitation {
  // Without `viewer`.
  Hangout hangout = 1;
  tokuly.common.v1.UserSummary invited_by = 2;
}
