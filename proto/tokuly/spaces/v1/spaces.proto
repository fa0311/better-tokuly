syntax = "proto3";

// Drop-in audio rooms and always-on hangout rooms (たまり場) on LiveKit.
//
// Two products share this package:
//
// - A **room** (`Space`, SpaceService) is a talk with a stage and an
//   audience, in the manner of Twitter Spaces: a host, co-hosts and speakers
//   talk, listeners listen, raise a hand and send emoji. It is scheduled or
//   started on the spot, runs once and ends.
// - A **hangout** (`Hangout`, HangoutService) is a voice room that belongs
//   to a group of friends and never ends: it is simply open whenever
//   someone is inside, and who is inside is the whole point.
//
// Audio never passes through this API. JoinSpace / JoinHangout return
// `AudioCredentials`: a LiveKit URL, room name and access token a LiveKit
// client SDK connects with. What the token allows follows the role
// (listeners can only subscribe), and a role change takes effect on the
// connection at once. A person is inside one room or hangout at a time:
// joining another leaves the first.
//
// The server keeps "who is inside" true by comparing with LiveKit: someone
// whose app crashed disappears after a short grace period, and a room whose
// host stays away is handed to a co-host or ended.
//
// RPCs that need audio fail with AUDIO_NOT_CONFIGURED (unavailable) when the
// server has no LiveKit, and with AUDIO_UNAVAILABLE (unavailable) when
// LiveKit cannot be reached; everything else keeps working.
// GetSpacesConfig tells clients in advance.
package tokuly.spaces.v1;

import "google/protobuf/timestamp.proto";
import "tokuly/common/v1/common.proto";

// Audio rooms with a stage and an audience.
//
// Unless noted, RPCs need a signed-in caller (SIGN_IN_REQUIRED) and answer
// SPACE_NOT_FOUND for a room the caller may not see: a room that is not
// public and to which they are neither invited nor (for friends rooms) a
// friend of the host, and any room of a host on either side of a block.
// "Moderator" below means the host or a co-host. Lists are rate limited
// per caller (RATE_LIMITED), like everything that reaches other people.
service SpaceService {
  // What this server offers: whether audio is configured and the limits
  // rooms and hangouts are held to. Callable without signing in.
  rpc GetSpacesConfig(GetSpacesConfigRequest) returns (GetSpacesConfigResponse);

  // Creates a room. Without `scheduled_at` it goes live at once with the
  // caller inside as host (credentials are returned); with it, the room is
  // announced as upcoming and waits for StartSpace. A host has one live
  // room at a time.
  // Errors: INVALID_TITLE, INVALID_TAGS, INVALID_LANGUAGE, INVALID_AUDIENCE,
  // INVALID_SCHEDULE (in the past, or too far ahead), TOO_MANY_SPACES (too
  // many upcoming rooms), ALREADY_HOSTING, NOT_FRIENDS / TOO_MANY_INVITES (see
  // InviteToSpace), AUDIO_NOT_CONFIGURED / AUDIO_UNAVAILABLE / ENTERING_ELSEWHERE
  // (instant rooms only; see JoinSpace), RATE_LIMITED.
  rpc CreateSpace(CreateSpaceRequest) returns (CreateSpaceResponse);
  // Changes a room's title, tags and language (any time before it ends) or
  // its audience and schedule (only while it is upcoming). Host only.
  // Errors: SPACE_NOT_FOUND, NOT_HOST, SPACE_ENDED, SPACE_NOT_SCHEDULED
  // (audience or schedule of a room that already started), RATE_LIMITED,
  // and the validation errors of CreateSpace.
  rpc UpdateSpace(UpdateSpaceRequest) returns (UpdateSpaceResponse);
  // Starts an upcoming room, early or late, with the host inside. People
  // who asked to be reminded are told, as are the host's friends when it is
  // a friends room.
  // Errors: SPACE_NOT_FOUND, NOT_HOST, SPACE_NOT_SCHEDULED, ALREADY_HOSTING,
  // AUDIO_NOT_CONFIGURED, AUDIO_UNAVAILABLE, ENTERING_ELSEWHERE (see JoinSpace),
  // RATE_LIMITED (a host takes a few rooms live per hour).
  rpc StartSpace(StartSpaceRequest) returns (StartSpaceResponse);
  // Calls an upcoming room off. Host only.
  // Errors: SPACE_NOT_FOUND, NOT_HOST, SPACE_NOT_SCHEDULED.
  rpc CancelSpace(CancelSpaceRequest) returns (CancelSpaceResponse);
  // Ends a live room for everyone. Host only. Ending a room that already
  // ended succeeds.
  // Errors: SPACE_NOT_FOUND, NOT_HOST, SPACE_NOT_LIVE (still upcoming).
  rpc EndSpace(EndSpaceRequest) returns (EndSpaceResponse);
  // Removes a room that ended or was cancelled from the host's history; it
  // reads as SPACE_NOT_FOUND from then on. What moderation needs of it
  // (who was there) is kept for a while longer, and people who were in the
  // room or invited to it can still report it.
  // Errors: SPACE_NOT_FOUND, NOT_HOST, SPACE_NOT_ENDED.
  rpc DeleteSpace(DeleteSpaceRequest) returns (DeleteSpaceResponse);
  // One room with its stage, as the caller sees it. Public rooms can be
  // read without signing in.
  // Errors: SPACE_NOT_FOUND.
  rpc GetSpace(GetSpaceRequest) returns (GetSpaceResponse);

  // Enters a live room and returns the credentials to connect. The caller
  // comes in with the role they hold: the host as host, a co-host as
  // co-host, everyone else as a listener. Joining again (a reconnect,
  // another device) returns fresh credentials for the current role.
  // Someone who is banned from the room does not see it any more
  // (SPACE_NOT_FOUND); BANNED_FROM_SPACE is only the answer to a ban that
  // lands while they are on their way in.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, BANNED_FROM_SPACE, SPACE_FULL,
  // ENTERING_ELSEWHERE (unavailable: the caller is entering another room or
  // hangout at this very moment; try again), AUDIO_NOT_CONFIGURED,
  // AUDIO_UNAVAILABLE, RATE_LIMITED.
  rpc JoinSpace(JoinSpaceRequest) returns (JoinSpaceResponse);
  // Leaves a room. A speaker returns as a listener; the host keeps the room
  // for a while (see `SpacesConfig.host_grace_seconds`). Leaving a room one
  // is not in succeeds.
  // Errors: SPACE_NOT_FOUND.
  rpc LeaveSpace(LeaveSpaceRequest) returns (LeaveSpaceResponse);
  // The people inside a live room: the stage first (host, co-hosts,
  // speakers), then raised hands in the order they went up, then the rest
  // of the audience. PARTICIPANT_FILTER_PAST lists who is gone instead.
  // The stage is for everyone who may see the room. Who is listening is
  // only listed to people who are inside themselves and to moderators (to
  // anyone else the unfiltered list is the stage), and who is gone only to
  // people who were inside. Except for moderators, people on either side of
  // a block with the caller are left out, and listeners who do not share
  // their online status are only counted (`hidden_count`).
  // Errors: SPACE_NOT_FOUND, NOT_IN_SPACE (audience, hands or past asked for
  // from outside), RATE_LIMITED.
  rpc ListParticipants(ListParticipantsRequest) returns (ListParticipantsResponse);

  // Raises or lowers the caller's hand to ask for the stage.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_IN_SPACE, ALREADY_ON_STAGE,
  // RATE_LIMITED.
  rpc SetHandRaised(SetHandRaisedRequest) returns (SetHandRaisedResponse);
  // Brings a listener on stage. Someone whose hand is up becomes a speaker
  // at once (`on_stage` is set); anyone else gets an invitation to answer
  // with RespondToStageInvite. Moderators only.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_MODERATOR,
  // TARGET_NOT_IN_SPACE, ALREADY_ON_STAGE, STAGE_FULL, RATE_LIMITED (also when
  // the same person is invited over and over).
  rpc InviteToStage(InviteToStageRequest) returns (InviteToStageResponse);
  // Accepts (the caller becomes a speaker) or declines a stage invitation.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_IN_SPACE,
  // NO_STAGE_INVITATION, STAGE_FULL.
  rpc RespondToStageInvite(RespondToStageInviteRequest) returns (RespondToStageInviteResponse);
  // Moves a speaker back to the audience. With an empty `user_id` the
  // caller steps down themselves (a co-host gives up the role too);
  // otherwise moderators only, and it also withdraws a stage invitation and
  // dismisses a raised hand of someone in the audience. The host cannot be
  // moved; a co-host only by the host.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_IN_SPACE, NOT_MODERATOR,
  // TARGET_NOT_IN_SPACE, CANNOT_MODERATE_USER, HOST_CANNOT_STEP_DOWN (use
  // TransferHost or EndSpace), RATE_LIMITED.
  rpc MoveToAudience(MoveToAudienceRequest) returns (MoveToAudienceResponse);
  // Makes someone inside a co-host, or takes the role away again (they stay
  // on stage as a speaker). Host only.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_HOST, TARGET_NOT_IN_SPACE,
  // TOO_MANY_COHOSTS, STAGE_FULL, INVALID_USER (the host themselves),
  // RATE_LIMITED.
  rpc SetCohost(SetCohostRequest) returns (SetCohostResponse);
  // Hands the room to someone inside; the caller stays as a co-host.
  // Host only.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_HOST, TARGET_NOT_IN_SPACE,
  // ALREADY_HOSTING (the new host runs another live room), STAGE_FULL,
  // INVALID_USER, RATE_LIMITED.
  rpc TransferHost(TransferHostRequest) returns (TransferHostResponse);
  // Mutes a speaker's microphone on the server. They can unmute themselves;
  // to keep someone quiet, move them to the audience. Moderators only; the
  // host can only be muted by themselves, a co-host only by the host.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_MODERATOR,
  // TARGET_NOT_IN_SPACE, NOT_ON_STAGE, CANNOT_MODERATE_USER,
  // AUDIO_NOT_CONFIGURED, AUDIO_UNAVAILABLE, RATE_LIMITED.
  rpc MuteSpeaker(MuteSpeakerRequest) returns (MuteSpeakerResponse);
  // Removes someone from the room; with `ban` they cannot come back (and
  // need not be inside to be banned). Moderators only; the host cannot be
  // removed, a co-host only by the host.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_MODERATOR,
  // TARGET_NOT_IN_SPACE (without `ban`), CANNOT_MODERATE_USER, INVALID_USER,
  // RATE_LIMITED.
  rpc RemoveParticipant(RemoveParticipantRequest) returns (RemoveParticipantResponse);
  // Lifts a ban. Moderators only. Succeeds when there was none.
  // Errors: SPACE_NOT_FOUND, NOT_MODERATOR.
  rpc UnbanUser(UnbanUserRequest) returns (UnbanUserResponse);
  // The people banned from a room, newest first. Moderators only.
  // Errors: SPACE_NOT_FOUND, NOT_MODERATOR.
  rpc ListBans(ListBansRequest) returns (ListBansResponse);

  // Sends an emoji burst to everyone in the room. Not stored; delivered
  // over realtime only, and thinned out when a large room sends more than
  // anyone could watch. Callers must be inside.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_LIVE, NOT_IN_SPACE, INVALID_EMOJI,
  // RATE_LIMITED.
  rpc SendReaction(SendReactionRequest) returns (SendReactionResponse);
  // Pins a note, a link or both at the top of the room; empty `text` and
  // `url` unpin. Moderators only.
  // Errors: SPACE_NOT_FOUND, SPACE_ENDED, NOT_MODERATOR, INVALID_PIN,
  // RATE_LIMITED.
  rpc SetPin(SetPinRequest) returns (SetPinResponse);

  // Invites friends of the caller to a room and notifies them. An
  // invitation lets its holder into a friends or invited-only room. In a
  // public room anyone inside may invite; otherwise moderators only.
  // People who are already invited, banned from the room or unable to see
  // the host's rooms are skipped without a word. Someone the caller keeps
  // inviting is told only the first few times a day.
  // Errors: SPACE_NOT_FOUND, SPACE_ENDED, NOT_MODERATOR, NOT_FRIENDS (someone
  // is not the caller's friend), TOO_MANY_INVITES, RATE_LIMITED.
  rpc InviteToSpace(InviteToSpaceRequest) returns (InviteToSpaceResponse);
  // Takes an invitation back. Moderators only. The person is not removed
  // from the room if they are already inside, and can still report the
  // room they were invited to.
  // Errors: SPACE_NOT_FOUND, NOT_MODERATOR.
  rpc RevokeSpaceInvite(RevokeSpaceInviteRequest) returns (RevokeSpaceInviteResponse);
  // The people invited to a room, newest first. Moderators only.
  // Errors: SPACE_NOT_FOUND, NOT_MODERATOR.
  rpc ListSpaceInvites(ListSpaceInvitesRequest) returns (ListSpaceInvitesResponse);
  // Asks to be told when an upcoming room starts, or takes that back.
  // Errors: SPACE_NOT_FOUND, SPACE_NOT_SCHEDULED, RATE_LIMITED.
  rpc SetReminder(SetReminderRequest) returns (SetReminderResponse);

  // Rooms that are live right now. FRIENDS: rooms the caller may enter in
  // which a friend is inside, with those friends. PUBLIC: public rooms
  // ranked by listeners, optionally of one tag or language; callable
  // without signing in. Rooms the caller is banned from and rooms of hosts
  // on either side of a block are left out.
  // Errors: INVALID_SCOPE, SIGN_IN_REQUIRED (FRIENDS), RATE_LIMITED.
  rpc ListLiveSpaces(ListLiveSpacesRequest) returns (ListLiveSpacesResponse);
  // Upcoming rooms the caller may enter, soonest first: public rooms
  // (optionally of one tag or language), rooms of friends and rooms they are
  // invited to. Without signing in: public rooms only.
  rpc ListUpcomingSpaces(ListUpcomingSpacesRequest) returns (ListUpcomingSpacesResponse);
  // The caller's own rooms: live and upcoming first, then past ones,
  // newest first.
  rpc ListMySpaces(ListMySpacesRequest) returns (ListMySpacesResponse);
  // Tags of the public rooms that are live right now, most listeners first.
  // Callable without signing in.
  rpc ListPopularTags(ListPopularTagsRequest) returns (ListPopularTagsResponse);
  // Friends who are inside a room or hangout the caller could enter right
  // now, for friend lists and the map. Friends who hide their online
  // status are left out.
  rpc ListFriendsInRooms(ListFriendsInRoomsRequest) returns (ListFriendsInRoomsResponse);
}

// Always-on voice rooms of friend groups (たまり場).
//
// Every RPC needs a signed-in caller and answers HANGOUT_NOT_FOUND for a
// hangout the caller neither belongs nor is invited to.
service HangoutService {
  // Creates a hangout owned by the caller and invites `invitee_ids` to it.
  // Errors: INVALID_NAME, INVALID_EMOJI, TOO_MANY_HANGOUTS, NOT_FRIENDS,
  // HANGOUT_FULL, RATE_LIMITED.
  rpc CreateHangout(CreateHangoutRequest) returns (CreateHangoutResponse);
  // Renames a hangout, changes its emoji or who may invite. Owner only.
  // Errors: HANGOUT_NOT_FOUND, NOT_OWNER, INVALID_NAME, INVALID_EMOJI,
  // RATE_LIMITED.
  rpc UpdateHangout(UpdateHangoutRequest) returns (UpdateHangoutResponse);
  // Closes a hangout for good; anyone inside is disconnected. Owner only.
  // People who belonged to it can still report it for a while.
  // Errors: HANGOUT_NOT_FOUND, NOT_OWNER.
  rpc DeleteHangout(DeleteHangoutRequest) returns (DeleteHangoutResponse);
  // One hangout with its members and who is inside right now.
  // Errors: HANGOUT_NOT_FOUND.
  rpc GetHangout(GetHangoutRequest) returns (GetHangoutResponse);
  // The caller's hangouts — open ones first, then the most recently used —
  // each with who is inside right now, and the invitations waiting for an
  // answer.
  rpc ListHangouts(ListHangoutsRequest) returns (ListHangoutsResponse);
  // Invites friends of the caller. The owner always may; members when the
  // hangout allows it. People who are already part of it, or in a block
  // with the owner, are skipped without a word. Someone the caller keeps
  // inviting is told only the first few times a day.
  // Errors: HANGOUT_NOT_FOUND, INVITES_NOT_ALLOWED, NOT_FRIENDS (someone is
  // not the caller's friend), TOO_MANY_INVITES (more than 50 at a time),
  // HANGOUT_FULL, RATE_LIMITED.
  rpc InviteToHangout(InviteToHangoutRequest) returns (InviteToHangoutResponse);
  // Accepts or declines an invitation.
  // Errors: HANGOUT_NOT_FOUND, NO_INVITATION, HANGOUT_FULL,
  // TOO_MANY_HANGOUTS (the caller belongs to too many).
  rpc RespondToHangoutInvite(RespondToHangoutInviteRequest) returns (RespondToHangoutInviteResponse);
  // Removes a member, or takes an invitation back. The owner may remove
  // anyone; a member may take back an invitation they sent.
  // Errors: HANGOUT_NOT_FOUND, NOT_OWNER, TARGET_NOT_A_MEMBER,
  // INVALID_USER (the owner themselves).
  rpc RemoveHangoutMember(RemoveHangoutMemberRequest) returns (RemoveHangoutMemberResponse);
  // Stops being a member. The owner hands the hangout over first
  // (TransferHangout) or deletes it.
  // Errors: HANGOUT_NOT_FOUND, OWNER_CANNOT_QUIT.
  rpc QuitHangout(QuitHangoutRequest) returns (QuitHangoutResponse);
  // Makes another member the owner. Owner only.
  // Errors: HANGOUT_NOT_FOUND, NOT_OWNER, TARGET_NOT_A_MEMBER, INVALID_USER,
  // TOO_MANY_HANGOUTS (the new owner owns too many).
  rpc TransferHangout(TransferHangoutRequest) returns (TransferHangoutResponse);
  // Silences (or restores) the caller's "someone is in the hangout"
  // notifications for one hangout.
  // Errors: HANGOUT_NOT_FOUND.
  rpc SetHangoutMuted(SetHangoutMutedRequest) returns (SetHangoutMutedResponse);

  // Enters the hangout's voice room and returns the credentials to
  // connect; everyone inside can talk. The other members see the caller
  // inside at once, and friends among them are notified when the caller is
  // the first one in. Joining again returns fresh credentials. Members only.
  // Errors: HANGOUT_NOT_FOUND, NOT_A_MEMBER (invited, not yet accepted),
  // ENTERING_ELSEWHERE (unavailable: the caller is entering another room or
  // hangout at this very moment; try again), AUDIO_NOT_CONFIGURED,
  // AUDIO_UNAVAILABLE, RATE_LIMITED.
  rpc JoinHangout(JoinHangoutRequest) returns (JoinHangoutResponse);
  // Leaves the voice room; the membership stays. Leaving when not inside
  // succeeds.
  // Errors: HANGOUT_NOT_FOUND.
  rpc LeaveHangout(LeaveHangoutRequest) returns (LeaveHangoutResponse);
}

// ───────────────────────────── rooms ─────────────────────────────

// Who may enter a room.
enum SpaceAudience {
  SPACE_AUDIENCE_UNSPECIFIED = 0;
  // Anyone signed in. Listed in discovery and search.
  SPACE_AUDIENCE_PUBLIC = 1;
  // Friends of the host, and people invited by a moderator. The default.
  SPACE_AUDIENCE_FRIENDS = 2;
  // Only people invited by a moderator.
  SPACE_AUDIENCE_INVITED = 3;
}

enum SpaceState {
  SPACE_STATE_UNSPECIFIED = 0;
  // Announced for `scheduled_at`; nobody can enter yet.
  SPACE_STATE_SCHEDULED = 1;
  SPACE_STATE_LIVE = 2;
  SPACE_STATE_ENDED = 3;
  // An upcoming room that was called off or never started.
  SPACE_STATE_CANCELLED = 4;
}

// Why a room ended or was cancelled.
enum SpaceEndReason {
  SPACE_END_REASON_UNSPECIFIED = 0;
  // The host ended (or cancelled) it.
  SPACE_END_REASON_HOST_ENDED = 1;
  // The host stayed away and no co-host was there to take over.
  SPACE_END_REASON_HOST_LEFT = 2;
  // Nobody was inside any more.
  SPACE_END_REASON_EMPTY = 3;
  // Taken down by moderation.
  SPACE_END_REASON_MODERATION = 4;
  // The host's account was closed. Only the host is told so; everyone
  // else sees HOST_LEFT.
  SPACE_END_REASON_ACCOUNT_CLOSED = 5;
  // An upcoming room nobody started within a day of its time.
  SPACE_END_REASON_NEVER_STARTED = 6;
}

// What someone is in a room. Everything from SPEAKER up is "on stage" and
// may talk.
enum SpaceRole {
  SPACE_ROLE_UNSPECIFIED = 0;
  // In the audience: hears the room, cannot talk.
  SPACE_ROLE_LISTENER = 1;
  SPACE_ROLE_SPEAKER = 2;
  // Moderates like the host, short of ending the room, handing it over
  // and naming co-hosts.
  SPACE_ROLE_COHOST = 3;
  SPACE_ROLE_HOST = 4;
}

// Why someone is no longer inside.
enum SpaceLeaveReason {
  SPACE_LEAVE_REASON_UNSPECIFIED = 0;
  // They left (or entered another room).
  SPACE_LEAVE_REASON_LEFT = 1;
  // A moderator removed them.
  SPACE_LEAVE_REASON_REMOVED = 2;
  // A moderator removed and banned them.
  SPACE_LEAVE_REASON_BANNED = 3;
  // Their connection was gone for too long.
  SPACE_LEAVE_REASON_DISCONNECTED = 4;
  // The room ended.
  SPACE_LEAVE_REASON_ENDED = 5;
}

// An audio room.
message Space {
  string id = 1;
  string title = 2;
  // Topic tags without the leading '#', lowercase.
  repeated string tags = 3;
  // Language the room is held in: a BCP 47 primary tag ("ja", "en"), or
  // empty when the host did not say.
  string language = 4;
  SpaceAudience audience = 5;
  SpaceState state = 6;
  tokuly.common.v1.UserSummary host = 7;
  // Planned start; unset for rooms started on the spot.
  google.protobuf.Timestamp scheduled_at = 8;
  google.protobuf.Timestamp started_at = 9;
  google.protobuf.Timestamp ended_at = 10;
  // Set once the room ended or was cancelled.
  SpaceEndReason end_reason = 11;
  // Everyone inside right now, the stage included.
  int32 listener_count = 12;
  // People on stage right now (host, co-hosts, speakers).
  int32 speaker_count = 13;
  // Hands that are up right now.
  int32 hand_count = 14;
  // The most people that were inside at once.
  int32 peak_listeners = 15;
  // Different people who entered the room at some point.
  int32 total_listeners = 16;
  // Seats on stage, the host's included.
  int32 max_speakers = 17;
  SpacePin pin = 18;
  // Who is on stage right now, host first. Filled in GetSpace, in the
  // responses of RPCs that act on one room, and in realtime pushes; lists
  // carry at most a few for avatars.
  repeated SpaceParticipant stage = 19;
  // People who asked to be reminded of an upcoming room.
  int32 reminder_count = 20;
  google.protobuf.Timestamp created_at = 21;
  // The caller's own relation to the room. Unset in realtime pushes and
  // for anonymous callers.
  SpaceViewer viewer = 22;
  // Friends of the caller who are inside (ListLiveSpaces only).
  repeated tokuly.common.v1.UserSummary friends_inside = 23;
}

// A note or a link pinned at the top of a room.
message SpacePin {
  // Up to 200 characters.
  string text = 1;
  // An http(s) link, or empty.
  string url = 2;
  google.protobuf.Timestamp pinned_at = 3;
  string pinned_by_id = 4;
}

// The caller's relation to a room.
message SpaceViewer {
  // Inside right now.
  bool inside = 1;
  // The role the caller has, or would enter with (the host and co-hosts
  // keep theirs while away).
  SpaceRole role = 2;
  bool hand_raised = 3;
  // A moderator invited the caller on stage; answer with
  // RespondToStageInvite.
  bool stage_invited = 4;
  // The caller asked to be reminded when the room starts.
  bool reminder_set = 5;
  // The caller holds an invitation to the room.
  bool invited = 6;
}

// Someone inside a room.
message SpaceParticipant {
  tokuly.common.v1.UserSummary user = 1;
  SpaceRole role = 2;
  // Set while their hand is up.
  google.protobuf.Timestamp hand_raised_at = 3;
  // A stage invitation is waiting for their answer. Only shown to
  // moderators and to the person themselves; never set in realtime pushes.
  bool stage_invited = 4;
  // When they entered (this time).
  google.protobuf.Timestamp joined_at = 5;
  // PARTICIPANT_FILTER_PAST only: when and why they are no longer inside.
  // `role` is then the highest role they held in the room.
  google.protobuf.Timestamp left_at = 6;
  SpaceLeaveReason leave_reason = 7;
}

// What a LiveKit client needs to connect to a room's audio.
message AudioCredentials {
  // LiveKit server URL (`ws://` / `wss://`).
  string url = 1;
  // LiveKit room name.
  string room = 2;
  // Access token for this user, room and role. Connect before `expires_at`;
  // an established connection outlives it.
  string token = 3;
  google.protobuf.Timestamp expires_at = 4;
  // What the token allows; changes later arrive through LiveKit itself.
  bool can_publish = 5;
}

message GetSpacesConfigRequest {}

// Limits of this server.
message SpacesConfig {
  // False when the server runs without LiveKit: rooms cannot go live and
  // nobody can enter a hangout.
  bool audio_enabled = 1;
  // Seats on stage, the host's included.
  int32 max_speakers = 2;
  int32 max_cohosts = 3;
  // People a room holds, the stage included.
  int32 max_listeners = 4;
  int32 max_title_length = 5;
  int32 max_tags = 6;
  // How far ahead a room can be scheduled.
  int32 max_schedule_days = 7;
  // How long a room waits for its host before it is handed to a co-host
  // or ended.
  int32 host_grace_seconds = 8;
  // Hangouts one person may own.
  int32 max_hangouts = 9;
  int32 max_hangout_members = 10;
}

message GetSpacesConfigResponse {
  SpacesConfig config = 1;
}

message CreateSpaceRequest {
  // 1–80 characters.
  string title = 1;
  // Up to 5 tags of up to 30 characters; a leading '#' is dropped.
  repeated string tags = 2;
  // BCP 47 primary tag ("ja"), or empty.
  string language = 3;
  // UNSPECIFIED means FRIENDS.
  SpaceAudience audience = 4;
  // Unset: start now. Otherwise at least a minute from now.
  google.protobuf.Timestamp scheduled_at = 5;
  // Friends to invite right away (see InviteToSpace).
  repeated string invitee_ids = 6;
}

message CreateSpaceResponse {
