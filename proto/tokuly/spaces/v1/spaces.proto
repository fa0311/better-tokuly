// ───────────────────────────── hangouts ─────────────────────────────

enum HangoutMemberState {
  HANGOUT_MEMBER_STATE_UNSPECIFIED = 0;
  // Invited; has not answered yet.
  HANGOUT_MEMBER_STATE_INVITED = 1;
  HANGOUT_MEMBER_STATE_MEMBER = 2;
}

// A persistent voice room of a friend group.
message Hangout {
  string id = 1;
  // 1–40 characters.
  string name = 2;
  // One emoji standing in for an icon.
  string emoji = 3;
  tokuly.common.v1.UserSummary owner = 4;
  // Members may invite their friends too; otherwise only the owner.
  bool members_can_invite = 5;
  // Members, the owner included; invitations are not counted.
  int32 member_count = 6;
  // People in the voice room right now. The hangout is "open" when > 0.
  int32 inside_count = 7;
  // Members first (those inside leading), then open invitations. Invitees
  // only see the members.
  repeated HangoutMember members = 8;
  // The last time somebody was inside.
  google.protobuf.Timestamp last_active_at = 9;
  google.protobuf.Timestamp created_at = 10;
  // The caller's own relation to the hangout. Unset in realtime pushes.
  HangoutViewer viewer = 11;
}

message HangoutMember {
  tokuly.common.v1.UserSummary user = 1;
  HangoutMemberState state = 2;
  bool owner = 3;
  // In the voice room right now.
  bool inside = 4;
  google.protobuf.Timestamp inside_since = 5;
  // Who invited them; empty for the owner.
  string invited_by_id = 6;
  // When they became a member (or were invited).
  google.protobuf.Timestamp joined_at = 7;
}

// The caller's relation to a hangout.
message HangoutViewer {
  HangoutMemberState state = 1;
  bool owner = 2;
  bool inside = 3;
  // "Someone is in the hangout" notifications are silenced.
  bool muted = 4;
  // The caller may invite friends.
  bool can_invite = 5;
}

