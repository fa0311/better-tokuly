// ───────────────────────────── Watch parties ─────────────────────────────

// Watch parties (一緒に見る): a host plays a video and everyone in the party
// follows. Up to 100 members, guests by link.
//
// Joining returns the realtime topic that carries the party's `VideoEvent`s:
// `party:{party_id}` for signed-in members (the gateway admits members
// only), `party:{party_id}:{key}` for a guest, where the key is a secret of
// that guest's seat — knowing the party ID is not enough to listen, and a
// guest who leaves or is removed stops receiving events at once.
//
// Playback is authoritative on the server: `PartyPlayback` says where the
// video was (`position_seconds`) at `updated_at` server time and whether and
// how fast it has been moving since. Clients estimate their clock offset
// from `server_time` in responses and seek to
// `position_seconds + (now - updated_at) * rate` while `playing`.
//
// Guests act with the `guest_token` they got from JoinParty; signed-in
// members leave it empty.
service WatchPartyService {
  // Starts a party for a video the caller may watch and joins as host.
  // Errors: VIDEO_NOT_FOUND, PLAYBACK_BLOCKED, PLAYLIST_NOT_FOUND,
  // PARTY_LIMIT_REACHED (the caller hosts too many parties), RATE_LIMITED.
  rpc CreateParty(CreatePartyRequest) returns (CreatePartyResponse);
  // What an invite link shows before joining. Public; by join code only.
  // Errors: PARTY_NOT_FOUND.
  rpc PreviewParty(PreviewPartyRequest) returns (PreviewPartyResponse);
  // Joins by join code — signed in, or as a guest with a display name.
  // Joining again returns the existing seat. Public.
  // Errors: PARTY_NOT_FOUND, PARTY_FULL, PARTY_GUESTS_NOT_ALLOWED,
  // GUEST_NAME_INVALID, PARTY_BANNED (removed by the host), VIDEO_NOT_FOUND
  // or PLAYBACK_BLOCKED (the caller may not watch the video), RATE_LIMITED.
  rpc JoinParty(JoinPartyRequest) returns (JoinPartyResponse);
  // The party as a member sees it: playback, members, recent chat.
  // Errors: PARTY_NOT_FOUND, NOT_A_PARTY_MEMBER.
  rpc GetParty(GetPartyRequest) returns (GetPartyResponse);
  // Keeps the caller's seat (members silent for a minute are dropped) and
  // returns the current playback state. Call every 20 s.
  // Errors: PARTY_NOT_FOUND, NOT_A_PARTY_MEMBER.
  rpc HeartbeatParty(HeartbeatPartyRequest) returns (HeartbeatPartyResponse);
  // Leaves the party. When the host leaves, the longest-present co-host (or
  // else signed-in member) becomes host; a party without signed-in members
  // ends. Errors: PARTY_NOT_FOUND.
  rpc LeaveParty(LeavePartyRequest) returns (LeavePartyResponse);
  // Play, pause, seek or change speed. Host and co-hosts only.
  // Errors: PARTY_NOT_FOUND, NOT_A_PARTY_MEMBER, NOT_PARTY_HOST,
  // PLAYBACK_INVALID (position or rate out of range).
  rpc SetPartyPlayback(SetPartyPlaybackRequest) returns (SetPartyPlaybackResponse);
  // Switches the party to another video (e.g. the next playlist item).
  // Host and co-hosts only. Errors: as SetPartyPlayback, VIDEO_NOT_FOUND.
  rpc SetPartyVideo(SetPartyVideoRequest) returns (SetPartyVideoResponse);
  // Makes a signed-in member a co-host or a plain member again, or hands the
  // party over (role HOST: the caller becomes a co-host). Host only.
  // Errors: PARTY_NOT_FOUND, NOT_PARTY_HOST, PARTY_MEMBER_NOT_FOUND,
  // GUESTS_CANNOT_HOST, ROLE_INVALID.
  rpc SetPartyMemberRole(SetPartyMemberRoleRequest) returns (SetPartyMemberRoleResponse);
  // Removes a member. A removed account cannot rejoin; a removed guest is
  // refused from the same network address. Host and co-hosts (co-hosts
  // cannot remove the host or other co-hosts).
  // Errors: PARTY_NOT_FOUND, NOT_PARTY_HOST, PARTY_MEMBER_NOT_FOUND.
  rpc RemovePartyMember(RemovePartyMemberRequest) returns (RemovePartyMemberResponse);
  // Changes whether guests may join. Host only.
  // Errors: PARTY_NOT_FOUND, NOT_PARTY_HOST.
  rpc UpdateParty(UpdatePartyRequest) returns (UpdatePartyResponse);
  // Sends a chat message: text of at most 500 characters and/or, for
  // signed-in members, a stamp. Errors: PARTY_NOT_FOUND, NOT_A_PARTY_MEMBER,
  // MESSAGE_EMPTY, MESSAGE_TOO_LONG, STAMP_NOT_USABLE (also for guests and
  // when the server has no stamp service), RATE_LIMITED.
  rpc SendPartyMessage(SendPartyMessageRequest) returns (SendPartyMessageResponse);
  // Notifies friends of the caller with a link to the party.
  // Errors: PARTY_NOT_FOUND, NOT_A_PARTY_MEMBER, NOT_FRIENDS, TOO_MANY_INVITES,
  // RATE_LIMITED.
  rpc InviteToParty(InviteToPartyRequest) returns (InviteToPartyResponse);
  // Ends the party for everyone. Host only.
  // Errors: PARTY_NOT_FOUND, NOT_PARTY_HOST.
  rpc EndParty(EndPartyRequest) returns (EndPartyResponse);
}

enum PartyRole {
  PARTY_ROLE_UNSPECIFIED = 0;
  // Controls playback, roles and the party itself. Exactly one.
  PARTY_ROLE_HOST = 1;
  // May control playback and remove members.
  PARTY_ROLE_COHOST = 2;
  PARTY_ROLE_MEMBER = 3;
}

// Why a member is gone.
enum PartyLeaveReason {
  PARTY_LEAVE_REASON_UNSPECIFIED = 0;
  PARTY_LEAVE_REASON_LEFT = 1;
  // Removed by the host or a co-host.
  PARTY_LEAVE_REASON_REMOVED = 2;
  // No heartbeat for a minute.
  PARTY_LEAVE_REASON_TIMED_OUT = 3;
}

// Why a party is over.
enum PartyEndReason {
  PARTY_END_REASON_UNSPECIFIED = 0;
  PARTY_END_REASON_ENDED_BY_HOST = 1;
  // The last signed-in member left.
  PARTY_END_REASON_EMPTY = 2;
  // Open for longer than a party may last.
  PARTY_END_REASON_EXPIRED = 3;
  // The video was deleted or made unavailable.
  PARTY_END_REASON_VIDEO_UNAVAILABLE = 4;
}

// The authoritative playback state of a party.
message PartyPlayback {
  bool playing = 1;
  // Position at `updated_at`.
  double position_seconds = 2;
  // Playback speed, 0.25-2.
  double rate = 3;
  // Server time the state was set.
  google.protobuf.Timestamp updated_at = 4;
  // Grows with every change; ignore states older than the one applied.
  int64 sequence = 5;
  // Member who made the change; empty for the initial state.
  string changed_by_member_id = 6;
}

// Someone in a party.
message PartyMember {
  // ID of the seat (not the user ID).
  string id = 1;
  // Unset for guests.
  tokuly.common.v1.UserSummary user = 2;
  // Display name: the user's, or the one a guest chose.
  string name = 3;
  PartyRole role = 4;
  bool is_guest = 5;
  google.protobuf.Timestamp joined_at = 6;
}

message PartyMessage {
  string id = 1;
  // The sender's seat as it was when the message was sent.
  PartyMember sender = 2;
  string text = 3;
  // Unset when the message has no stamp.
  tokuly.common.v1.StampRef stamp = 4;
  google.protobuf.Timestamp sent_at = 5;
}

message Party {
  string id = 1;
  // Join code; the invite link is `invite_url`.
  string code = 2;
  string invite_url = 3;
  VideoSummary video = 4;
  // The playlist the party is going through; empty when none.
  string playlist_id = 5;
  PartyPlayback playback = 6;
  bool allow_guests = 7;
  int32 member_count = 8;
  // Most members a party takes.
  int32 max_members = 9;
  google.protobuf.Timestamp created_at = 10;
  // Set once the party is over.
  google.protobuf.Timestamp ended_at = 11;
}

message CreatePartyRequest {
  string video_id = 1;
  // The playlist the video is played from. Optional.
  string playlist_id = 2;
  // Unset = guests may join.
  optional bool allow_guests = 3;
  // Where playback starts.
  double position_seconds = 4;
}

// A member's view of the party, returned by create, join and get.
message PartySession {
  Party party = 1;
  // The caller's seat.
  PartyMember self = 2;
  // Everyone present, host first.
  repeated PartyMember members = 3;
  // The latest messages, oldest first (at most 50).
  repeated PartyMessage recent_messages = 4;
  // Realtime topic to subscribe to (see the service comment).
  string realtime_topic = 5;
  // For estimating the client's clock offset.
  google.protobuf.Timestamp server_time = 6;
  // Guests only, and only from JoinParty: the secret proving the seat.
  string guest_token = 7;
}

message CreatePartyResponse {
  PartySession session = 1;
}

message PreviewPartyRequest {
  string code = 1;
}

message PreviewPartyResponse {
  Party party = 1;
  PartyMember host = 2;
}

message JoinPartyRequest {
  string code = 1;
  // Guests: 1-24 characters. Ignored for signed-in callers.
  string guest_name = 2;
  // A guest rejoining with the same seat (e.g. after a reload). Optional.
  string guest_token = 3;
}

message JoinPartyResponse {
  PartySession session = 1;
}

message GetPartyRequest {
  string party_id = 1;
  string guest_token = 2;
}

message GetPartyResponse {
  PartySession session = 1;
}

message HeartbeatPartyRequest {
  string party_id = 1;
