}

message ListSubtitlesResponse {
  repeated SubtitleTrack subtitles = 1;
}

// ───────────────────────────── Playback & history ─────────────────────────────

// Playback sessions (view counting, watch time, resume position) and the
// watch history built from them.
service PlaybackService {
  // Call when playback starts. Opens a session for `ReportPlayback` and
  // returns where to resume. Public (anonymous viewers are counted by
  // network address). Errors: VIDEO_NOT_FOUND, PLAYBACK_BLOCKED,
  // RATE_LIMITED.
  rpc StartPlayback(StartPlaybackRequest) returns (StartPlaybackResponse);
  // Call every `report_interval_seconds` while the session lasts and once
  // when playback pauses, seeks or ends. Feeds watch time, the resume
  // position and audience retention; a view is counted once the session
  // accumulated `min_view_seconds` of watching, at most once per viewer and
  // video within the de-duplication period. Public.
  // Errors: PLAYBACK_SESSION_NOT_FOUND (expired: start a new one).
  rpc ReportPlayback(ReportPlaybackRequest) returns (ReportPlaybackResponse);
  // The caller's watch history, most recently watched first.
  rpc ListWatchHistory(ListWatchHistoryRequest) returns (ListWatchHistoryResponse);
  // Removes one video from the history (and forgets its resume position).
  rpc RemoveWatchHistoryItem(RemoveWatchHistoryItemRequest) returns (RemoveWatchHistoryItemResponse);
  // Removes everything from the history.
  rpc ClearWatchHistory(ClearWatchHistoryRequest) returns (ClearWatchHistoryResponse);
  // Whether recording is paused.
  rpc GetWatchHistorySettings(GetWatchHistorySettingsRequest) returns (GetWatchHistorySettingsResponse);
  // Pauses or resumes recording. While paused nothing is added and resume
  // positions do not move.
  rpc SetWatchHistoryPaused(SetWatchHistoryPausedRequest) returns (SetWatchHistoryPausedResponse);
}

// Where a viewer came from, as reported by the client.
enum TrafficSource {
  TRAFFIC_SOURCE_UNSPECIFIED = 0;
  // Opened by URL, bookmark or without a known referrer.
  TRAFFIC_SOURCE_DIRECT = 1;
  TRAFFIC_SOURCE_HOME = 2;
  TRAFFIC_SOURCE_SUBSCRIPTIONS = 3;
  TRAFFIC_SOURCE_TRENDING = 4;
  // "Up next" / related videos.
  TRAFFIC_SOURCE_RELATED = 5;
  TRAFFIC_SOURCE_SEARCH = 6;
  TRAFFIC_SOURCE_CHANNEL = 7;
  TRAFFIC_SOURCE_PLAYLIST = 8;
  TRAFFIC_SOURCE_NOTIFICATION = 9;
  // The friends' activity feed, a chat message or a note.
  TRAFFIC_SOURCE_FRIENDS = 10;
  TRAFFIC_SOURCE_WATCH_PARTY = 11;
  // Another website or an embed.
  TRAFFIC_SOURCE_EXTERNAL = 12;
  TRAFFIC_SOURCE_HISTORY = 13;
}

message StartPlaybackRequest {
  string video_id = 1;
  TrafficSource source = 2;
  // Where playback starts (the resume position, a `?t=` value, or 0).
  double position_seconds = 3;
}

message StartPlaybackResponse {
  // Opaque; pass to ReportPlayback. Valid until two hours without a report.
  string session_id = 1;
  // Where the caller left off earlier; 0 when unknown or watched to the end.
  double resume_position_seconds = 2;
  // Seconds of watching after which the view counts.
  double min_view_seconds = 3;
  // How often to report while playing.
  int32 report_interval_seconds = 4;
  int64 view_count = 5;
}

message ReportPlaybackRequest {
  string session_id = 1;
  // Current position.
  double position_seconds = 2;
  // The player is playing right now (false: paused, buffering, hidden).
  bool playing = 3;
  // Playback reached the end.
  bool ended = 4;
}

message ReportPlaybackResponse {
  // This session's view has been counted (now or earlier).
  bool view_counted = 1;
  int64 view_count = 2;
}

message WatchHistoryItem {
  VideoSummary video = 1;
  google.protobuf.Timestamp last_watched_at = 2;
  // Seconds the caller spent watching it, over all sessions.
  double watched_seconds = 3;
}

message ListWatchHistoryRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message ListWatchHistoryResponse {
  repeated WatchHistoryItem items = 1;
  tokuly.common.v1.PageInfo page = 2;
  bool paused = 3;
}

message RemoveWatchHistoryItemRequest {
  string video_id = 1;
}

message RemoveWatchHistoryItemResponse {}

message ClearWatchHistoryRequest {}

message ClearWatchHistoryResponse {}

message GetWatchHistorySettingsRequest {}

message GetWatchHistorySettingsResponse {
  bool paused = 1;
}

message SetWatchHistoryPausedRequest {
  bool paused = 1;
}

message SetWatchHistoryPausedResponse {
  bool paused = 1;
}

