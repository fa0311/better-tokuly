syntax = "proto3";

// Video (動画): channels, long-form videos, subtitles, playlists, watch
// history, feeds, watch parties and creator analytics.
//
// Channels. An account owns up to five channels and publishes as one of
// them; one of them is the default ("posting identity"). Channel handles are
// a namespace of their own (a channel and a user may share a handle) with
// the same format as user handles. Every `channel_id` field accepts the
// channel's UUID or its handle, with or without a leading '@'.
//
// Videos. A video is created from a media upload (`ASSET_PURPOSE_VIDEO`) and
// moves through two independent states:
// - `ProcessingState`: PROCESSING → READY or FAILED, following the upload;
// - `VideoStatus`: DRAFT → (SCHEDULED →) PUBLISHED. Publishing a video that
//   is still processing schedules it "as soon as it is ready".
// Only PUBLISHED videos are visible to anyone but the owner. Who sees a
// published video is its `Visibility`:
//   PUBLIC    everyone; listed in feeds, trending, recommendations, search
//   NO_FEED   everyone; listed on the channel page only
//   UNLISTED  everyone with the link; listed nowhere
//   FRIENDS   friends of the channel's owner; listed for them on the channel
//             page and in their subscriptions feed. With `allow_link` anyone
//             who has the link may watch too (the original Tokuly's
//             「フレンド/リンク限定」); the listing stays friends-only
//   PRIVATE   the owner
// Every `video_id` field accepts the UUID or the 11-character `short_id`.
// A `?t=` deep link is resolved by the client (seek after loading).
//
// Playlists have a UUID and a `short_id`; `playlist_id` fields also accept
// `WL` (the caller's watch-later list) and `LL` (the caller's liked videos).
//
// Blocks: nothing owned by a user in a block relation with the caller is
// ever returned; it reads as not found. The same goes for everything owned by
// a suspended account, for everyone but that account.
package tokuly.video.v1;

import "google/protobuf/timestamp.proto";
import "tokuly/common/v1/common.proto";
import "tokuly/media/v1/media.proto";

// ───────────────────────────── Channels ─────────────────────────────

// Channels, their pages and subscriptions.
service ChannelService {
  // Creates a channel for the caller. The first channel becomes the default.
  // Errors: CHANNEL_LIMIT_REACHED, HANDLE_INVALID, HANDLE_RESERVED,
  // HANDLE_TAKEN, CHANNEL_NAME_INVALID, CHANNEL_DESCRIPTION_TOO_LONG,
  // CHANNEL_LINKS_INVALID, ASSET_NOT_FOUND, ASSET_WRONG_PURPOSE, ASSET_NOT_READY,
  // ASSET_NOT_IMAGE, RATE_LIMITED.
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  // Changes a channel of the caller. Unset fields stay as they are.
  // Errors: CHANNEL_NOT_FOUND, plus the validation errors of CreateChannel,
  // TRAILER_NOT_FOUND (the trailer must be a public video of the channel).
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  // Deletes a channel of the caller with everything on it: videos, playlists,
  // subscriptions. If it was the default, the oldest remaining channel
  // becomes the default. Errors: CHANNEL_NOT_FOUND.
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  // The caller's channels, default first.
  rpc ListMyChannels(ListMyChannelsRequest) returns (ListMyChannelsResponse);
  // Makes a channel the caller's default posting identity.
  // Errors: CHANNEL_NOT_FOUND.
  rpc SetDefaultChannel(SetDefaultChannelRequest) returns (SetDefaultChannelResponse);
  // Whether a channel handle can be taken. Public; never an error for a
  // well-formed request (the answer is in the response).
  rpc CheckChannelHandle(CheckChannelHandleRequest) returns (CheckChannelHandleResponse);
  // A channel by ID or handle. Public. Errors: CHANNEL_NOT_FOUND.
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  // The channel's home tab: trailer, latest and popular videos, live
  // archives, playlists. Sections without content are omitted. Shorts and
  // live streams come from their own services. Public.
  // Errors: CHANNEL_NOT_FOUND.
  rpc GetChannelPage(GetChannelPageRequest) returns (GetChannelPageResponse);
  // Videos of a channel that the caller may see listed. Public.
  // Errors: CHANNEL_NOT_FOUND.
  rpc ListChannelVideos(ListChannelVideosRequest) returns (ListChannelVideosResponse);
  // Subscribes the caller to a channel, or changes the notification level of
  // an existing subscription. Errors: CHANNEL_NOT_FOUND,
  // CANNOT_SUBSCRIBE_TO_OWN_CHANNEL, RATE_LIMITED.
  rpc Subscribe(SubscribeRequest) returns (SubscribeResponse);
  // Ends the caller's subscription. Not being subscribed is not an error.
  // Errors: CHANNEL_NOT_FOUND.
  rpc Unsubscribe(UnsubscribeRequest) returns (UnsubscribeResponse);
  // Channels the caller subscribes to, most recently subscribed first.
  rpc ListSubscriptions(ListSubscriptionsRequest) returns (ListSubscriptionsResponse);
  // Subscribers of one of the caller's channels, newest first.
  // Errors: CHANNEL_NOT_FOUND.
  rpc ListSubscribers(ListSubscribersRequest) returns (ListSubscribersResponse);
  // Channels worth a look: popular ones the caller does not subscribe to.
  // Public.
  rpc ListRecommendedChannels(ListRecommendedChannelsRequest) returns (ListRecommendedChannelsResponse);
}

// How much a subscriber wants to hear from a channel.
enum NotificationLevel {
  NOTIFICATION_LEVEL_UNSPECIFIED = 0;
  // Subscribed, never notified.
  NOTIFICATION_LEVEL_NONE = 1;
  // Every upload lands in the inbox; a push is sent only while the
  // subscriber has recently watched the channel. The default.
  NOTIFICATION_LEVEL_PERSONALIZED = 2;
  // Every upload (and live stream) is pushed.
  NOTIFICATION_LEVEL_ALL = 3;
}

// A link shown on the channel's about tab.
message ChannelLink {
  // At most 30 characters.
  string title = 1;
  // http(s) URL, at most 500 characters.
  string url = 2;
}

// What the caller has to do with a channel. Unset for anonymous callers.
message ChannelViewerState {
  // The channel belongs to the caller.
  bool is_owner = 1;
  bool subscribed = 2;
  // Only meaningful while `subscribed`.
  NotificationLevel notification_level = 3;
  google.protobuf.Timestamp subscribed_at = 4;
  // The channel is the caller's default posting identity.
  bool is_default = 5;
}

// A channel page header and about tab.
message Channel {
  tokuly.common.v1.ChannelSummary summary = 1;
  string description = 2;
  tokuly.common.v1.Image banner = 3;
  repeated ChannelLink links = 4;
  // Videos listed on the channel page for everyone (PUBLIC and NO_FEED).
  int64 video_count = 5;
  // Views of all the channel's videos.
  int64 view_count = 6;
  google.protobuf.Timestamp created_at = 7;
  // Short ID of the video featured at the top of the page; empty when none.
  string trailer_video_id = 8;
  ChannelViewerState viewer = 9;
}

message CreateChannelRequest {
  // 3-24 characters: a-z, 0-9, `_`, `-`; unique among channels.
  string handle = 1;
  // 1-50 characters.
  string name = 2;
  // At most 1000 characters.
  string description = 3;
  // A READY image upload with `ASSET_PURPOSE_CHANNEL_ICON`; empty = none.
  string icon_asset_id = 4;
  // A READY image upload with `ASSET_PURPOSE_CHANNEL_BANNER`; empty = none.
  string banner_asset_id = 5;
  // At most 5.
  repeated ChannelLink links = 6;
}

message CreateChannelResponse {
  Channel channel = 1;
}

// Wrapper so "replace the links" can be told apart from "leave them".
message ChannelLinkList {
  repeated ChannelLink links = 1;
}

message UpdateChannelRequest {
  string channel_id = 1;
  optional string handle = 2;
  optional string name = 3;
  optional string description = 4;
  // Empty string removes the icon.
  optional string icon_asset_id = 5;
  // Empty string removes the banner.
  optional string banner_asset_id = 6;
  ChannelLinkList links = 7;
  // A public video of this channel to feature; empty string = none.
  optional string trailer_video_id = 8;
}

message UpdateChannelResponse {
  Channel channel = 1;
}

message DeleteChannelRequest {
  string channel_id = 1;
}

message DeleteChannelResponse {}

message ListMyChannelsRequest {}

message ListMyChannelsResponse {
  repeated Channel channels = 1;
  // How many channels one account may own.
  int32 max_channels = 2;
}

message SetDefaultChannelRequest {
  string channel_id = 1;
}

message SetDefaultChannelResponse {
  Channel channel = 1;
}

message CheckChannelHandleRequest {
  string handle = 1;
}

message CheckChannelHandleResponse {
  bool available = 1;
  // The handle as it would be stored (lowercase, no '@'); empty when invalid.
  string normalized = 2;
  // Why it is not available: HANDLE_INVALID, HANDLE_RESERVED or HANDLE_TAKEN.
  string reason = 3;
}

message GetChannelRequest {
  string channel_id = 1;
}

message GetChannelResponse {
  Channel channel = 1;
}

// What a section of the channel home tab shows.
enum ChannelSectionKind {
  CHANNEL_SECTION_KIND_UNSPECIFIED = 0;
  // The featured video (`videos` holds exactly one).
  CHANNEL_SECTION_KIND_TRAILER = 1;
  // Newest uploads.
  CHANNEL_SECTION_KIND_LATEST = 2;
  // Most viewed videos.
  CHANNEL_SECTION_KIND_POPULAR = 3;
  // Archives of past live streams.
  CHANNEL_SECTION_KIND_LIVE_ARCHIVES = 4;
  // Public playlists of the channel.
  CHANNEL_SECTION_KIND_PLAYLISTS = 5;
}

message ChannelSection {
  ChannelSectionKind kind = 1;
  repeated VideoSummary videos = 2;
  repeated Playlist playlists = 3;
}

message GetChannelPageRequest {
  string channel_id = 1;
}

message GetChannelPageResponse {
  Channel channel = 1;
  repeated ChannelSection sections = 2;
}

enum ChannelVideoSort {
  CHANNEL_VIDEO_SORT_UNSPECIFIED = 0;
  // Most recently published first (the default).
  CHANNEL_VIDEO_SORT_NEWEST = 1;
  // Most viewed first.
  CHANNEL_VIDEO_SORT_POPULAR = 2;
  // Oldest first.
  CHANNEL_VIDEO_SORT_OLDEST = 3;
}

message ListChannelVideosRequest {
  string channel_id = 1;
  ChannelVideoSort sort = 2;
  // Only videos of this origin; unspecified = all.
  VideoOrigin origin = 3;
  tokuly.common.v1.PageRequest page = 4;
}

message ListChannelVideosResponse {
  repeated VideoSummary videos = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message SubscribeRequest {
  string channel_id = 1;
  // Unspecified = PERSONALIZED for a new subscription, unchanged for an
  // existing one.
  NotificationLevel notification_level = 2;
  // The video the caller was watching when they subscribed, for the
  // creator's analytics. Optional.
  string source_video_id = 3;
}

message SubscribeResponse {
  Channel channel = 1;
}

message UnsubscribeRequest {
  string channel_id = 1;
}

message UnsubscribeResponse {
  Channel channel = 1;
}

message ListSubscriptionsRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message Subscription {
  tokuly.common.v1.ChannelSummary channel = 1;
  NotificationLevel notification_level = 2;
  google.protobuf.Timestamp subscribed_at = 3;
}

message ListSubscriptionsResponse {
  repeated Subscription subscriptions = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message ListSubscribersRequest {
  string channel_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message Subscriber {
  tokuly.common.v1.UserSummary user = 1;
  google.protobuf.Timestamp subscribed_at = 2;
}

message ListSubscribersResponse {
  repeated Subscriber subscribers = 1;
  tokuly.common.v1.PageInfo page = 2;
  int64 subscriber_count = 3;
}

message ListRecommendedChannelsRequest {
  // 1-50, default 12.
  int32 limit = 1;
}

message ListRecommendedChannelsResponse {
  repeated tokuly.common.v1.ChannelSummary channels = 1;
}

// ───────────────────────────── Videos ─────────────────────────────

// Videos: the studio side (create, edit, publish, subtitles) and the watch
// page (get, rate).
service VideoService {
  // Creates a draft video on one of the caller's channels from an upload,
  // which may still be processing. Errors: CHANNEL_REQUIRED (the caller has
  // no channel), CHANNEL_NOT_FOUND, ASSET_NOT_FOUND, ASSET_WRONG_PURPOSE,
  // ASSET_FAILED, ASSET_ALREADY_USED, plus the validation errors of
  // UpdateVideo, RATE_LIMITED.
  rpc CreateVideo(CreateVideoRequest) returns (CreateVideoResponse);
  // Changes a video of the caller. Unset fields stay as they are.
  // Errors: VIDEO_NOT_FOUND, TITLE_INVALID, DESCRIPTION_TOO_LONG,
  // TAGS_INVALID, GAME_INVALID, CHAPTERS_INVALID, VISIBILITY_INVALID,
  // ASSET_NOT_FOUND, ASSET_WRONG_PURPOSE, ASSET_NOT_READY, ASSET_NOT_IMAGE.
  rpc UpdateVideo(UpdateVideoRequest) returns (UpdateVideoResponse);
  // Publishes a video now or at `publish_at`. A video still processing is
  // published as soon as it is ready (or at `publish_at`, whichever is
  // later). Errors: VIDEO_NOT_FOUND, VIDEO_PROCESSING_FAILED,
  // SCHEDULE_INVALID (in the past or more than a year ahead).
  rpc PublishVideo(PublishVideoRequest) returns (PublishVideoResponse);
  // Takes a video back to DRAFT (also cancels a schedule).
  // Errors: VIDEO_NOT_FOUND.
  rpc UnpublishVideo(UnpublishVideoRequest) returns (UnpublishVideoResponse);
  // Deletes a video of the caller with its upload. Errors: VIDEO_NOT_FOUND.
  rpc DeleteVideo(DeleteVideoRequest) returns (DeleteVideoResponse);
  // A video for the watch page. Public. An age-restricted video is returned
  // without `playback` to callers who may not watch it (`playback_block`
  // says why). Errors: VIDEO_NOT_FOUND.
  rpc GetVideo(GetVideoRequest) returns (GetVideoResponse);
  // Cards for up to 100 videos, in request order (e.g. to render activity
  // feed entries or chat embeds). Videos that do not exist or that the
  // caller may not watch are left out. Public. Errors: TOO_MANY_IDS.
  rpc BatchGetVideos(BatchGetVideosRequest) returns (BatchGetVideosResponse);
  // Every video on the caller's channels, in any state, newest first.
  // Errors: CHANNEL_NOT_FOUND.
  rpc ListStudioVideos(ListStudioVideosRequest) returns (ListStudioVideosResponse);
  // Likes or dislikes a video, or takes the rating back. Liked videos appear
  // in the caller's `LL` playlist. Errors: VIDEO_NOT_FOUND, RATE_LIMITED.
  rpc RateVideo(RateVideoRequest) returns (RateVideoResponse);
  // Game titles that start with or resemble `query`, most used first. Public.
  rpc SuggestGames(SuggestGamesRequest) returns (SuggestGamesResponse);
  // Adds a subtitle track from a WebVTT or SRT file (SRT is converted).
  // Errors: VIDEO_NOT_FOUND, SUBTITLE_SOURCE_REQUIRED,
  // SUBTITLE_LANGUAGE_INVALID, SUBTITLE_LANGUAGE_EXISTS,
  // SUBTITLE_LABEL_INVALID, SUBTITLE_INVALID (not WebVTT/SRT, no cues or
  // malformed timings), SUBTITLE_TOO_LARGE, SUBTITLE_LIMIT_REACHED,
  // ASSET_NOT_FOUND, ASSET_WRONG_PURPOSE, ASSET_NOT_READY, RATE_LIMITED.
  rpc AddSubtitle(AddSubtitleRequest) returns (AddSubtitleResponse);
  // Changes a track's label, language, default flag or content.
  // Errors: SUBTITLE_NOT_FOUND, plus the validation errors of AddSubtitle.
  rpc UpdateSubtitle(UpdateSubtitleRequest) returns (UpdateSubtitleResponse);
  // Errors: SUBTITLE_NOT_FOUND.
  rpc DeleteSubtitle(DeleteSubtitleRequest) returns (DeleteSubtitleResponse);
  // The subtitle tracks of a video the caller may watch. Public.
  // Errors: VIDEO_NOT_FOUND.
  rpc ListSubtitles(ListSubtitlesRequest) returns (ListSubtitlesResponse);
}

// Where a video is on its way to the public.
enum VideoStatus {
  VIDEO_STATUS_UNSPECIFIED = 0;
  // Only the owner sees it.
  VIDEO_STATUS_DRAFT = 1;
  // Goes live at `scheduled_at`, or as soon as processing finishes after that.
  VIDEO_STATUS_SCHEDULED = 2;
  VIDEO_STATUS_PUBLISHED = 3;
}

// State of the video's upload in the media pipeline.
enum ProcessingState {
  PROCESSING_STATE_UNSPECIFIED = 0;
  PROCESSING_STATE_PROCESSING = 1;
  PROCESSING_STATE_READY = 2;
  // `VideoStudioInfo.processing_error` says why.
  PROCESSING_STATE_FAILED = 3;
}

// How a video came to be.
enum VideoOrigin {
  VIDEO_ORIGIN_UNSPECIFIED = 0;
  VIDEO_ORIGIN_UPLOAD = 1;
  // The archive of a live stream.
  VIDEO_ORIGIN_LIVE_ARCHIVE = 2;
}

// Genre of a video. Clients localize the names.
enum VideoCategory {
  VIDEO_CATEGORY_UNSPECIFIED = 0;
  VIDEO_CATEGORY_GAMING = 1;
  // 雑談
  VIDEO_CATEGORY_TALK = 2;
  VIDEO_CATEGORY_MUSIC = 3;
  VIDEO_CATEGORY_ENTERTAINMENT = 4;
  // 日常 / vlog
  VIDEO_CATEGORY_DAILY_LIFE = 5;
  VIDEO_CATEGORY_TRAVEL = 6;
  VIDEO_CATEGORY_FOOD = 7;
  VIDEO_CATEGORY_SPORTS = 8;
  VIDEO_CATEGORY_EDUCATION = 9;
  VIDEO_CATEGORY_TECH = 10;
  VIDEO_CATEGORY_ART = 11;
  VIDEO_CATEGORY_PETS = 12;
  VIDEO_CATEGORY_NEWS = 13;
  VIDEO_CATEGORY_OTHER = 14;
}

// The caller's rating of a video.
enum Rating {
  RATING_UNSPECIFIED = 0;
  RATING_NONE = 1;
  RATING_LIKE = 2;
  RATING_DISLIKE = 3;
}

// Why `Video.playback` is missing.
enum PlaybackBlock {
  // Playback is available.
  PLAYBACK_BLOCK_UNSPECIFIED = 0;
  // Age-restricted and the caller is not signed in.
  PLAYBACK_BLOCK_SIGN_IN_REQUIRED = 1;
  // Age-restricted and the caller is under 18 (or has no birthdate).
  PLAYBACK_BLOCK_AGE_RESTRICTED = 2;
  // The upload is not ready (only the owner can see such a video).
  PLAYBACK_BLOCK_NOT_READY = 3;
}

// A named position in a video.
message Chapter {
  double start_seconds = 1;
  // 1-100 characters.
  string title = 2;
}

// A video as shown on cards and in lists.
message VideoSummary {
  string id = 1;
  string short_id = 2;
  string title = 3;
  // The custom thumbnail, otherwise the poster frame. Unset while processing.
  tokuly.common.v1.Image thumbnail = 4;
  double duration_seconds = 5;
  tokuly.common.v1.ChannelSummary channel = 6;
  int64 view_count = 7;
  int64 like_count = 8;
  int64 comment_count = 9;
  // When it (first) went public. Unset for drafts.
  google.protobuf.Timestamp published_at = 10;
  tokuly.common.v1.Visibility visibility = 11;
  VideoStatus status = 12;
  ProcessingState processing = 13;
  // Short muted animated preview for hover cards; may be empty.
  string preview_url = 14;
  bool age_restricted = 15;
  VideoOrigin origin = 16;
  VideoCategory category = 17;
  // Where the caller left off (0 = from the start), for progress bars.
  double resume_position_seconds = 18;
  // The caller watched it to the end.
  bool watched = 19;
  google.protobuf.Timestamp created_at = 20;
  // Set while `status` is SCHEDULED.
  google.protobuf.Timestamp scheduled_at = 21;
}

// What the caller has to do with a video. Unset for anonymous callers.
message VideoViewerState {
  bool is_owner = 1;
  Rating rating = 2;
  bool in_watch_later = 3;
  // The caller's subscription to the video's channel.
  bool subscribed = 4;
  NotificationLevel notification_level = 5;
}

// Details only the owner sees.
message VideoStudioInfo {
  // The upload the video plays.
  string asset_id = 1;
  // Media failure reason (e.g. CORRUPT_MEDIA) while processing FAILED.
  string processing_error = 2;
  // A custom thumbnail is set (otherwise the poster frame is used).
  bool has_custom_thumbnail = 3;
  // Subscribers are notified when the video goes public.
  bool notify_subscribers = 4;
  int64 dislike_count = 5;
  // The live stream this video is the archive of; empty for uploads.
  string origin_id = 6;
}

// A video with everything the watch page (or the studio editor) shows.
message Video {
  VideoSummary summary = 1;
  // At most 5000 characters.
  string description = 2;
  // Lowercase, without '#'.
  repeated string tags = 3;
  // Game title; may be empty.
  string game = 4;
  // Sorted by `start_seconds`; empty or starting at 0.
  repeated Chapter chapters = 5;
  // Comments (engagement service, `SUBJECT_TYPE_VIDEO`) are accepted.
  bool comments_enabled = 6;
  // Streams, poster, storyboard and preview of the processed upload. Unset
  // when `playback_block` is set.
  tokuly.media.v1.VideoInfo playback = 7;
  PlaybackBlock playback_block = 8;
  repeated SubtitleTrack subtitles = 9;
  VideoViewerState viewer = 10;
  // Only set for the owner.
  VideoStudioInfo studio = 11;
  // FRIENDS visibility only: anyone who has the link may watch, while the
  // video is still listed for friends only.
  bool allow_link = 12;
}

// Wrapper so "replace the tags" can be told apart from "leave them".
message TagList {
  // At most 20 tags of at most 30 characters each; '#' is stripped.
  repeated string tags = 1;
}

// Wrapper so "replace the chapters" can be told apart from "leave them".
message ChapterList {
  // At most 100. If any are given the first must start at 0, each must
  // start at least 5 s after the previous one and before the video ends.
  repeated Chapter chapters = 1;
}

message CreateVideoRequest {
  // Empty = the caller's default channel.
  string channel_id = 1;
  // An upload with `ASSET_PURPOSE_VIDEO` owned by the caller.
  string asset_id = 2;
  // 1-100 characters. Empty = the upload's file name.
  string title = 3;
  string description = 4;
  repeated string tags = 5;
  VideoCategory category = 6;
  string game = 7;
  // Unspecified = PRIVATE.
  tokuly.common.v1.Visibility visibility = 8;
  bool age_restricted = 9;
  // Unset = comments enabled.
  optional bool comments_enabled = 10;
  // Unset = subscribers are notified.
  optional bool notify_subscribers = 11;
  // A READY image upload with `ASSET_PURPOSE_THUMBNAIL`; empty = poster frame.
  string thumbnail_asset_id = 12;
  repeated Chapter chapters = 13;
  // See `Video.allow_link`.
  bool allow_link = 14;
}

message CreateVideoResponse {
  Video video = 1;
}

message UpdateVideoRequest {
  string video_id = 1;
  optional string title = 2;
  optional string description = 3;
  TagList tags = 4;
  optional VideoCategory category = 5;
  optional string game = 6;
  optional tokuly.common.v1.Visibility visibility = 7;
  optional bool age_restricted = 8;
  optional bool comments_enabled = 9;
  optional bool notify_subscribers = 10;
  // Empty string goes back to the poster frame.
  optional string thumbnail_asset_id = 11;
  ChapterList chapters = 12;
  optional bool allow_link = 13;
}

message UpdateVideoResponse {
  Video video = 1;
}

message PublishVideoRequest {
  string video_id = 1;
  // Unset = now.
  google.protobuf.Timestamp publish_at = 2;
  // Applied before publishing when set.
  optional tokuly.common.v1.Visibility visibility = 3;
}

message PublishVideoResponse {
  Video video = 1;
}

message UnpublishVideoRequest {
  string video_id = 1;
}

message UnpublishVideoResponse {
  Video video = 1;
}

message DeleteVideoRequest {
  string video_id = 1;
}

message DeleteVideoResponse {}

message GetVideoRequest {
  string video_id = 1;
}

message GetVideoResponse {
  Video video = 1;
}

message BatchGetVideosRequest {
  // UUIDs or short IDs, at most 100.
  repeated string video_ids = 1;
}

message BatchGetVideosResponse {
  repeated VideoSummary videos = 1;
}

message ListStudioVideosRequest {
  // One of the caller's channels; empty = all of them.
  string channel_id = 1;
  // Only videos in this status; unspecified = all.
  VideoStatus status = 2;
  tokuly.common.v1.PageRequest page = 3;
}

message ListStudioVideosResponse {
  repeated VideoSummary videos = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message RateVideoRequest {
  string video_id = 1;
  // LIKE, DISLIKE or NONE (take the rating back).
  Rating rating = 2;
}

message RateVideoResponse {
  Rating rating = 1;
  int64 like_count = 2;
}

message SuggestGamesRequest {
  // May be empty: the most used titles.
  string query = 1;
  // 1-20, default 10.
  int32 limit = 2;
}

message SuggestGamesResponse {
  repeated string games = 1;
}

// ───────────────────────────── Subtitles ─────────────────────────────

// Format a subtitle file was uploaded in. Tracks are always served as WebVTT.
enum SubtitleFormat {
  SUBTITLE_FORMAT_UNSPECIFIED = 0;
  SUBTITLE_FORMAT_VTT = 1;
  SUBTITLE_FORMAT_SRT = 2;
}

message SubtitleTrack {
  string id = 1;
  // BCP 47 tag, lowercase language: `ja`, `en`, `zh-Hant`, `pt-BR`.
  string language = 2;
  // Shown in the player's menu, e.g. "日本語".
  string label = 3;
  // WebVTT file in the media bucket.
  string url = 4;
  // Shown by default when the viewer has no preference. At most one track
  // of a video is the default; a video may have none (subtitles start off).
  bool is_default = 5;
  SubtitleFormat original_format = 6;
  int32 cue_count = 7;
  google.protobuf.Timestamp created_at = 8;
}

message AddSubtitleRequest {
  string video_id = 1;
  // The file: either an upload with `ASSET_PURPOSE_SUBTITLE`, or its text.
  oneof source {
    string asset_id = 2;
    // WebVTT or SRT text, at most 1 MiB.
    string content = 3;
  }
  string language = 4;
  // 1-40 characters. Empty = the language tag.
  string label = 5;
  // Make this the default track (the previous default stops being one).
  bool is_default = 6;
}

message AddSubtitleResponse {
  SubtitleTrack subtitle = 1;
}

message UpdateSubtitleRequest {
  string subtitle_id = 1;
  optional string language = 2;
  optional string label = 3;
  // True makes it the default track (the previous default stops being
  // one); false leaves the video without a default track.
  optional bool is_default = 4;
  // Replaces the content when set.
  oneof source {
    string asset_id = 5;
    string content = 6;
  }
}

message UpdateSubtitleResponse {
  SubtitleTrack subtitle = 1;
}

message DeleteSubtitleRequest {
  string subtitle_id = 1;
}

