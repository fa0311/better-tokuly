// Playlists, including the two built-in ones: watch later (`WL`) and liked
// videos (`LL`, maintained by `VideoService.RateVideo`).
service PlaylistService {
  // Errors: PLAYLIST_LIMIT_REACHED, PLAYLIST_TITLE_INVALID,
  // PLAYLIST_DESCRIPTION_TOO_LONG, VISIBILITY_INVALID (playlists are PUBLIC,
  // UNLISTED or PRIVATE), CHANNEL_NOT_FOUND, RATE_LIMITED.
  rpc CreatePlaylist(CreatePlaylistRequest) returns (CreatePlaylistResponse);
  // Errors: PLAYLIST_NOT_FOUND, PLAYLIST_BUILT_IN (built-in lists cannot be
  // edited), plus the validation errors of CreatePlaylist.
  rpc UpdatePlaylist(UpdatePlaylistRequest) returns (UpdatePlaylistResponse);
  // Errors: PLAYLIST_NOT_FOUND, PLAYLIST_BUILT_IN.
  rpc DeletePlaylist(DeletePlaylistRequest) returns (DeletePlaylistResponse);
  // A playlist the caller may see. Public for PUBLIC and UNLISTED lists.
  // Errors: PLAYLIST_NOT_FOUND.
  rpc GetPlaylist(GetPlaylistRequest) returns (GetPlaylistResponse);
  // The caller's playlists (built-in ones first), optionally with whether
  // each contains a given video ("save to..." dialog).
  rpc ListMyPlaylists(ListMyPlaylistsRequest) returns (ListMyPlaylistsResponse);
  // Public playlists shown on a channel's page. Public.
  // Errors: CHANNEL_NOT_FOUND.
  rpc ListChannelPlaylists(ListChannelPlaylistsRequest) returns (ListChannelPlaylistsResponse);
  // Videos of a playlist in order (built-in lists: newest first). Videos the
  // caller may not see are left out. Errors: PLAYLIST_NOT_FOUND.
  rpc ListPlaylistItems(ListPlaylistItemsRequest) returns (ListPlaylistItemsResponse);
  // Appends a video the caller may watch. Adding a video twice is a no-op.
  // Errors: PLAYLIST_NOT_FOUND, PLAYLIST_FULL, VIDEO_NOT_FOUND,
  // PLAYLIST_READ_ONLY (`LL` changes only through RateVideo).
  rpc AddPlaylistItem(AddPlaylistItemRequest) returns (AddPlaylistItemResponse);
  // Errors: PLAYLIST_NOT_FOUND, PLAYLIST_READ_ONLY.
  rpc RemovePlaylistItem(RemovePlaylistItemRequest) returns (RemovePlaylistItemResponse);
  // Moves a video to a new place in the list.
  // Errors: PLAYLIST_NOT_FOUND, PLAYLIST_ITEM_NOT_FOUND, PLAYLIST_READ_ONLY.
  rpc MovePlaylistItem(MovePlaylistItemRequest) returns (MovePlaylistItemResponse);
}

enum PlaylistKind {
  PLAYLIST_KIND_UNSPECIFIED = 0;
  // Made by a user.
  PLAYLIST_KIND_CUSTOM = 1;
  // The built-in "watch later" list (`WL`); always private.
  PLAYLIST_KIND_WATCH_LATER = 2;
  // The built-in list of liked videos (`LL`); always private.
  PLAYLIST_KIND_LIKED = 3;
}

message Playlist {
  string id = 1;
  string short_id = 2;
  PlaylistKind kind = 3;
  // Empty for built-in lists (clients show a localized name).
  string title = 4;
  string description = 5;
  // PUBLIC, UNLISTED or PRIVATE.
  tokuly.common.v1.Visibility visibility = 6;
  // Videos in the list, including ones the caller cannot see.
  int32 item_count = 7;
  // Thumbnail of the first video the caller may see.
  tokuly.common.v1.Image thumbnail = 8;
  // The account that made the playlist. Unset for a playlist published on a
  // channel (channels do not reveal their owner), except to the owner.
  tokuly.common.v1.UserSummary owner = 9;
  // The channel the playlist is published on; unset for personal playlists.
  tokuly.common.v1.ChannelSummary channel = 10;
  int64 like_count = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // The caller owns the playlist.
  bool is_owner = 14;
  // Only in ListMyPlaylists with `contains_video_id`: the list has that video.
  bool contains_video = 15;
