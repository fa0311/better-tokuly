// ───────────────────────────── Creator analytics ─────────────────────────────

// Studio analytics for the owner of a channel.
service StudioAnalyticsService {
  // Totals, a daily series, traffic sources and top videos of a channel
  // over a date range. Errors: CHANNEL_NOT_FOUND, DATE_RANGE_INVALID,
  // TIME_ZONE_INVALID, ANALYTICS_UNAVAILABLE.
  rpc GetChannelAnalytics(GetChannelAnalyticsRequest) returns (GetChannelAnalyticsResponse);
  // The same for one video, plus its audience retention curve.
  // Errors: VIDEO_NOT_FOUND, DATE_RANGE_INVALID, TIME_ZONE_INVALID,
  // ANALYTICS_UNAVAILABLE.
  rpc GetVideoAnalytics(GetVideoAnalyticsRequest) returns (GetVideoAnalyticsResponse);
  // Views of the last 48 hours (per hour) and 60 minutes (per minute) for a
  // channel or one video. Errors: CHANNEL_NOT_FOUND, VIDEO_NOT_FOUND,
  // TARGET_REQUIRED, ANALYTICS_UNAVAILABLE.
  rpc GetRealtimeAnalytics(GetRealtimeAnalyticsRequest) returns (GetRealtimeAnalyticsResponse);
}

// An inclusive range of calendar days.
message DateRange {
  // `YYYY-MM-DD`.
  string start_date = 1;
  // `YYYY-MM-DD`; at most 366 days after `start_date`.
  string end_date = 2;
  // IANA zone the days are cut in, e.g. `Asia/Tokyo`. Empty = UTC.
  string time_zone = 3;
}

message AnalyticsTotals {
  int64 views = 1;
  // Distinct viewers (accounts, and network addresses of anonymous viewers).
  int64 unique_viewers = 2;
  double watch_time_seconds = 3;
  // `watch_time_seconds / views`; 0 without views.
  double average_view_duration_seconds = 4;
  int64 subscribers_gained = 5;
  int64 subscribers_lost = 6;
  int64 likes = 7;
  int64 dislikes = 8;
}

message DailyAnalytics {
  // `YYYY-MM-DD` in the requested time zone.
  string date = 1;
  int64 views = 2;
  int64 unique_viewers = 3;
  double watch_time_seconds = 4;
  int64 subscribers_gained = 5;
  int64 subscribers_lost = 6;
}

message TrafficSourceStats {
  TrafficSource source = 1;
  int64 views = 2;
  double watch_time_seconds = 3;
}

message VideoStats {
  VideoSummary video = 1;
  int64 views = 2;
  double watch_time_seconds = 3;
}

message GetChannelAnalyticsRequest {
  string channel_id = 1;
  DateRange range = 2;
}

message GetChannelAnalyticsResponse {
  AnalyticsTotals totals = 1;
  // One entry per day of the range, including days without activity.
  repeated DailyAnalytics daily = 2;
  repeated TrafficSourceStats traffic_sources = 3;
  // The ten most viewed videos of the range.
  repeated VideoStats top_videos = 4;
  // Current number of subscribers.
  int64 subscriber_count = 5;
}

message GetVideoAnalyticsRequest {
  string video_id = 1;
  DateRange range = 2;
}

message GetVideoAnalyticsResponse {
  AnalyticsTotals totals = 1;
  repeated DailyAnalytics daily = 2;
  repeated TrafficSourceStats traffic_sources = 3;
  // 100 values: the share (0-1) of playback sessions that watched each
  // hundredth of the video. Empty without sessions.
  repeated double retention = 4;
}

message GetRealtimeAnalyticsRequest {
  oneof target {
    string channel_id = 1;
    string video_id = 2;
  }
}

message GetRealtimeAnalyticsResponse {
  // 48 values, oldest first; the last is the current hour.
  repeated int64 views_per_hour = 1;
  // 60 values, oldest first; the last is the current minute.
  repeated int64 views_per_minute = 2;
  int64 views_last_48_hours = 3;
  int64 views_last_60_minutes = 4;
  // Channel target only: the most viewed videos of the last 48 hours.
  repeated VideoStats top_videos = 5;
}

// ───────────────────────────── Realtime ─────────────────────────────

// Pushed over the realtime gateway (tokuly.realtime.v1.ServerFrame.video).
//
// `video_updated` is sent to the owner (user-scoped). The `party_*` events
// are sent on the party's topic (see WatchPartyService).
message VideoEvent {
  oneof event {
    // A video of the caller changed state: processing finished or failed,
    // or a scheduled video went live.
    VideoSummary video_updated = 1;
    PartyPlayback party_playback = 2;
    PartyMember party_member_joined = 3;
    PartyMemberLeft party_member_left = 4;
    // A member's role changed.
    PartyMember party_member_updated = 5;
    PartyMessage party_message = 6;
    // The party switched videos or its settings changed; `playback` restarts.
    Party party_updated = 7;
    PartyEnded party_ended = 8;
  }
}

message PartyMemberLeft {
  string member_id = 1;
  PartyLeaveReason reason = 2;
  int32 member_count = 3;
}

message PartyEnded {
  string party_id = 1;
  PartyEndReason reason = 2;
}
