syntax = "proto3";

// Accounts, authentication, sessions, profiles and per-account settings.
package tokuly.identity.v1;

import "google/protobuf/timestamp.proto";
import "tokuly/common/v1/common.proto";

// ───────────────────────────── Auth ─────────────────────────────

// Unauthenticated entry points plus token lifecycle.
//
// Token model: a short-lived access token (JWT, EdDSA, ~15 min) sent as
// `Authorization: Bearer`, and a rotating opaque refresh token. Web clients
// send `x-tokuly-client: web`; the server then stores the refresh token in an
// HttpOnly cookie and leaves `refresh_token` empty in responses.
service AuthService {
  rpc SignUp(SignUpRequest) returns (AuthResponse);
  rpc SignIn(SignInRequest) returns (AuthResponse);
  // Exchanges a refresh token (body or cookie) for a new token pair.
  rpc RefreshToken(RefreshTokenRequest) returns (AuthResponse);
  rpc SignOut(SignOutRequest) returns (SignOutResponse);

  // Whether a handle can be taken. RATE_LIMITED past 120 a minute per
  // account, or per address when signed out.
  rpc CheckHandle(CheckHandleRequest) returns (CheckHandleResponse);

  // What this server supports for signing in, so clients show only the ways
  // that work. Needs no session: the sign-in screen asks it.
  rpc GetAuthCapabilities(GetAuthCapabilitiesRequest) returns (GetAuthCapabilitiesResponse);

  // Passkeys (WebAuthn). Option/response payloads are the standard WebAuthn
  // JSON objects, passed through as strings.
  //
  // All four: PASSKEYS_UNAVAILABLE when the server has no passkeys
  // (`AuthCapabilities.passkeys_available` is false).
  // BeginPasskeyRegistration: INVALID_CREDENTIALS (wrong `current_password`),
  // TOO_MANY_PASSKEYS, RATE_LIMITED.
  rpc BeginPasskeyRegistration(BeginPasskeyRegistrationRequest) returns (BeginPasskeyRegistrationResponse);
  rpc FinishPasskeyRegistration(FinishPasskeyRegistrationRequest) returns (FinishPasskeyRegistrationResponse);
  rpc BeginPasskeySignIn(BeginPasskeySignInRequest) returns (BeginPasskeySignInResponse);
  // RATE_LIMITED past 60 in 5 minutes per address (as BeginPasskeySignIn).
  rpc FinishPasskeySignIn(FinishPasskeySignInRequest) returns (AuthResponse);

  rpc RequestEmailVerification(RequestEmailVerificationRequest) returns (RequestEmailVerificationResponse);
  // Opens a mailed link: confirms an address, completes an address change,
  // or undoes one. A completed change signs out every other device and voids
  // pending reset links; when the previous address was verified it is mailed
  // an undo link (7 days, once) and stays reserved for it until then
  // (sign-up and ChangeEmail treat it as taken). The undo restores the
  // address with its original verification. TOKEN_INVALID, EMAIL_TAKEN (the
  // link stays usable).
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  // Sets a new password with the token of a reset mail and signs every
  // device out. TOKEN_INVALID, the password reasons of SignUp, RATE_LIMITED
  // past 30 an hour per address.
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse);

  // Device login: an app without a browser session (desktop Studio, TV, CLI)
  // shows `user_code` / a QR of `verification_url`, the user approves it from a
  // signed-in client, and the app polls until tokens are issued. Tokens never
  // travel through URLs.
  rpc StartDeviceLogin(StartDeviceLoginRequest) returns (StartDeviceLoginResponse);
  rpc PollDeviceLogin(PollDeviceLoginRequest) returns (PollDeviceLoginResponse);
  // Get and Approve: DEVICE_CODE_INVALID, DEVICE_CODE_USED (Approve), and
  // RATE_LIMITED past 20 codes per account in 10 minutes.
  rpc GetDeviceLogin(GetDeviceLoginRequest) returns (GetDeviceLoginResponse);
  rpc ApproveDeviceLogin(ApproveDeviceLoginRequest) returns (ApproveDeviceLoginResponse);

  // Accounts on this device (quick switching between a main account, a 裏垢,
  // a creator account...). Each account keeps a session of its own on the
  // device; the server never records that they belong together. One of them
  // is active, the others are parked: a parked session is refreshed only
  // through SwitchAccount (RefreshToken answers SWITCH_REQUIRED). An account
  // is added by signing in to it in full (SignIn, SignUp or
  // FinishPasskeySignIn with `add_account`), with its own password and second
  // factor; at most 5 accounts per device (TOO_MANY_ACCOUNTS).
  //
  // Web keeps the parked refresh tokens in an HttpOnly cookie; native clients
  // hold them and pass them in `refresh_tokens` / `refresh_token`.
  rpc ListDeviceAccounts(ListDeviceAccountsRequest) returns (ListDeviceAccountsResponse);
  // Makes a parked account the active one, without its password. The account
  // that was active is parked. When the target account has two-factor
  // authentication on and its session on this device has not passed the
  // second factor in the last 12 hours, the answer is `mfa_required` until
  // `totp_code` (or a recovery code) is given. ACCOUNT_NOT_ON_DEVICE (no such
  // parked session: signed out, expired, revoked by a password change),
  // INVALID_TOTP, ACCOUNT_BANNED, RATE_LIMITED. The switch is written to the
  // target account's security log (ACCOUNT_SWITCHED).
  rpc SwitchAccount(SwitchAccountRequest) returns (AuthResponse);
  // Signs a parked account out of this device; the others stay.
  rpc RemoveDeviceAccount(RemoveDeviceAccountRequest) returns (RemoveDeviceAccountResponse);

  // Opens the web signed in from an app: a single-use code (60 seconds) for
  // the caller's session, which the app's web view loads as
  // `<api path prefix>/auth/handoff?code=…`. That route (plain HTTP, not
  // Connect) redeems it once, makes a web session of the same account linked
  // to the app's session (ending the app's session ends it too; one per app
  // session, a newer one replaces it), sets the refresh cookie and redirects
  // to `path`. The session token never travels in a URL.
  //
  // The code is bound to the app (as PKCE binds an OAuth code): the app makes
  // a random verifier, sends its SHA-256 here, and its web view sends the
  // verifier itself on that first load, in the `x-tokuly-handoff-verifier`
  // header, never in the URL. A load without it (a link someone was sent,
  // the code leaked) signs nobody in, so nobody can be signed in as somebody
  // else's account. Sessions only: not
  // available to API tokens or OAuth apps, nor to a session that came from a
  // hand-off itself. INVALID_VERIFIER, INVALID_PATH (not a path of the web app: a scheme, a
  // host, `//`, a backslash, or an unknown route), NOT_AVAILABLE (a web
  // session from a hand-off), RATE_LIMITED.
  rpc CreateWebHandoff(CreateWebHandoffRequest) returns (CreateWebHandoffResponse);
}

message ClientInfo {
  tokuly.common.v1.Platform platform = 1;
  // Human readable device name, e.g. "Pixel 10" or "Chrome on macOS".
  string device_name = 2;
  string app_version = 3;
  // Stable per-install identifier used to de-duplicate sessions.
  string device_id = 4;
  // BCP 47 language tag preferred by the device.
  string locale = 5;
  // IANA time zone, e.g. "Asia/Tokyo".
  string time_zone = 6;
}

message SignUpRequest {
  string email = 1;
  string password = 2;
  string handle = 3;
  string display_name = 4;
  // ISO date (YYYY-MM-DD). Used for the minimum-age check.
  string birthdate = 5;
  ClientInfo client = 6;
  // Optional invite code; the inviter gets an "intro" and a friend suggestion.
  string invite_code = 7;
  // The user accepted the terms of service and community rules.
  bool accept_terms = 8;
  // Keep the account that is signed in on this device (parked) and add the
  // new one beside it, instead of replacing it. TOO_MANY_ACCOUNTS past 5.
  bool add_account = 9;
}

message SignInRequest {
  // Email address or handle.
  string identifier = 1;
  string password = 2;
  // Required when the account has TOTP enabled and `mfa_required` was returned.
  string totp_code = 3;
  ClientInfo client = 4;
  // See SignUpRequest.add_account.
  bool add_account = 5;
}

message AuthResponse {
  string access_token = 1;
  // Empty for web clients (stored in an HttpOnly cookie instead).
  string refresh_token = 2;
  google.protobuf.Timestamp access_token_expires_at = 3;
  Me me = 4;
  // Set instead of tokens when a second factor is needed.
  bool mfa_required = 5;
  string session_id = 6;
}

message RefreshTokenRequest {
  // Empty for web clients (cookie is used).
  string refresh_token = 1;
}

message SignOutRequest {
  // Also revoke every other session of this account.
  bool all_sessions = 1;
  // Sign every account on this device out (a shared computer): the active
  // one and the parked ones. Web: both refresh cookies are read and cleared.
  bool all_accounts_on_device = 2;
  // Native clients with `all_accounts_on_device`: the parked accounts'
  // refresh tokens they hold.
  repeated string parked_refresh_tokens = 3;
}

message SignOutResponse {}

message CheckHandleRequest {
  string handle = 1;
}

message CheckHandleResponse {
  bool available = 1;
  // Normalized form the server would store.
  string normalized = 2;
  // INVALID_FORMAT | TAKEN | RESERVED when not available. RESERVED covers
  // the reserved words and anything that passes for Tokuly or its staff once
  // look-alike characters are folded (`t0kuly`, `tokuly_official`, `adm1n`).
  string reason = 3;
}

// Ways of signing in this server supports.
message AuthCapabilities {
  // Passkeys can be registered and used. False when the server is reached by
  // an IP address (`TOKULY_PUBLIC_URL=http://192.168.1.10`): WebAuthn needs
  // a domain name (localhost counts as one).
  bool passkeys_available = 1;
}

message GetAuthCapabilitiesRequest {}

message GetAuthCapabilitiesResponse {
  AuthCapabilities capabilities = 1;
}

message BeginPasskeyRegistrationRequest {
  // Label shown in the passkey list, e.g. "MacBook Touch ID".
  string name = 1;
  // The account password (ignored when the account has none). A new way to
  // sign in is never added on the strength of a session alone.
  string current_password = 2;
}

message BeginPasskeyRegistrationResponse {
  string challenge_id = 1;
  // PublicKeyCredentialCreationOptions as JSON.
  string options_json = 2;
}

message FinishPasskeyRegistrationRequest {
  string challenge_id = 1;
  // RegistrationResponseJSON from navigator.credentials.create().
  string credential_json = 2;
}

message FinishPasskeyRegistrationResponse {
  Passkey passkey = 1;
}

message BeginPasskeySignInRequest {
  // Optional: narrows allowed credentials. Empty enables discoverable login.
  string identifier = 1;
}

message BeginPasskeySignInResponse {
  string challenge_id = 1;
  // PublicKeyCredentialRequestOptions as JSON.
  string options_json = 2;
}

message FinishPasskeySignInRequest {
  string challenge_id = 1;
  // AuthenticationResponseJSON from navigator.credentials.get().
  string credential_json = 2;
  ClientInfo client = 3;
  // See SignUpRequest.add_account.
  bool add_account = 4;
}

message RequestEmailVerificationRequest {}

message RequestEmailVerificationResponse {}

message VerifyEmailRequest {
  string token = 1;
}

message VerifyEmailResponse {
  // The link was the undo of an address change: the account is back on this
  // address and every device was signed out (the owner should reset the
  // password next).
  bool email_change_reverted = 1;
}

message RequestPasswordResetRequest {
  string email = 1;
}

// Always succeeds to avoid leaking whether an email is registered.
message RequestPasswordResetResponse {}

message ResetPasswordRequest {
  string token = 1;
  string new_password = 2;
}

message ResetPasswordResponse {}

message StartDeviceLoginRequest {
  ClientInfo client = 1;
}

message StartDeviceLoginResponse {
  // Secret held by the device; used for polling.
  string device_code = 1;
  // Short code the user confirms, e.g. "TKLY-4827".
  string user_code = 2;
  // URL to open (or encode as QR) on a signed-in device.
  string verification_url = 3;
  int32 expires_in_seconds = 4;
  int32 poll_interval_seconds = 5;
}

message PollDeviceLoginRequest {
  string device_code = 1;
}

message PollDeviceLoginResponse {
  DeviceLoginStatus status = 1;
  // Present when status is APPROVED.
  AuthResponse auth = 2;
}

enum DeviceLoginStatus {
  DEVICE_LOGIN_STATUS_UNSPECIFIED = 0;
  DEVICE_LOGIN_STATUS_PENDING = 1;
  DEVICE_LOGIN_STATUS_APPROVED = 2;
  DEVICE_LOGIN_STATUS_DENIED = 3;
  DEVICE_LOGIN_STATUS_EXPIRED = 4;
}

message GetDeviceLoginRequest {
  string user_code = 1;
}

message GetDeviceLoginResponse {
  ClientInfo client = 1;
  DeviceLoginStatus status = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ApproveDeviceLoginRequest {
  string user_code = 1;
  // False denies the request.
  bool approve = 2;
}

message ApproveDeviceLoginResponse {}

message ListDeviceAccountsRequest {
  // Native clients: the refresh tokens of the parked accounts they hold.
  // Web: empty (the cookie is read).
  repeated string refresh_tokens = 1;
}

// An account signed in on this device.
message DeviceAccount {
  // The account's session on this device; names it in SwitchAccount and
  // RemoveDeviceAccount.
  string session_id = 1;
  tokuly.common.v1.UserSummary user = 2;
  // The account this request was made as (from the access token, or the
  // web cookie of the active account).
  bool active = 3;
  // Switching to it will ask for its second factor.
  bool mfa_required = 4;
}

message ListDeviceAccountsResponse {
  // The active account first, then the parked ones, most recently used
  // first. Tokens that no longer work are left out (and dropped from the web
  // cookie).
  repeated DeviceAccount accounts = 1;
  // How many accounts one device may hold.
  int32 limit = 2;
}

message SwitchAccountRequest {
  // The parked session to switch to (web).
  string session_id = 1;
  // Native clients: the refresh token of the parked account instead.
  string refresh_token = 2;
  // The target account's TOTP or recovery code, when `mfa_required` was answered.
  string totp_code = 3;
}

message RemoveDeviceAccountRequest {
  // The parked session to sign out (web).
  string session_id = 1;
  // Native clients: its refresh token instead.
  string refresh_token = 2;
}

message RemoveDeviceAccountResponse {}

message CreateWebHandoffRequest {
  // Where the web opens, a path of the web app with an optional query and
  // fragment (`/settings`, `/notes?tab=home`). Empty: `/`.
  string path = 1;
  // The SHA-256 of the app's verifier, 64 lowercase hex digits. The verifier
  // is 32 to 128 characters of `A-Z a-z 0-9 - . _ ~` (RFC 7636), at least
  // 256 random bits. INVALID_VERIFIER otherwise.
  string verifier_hash = 2;
}

message CreateWebHandoffResponse {
  // What the app's web view loads, relative to the server's origin
  // (`/api/auth/handoff?code=…`).
  string url = 1;
  // When the code stops working (60 seconds after it was made).
  google.protobuf.Timestamp expires_at = 2;
}

// ───────────────────────────── Account ─────────────────────────────

// Everything about the signed-in account itself.
service AccountService {
  rpc GetMe(GetMeRequest) returns (GetMeResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc SetStatus(SetStatusRequest) returns (SetStatusResponse);

  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  // SETTINGS_INVALID; SETTING_RESTRICTED when an account under 18 widens a
  // setting past what minors may choose (`PrivacySettings`);
  // BIRTHDAY_YEAR_RESTRICTED.
  rpc UpdateSettings(UpdateSettingsRequest) returns (UpdateSettingsResponse);
  // Gives the birthdate of an account that has none (made before sign-up
  // asked for it; clients ask when `Me.birthdate` is empty). It cannot be
  // changed afterwards. An account under 18 then gets the privacy defaults
  // of minors, as at sign-up. BIRTHDATE_INVALID, AGE_RESTRICTED (under the
  // minimum age: nothing is stored), BIRTHDATE_ALREADY_SET, RATE_LIMITED.
  rpc SetBirthdate(SetBirthdateRequest) returns (SetBirthdateResponse);

  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
  // INVALID_CREDENTIALS, EMAIL_INVALID, EMAIL_UNCHANGED, RATE_LIMITED. An
  // address that belongs to another account is answered like any other (so
  // the RPC does not reveal who is registered) but is sent no link.
  rpc ChangeEmail(ChangeEmailRequest) returns (ChangeEmailResponse);

  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);

  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse);
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse);

  // TOTP two-factor authentication. Every code is accepted once; attempts
  // are limited to 8 per 5 minutes and 30 a day (RATE_LIMITED).
  rpc BeginTotpSetup(BeginTotpSetupRequest) returns (BeginTotpSetupResponse);
  // INVALID_CREDENTIALS (wrong `current_password`), INVALID_TOTP,
  // TOTP_SETUP_EXPIRED, RATE_LIMITED.
  rpc EnableTotp(EnableTotpRequest) returns (EnableTotpResponse);
  // INVALID_TOTP (wrong or already used code), TOTP_NOT_ENABLED, RATE_LIMITED.
  rpc DisableTotp(DisableTotpRequest) returns (DisableTotpResponse);

  // Security log: sign-ins, password changes, new devices, etc.
  rpc ListSecurityEvents(ListSecurityEventsRequest) returns (ListSecurityEventsResponse);

  // Account deletion has a 30 day grace period. The account keeps working
  // meanwhile (`Me.deletion_scheduled_at` says when it ends) and
  // CancelAccountDeletion calls it off; signing in does not. When the period
  // ends the account is erased, its devices are signed out at once and its
  // handle stays unclaimable for 30 days.
  rpc RequestAccountDeletion(RequestAccountDeletionRequest) returns (RequestAccountDeletionResponse);
  rpc CancelAccountDeletion(CancelAccountDeletionRequest) returns (CancelAccountDeletionResponse);

  // Starts an asynchronous export of all personal data; the finished archive
  // is delivered as a notification with a download link.
  rpc RequestDataExport(RequestDataExportRequest) returns (RequestDataExportResponse);

  // Third-party connections (e.g. Spotify for "now playing").
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  rpc BeginConnection(BeginConnectionRequest) returns (BeginConnectionResponse);
  rpc FinishConnection(FinishConnectionRequest) returns (FinishConnectionResponse);
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);

  // Profile extras (プロフ帳): MBTI, blood type, zodiac, pronouns, 推し,
  // favourite things, links, a longer bio, a theme and question cards, each
  // with the audience that sees it. Groups present in the request replace
  // what is stored; absent ones stay. Nothing here is needed at sign-up.
  // MBTI_INVALID, BLOOD_TYPE_INVALID, PRONOUNS_INVALID, LONG_BIO_TOO_LONG,
  // THEME_INVALID, VISIBILITY_INVALID, TOO_MANY_OSHI, OSHI_INVALID,
  // TOO_MANY_TAGS, TAG_INVALID, TOO_MANY_LINKS, LINK_INVALID,
  // TOO_MANY_CARDS, CARD_INVALID, PROMPT_NOT_FOUND, CARD_NOT_FOUND, the
  // media errors for an oshi image, RATE_LIMITED (60 an hour).
  rpc UpdateProfileExtras(UpdateProfileExtrasRequest) returns (UpdateProfileExtrasResponse);
  // Pins a song on the profile from the connected Spotify account: the track
  // named, or what is playing now. SPOTIFY_NOT_CONNECTED, TRACK_INVALID,
  // NOTHING_PLAYING, PROVIDER_ERROR, RATE_LIMITED.
  rpc PinSong(PinSongRequest) returns (PinSongResponse);
  // Checks the profile links again for a link back (`rel="me"`) to this
  // profile. The check runs in the background; RATE_LIMITED past 5 an hour.
  rpc RecheckProfileLinks(RecheckProfileLinksRequest) returns (RecheckProfileLinksResponse);
}

// The signed-in user's full account.
message Me {
  tokuly.common.v1.UserSummary user = 1;
  string email = 2;
  bool email_verified = 3;
  string bio = 4;
  tokuly.common.v1.Image banner = 5;
  google.protobuf.Timestamp created_at = 6;
  bool totp_enabled = 7;
  int32 passkey_count = 8;
  bool has_password = 9;
  // Account roles: "admin", "moderator", "staff".
  repeated string roles = 10;
  // Set while the account is scheduled for deletion.
  google.protobuf.Timestamp deletion_scheduled_at = 11;
  Status status = 12;
  string birthdate = 13;
  // Feature flags evaluated for this user (name -> enabled).
  map<string, bool> features = 14;
  string locale = 15;
  string time_zone = 16;
  // Everything of the プロフ帳, with the audience of every field.
  ProfileExtras extras = 17;
  // The account is a bot (made on the developer platform); `bot_owner` is the
  // person it belongs to.
  bool bot = 18;
  tokuly.common.v1.UserSummary bot_owner = 19;
  // School shown on the profile.
  string school_name = 20;
  // The limits for people under 18 apply: by the birthdate, or because the
  // account has given none yet (an empty `birthdate`; a bot goes by its
  // owner).
  bool minor = 21;
}

// Ephemeral mood/status shown on the profile and next to the map pin.
message Status {
  string emoji = 1;
  string text = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp set_at = 4;
}

message GetMeRequest {}

message GetMeResponse {
  Me me = 1;
}

message UpdateProfileRequest {
  optional string display_name = 1;
  // At most 3 changes a week. The handle given up stays reserved for this
  // account for 30 days (HANDLE_TAKEN for everyone else), as does the
  // handle of a purged account.
  optional string handle = 2;
  optional string bio = 3;
  // Media asset IDs from tokuly.media.v1.MediaService uploads. Empty string clears.
  optional string avatar_asset_id = 4;
  optional string avatar_video_asset_id = 5;
  optional string banner_asset_id = 6;
  optional string locale = 7;
  optional string time_zone = 8;
  // School shown as a badge on the profile and used for "same school"
  // friend suggestions. Empty string clears it.
  optional string school_name = 9;
}

message UpdateProfileResponse {
  Me me = 1;
}

message SetStatusRequest {
  // Empty emoji and text clears the status.
  string emoji = 1;
  string text = 2;
  // 0 keeps the status until cleared.
  int32 expires_in_seconds = 3;
}

message SetStatusResponse {
  Status status = 1;
}

// Who is allowed to do something.
enum Audience {
  AUDIENCE_UNSPECIFIED = 0;
  AUDIENCE_EVERYONE = 1;
  AUDIENCE_FRIENDS_OF_FRIENDS = 2;
  AUDIENCE_FRIENDS = 3;
  AUDIENCE_NOBODY = 4;
}

// Accounts under 18 start with the defaults for minors, decided when the
// birthdate is given and then stored: discoverable_to and
// friend_requests_from AUDIENCE_FRIENDS_OF_FRIENDS, default_note_visibility
// VISIBILITY_FOLLOWERS, nearby_discoverable off. They may change them, except
// that discoverable_to and friend_requests_from go no wider than friends of
// friends until they turn 18 (SETTING_RESTRICTED).
message PrivacySettings {
  reserved 4;
  reserved "discoverable";

  // Who may send friend requests.
  Audience friend_requests_from = 1;
  // Who may see the friend list.
  Audience friend_list_visible_to = 2;
  // Who may see the scratch map (footprints) in full; others get percentages only.
  Audience footprints_visible_to = 3;
  // Appear in nearby discovery (within ~50 m) while the add-friend screen is open.
  bool nearby_discoverable = 5;
  // Share battery level / charging state with friends.
  bool share_battery = 6;
  // Share speed and activity (walking, driving...).
  bool share_activity = 7;
  // Show the online ("in app") halo.
  bool share_online_status = 8;
  // Show home/work/school badges to friends.
  bool share_place_labels = 9;
  // Share what is playing (connected music service).
  bool share_now_playing = 10;
  // Days of raw location history to keep (0 = keep forever, minimum 1).
  int32 location_history_days = 11;
  // Record footprints (scratch map) and visits.
  bool record_history = 12;
  // Tell people when I look at their location / profile.
  bool share_views = 13;
  // Who may message me directly.
  Audience direct_messages_from = 14;
  // Who may call me.
  Audience calls_from = 15;
  // Notes default visibility: public, followers, friends or private.
  tokuly.common.v1.Visibility default_note_visibility = 16;
  // Who sees my birthday (on the profile, in friends' calendars, birthday
  // reminders): AUDIENCE_EVERYONE, AUDIENCE_FRIENDS or AUDIENCE_NOBODY
  // (the default). The zodiac sign follows its own field visibility.
  Audience birthday_visible_to = 17;
  // Show the year as well as the month and day. Not with AUDIENCE_EVERYONE
  // for an account under 18 (BIRTHDAY_YEAR_RESTRICTED): the year gives the
  // age away.
  bool birthday_show_year = 18;
  // Who finds me in user search, address-book matching and "people you may
  // know": AUDIENCE_EVERYONE (all of them), AUDIENCE_FRIENDS_OF_FRIENDS
  // (only as a friend of a friend among "people you may know"; never
  // through search or an address book) or AUDIENCE_NOBODY.
  Audience discoverable_to = 19;
}

message AppearanceSettings {
  // "system" | "light" | "dark".
  string theme = 1;
  // Map style ID, e.g. "tokuly", "light", "dark", "mono", "satellite".
  string map_style = 2;
  // Accent color as #rrggbb.
  string accent_color = 3;
  // ドパガキ度: 0 (calm, reduced motion) .. 5 (maximum sparkle).
  int32 dopamine_level = 4;
  // Play interface sounds.
  bool sounds = 5;
  // Vibrate on interactions.
  bool haptics = 6;
  // "km" | "mi".
  string distance_unit = 7;
  // Autoplay videos in feeds.
  bool autoplay = 8;
}

message Settings {
  PrivacySettings privacy = 1;
  AppearanceSettings appearance = 2;
}

message GetSettingsRequest {}

message GetSettingsResponse {
  Settings settings = 1;
}

message UpdateSettingsRequest {
  // Fields present replace the stored group as a whole.
  PrivacySettings privacy = 1;
  AppearanceSettings appearance = 2;
}

message UpdateSettingsResponse {
  Settings settings = 1;
}

message SetBirthdateRequest {
  // YYYY-MM-DD.
  string birthdate = 1;
}

message SetBirthdateResponse {
  Me me = 1;
  // With the defaults of the age group applied.
  Settings settings = 2;
}

// Password changes, new passkeys and turning TOTP on or off are also told to
// the account's address by mail.
message ChangePasswordRequest {
  // Empty when the account has no password yet (passkey-only).
  string current_password = 1;
  string new_password = 2;
}

message ChangePasswordResponse {}

message ChangeEmailRequest {
  string new_email = 1;
  string current_password = 2;
}

// A verification mail is sent to the new address; the change applies on verify.
message ChangeEmailResponse {}

message Session {
  string id = 1;
  ClientInfo client = 2;
  string ip = 3;
  // Coarse location derived from the IP (may be empty).
  string location = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp last_active_at = 6;
  bool current = 7;
  // Added beside another account on that device (account switching).
  bool added_by_switch = 8;
  // Parked on that device: another account is the active one there.
  bool parked = 9;
  // Last time this account was switched to on that device.
  google.protobuf.Timestamp last_switched_at = 10;
}

message ListSessionsRequest {}

message ListSessionsResponse {
  repeated Session sessions = 1;
}

message RevokeSessionRequest {
  string session_id = 1;
}

message RevokeSessionResponse {}

message Passkey {
  string id = 1;
  string name = 2;
  google.protobuf.Timestamp created_at = 3;
  google.protobuf.Timestamp last_used_at = 4;
}

message ListPasskeysRequest {}

message ListPasskeysResponse {
  repeated Passkey passkeys = 1;
}

message DeletePasskeyRequest {
  string passkey_id = 1;
}

message DeletePasskeyResponse {}

message BeginTotpSetupRequest {}

message BeginTotpSetupResponse {
  // Base32 secret for manual entry.
  string secret = 1;
  // otpauth:// URI to render as a QR code.
  string otpauth_url = 2;
}

message EnableTotpRequest {
  string code = 1;
  // The account password (ignored when the account has none), so a session
  // alone cannot put the account behind an authenticator someone else holds.
  string current_password = 2;
}

message EnableTotpResponse {
  // One-time recovery codes; shown once.
  repeated string recovery_codes = 1;
}

message DisableTotpRequest {
  string code = 1;
}

message DisableTotpResponse {}

message SecurityEvent {
  string id = 1;
  // SIGN_IN | SIGN_IN_FAILED | SIGN_OUT | PASSWORD_CHANGED | EMAIL_CHANGED |
  // PASSKEY_ADDED | PASSKEY_REMOVED | TOTP_ENABLED | TOTP_DISABLED |
  // SESSION_REVOKED | DEVICE_LOGIN_APPROVED | DELETION_REQUESTED | ...
  string type = 2;
  string ip = 3;
  string device_name = 4;
  string location = 5;
  google.protobuf.Timestamp created_at = 6;
}

message ListSecurityEventsRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message ListSecurityEventsResponse {
  repeated SecurityEvent events = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message RequestAccountDeletionRequest {
  string current_password = 1;
  string reason = 2;
}

message RequestAccountDeletionResponse {
  google.protobuf.Timestamp deletion_scheduled_at = 1;
}

message CancelAccountDeletionRequest {}

message CancelAccountDeletionResponse {}

message RequestDataExportRequest {}

message RequestDataExportResponse {
  string export_id = 1;
}

message Connection {
  // "spotify" | ...
  string provider = 1;
  string account_name = 2;
  google.protobuf.Timestamp connected_at = 3;
}

message ListConnectionsRequest {}

message ListConnectionsResponse {
  repeated Connection connections = 1;
  // Providers the server is configured for.
  repeated string available_providers = 2;
}

message BeginConnectionRequest {
  string provider = 1;
  // Where the provider should send the user back to.
  string redirect_uri = 2;
}

message BeginConnectionResponse {
  // Provider authorization URL to open.
  string authorization_url = 1;
  string state = 2;
}

message FinishConnectionRequest {
  string provider = 1;
  string code = 2;
  string state = 3;
}

message FinishConnectionResponse {
  Connection connection = 1;
}

message DeleteConnectionRequest {
  string provider = 1;
}

message DeleteConnectionResponse {}

message UpdateProfileExtrasRequest {
  // Four letters (`ENFP`), optionally `-A` / `-T`; empty clears.
  optional string mbti = 1;
  optional BloodType blood_type = 2;
  // Free text, e.g. "she/her", "彼/彼女"; at most 24 characters.
  optional string pronouns = 3;
  // The long bio: up to 2000 characters, line breaks and the note markup.
  optional string long_bio = 4;
  ProfileTheme theme = 5;
  // Replaces every field audience at once (see ProfileFieldVisibility).
  ProfileFieldVisibility visibility = 6;
  OshiList oshi = 7;
  ProfileTagList tags = 8;
  ProfileLinkList links = 9;
  ProfileQaCardList qa_cards = 10;
}

// Up to 10 推し, in display order.
message OshiList {
  repeated OshiInput items = 1;
}

message OshiInput {
  // An existing 推し being kept (its image stays unless replaced); empty for a new one.
  string id = 1;
  // 1-40 characters.
  string name = 2;
  // Absent: keep the image; empty: no image; otherwise an uploaded image (purpose AVATAR: a square picture).
  optional string image_asset_id = 3;
  // An https:// page about them (optional).
  string url = 4;
  // One emoji standing in for an image (optional).
  string emoji = 5;
}

// Up to 30 favourite things.
message ProfileTagList {
  repeated ProfileTag items = 1;
}

// Up to 8 links, in display order. A link keeps its verification while its URL stays.
message ProfileLinkList {
  repeated ProfileLinkInput items = 1;
}

message ProfileLinkInput {
  // 1-40 characters; empty uses the host name.
  string title = 1;
  // http(s), at most 500 characters.
  string url = 2;
}

// Up to 30 cards of the プロフ帳, in display order.
message ProfileQaCardList {
  repeated ProfileQaCardInput items = 1;
}

message ProfileQaCardInput {
  // An existing card being kept; empty for a new one.
  string id = 1;
  // A prompt from ListProfilePrompts; empty for a free question.
  string prompt_id = 2;
  // The question of a free card: 1-60 characters. Ignored with `prompt_id`.
  string question = 3;
  // 1-200 characters.
  string answer = 4;
  reserved 5;
  reserved "visibility";
  // Kept but not shown on the profile.
  bool hidden = 6;
  // Who sees the card: PUBLIC, FOLLOWERS, FRIENDS, CLOSE_FRIENDS, CIRCLE
  // (with `circle_id`, one of the owner's circles) or PRIVATE (only me).
  tokuly.common.v1.AudienceRef audience = 7;
}

message UpdateProfileExtrasResponse {
  ProfileExtras extras = 1;
}

message PinSongRequest {
  // A Spotify track URL (`https://open.spotify.com/track/…`), URI or ID;
  // empty pins what is playing now.
  string track = 1;
  // Removes the pinned song instead.
  bool clear = 2;
}

message PinSongResponse {
  // Unset after `clear`.
  PinnedSong song = 1;
}

message RecheckProfileLinksRequest {}

message RecheckProfileLinksResponse {}

// ───────────────────────────── Profiles ─────────────────────────────

// Public-facing profiles of any user.
service ProfileService {
  // Look up by ID or handle. Works anonymously for public data.
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse);
  rpc BatchGetUsers(BatchGetUsersRequest) returns (BatchGetUsersResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  // Records that the caller viewed a profile (deduplicated per day).
  rpc RecordProfileView(RecordProfileViewRequest) returns (RecordProfileViewResponse);
  // Who viewed my profile: cumulative count plus recent viewers who share views.
  rpc GetProfileViews(GetProfileViewsRequest) returns (GetProfileViewsResponse);
  // The curated questions of the プロフ帳.
  rpc ListProfilePrompts(ListProfilePromptsRequest) returns (ListProfilePromptsResponse);
  // Favourite things other people show publicly, most used first, for the
  // tag picker. A tag is suggested once at least 5 people show it (one
  // person's tag would point at them); locked accounts and bots do not
  // count. QUERY_TOO_LONG, RATE_LIMITED.
  rpc SuggestProfileTags(SuggestProfileTagsRequest) returns (SuggestProfileTagsResponse);
}

// What the viewer is to the profile owner.
enum Relationship {
  RELATIONSHIP_UNSPECIFIED = 0;
  RELATIONSHIP_NONE = 1;
  RELATIONSHIP_SELF = 2;
  RELATIONSHIP_FRIENDS = 3;
  // The viewer sent a request that is still pending.
  RELATIONSHIP_REQUEST_SENT = 4;
  // The profile owner sent the viewer a request.
  RELATIONSHIP_REQUEST_RECEIVED = 5;
  // The viewer blocked this user.
  RELATIONSHIP_BLOCKED = 6;
}

message Profile {
  tokuly.common.v1.UserSummary user = 1;
  string bio = 2;
  tokuly.common.v1.Image banner = 3;
  google.protobuf.Timestamp joined_at = 4;
  Status status = 5;
  Relationship relationship = 6;
  ProfileStats stats = 7;
  // Now playing track, when shared.
  NowPlaying now_playing = 8;
  // Distance in meters between viewer and owner (friends only, when both share location).
  optional double distance_meters = 9;
  // Mutual friends preview (up to 6) and total.
  repeated tokuly.common.v1.UserSummary mutual_friends = 10;
  int32 mutual_friend_count = 11;
  // Friendship details when relationship is FRIENDS.
  google.protobuf.Timestamp friends_since = 12;
  bool best_friend = 13;
  // School badge (optional).
  string school_name = 14;
  // Pieces contributed by other domains, in display order.
  repeated ProfileCard cards = 15;
  // The プロフ帳 as the viewer may see it: fields whose audience leaves the
  // viewer out are empty, cards hidden from them are absent.
  ProfileExtras extras = 16;
  // A bot account (developer platform) and the person it belongs to (unset
  // when the viewer may not see that person).
  bool bot = 17;
  tokuly.common.v1.UserSummary bot_owner = 18;
  // The birthday when the owner shares it with the viewer.
  BirthdayView birthday = 19;
}

// A birthday as it is shared.
message BirthdayView {
  int32 month = 1;
  int32 day = 2;
  // 0 when the year is not shared.
  int32 year = 3;
}

// The プロフ帳: what makes a profile somebody's own.
message ProfileExtras {
  // e.g. `ENFP` or `INFJ-T`.
  string mbti = 1;
  BloodType blood_type = 2;
  string pronouns = 3;
  // Derived from the birthday; shown when its field audience lets the viewer in.
  Zodiac zodiac = 4;
  repeated Oshi oshi = 5;
  repeated ProfileTag tags = 6;
  repeated ProfileLink links = 7;
  string long_bio = 8;
  // Always public: it is how the page looks.
  ProfileTheme theme = 9;
  PinnedSong pinned_song = 10;
  repeated ProfileQaCard qa_cards = 11;
  // The owner's own view (Me, UpdateProfileExtras) only: who sees each field.
  ProfileFieldVisibility visibility = 12;
}

// Who sees each field of the プロフ帳: VISIBILITY_PUBLIC, VISIBILITY_FOLLOWERS,
// VISIBILITY_FRIENDS, VISIBILITY_CLOSE_FRIENDS or VISIBILITY_PRIVATE (only
// me), with the meaning of the social domain's audiences: the public fields
// of a locked account reach only its followers and friends (and stay out of
// search and tag suggestions). Defaults: public, except zodiac (private).
message ProfileFieldVisibility {
  tokuly.common.v1.Visibility mbti = 1;
  tokuly.common.v1.Visibility blood_type = 2;
  tokuly.common.v1.Visibility pronouns = 3;
  tokuly.common.v1.Visibility zodiac = 4;
  tokuly.common.v1.Visibility oshi = 5;
  tokuly.common.v1.Visibility tags = 6;
  tokuly.common.v1.Visibility links = 7;
  tokuly.common.v1.Visibility long_bio = 8;
  tokuly.common.v1.Visibility pinned_song = 9;
}

enum BloodType {
  BLOOD_TYPE_UNSPECIFIED = 0;
  BLOOD_TYPE_A = 1;
  BLOOD_TYPE_B = 2;
  BLOOD_TYPE_O = 3;
  BLOOD_TYPE_AB = 4;
}

enum Zodiac {
  ZODIAC_UNSPECIFIED = 0;
  ZODIAC_ARIES = 1;
  ZODIAC_TAURUS = 2;
  ZODIAC_GEMINI = 3;
  ZODIAC_CANCER = 4;
  ZODIAC_LEO = 5;
  ZODIAC_VIRGO = 6;
  ZODIAC_LIBRA = 7;
  ZODIAC_SCORPIO = 8;
  ZODIAC_SAGITTARIUS = 9;
  ZODIAC_CAPRICORN = 10;
  ZODIAC_AQUARIUS = 11;
  ZODIAC_PISCES = 12;
}

// A 推し: a person, a character, a group, a team...
message Oshi {
  string id = 1;
  string name = 2;
  tokuly.common.v1.Image image = 3;
  string url = 4;
  string emoji = 5;
}

// What a favourite thing is about.
enum ProfileTagCategory {
  PROFILE_TAG_CATEGORY_UNSPECIFIED = 0;
  PROFILE_TAG_CATEGORY_MUSIC = 1;
  PROFILE_TAG_CATEGORY_GAMES = 2;
  PROFILE_TAG_CATEGORY_FOOD = 3;
  PROFILE_TAG_CATEGORY_ANIME_MANGA = 4;
  PROFILE_TAG_CATEGORY_SPORTS = 5;
  PROFILE_TAG_CATEGORY_MOVIES_TV = 6;
  PROFILE_TAG_CATEGORY_BOOKS = 7;
  PROFILE_TAG_CATEGORY_FASHION = 8;
  PROFILE_TAG_CATEGORY_OTHER = 9;
}

// A favourite thing: free text (1-24 characters) in a category.
message ProfileTag {
  ProfileTagCategory category = 1;
  string name = 2;
}

message ProfileLink {
  string id = 1;
  string title = 2;
  string url = 3;
  // The page links back to this profile with `rel="me"`.
  bool verified = 4;
  google.protobuf.Timestamp verified_at = 5;
}

// How the profile page looks.
message ProfileTheme {
  // #rrggbb; empty uses the app's accent.
  string color = 1;
  ProfileThemeStyle style = 2;
}

enum ProfileThemeStyle {
  PROFILE_THEME_STYLE_UNSPECIFIED = 0;
  PROFILE_THEME_STYLE_POP = 1;
  PROFILE_THEME_STYLE_PASTEL = 2;
  PROFILE_THEME_STYLE_NEON = 3;
  PROFILE_THEME_STYLE_MONO = 4;
  PROFILE_THEME_STYLE_NIGHT = 5;
}

// A song pinned to the profile.
message PinnedSong {
  // "spotify".
  string provider = 1;
  string track_id = 2;
  string title = 3;
  string artist = 4;
  string album = 5;
  string artwork_url = 6;
  string track_url = 7;
  google.protobuf.Timestamp pinned_at = 8;
}

// A question-and-answer card of the プロフ帳.
message ProfileQaCard {
  string id = 1;
  // The prompt it answers; empty for a free question.
  string prompt_id = 2;
  // The prompt's text, or the free question in both fields.
  tokuly.common.v1.LocalizedText question = 3;
  string answer = 4;
  reserved 5;
  reserved "visibility";
  // The owner's own view only: kept but not shown.
  bool hidden = 6;
  // The owner's own view only: who sees the card.
  tokuly.common.v1.AudienceRef audience = 7;
}

// A question from the curated bank ("好きな教科", "無人島に1つ持っていくなら").
message ProfilePrompt {
  string id = 1;
  tokuly.common.v1.LocalizedText question = 2;
  // A group for the picker: "school", "likes", "me", "if".
  string group = 3;
  // An emoji for the card.
  string emoji = 4;
}

// A piece of a profile contributed by another domain: a level badge, a
// "studying now" line, a link to the question box. Clients render the kinds
// they know richly and every other kind as a plain titled row, so a new
// feature shows up on profiles without a client release.
message ProfileCard {
  // "<domain>.<thing>", e.g. "quest.level", "school.studying", "ask.box".
  string kind = 1;
  tokuly.common.v1.LocalizedText title = 2;
  tokuly.common.v1.LocalizedText text = 3;
  // A single emoji standing in for an icon; empty when `image` is set.
  string emoji = 4;
  tokuly.common.v1.Image image = 5;
  // Where tapping the card leads inside the app (a path); empty if nowhere.
  string path = 6;
  // Kind-specific values for clients that render the kind richly.
  map<string, string> data = 7;
  // Position among the cards: lower comes first.
  int32 order = 8;
}

message ProfileStats {
  int32 friend_count = 1;
  // People who joined through this user's invite links ("intros").
  int32 intro_count = 2;
  int64 profile_view_count = 3;
  int32 note_count = 4;
  int32 bump_count = 5;
  // Percentage of the home country uncovered on the scratch map (0-100).
  double explored_percent = 6;
  int32 visited_country_count = 7;
  int32 stamp_pack_count = 8;
  int32 days_since_joined = 9;
  // Filled by the social domain for signed-in viewers, counted like its
  // follow lists (active accounts, without people in a block with the viewer).
  int32 follower_count = 10;
  int32 following_count = 11;
}

message NowPlaying {
  string provider = 1;
  string title = 2;
  string artist = 3;
  string album = 4;
  string artwork_url = 5;
  string track_url = 6;
  int32 duration_ms = 7;
  int32 progress_ms = 8;
  bool playing = 9;
  google.protobuf.Timestamp updated_at = 10;
}

message GetProfileRequest {
  oneof by {
    string user_id = 1;
    string handle = 2;
  }
  // Field 3 (as_moderator) is gone: moderators read a reported プロフ帳
  // through tokuly.admin.v1.ModerationService.GetReportedProfile.
  reserved 3;
  reserved "as_moderator";
}

message GetProfileResponse {
  Profile profile = 1;
}

message BatchGetUsersRequest {
  repeated string user_ids = 1;
}

message BatchGetUsersResponse {
  repeated tokuly.common.v1.UserSummary users = 1;
}

message SearchUsersRequest {
  string query = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message SearchUsersResponse {
  repeated UserSearchResult results = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message UserSearchResult {
  tokuly.common.v1.UserSummary user = 1;
  Relationship relationship = 2;
  int32 mutual_friend_count = 3;
  bool bot = 4;
}

message RecordProfileViewRequest {
  string user_id = 1;
}

message RecordProfileViewResponse {}

message GetProfileViewsRequest {}

message GetProfileViewsResponse {
  int64 total = 1;
  int32 last_24h = 2;
  // Recent viewers who allow their views to be shown.
  repeated ProfileViewer viewers = 3;
}

message ProfileViewer {
  tokuly.common.v1.UserSummary user = 1;
  google.protobuf.Timestamp viewed_at = 2;
}

message ListProfilePromptsRequest {}

message ListProfilePromptsResponse {
  repeated ProfilePrompt prompts = 1;
}

message SuggestProfileTagsRequest {
  ProfileTagCategory category = 1;
  // Beginning of the tag; empty lists the most used ones. At most 24 characters.
  string query = 2;
}

message SuggestProfileTagsResponse {
  repeated TagSuggestion suggestions = 1;
}

message TagSuggestion {
  string name = 1;
  // How many people show it.
  int32 count = 2;
}
