syntax = "proto3";

// Communities (コミュニティ): places for a class, a club, a game, an 推し, a
// neighbourhood, a study group or a tech topic. A community has members with
// roles, boards (channels holding threads and replies), events with RSVP and
// check-in, announcements, and its own safety tools.
//
// Conventions of this package:
// - `community_id` accepts the community's UUID or its handle everywhere.
// - `thread_id` accepts the thread's UUID or its 11-character short ID.
// - Likes, emoji reactions, bookmarks, comments and reports on communities,
//   threads, replies and events go through tokuly.engagement.v1 with the
//   subject types COMMUNITY, COMMUNITY_THREAD, COMMUNITY_REPLY and
//   COMMUNITY_EVENT. Replies to threads are part of this package.
// - Who may do what is one table (see `Permission`); every response that
//   carries a `viewer` block tells the client what the caller may do, so
//   clients never copy the table.
// - A community the caller may not know about (hidden, deleted) answers
//   COMMUNITY_NOT_FOUND. Content of a community the caller may see from the
//   outside but not read (restricted) answers NOT_A_MEMBER.
// - Accounts with the site-wide `moderator` or `admin` role may read every
//   community and reveal anonymous authors; that is how reports are handled.
// - A removed thread, reply or event keeps its content for a retention
//   period (30 days by default), counted from its removal. Members no
//   longer see it; it can still be reported, and the staff and site
//   moderation can still read it (GetContentHistory) and look up its
//   author. Deleting or editing a post does not take back what was posted.
package tokuly.community.v1;

import "google/protobuf/timestamp.proto";
import "tokuly/common/v1/common.proto";

// ───────────────────────────── Communities ─────────────────────────────

// Communities, membership, invites and roles.
//
// Reading the front page of a public or restricted community works
// anonymously; everything else needs a signed-in caller.
service CommunityService {
  // Creates a community owned by the caller, with a first channel
  // ("general"). The caller becomes its owner and first member.
  // Errors: NAME_INVALID, HANDLE_INVALID, HANDLE_RESERVED, HANDLE_TAKEN,
  // DESCRIPTION_TOO_LONG, CATEGORY_INVALID, VISIBILITY_INVALID,
  // LANGUAGE_INVALID, TOO_MANY_TAGS, TAG_INVALID, TOO_MANY_RULES,
  // RULE_INVALID, TOO_MANY_QUESTIONS, QUESTION_INVALID, SCHOOL_NAME_INVALID,
  // ASSET_NOT_FOUND, ASSET_NOT_READY, ASSET_NOT_IMAGE, ASSET_WRONG_PURPOSE,
  // COMMUNITY_LIMIT_REACHED (the caller owns as many as one account may),
  // RATE_LIMITED.
  rpc CreateCommunity(CreateCommunityRequest) returns (CreateCommunityResponse);
  // One community as the caller sees it. A hidden community exists only for
  // its members. Works anonymously. Errors: COMMUNITY_NOT_FOUND.
  rpc GetCommunity(GetCommunityRequest) returns (GetCommunityResponse);
  // Changes the community's profile and settings. Needs MANAGE_COMMUNITY.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, plus the validation
  // errors of CreateCommunity.
  rpc UpdateCommunity(UpdateCommunityRequest) returns (UpdateCommunityResponse);
  // Closes the community for good: it disappears for everyone, its handle
  // becomes free again. Owner only.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED.
  rpc DeleteCommunity(DeleteCommunityRequest) returns (DeleteCommunityResponse);
  // Whether a handle is well-formed and free, for the creation form.
  rpc CheckHandle(CheckHandleRequest) returns (CheckHandleResponse);
  // Hands the community to another member, who becomes owner; the caller
  // stays as an admin. Owner only.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, MEMBER_NOT_FOUND,
  // CANNOT_TARGET_SELF, COMMUNITY_LIMIT_REACHED (the new owner owns as many
  // as one account may).
  rpc TransferOwnership(TransferOwnershipRequest) returns (TransferOwnershipResponse);
  // The communities the caller is a member of, most recently active first,
  // followed on the first page by the caller's pending join requests.
  rpc ListMyCommunities(ListMyCommunitiesRequest) returns (ListMyCommunitiesResponse);
  // The public communities another user chose to show on their profile.
  // Errors: USER_NOT_FOUND (also when either side blocked the other).
  rpc ListUserCommunities(ListUserCommunitiesRequest) returns (ListUserCommunitiesResponse);

  // Joins a community. A public community is joined at once. A restricted
  // one is joined at once with a valid invite code; without one the caller
  // files a request (answering the join questions) that the staff approves
  // or declines. A hidden community is joined by invite code only.
  // Joining again while a member returns the membership.
  // Errors: COMMUNITY_NOT_FOUND, INVITE_INVALID (unknown, expired, revoked,
  // used up, or its creator left, was removed or may no longer invite), BANNED, COMMUNITY_FULL, JOIN_LIMIT_REACHED (the caller is in
  // as many communities as one account may), ANSWERS_REQUIRED,
  // ANSWER_TOO_LONG, RATE_LIMITED.
  rpc JoinCommunity(JoinCommunityRequest) returns (JoinCommunityResponse);
  // What an invite leads to: the community's front page, even when it is
  // hidden. Errors: INVITE_INVALID, RATE_LIMITED.
  rpc PreviewInvite(PreviewInviteRequest) returns (PreviewInviteResponse);
  // Leaves a community. The owner must transfer ownership (or delete the
  // community) first. Errors: COMMUNITY_NOT_FOUND, NOT_A_MEMBER,
  // OWNER_CANNOT_LEAVE.
  rpc LeaveCommunity(LeaveCommunityRequest) returns (LeaveCommunityResponse);
  // Withdraws the caller's pending join request.
  // Errors: COMMUNITY_NOT_FOUND, REQUEST_NOT_FOUND.
  rpc CancelJoinRequest(CancelJoinRequestRequest) returns (CancelJoinRequestResponse);
  // Pending join requests, oldest first. Needs MANAGE_MEMBERS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED.
  rpc ListJoinRequests(ListJoinRequestsRequest) returns (ListJoinRequestsResponse);
  // Approves or declines a join request. Approval makes the requester a
  // member and tells them; declining is silent (the requester keeps seeing
  // the request as pending and may ask again a week later).
  // Needs MANAGE_MEMBERS. Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED,
  // REQUEST_NOT_FOUND, COMMUNITY_FULL, JOIN_LIMIT_REACHED, BANNED.
  rpc RespondJoinRequest(RespondJoinRequestRequest) returns (RespondJoinRequestResponse);

  // The member directory: staff first, then by join date; `query` searches
  // names and handles. Members only (the member count is public).
  // Errors: COMMUNITY_NOT_FOUND, NOT_A_MEMBER, QUERY_TOO_LONG.
  rpc ListMembers(ListMembersRequest) returns (ListMembersResponse);
  // One member. Members only.
  // Errors: COMMUNITY_NOT_FOUND, NOT_A_MEMBER, MEMBER_NOT_FOUND.
  rpc GetMember(GetMemberRequest) returns (GetMemberResponse);
  // Makes a member a moderator, an admin, or a plain member again. Admins
  // appoint and dismiss moderators; only the owner appoints and dismisses
  // admins. Ownership moves with TransferOwnership.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, MEMBER_NOT_FOUND,
  // ROLE_INVALID, CANNOT_TARGET_SELF.
  rpc SetMemberRole(SetMemberRoleRequest) returns (SetMemberRoleResponse);
  // The caller's own settings in a community: notification level and
  // whether the membership shows on their profile.
  // Errors: COMMUNITY_NOT_FOUND, NOT_A_MEMBER, LEVEL_INVALID.
  rpc UpdateMembership(UpdateMembershipRequest) returns (UpdateMembershipResponse);

  // Creates an invite: one token usable as a code, a link and a QR code,
  // with an optional expiry and use limit. Needs CREATE_INVITE.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, EXPIRY_INVALID,
  // MAX_USES_INVALID, NOTE_TOO_LONG, TOO_MANY_INVITES, RATE_LIMITED.
  rpc CreateInvite(CreateInviteRequest) returns (CreateInviteResponse);
  // The community's invites that can still be used, newest first. Staff see
  // all of them, other members their own. Needs CREATE_INVITE.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED.
  rpc ListInvites(ListInvitesRequest) returns (ListInvitesResponse);
  // Makes an invite unusable. Its creator, or anyone with MANAGE_MEMBERS.
  // Errors: INVITE_NOT_FOUND, PERMISSION_DENIED.
  rpc RevokeInvite(RevokeInviteRequest) returns (RevokeInviteResponse);
}

// What a community is about.
enum CommunityCategory {
  COMMUNITY_CATEGORY_UNSPECIFIED = 0;
  // A class, a grade, a whole school.
  COMMUNITY_CATEGORY_SCHOOL = 1;
  // A club or circle (部活・サークル).
  COMMUNITY_CATEGORY_CLUB = 2;
  COMMUNITY_CATEGORY_GAME = 3;
  // A fandom (推し活).
  COMMUNITY_CATEGORY_OSHI = 4;
  // A neighbourhood, a town.
  COMMUNITY_CATEGORY_LOCAL = 5;
  COMMUNITY_CATEGORY_STUDY = 6;
  COMMUNITY_CATEGORY_TECH = 7;
  COMMUNITY_CATEGORY_OTHER = 8;
}

// Who finds, reads and joins a community.
enum CommunityVisibility {
  COMMUNITY_VISIBILITY_UNSPECIFIED = 0;
  // Listed; anyone reads and joins.
  COMMUNITY_VISIBILITY_PUBLIC = 1;
  // Listed; anyone sees the front page, only members read. Joining needs
  // approval or an invite.
  COMMUNITY_VISIBILITY_RESTRICTED = 2;
  // Not listed anywhere; exists only for its members. Invite only.
  COMMUNITY_VISIBILITY_HIDDEN = 3;
}

// Roles, lowest to highest. A member acts only on members of a lower role.
enum MemberRole {
  MEMBER_ROLE_UNSPECIFIED = 0;
  MEMBER_ROLE_MEMBER = 1;
  MEMBER_ROLE_MODERATOR = 2;
  MEMBER_ROLE_ADMIN = 3;
  MEMBER_ROLE_OWNER = 4;
}

// What the caller is to a community.
enum MembershipStatus {
  MEMBERSHIP_STATUS_UNSPECIFIED = 0;
  MEMBERSHIP_STATUS_NONE = 1;
  MEMBERSHIP_STATUS_MEMBER = 2;
  // A join request is waiting (or was declined: declining is silent).
  MEMBERSHIP_STATUS_REQUESTED = 3;
  MEMBERSHIP_STATUS_BANNED = 4;
}

// What a member is notified about.
enum NotificationLevel {
  NOTIFICATION_LEVEL_UNSPECIFIED = 0;
  // Announcements, mentions, replies to the member's threads and to threads
  // they follow, and event notices.
  NOTIFICATION_LEVEL_ALL = 1;
  // Mentions and announcements only.
  NOTIFICATION_LEVEL_MENTIONS = 2;
  // Nothing (moderation notices about the member's own posts still arrive).
  NOTIFICATION_LEVEL_NONE = 3;
}

// The permission table. Member: POST, plus CREATE_INVITE / CREATE_EVENT when
// the community's settings open them to members. Moderator: everything a
// member may, plus CREATE_INVITE, CREATE_EVENT, MODERATE_CONTENT,
// MANAGE_MEMBERS, ANNOUNCE, REVEAL_AUTHOR, VIEW_MODERATION_LOG and
// MANAGE_SAFETY. Admin: everything a moderator may, plus MANAGE_CHANNELS,
// MANAGE_COMMUNITY and MANAGE_ROLES. Owner: everything, plus
// TRANSFER_OWNERSHIP and DELETE_COMMUNITY.
enum Permission {
  PERMISSION_UNSPECIFIED = 0;
  // Start threads, reply, vote in polls, RSVP (where the channel allows it).
  PERMISSION_POST = 1;
  PERMISSION_CREATE_INVITE = 2;
  PERMISSION_CREATE_EVENT = 3;
  // Delete other members' posts, pin and lock threads, work the review
  // queue, edit and cancel other members' events.
  PERMISSION_MODERATE_CONTENT = 4;
  // Approve and decline join requests; remove, time out and ban members of
  // a lower role; revoke invites.
  PERMISSION_MANAGE_MEMBERS = 5;
  // Mark a thread as an announcement.
  PERMISSION_ANNOUNCE = 6;
  // Reveal who wrote an anonymous post (logged and announced to the staff).
  PERMISSION_REVEAL_AUTHOR = 7;
  PERMISSION_VIEW_MODERATION_LOG = 8;
  // Muted words, the auto-hide threshold, slow mode.
  PERMISSION_MANAGE_SAFETY = 9;
  // Create, edit, order and delete channels.
  PERMISSION_MANAGE_CHANNELS = 10;
  // Edit the community's profile, rules, join questions, visibility and settings.
  PERMISSION_MANAGE_COMMUNITY = 11;
  // Appoint and dismiss moderators (admins) and admins (owner).
  PERMISSION_MANAGE_ROLES = 12;
  PERMISSION_TRANSFER_OWNERSHIP = 13;
  PERMISSION_DELETE_COMMUNITY = 14;
}

// One rule of a community.
message Rule {
  // 1-80 characters.
  string title = 1;
  // At most 500 characters.
  string body = 2;
}

// Wrapper so an update can tell "leave the rules alone" from "no rules".
message RuleList {
  repeated Rule rules = 1;
}

// Wrapper so an update can tell "leave the list alone" from "empty list".
message StringList {
  repeated string values = 1;
}

// Switches the staff can flip.
message CommunitySettings {
  // Plain members may create invites (otherwise moderators and up).
  bool members_can_invite = 1;
  // Plain members may create events (otherwise moderators and up).
  bool members_can_create_events = 2;
}

message Community {
  string id = 1;
  // Unique among communities (a namespace of its own, same format as user
  // handles), without a leading '+'.
  string handle = 2;
  string name = 3;
  string description = 4;
  tokuly.common.v1.Image icon = 5;
  tokuly.common.v1.Image banner = 6;
  // In display order.
  repeated Rule rules = 7;
  // Normalized (lowercase, no '#'), at most 10.
  repeated string tags = 8;
  CommunityCategory category = 9;
  // Main language as a locale tag, e.g. "ja".
  string language = 10;
  CommunityVisibility visibility = 11;
  // The school a SCHOOL or CLUB community belongs to; empty otherwise.
  string school_name = 12;
  int32 member_count = 13;
  // Threads that are visible to members.
  int32 thread_count = 14;
  tokuly.common.v1.UserSummary owner = 15;
  // Asked of people who request to join a restricted community.
  repeated string join_questions = 16;
  CommunitySettings settings = 17;
  google.protobuf.Timestamp created_at = 18;
  // When something was last posted.
  google.protobuf.Timestamp last_activity_at = 19;
  // How many members the community may have.
  int32 max_members = 20;
  // The caller's relation to the community. Unset for anonymous callers.
  CommunityViewer viewer = 21;
}

// The caller's relation to a community.
message CommunityViewer {
  MembershipStatus status = 1;
  // Set for members.
  MemberRole role = 2;
  // What the caller may do here, per the permission table. Empty for non-members.
  repeated Permission permissions = 3;
  NotificationLevel notification_level = 4;
  // The membership shows on the caller's profile (public communities only).
  bool show_on_profile = 5;
  google.protobuf.Timestamp joined_at = 6;
  // Set while the caller is timed out: no posting, voting or RSVP until then.
  google.protobuf.Timestamp timeout_until = 7;
  // Something was posted that the caller has not read.
  bool has_unread = 8;
  // Join requests waiting for a decision. Only for callers with MANAGE_MEMBERS.
  int32 pending_request_count = 9;
  // Hidden posts waiting for review. Only for callers with MODERATE_CONTENT.
  int32 review_queue_count = 10;
  // Set when the caller is banned.
  string ban_reason = 11;
  // When the ban ends; unset for a permanent ban.
  google.protobuf.Timestamp ban_expires_at = 12;
}

message Member {
  tokuly.common.v1.UserSummary user = 1;
  MemberRole role = 2;
  google.protobuf.Timestamp joined_at = 3;
  // Set while the member is timed out. Shown to the staff and to the member.
  google.protobuf.Timestamp timeout_until = 4;
  // Shown to the staff and to the member.
  string timeout_reason = 5;
}

// An answer to one of the community's join questions.
message JoinAnswer {
  string question = 1;
  // At most 500 characters.
  string answer = 2;
}

message JoinRequest {
  string id = 1;
  string community_id = 2;
  tokuly.common.v1.UserSummary user = 3;
  repeated JoinAnswer answers = 4;
  google.protobuf.Timestamp created_at = 5;
}

// An invite: a code, the link that carries it, and the QR code clients draw
// from the link.
message Invite {
  string id = 1;
  string community_id = 2;
  // 10 characters, case-sensitive.
  string code = 3;
  // Link into the web app that opens the invite; also the QR payload.
  string url = 4;
  tokuly.common.v1.UserSummary creator = 5;
  // Unset = never expires.
  google.protobuf.Timestamp expires_at = 6;
  // 0 = unlimited.
  int32 max_uses = 7;
  int32 use_count = 8;
  // A label for the staff ("文化祭のポスター用"), at most 100 characters.
  string note = 9;
  google.protobuf.Timestamp created_at = 10;
}

message CreateCommunityRequest {
  // 1-50 characters.
  string name = 1;
  // 3-24 characters: a-z, 0-9, _ and -.
  string handle = 2;
  // At most 1000 characters.
  string description = 3;
  CommunityCategory category = 4;
  CommunityVisibility visibility = 5;
  // Locale tag; empty = the creator's language.
  string language = 6;
  // At most 10, each at most 30 characters.
  repeated string tags = 7;
  // At most 20.
  repeated Rule rules = 8;
  // At most 5, each at most 200 characters.
  repeated string join_questions = 9;
  // Image upload, purpose COMMUNITY_ICON (AVATAR and CHANNEL_ICON, used
  // before, are still taken); empty = no icon.
  string icon_asset_id = 10;
  // Image upload, purpose COMMUNITY_BANNER (BANNER and CHANNEL_BANNER, used
  // before, are still taken); empty = no banner.
  string banner_asset_id = 11;
  // For SCHOOL and CLUB communities; empty = the creator's school.
  string school_name = 12;
  CommunitySettings settings = 13;
}

message CreateCommunityResponse {
  Community community = 1;
}

message GetCommunityRequest {
  string community_id = 1;
}

message GetCommunityResponse {
  Community community = 1;
}

message UpdateCommunityRequest {
  string community_id = 1;
  optional string name = 2;
  optional string handle = 3;
  optional string description = 4;
  optional CommunityCategory category = 5;
  optional CommunityVisibility visibility = 6;
  optional string language = 7;
  StringList tags = 8;
  RuleList rules = 9;
  StringList join_questions = 10;
  // Empty string removes the icon.
  optional string icon_asset_id = 11;
  // Empty string removes the banner.
  optional string banner_asset_id = 12;
  optional string school_name = 13;
  CommunitySettings settings = 14;
}

message UpdateCommunityResponse {
  Community community = 1;
}

message DeleteCommunityRequest {
  string community_id = 1;
}

message DeleteCommunityResponse {}

message CheckHandleRequest {
  string handle = 1;
}

message CheckHandleResponse {
  bool available = 1;
  // Why not, when not: HANDLE_INVALID, HANDLE_RESERVED or HANDLE_TAKEN.
  string reason = 2;
  // The handle as it would be stored (lowercased).
  string normalized = 3;
}

message TransferOwnershipRequest {
  string community_id = 1;
  // The member who becomes owner.
  string user_id = 2;
}

message TransferOwnershipResponse {
  Community community = 1;
}

message ListMyCommunitiesRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message ListMyCommunitiesResponse {
  repeated Community communities = 1;
  // Communities the caller asked to join and waits for (first page only).
  repeated Community requested = 2;
  tokuly.common.v1.PageInfo page = 3;
  // How many communities one account may own.
  int32 max_owned = 4;
  // How many of them the caller owns.
  int32 owned_count = 5;
}

message ListUserCommunitiesRequest {
  string user_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListUserCommunitiesResponse {
  repeated Community communities = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message JoinCommunityRequest {
  // The community to join; may be empty when `invite_code` is given.
  string community_id = 1;
  string invite_code = 2;
  // Answers to the community's join questions, in their order. Needed when
  // the join becomes a request.
  repeated string answers = 3;
}

message JoinCommunityResponse {
  // MEMBER when the caller is in, REQUESTED when a request was filed.
  MembershipStatus status = 1;
  Community community = 2;
}

message PreviewInviteRequest {
  string invite_code = 1;
}

message PreviewInviteResponse {
  Community community = 1;
  // Who created the invite.
  tokuly.common.v1.UserSummary inviter = 2;
}

message LeaveCommunityRequest {
  string community_id = 1;
}

message LeaveCommunityResponse {}

message CancelJoinRequestRequest {
  string community_id = 1;
}

message CancelJoinRequestResponse {}

message ListJoinRequestsRequest {
  string community_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListJoinRequestsResponse {
  repeated JoinRequest requests = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message RespondJoinRequestRequest {
  string request_id = 1;
  bool approve = 2;
}

message RespondJoinRequestResponse {
  // The new member, when approved.
  Member member = 1;
}

message ListMembersRequest {
  string community_id = 1;
  // Matches display names and handles; at most 64 characters.
  string query = 2;
  // Only members of this role; unspecified = everyone.
  MemberRole role = 3;
  tokuly.common.v1.PageRequest page = 4;
}

message ListMembersResponse {
  repeated Member members = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message GetMemberRequest {
  string community_id = 1;
  string user_id = 2;
}

message GetMemberResponse {
  Member member = 1;
}

message SetMemberRoleRequest {
  string community_id = 1;
  string user_id = 2;
  // MEMBER, MODERATOR or ADMIN.
  MemberRole role = 3;
}

message SetMemberRoleResponse {
  Member member = 1;
}

message UpdateMembershipRequest {
  string community_id = 1;
  optional NotificationLevel notification_level = 2;
  // Only has an effect in public communities.
  optional bool show_on_profile = 3;
}

message UpdateMembershipResponse {
  CommunityViewer viewer = 1;
}

message CreateInviteRequest {
  string community_id = 1;
  // Seconds until the invite expires: 0 = never, at most 30 days.
  int32 expires_in_seconds = 2;
  // 0 = unlimited, at most 10000.
  int32 max_uses = 3;
  string note = 4;
}

message CreateInviteResponse {
  Invite invite = 1;
}

message ListInvitesRequest {
  string community_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListInvitesResponse {
  repeated Invite invites = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message RevokeInviteRequest {
  string invite_id = 1;
}

message RevokeInviteResponse {}

// ───────────────────────────── Boards ─────────────────────────────

// Channels, threads, replies and polls.
//
// Reading follows the community: a public community's boards are open to
// everyone (anonymous callers included), any other community's to members
// only. Posts by users in a block with the caller are left out of lists —
// except in anonymous channels, where hiding them would tell who wrote what.
//
// Anonymous channels: posts carry a `Pseudonym` instead of an author. The
// pseudonym is stable for one author within one thread and unrelated across
// threads. No response of this service names the author of an anonymous
// post to anyone but the author (`viewer.mine`); the staff unmasks through
// CommunityModerationService.RevealAuthor, which is logged.
// So that nothing else gives an author away, an anonymous channel
// - takes posts only while enough members could have written them
//   (TOO_FEW_MEMBERS below that);
// - treats the staff like everyone else: slow mode, the word filter and
//   auto-hide on reports apply to them too;
// - takes only stamps anyone could send (from published packs:
//   STAMP_NOT_ALLOWED otherwise) and only uploads that are used nowhere
//   else (ASSET_ALREADY_USED otherwise).
service CommunityBoardService {
  // Adds a channel at the end of the list. Needs MANAGE_CHANNELS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, CHANNEL_NAME_INVALID,
  // DESCRIPTION_TOO_LONG, EMOJI_INVALID, POSTING_INVALID, TOO_MANY_CHANNELS.
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  // Edits a channel. Anonymous mode cannot be changed once the channel has
  // threads. Needs MANAGE_CHANNELS.
  // Errors: CHANNEL_NOT_FOUND, PERMISSION_DENIED, CHANNEL_NOT_EMPTY, plus
  // the validation errors of CreateChannel.
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  // Deletes a channel with everything in it. A community keeps at least one
  // channel. Needs MANAGE_CHANNELS.
  // Errors: CHANNEL_NOT_FOUND, PERMISSION_DENIED, LAST_CHANNEL.
  rpc DeleteChannel(DeleteChannelRequest) returns (DeleteChannelResponse);
  // Sets the order of the channels; every channel must be named once.
  // Needs MANAGE_CHANNELS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, CHANNEL_ORDER_MISMATCH.
  rpc ReorderChannels(ReorderChannelsRequest) returns (ReorderChannelsResponse);
  // The channels of a community in display order.
  // Errors: COMMUNITY_NOT_FOUND, NOT_A_MEMBER.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);

  // Starts a thread. A thread needs a title and at least one of body,
  // images, stamp or poll. `@handle` mentions notify members. The author
  // follows the thread. A post containing one of the community's muted words
  // is stored hidden and waits for the staff's review.
  // Errors: CHANNEL_NOT_FOUND, NOT_A_MEMBER, POSTING_RESTRICTED (the channel
  // is for moderators), TIMED_OUT, SLOW_MODE, TITLE_INVALID, BODY_TOO_LONG,
  // THREAD_EMPTY, TOO_MANY_IMAGES, ASSET_NOT_FOUND, ASSET_NOT_READY,
  // ASSET_NOT_IMAGE, ASSET_WRONG_PURPOSE, STAMP_NOT_USABLE, POLL_INVALID,
  // TOO_MANY_TAGS, TAG_INVALID, RATE_LIMITED; in anonymous channels also
  // TOO_FEW_MEMBERS, STAMP_NOT_ALLOWED, ASSET_ALREADY_USED.
  rpc CreateThread(CreateThreadRequest) returns (CreateThreadResponse);
  // One thread. Errors: THREAD_NOT_FOUND, NOT_A_MEMBER.
  rpc GetThread(GetThreadRequest) returns (GetThreadResponse);
  // Edits title, body and tags; the thread shows as edited. Author only.
  // What the thread said before stays on file for the staff, and a thread
  // can be edited 30 times.
  // Errors: THREAD_NOT_FOUND, PERMISSION_DENIED, TIMED_OUT, THREAD_LOCKED,
  // TITLE_INVALID, BODY_TOO_LONG, THREAD_EMPTY, TOO_MANY_TAGS, TAG_INVALID,
  // TOO_MANY_EDITS, RATE_LIMITED.
  rpc UpdateThread(UpdateThreadRequest) returns (UpdateThreadResponse);
  // Deletes a thread with its replies. The author, or a member with
  // MODERATE_CONTENT, who must give a reason that lands in the moderation
  // log and is told to the author.
  // Errors: THREAD_NOT_FOUND, PERMISSION_DENIED, REASON_REQUIRED,
  // REASON_TOO_LONG.
  rpc DeleteThread(DeleteThreadRequest) returns (DeleteThreadResponse);
  // Threads of a community or of one channel. Pinned threads come
  // separately, on the first page; `threads` holds the rest in the chosen
  // order. The hot order moves while it is read (scores are recomputed
  // every few minutes): a later page may repeat a thread, which clients
  // drop. Errors: COMMUNITY_NOT_FOUND, CHANNEL_NOT_FOUND, NOT_A_MEMBER,
  // SORT_INVALID, TAG_INVALID.
  rpc ListThreads(ListThreadsRequest) returns (ListThreadsResponse);
  // The community's announcements, newest first.
  // Errors: COMMUNITY_NOT_FOUND, NOT_A_MEMBER.
  rpc ListAnnouncements(ListAnnouncementsRequest) returns (ListAnnouncementsResponse);
  // Threads the caller follows, most recently active first, optionally
  // within one community.
  rpc ListFollowedThreads(ListFollowedThreadsRequest) returns (ListFollowedThreadsResponse);
  // Pins a thread to the top of its channel, or unpins it. At most 5 pinned
  // threads per channel. Needs MODERATE_CONTENT.
  // Errors: THREAD_NOT_FOUND, PERMISSION_DENIED, TOO_MANY_PINNED.
  rpc PinThread(PinThreadRequest) returns (PinThreadResponse);
  // Locks a thread (no new replies, no edits), or unlocks it.
  // Needs MODERATE_CONTENT. Errors: THREAD_NOT_FOUND, PERMISSION_DENIED.
  rpc LockThread(LockThreadRequest) returns (LockThreadResponse);
  // Marks a thread as an announcement, or takes the mark back. The first
  // time a thread becomes an announcement the members are notified, each
  // according to their notification level. Needs ANNOUNCE.
  // Errors: THREAD_NOT_FOUND, PERMISSION_DENIED, THREAD_HIDDEN, RATE_LIMITED.
  rpc SetAnnouncement(SetAnnouncementRequest) returns (SetAnnouncementResponse);
  // Follows a thread (notifications about new replies) or stops following.
  // Members only. Errors: THREAD_NOT_FOUND, NOT_A_MEMBER.
  rpc SetThreadFollow(SetThreadFollowRequest) returns (SetThreadFollowResponse);
  // Marks a thread, a whole channel or a whole community as read.
  // Errors: THREAD_NOT_FOUND, CHANNEL_NOT_FOUND, COMMUNITY_NOT_FOUND,
  // NOT_A_MEMBER, TARGET_REQUIRED.
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);

  // Votes in a thread's poll, replacing the caller's earlier vote; no
  // options takes the vote back. Results show once the caller has voted.
  // Errors: THREAD_NOT_FOUND, NOT_A_MEMBER, TIMED_OUT, POLL_NOT_FOUND,
  // POLL_CLOSED, OPTION_NOT_FOUND, SINGLE_CHOICE (several options chosen in
  // a single-choice poll).
  rpc VotePoll(VotePollRequest) returns (VotePollResponse);
  // Ends a poll before its deadline. The thread's author or a member with
  // MODERATE_CONTENT. Errors: THREAD_NOT_FOUND, PERMISSION_DENIED,
  // POLL_NOT_FOUND.
  rpc ClosePoll(ClosePollRequest) returns (ClosePollResponse);

  // Replies to a thread, optionally to another reply of it (shown with a
  // quoted excerpt). Needs body, images or a stamp. The author starts
  // following the thread. Notifies the thread's author and followers
  // (once per thread until they read it) and mentioned members.
  // Errors: THREAD_NOT_FOUND, NOT_A_MEMBER, POSTING_RESTRICTED, TIMED_OUT,
  // THREAD_LOCKED, THREAD_HIDDEN (the thread waits for review), SLOW_MODE,
  // BODY_TOO_LONG, REPLY_EMPTY, TOO_MANY_IMAGES, ASSET_NOT_FOUND,
  // ASSET_NOT_READY, ASSET_NOT_IMAGE, ASSET_WRONG_PURPOSE, STAMP_NOT_USABLE,
  // REPLY_NOT_FOUND (`reply_to_id` is not a reply of this thread),
  // RATE_LIMITED; in anonymous channels also TOO_FEW_MEMBERS,
  // STAMP_NOT_ALLOWED, ASSET_ALREADY_USED.
  rpc CreateReply(CreateReplyRequest) returns (CreateReplyResponse);
  // One reply. Errors: REPLY_NOT_FOUND, NOT_A_MEMBER.
  rpc GetReply(GetReplyRequest) returns (GetReplyResponse);
  // Edits a reply's body; it shows as edited. Author only. What the reply
  // said before stays on file for the staff, and a reply can be edited 30
  // times. Errors: REPLY_NOT_FOUND, PERMISSION_DENIED, TIMED_OUT,
  // THREAD_LOCKED, BODY_TOO_LONG, REPLY_EMPTY, TOO_MANY_EDITS, RATE_LIMITED.
  rpc UpdateReply(UpdateReplyRequest) returns (UpdateReplyResponse);
  // Deletes a reply. The author, or a member with MODERATE_CONTENT, who
  // must give a reason that lands in the moderation log.
  // Errors: REPLY_NOT_FOUND, PERMISSION_DENIED, REASON_REQUIRED,
  // REASON_TOO_LONG.
  rpc DeleteReply(DeleteReplyRequest) returns (DeleteReplyResponse);
  // The replies of a thread, oldest first (or newest first).
  // Errors: THREAD_NOT_FOUND, NOT_A_MEMBER.
  rpc ListReplies(ListRepliesRequest) returns (ListRepliesResponse);
}

// Who may start threads and reply in a channel.
enum PostingPolicy {
  POSTING_POLICY_UNSPECIFIED = 0;
  POSTING_POLICY_EVERYONE = 1;
  // Moderators and up; everyone else reads.
  POSTING_POLICY_MODERATORS = 2;
}

// Order of a thread list.
enum ThreadSort {
  THREAD_SORT_UNSPECIFIED = 0;
  // Activity (replies, likes, comments) decayed by age; recomputed by a
  // worker every few minutes. The default.
  THREAD_SORT_HOT = 1;
  // Newest first.
  THREAD_SORT_NEW = 2;
  // Most liked within `window`.
  THREAD_SORT_TOP = 3;
}

// How far back THREAD_SORT_TOP looks.
enum TopWindow {
  TOP_WINDOW_UNSPECIFIED = 0;
  TOP_WINDOW_DAY = 1;
  TOP_WINDOW_WEEK = 2;
  TOP_WINDOW_MONTH = 3;
  TOP_WINDOW_YEAR = 4;
  // The default.
  TOP_WINDOW_ALL = 5;
}

// Whether a post is in public view.
enum PostState {
  POST_STATE_UNSPECIFIED = 0;
  POST_STATE_VISIBLE = 1;
  // Hidden pending the staff's review: only its author and members with
  // MODERATE_CONTENT see it.
  POST_STATE_HIDDEN = 2;
}

// Why a post is hidden.
enum HiddenReason {
  HIDDEN_REASON_UNSPECIFIED = 0;
  // Enough different members reported it.
  HIDDEN_REASON_REPORTS = 1;
  // It contains one of the community's muted words.
  HIDDEN_REASON_MUTED_WORD = 2;
}

message Channel {
  string id = 1;
  string community_id = 2;
  // 1-30 characters.
  string name = 3;
  // At most 200 characters.
  string description = 4;
  // One emoji shown next to the name; may be empty.
  string emoji = 5;
  // Position in the list, from 0.
  int32 position = 6;
  PostingPolicy posting = 7;
  // Posts in this channel show a pseudonym instead of the author.
  bool anonymous = 8;
  // Seconds a member waits between two posts here; 0 = off. Staff are
  // exempt, except in anonymous channels (two quick posts under one
  // pseudonym would say "staff").
  int32 slow_mode_seconds = 9;
  int32 thread_count = 10;
  google.protobuf.Timestamp last_activity_at = 11;
  // The caller has unread threads here. Members only.
  bool has_unread = 12;
  // The caller may post here right now.
  bool can_post = 13;
}

// The name an author goes by in one thread of an anonymous channel: an
// animal in a colour plus a short tag, e.g. "あおいペンギン #k3f9". Derived
// with a server-side key from the thread and the author, so it cannot be
// turned back into an account and tells nothing about other threads.
message Pseudonym {
  tokuly.common.v1.LocalizedText name = 1;
  string emoji = 2;
  // Avatar colour as #rrggbb.
  string color = 3;
  // 4 characters telling apart two authors who drew the same animal.
  string tag = 4;
}

// A member mentioned in a post.
message Mention {
  string handle = 1;
  string user_id = 2;
}

message PollOption {
  string id = 1;
  string text = 2;
  // Filled in only when the poll's results are visible to the caller.
  int32 vote_count = 3;
}

message Poll {
  repeated PollOption options = 1;
  // Voters may choose several options.
  bool multiple_choice = 2;
  // Deadline; unset = open until closed by hand.
  google.protobuf.Timestamp closes_at = 3;
  bool closed = 4;
  // How many members voted. Always shown.
  int32 voter_count = 5;
  // Whether `vote_count` is filled in: after the caller voted, once the poll
  // is closed, and for the thread's author.
  bool results_visible = 6;
  // What the caller chose.
  repeated string my_option_ids = 7;
}

// A poll as written with a new thread.
message PollInput {
  // 2-6 options, each 1-80 characters, all different.
  repeated string options = 1;
  bool multiple_choice = 2;
  // Optional deadline, between 5 minutes and 30 days from now.
  google.protobuf.Timestamp closes_at = 3;
}

message Thread {
  string id = 1;
  // 11 characters, for links.
  string short_id = 2;
  string community_id = 3;
  string channel_id = 4;
  // Unset in anonymous channels.
  tokuly.common.v1.UserSummary author = 5;
  // Set in anonymous channels.
  Pseudonym pseudonym = 6;
  // 1-100 characters.
  string title = 7;
  // At most 5000 characters.
  string body = 8;
  repeated Mention mentions = 9;
  // Up to 4.
  repeated tokuly.common.v1.Image images = 10;
  // Unset when the thread has no stamp or the stamp is no longer available.
  tokuly.common.v1.StampRef stamp = 11;
  Poll poll = 12;
  // Normalized (lowercase, no '#'), at most 5.
  repeated string tags = 13;
  bool pinned = 14;
  bool locked = 15;
  bool announcement = 16;
  PostState state = 17;
  // Set while the thread is hidden.
  HiddenReason hidden_reason = 18;
  // Visible replies.
  int32 reply_count = 19;
  int64 like_count = 20;
  // Comments written through the engagement API.
  int32 comment_count = 21;
  google.protobuf.Timestamp created_at = 22;
  // Set once the thread was edited.
  google.protobuf.Timestamp edited_at = 23;
  // Creation or the latest reply.
  google.protobuf.Timestamp last_activity_at = 24;
  // Path of the thread in the web app.
  string path = 25;
  // The caller's state. Unset for anonymous callers and in realtime pushes.
  ThreadViewer viewer = 26;
}

// What the caller is to a thread and may do with it.
message ThreadViewer {
  // The caller wrote it (the only way an anonymous post names its author:
  // to the author).
  bool mine = 1;
  bool following = 2;
  // Something happened in the thread since the caller last read it.
  bool unread = 3;
  // Replies written since the caller last read it.
  int32 unread_reply_count = 4;
  bool can_edit = 5;
  bool can_delete = 6;
  // The caller may pin, lock and review it.
  bool can_moderate = 7;
  bool can_reply = 8;
}

// The reply another reply answers, as shown above it.
message QuotedReply {
  string reply_id = 1;
  // Unset in anonymous channels and when the reply is gone.
  tokuly.common.v1.UserSummary author = 2;
  Pseudonym pseudonym = 3;
  // The first 120 characters of its body. Empty when the reply is gone.
  string excerpt = 4;
  // The quoted reply was deleted, is hidden, or was written by someone in a
  // block with the caller.
  bool unavailable = 5;
}

message Reply {
  string id = 1;
  string thread_id = 2;
  string community_id = 3;
  // Unset in anonymous channels.
  tokuly.common.v1.UserSummary author = 4;
  // Set in anonymous channels. Equal to the thread's pseudonym when the
  // thread's author replies.
  Pseudonym pseudonym = 5;
  // At most 2000 characters.
  string body = 6;
  repeated Mention mentions = 7;
  // Up to 4.
  repeated tokuly.common.v1.Image images = 8;
  tokuly.common.v1.StampRef stamp = 9;
  // Set when the reply answers another reply.
  QuotedReply reply_to = 10;
  PostState state = 11;
  HiddenReason hidden_reason = 12;
  int64 like_count = 13;
  int32 comment_count = 14;
  // Position in the thread, counting from 1 (gaps where replies were deleted).
  int32 number = 15;
  // Written by the thread's author.
  bool by_thread_author = 16;
  google.protobuf.Timestamp created_at = 17;
  google.protobuf.Timestamp edited_at = 18;
  // Unset for anonymous callers and in realtime pushes.
  ReplyViewer viewer = 19;
}

message ReplyViewer {
  bool mine = 1;
  bool can_edit = 2;
  bool can_delete = 3;
}

