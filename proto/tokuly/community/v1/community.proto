// ───────────────────────────── Safety tools ─────────────────────────────

// The staff's tools: sanctions, the review queue, word filters, slow mode,
// the moderation log and unmasking anonymous authors.
//
// Every RPC needs a signed-in member holding the permission it names; a
// member only ever acts on members of a lower role. Everything done here
// is written to the community's moderation log.
//
// Nobody judges their own case: reviewing one's own hidden post, or looking
// up the author of an anonymous post one is involved in, is refused with
// CONFLICT_OF_INTEREST and left to another member of the staff (or to site
// moderation).
service CommunityModerationService {
  // Removes a member (they may join again). Needs MANAGE_MEMBERS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, MEMBER_NOT_FOUND,
  // CANNOT_TARGET_SELF, REASON_TOO_LONG.
  rpc RemoveMember(RemoveMemberRequest) returns (RemoveMemberResponse);
  // Bans a user: removes them if they are a member and keeps them from
  // joining, for good or until `expires_at`. Needs MANAGE_MEMBERS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, USER_NOT_FOUND,
  // CANNOT_TARGET_SELF, REASON_REQUIRED, REASON_TOO_LONG, EXPIRY_INVALID.
  rpc BanMember(BanMemberRequest) returns (BanMemberResponse);
  // Lifts a ban. Needs MANAGE_MEMBERS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, BAN_NOT_FOUND.
  rpc UnbanMember(UnbanMemberRequest) returns (UnbanMemberResponse);
  // Bans in force, newest first. Needs MANAGE_MEMBERS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED.
  rpc ListBans(ListBansRequest) returns (ListBansResponse);
  // Times a member out: they keep reading but cannot post, vote or RSVP
  // until the timeout ends (at most 28 days). Needs MANAGE_MEMBERS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, MEMBER_NOT_FOUND,
  // CANNOT_TARGET_SELF, DURATION_INVALID, REASON_TOO_LONG.
  rpc TimeoutMember(TimeoutMemberRequest) returns (TimeoutMemberResponse);
  // Ends a timeout early. Needs MANAGE_MEMBERS.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, MEMBER_NOT_FOUND.
  rpc ClearTimeout(ClearTimeoutRequest) returns (ClearTimeoutResponse);

  // Muted words and the auto-hide threshold. Needs MANAGE_SAFETY.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED.
  rpc GetSafetySettings(GetSafetySettingsRequest) returns (GetSafetySettingsResponse);
  // Changes muted words and the auto-hide threshold. Needs MANAGE_SAFETY.
  // The moderation log records which words were added and removed.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, TOO_MANY_MUTED_WORDS,
  // MUTED_WORD_INVALID, THRESHOLD_INVALID.
  rpc UpdateSafetySettings(UpdateSafetySettingsRequest) returns (UpdateSafetySettingsResponse);
  // Sets a channel's slow mode (0 = off, at most 6 hours).
  // Needs MANAGE_SAFETY. Errors: CHANNEL_NOT_FOUND, PERMISSION_DENIED,
  // DURATION_INVALID.
  rpc SetSlowMode(SetSlowModeRequest) returns (SetSlowModeResponse);

  // Hidden posts waiting for a decision, oldest first: posts hidden after
  // reports and posts held for a muted word. Needs MODERATE_CONTENT.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED.
  rpc ListReviewQueue(ListReviewQueueRequest) returns (ListReviewQueueResponse);
  // Decides about a hidden post: restore it to public view (its reports are
  // cleared) or remove it for good. Needs MODERATE_CONTENT; not for the
  // post's own author.
  // Errors: POST_REQUIRED, THREAD_NOT_FOUND, REPLY_NOT_FOUND,
  // PERMISSION_DENIED, CONFLICT_OF_INTEREST, POST_NOT_HIDDEN,
  // DECISION_INVALID, REASON_TOO_LONG.
  rpc ReviewPost(ReviewPostRequest) returns (ReviewPostResponse);
  // Names the author of a post in an anonymous channel — also of one that
  // was removed, for as long as it is retained. The use is written to the
  // moderation log (without the author's name) and announced to the rest
  // of the staff. Needs REVEAL_AUTHOR, or the site-wide moderator role.
  // Refused for anyone involved (a pseudonym is one person within a
  // thread, so this is about the whole thread): whoever wrote in the
  // thread themselves, and whoever is mentioned, answered or was reported
  // against by anything that author wrote in it.
  // Errors: POST_REQUIRED, THREAD_NOT_FOUND, REPLY_NOT_FOUND,
  // PERMISSION_DENIED, CONFLICT_OF_INTEREST, POST_NOT_ANONYMOUS,
  // REASON_REQUIRED, REASON_TOO_LONG, RATE_LIMITED.
  rpc RevealAuthor(RevealAuthorRequest) returns (RevealAuthorResponse);
  // A thread, a reply or an event as the staff may read it: what it says
  // now — also after it was removed, for as long as it is retained — and
  // what it said before each edit. This is what makes a report about an
  // edited or deleted post something that can be acted on. Authors of
  // anonymous posts stay pseudonyms. Needs MODERATE_CONTENT, or the
  // site-wide moderator role (which it takes for a closed community).
  // Errors: CONTENT_REQUIRED, THREAD_NOT_FOUND, REPLY_NOT_FOUND,
  // EVENT_NOT_FOUND, PERMISSION_DENIED.
  rpc GetContentHistory(GetContentHistoryRequest) returns (GetContentHistoryResponse);
  // The moderation log, newest first. Needs VIEW_MODERATION_LOG.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED.
  rpc ListModerationLog(ListModerationLogRequest) returns (ListModerationLogResponse);
}

// What a moderation log entry records.
enum ModerationAction {
  MODERATION_ACTION_UNSPECIFIED = 0;
  MODERATION_ACTION_MEMBER_REMOVED = 1;
  MODERATION_ACTION_MEMBER_BANNED = 2;
  MODERATION_ACTION_MEMBER_UNBANNED = 3;
  MODERATION_ACTION_MEMBER_TIMED_OUT = 4;
  MODERATION_ACTION_TIMEOUT_CLEARED = 5;
  // details: `from`, `to` (role names).
  MODERATION_ACTION_ROLE_CHANGED = 6;
  MODERATION_ACTION_OWNERSHIP_TRANSFERRED = 7;
  MODERATION_ACTION_JOIN_REQUEST_APPROVED = 8;
  MODERATION_ACTION_JOIN_REQUEST_DECLINED = 9;
  // A moderator deleted someone else's thread.
  MODERATION_ACTION_THREAD_DELETED = 10;
  // A moderator deleted someone else's reply.
  MODERATION_ACTION_REPLY_DELETED = 11;
  // A post was hidden automatically; details: `cause` (`reports` or
  // `muted_word`), `reports`.
  MODERATION_ACTION_POST_HIDDEN = 12;
  // A hidden post went back into public view after review.
  MODERATION_ACTION_POST_RESTORED = 13;
  // A hidden post was removed after review.
  MODERATION_ACTION_POST_REMOVED = 14;
  MODERATION_ACTION_THREAD_PINNED = 15;
  MODERATION_ACTION_THREAD_UNPINNED = 16;
  MODERATION_ACTION_THREAD_LOCKED = 17;
  MODERATION_ACTION_THREAD_UNLOCKED = 18;
  MODERATION_ACTION_ANNOUNCEMENT_SET = 19;
  MODERATION_ACTION_ANNOUNCEMENT_CLEARED = 20;
  // Someone looked up the author of an anonymous post.
  MODERATION_ACTION_AUTHOR_REVEALED = 21;
  MODERATION_ACTION_SAFETY_SETTINGS_CHANGED = 22;
  // details: `seconds`.
  MODERATION_ACTION_SLOW_MODE_CHANGED = 23;
  MODERATION_ACTION_CHANNEL_CREATED = 24;
  MODERATION_ACTION_CHANNEL_UPDATED = 25;
  MODERATION_ACTION_CHANNEL_DELETED = 26;
  MODERATION_ACTION_COMMUNITY_UPDATED = 27;
  // Site moderation took content down (a thread, a reply or an event).
  MODERATION_ACTION_CONTENT_TAKEN_DOWN = 28;
  // A moderator removed or cancelled someone else's event.
  MODERATION_ACTION_EVENT_REMOVED = 29;
  MODERATION_ACTION_INVITE_REVOKED = 30;
}

// A decision about a hidden post.
enum ReviewDecision {
  REVIEW_DECISION_UNSPECIFIED = 0;
  REVIEW_DECISION_RESTORE = 1;
  REVIEW_DECISION_REMOVE = 2;
}

// A thread or a reply.
message PostRef {
  oneof post {
    string thread_id = 1;
    string reply_id = 2;
  }
}

message Ban {
  tokuly.common.v1.UserSummary user = 1;
  string reason = 2;
  tokuly.common.v1.UserSummary banned_by = 3;
  // Unset = permanent.
  google.protobuf.Timestamp expires_at = 4;
  google.protobuf.Timestamp created_at = 5;
}

message SafetySettings {
  // Words and phrases (at most 200, each at most 40 characters). A post
  // containing one is held for review. Matching ignores case and width.
  repeated string muted_words = 1;
  // Different members whose reports hide a post until reviewed; 0 = the
  // server's default.
  int32 auto_hide_reports = 2;
  // The number in force (the community's, or the server's default).
  int32 effective_auto_hide_reports = 3;
}

// A hidden post in the review queue.
message ReviewItem {
  oneof post {
    Thread thread = 1;
    Reply reply = 2;
  }
  HiddenReason reason = 3;
  // Different members who reported it.
  int32 report_count = 4;
  google.protobuf.Timestamp hidden_at = 5;
  // Title of the thread the post is, or belongs to.
  string thread_title = 6;
}

message ModerationLogEntry {
  string id = 1;
  ModerationAction action = 2;
  // Who did it; unset for automatic actions.
  tokuly.common.v1.UserSummary actor = 3;
  // The actor acted as site moderation, not as a member of the staff.
  bool site_moderation = 4;
  // The member it was done to. Unset when the action concerns an anonymous
  // post: the log never unmasks an author.
  tokuly.common.v1.UserSummary target_user = 5;
  // The pseudonym of the author when the action concerns an anonymous post.
  Pseudonym target_pseudonym = 6;
  string thread_id = 7;
  string reply_id = 8;
  string channel_id = 9;
  string event_id = 10;
  string reason = 11;
  // Action-specific values (see ModerationAction).
  map<string, string> details = 12;
  google.protobuf.Timestamp created_at = 13;
}

message RemoveMemberRequest {
  string community_id = 1;
  string user_id = 2;
  // Told to the member; at most 300 characters.
  string reason = 3;
}

message RemoveMemberResponse {}

message BanMemberRequest {
  string community_id = 1;
  string user_id = 2;
  // Required; told to the user; at most 300 characters.
  string reason = 3;
  // Unset = permanent. Must be in the future.
  google.protobuf.Timestamp expires_at = 4;
}

message BanMemberResponse {
  Ban ban = 1;
}

message UnbanMemberRequest {
  string community_id = 1;
  string user_id = 2;
}

message UnbanMemberResponse {}

message ListBansRequest {
  string community_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListBansResponse {
  repeated Ban bans = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message TimeoutMemberRequest {
  string community_id = 1;
  string user_id = 2;
  // 60 seconds to 28 days.
  int32 duration_seconds = 3;
  // Told to the member; at most 300 characters.
  string reason = 4;
}

message TimeoutMemberResponse {
  Member member = 1;
}

message ClearTimeoutRequest {
  string community_id = 1;
  string user_id = 2;
}

message ClearTimeoutResponse {
  Member member = 1;
}

message GetSafetySettingsRequest {
  string community_id = 1;
}

message GetSafetySettingsResponse {
  SafetySettings settings = 1;
}

message UpdateSafetySettingsRequest {
  string community_id = 1;
  StringList muted_words = 2;
  // 0 = the server's default, otherwise 2-50.
  optional int32 auto_hide_reports = 3;
}

message UpdateSafetySettingsResponse {
  SafetySettings settings = 1;
}

message SetSlowModeRequest {
  string channel_id = 1;
  // 0 = off, at most 21600.
  int32 seconds = 2;
}

message SetSlowModeResponse {
  Channel channel = 1;
}

message ListReviewQueueRequest {
  string community_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListReviewQueueResponse {
  repeated ReviewItem items = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message ReviewPostRequest {
  PostRef post = 1;
  ReviewDecision decision = 2;
  // Told to the author when the post is removed; at most 300 characters.
  string reason = 3;
}

message ReviewPostResponse {}

message RevealAuthorRequest {
  PostRef post = 1;
  // Why the author must be known; required, at most 300 characters.
  string reason = 2;
}

message RevealAuthorResponse {
  tokuly.common.v1.UserSummary author = 1;
  // Their role in the community; unspecified when they are no longer a member.
  MemberRole role = 2;
}

// A thread, a reply or an event.
message ContentRef {
  oneof content {
    string thread_id = 1;
    string reply_id = 2;
    string event_id = 3;
  }
}

// What a post or an event said before one of its edits.
message ContentRevision {
  // Empty for replies.
  string title = 1;
  // The body of a post. For an event: its description, then its place
  // (name, address) and link, each on a line of its own.
  string body = 2;
  // When this version was replaced.
  google.protobuf.Timestamp replaced_at = 3;
}

message GetContentHistoryRequest {
  ContentRef content = 1;
}

message GetContentHistoryResponse {
  // What it says now (for a removed one: what it said when it was removed).
  oneof current {
    Thread thread = 1;
    Reply reply = 2;
    CalendarEvent event = 3;
  }
  // Set when it was removed.
  google.protobuf.Timestamp removed_at = 4;
  // Earlier versions, oldest first.
  repeated ContentRevision revisions = 5;
}

message ListModerationLogRequest {
  string community_id = 1;
  // Only entries of this action; unspecified = all.
  ModerationAction action = 2;
  tokuly.common.v1.PageRequest page = 3;
}

message ListModerationLogResponse {
  repeated ModerationLogEntry entries = 1;
  tokuly.common.v1.PageInfo page = 2;
}

// ───────────────────────────── Events ─────────────────────────────

// Events of a community: a time, a place (or online), a capacity with a
// waitlist, RSVP, reminders and check-in.
//
// Reading follows the community (public: everyone; otherwise members).
service CommunityEventService {
  // Creates an event; the caller is its organiser and is going.
  // Needs CREATE_EVENT.
  // Errors: COMMUNITY_NOT_FOUND, PERMISSION_DENIED, TIMED_OUT, TITLE_INVALID,
  // DESCRIPTION_TOO_LONG, TIME_INVALID (start in the past, end before start,
  // longer than 31 days), PLACE_INVALID, URL_INVALID, CAPACITY_INVALID,
  // ASSET_NOT_FOUND, ASSET_NOT_READY, ASSET_NOT_IMAGE, ASSET_WRONG_PURPOSE,
  // RATE_LIMITED.
  rpc CreateEvent(CreateEventRequest) returns (CreateEventResponse);
  // Edits an event. Raising the capacity lets people off the waitlist;
  // moving the start tells everyone who answered. What the title, the
  // description, the place and the link said before stays on file for the
  // staff, and they can be reworded 30 times. The organiser, or a member
  // with MODERATE_CONTENT.
  // Errors: EVENT_NOT_FOUND, PERMISSION_DENIED, TIMED_OUT, EVENT_CANCELLED,
  // TOO_MANY_EDITS, RATE_LIMITED, plus the validation errors of CreateEvent.
  rpc UpdateEvent(UpdateEventRequest) returns (UpdateEventResponse);
  // Calls an event off; it stays visible as cancelled and everyone who
  // answered is told. The organiser, or a member with MODERATE_CONTENT.
  // Errors: EVENT_NOT_FOUND, PERMISSION_DENIED, TIMED_OUT, REASON_TOO_LONG.
  rpc CancelEvent(CancelEventRequest) returns (CancelEventResponse);
  // Removes an event. The organiser, or a member with MODERATE_CONTENT.
  // Errors: EVENT_NOT_FOUND, PERMISSION_DENIED, TIMED_OUT.
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);
  // One event. Errors: EVENT_NOT_FOUND, NOT_A_MEMBER.
  rpc GetEvent(GetEventRequest) returns (GetEventResponse);
  // The community's calendar: events overlapping a time range, earliest
  // first. Without a range: upcoming and running events (or past ones,
  // latest first). Errors: COMMUNITY_NOT_FOUND, NOT_A_MEMBER, RANGE_INVALID.
  rpc ListEvents(ListEventsRequest) returns (ListEventsResponse);
  // The caller's calendar across communities: upcoming and running events
  // they are going to, waitlisted for or interested in, earliest first.
  rpc ListMyEvents(ListMyEventsRequest) returns (ListMyEventsResponse);
  // Answers an event: going, interested or not going. When the event is
  // full, "going" puts the caller on the waitlist; whoever is first on it
  // moves up automatically when a place frees. Members only.
  // Errors: EVENT_NOT_FOUND, NOT_A_MEMBER, TIMED_OUT, EVENT_CANCELLED,
  // EVENT_ENDED, ANSWER_INVALID.
  rpc Rsvp(RsvpRequest) returns (RsvpResponse);
  // Who answered, by answer. Members see who is going, waitlisted and
  // interested; check-in times are for the organiser and the staff.
  // Errors: EVENT_NOT_FOUND, NOT_A_MEMBER.
  rpc ListAttendees(ListAttendeesRequest) returns (ListAttendeesResponse);
  // The code the organiser shows at the venue. It changes every minute or
  // so; attendees enter the one on screen. The organiser, or a member with
  // MODERATE_CONTENT. Errors: EVENT_NOT_FOUND, PERMISSION_DENIED,
  // EVENT_CANCELLED, CHECK_IN_CLOSED (opens 1 hour before the start, closes
  // 6 hours after the end).
  rpc GetCheckInCode(GetCheckInCodeRequest) returns (GetCheckInCodeResponse);
  // Checks the caller in with the code on the organiser's screen. Anyone
  // who is going may check in; checking in twice changes nothing.
  // Errors: EVENT_NOT_FOUND, NOT_A_MEMBER, NOT_GOING, EVENT_CANCELLED,
  // CHECK_IN_CLOSED, CODE_INVALID, RATE_LIMITED.
  rpc CheckIn(CheckInRequest) returns (CheckInResponse);
  // Checks an attendee in by hand (a dead phone): a member who answered
  // that they are going. The organiser confirms that answer and cannot
  // give one for the member. The organiser, or a member with
  // MODERATE_CONTENT. Errors: EVENT_NOT_FOUND, PERMISSION_DENIED,
  // MEMBER_NOT_FOUND, NOT_GOING, EVENT_CANCELLED, CHECK_IN_CLOSED,
  // RATE_LIMITED.
  rpc CheckInAttendee(CheckInAttendeeRequest) returns (CheckInAttendeeResponse);
}

// An answer to an event.
enum RsvpAnswer {
  RSVP_ANSWER_UNSPECIFIED = 0;
  RSVP_ANSWER_GOING = 1;
  RSVP_ANSWER_INTERESTED = 2;
  RSVP_ANSWER_NOT_GOING = 3;
}

// Where a member stands with an event.
enum AttendanceStatus {
  ATTENDANCE_STATUS_UNSPECIFIED = 0;
  ATTENDANCE_STATUS_GOING = 1;
  // Wants to go; the event is full.
  ATTENDANCE_STATUS_WAITLISTED = 2;
  ATTENDANCE_STATUS_INTERESTED = 3;
  ATTENDANCE_STATUS_NOT_GOING = 4;
}

// Where an event takes place.
message EventPlace {
  // 1-100 characters, e.g. "第2体育館".
  string name = 1;
  // Optional address, at most 200 characters.
  string address = 2;
  // Optional pin on the map.
  tokuly.common.v1.LatLng location = 3;
}

// An event on a community's calendar.
message CalendarEvent {
  string id = 1;
  string community_id = 2;
  tokuly.common.v1.UserSummary organizer = 3;
  // 1-100 characters.
  string title = 4;
  // At most 3000 characters.
  string description = 5;
  google.protobuf.Timestamp starts_at = 6;
  google.protobuf.Timestamp ends_at = 7;
  // Unset for online events.
  EventPlace place = 8;
  // The event happens online.
  bool online = 9;
  // Where to join an online event (https). Shown to members who are going.
  string online_url = 10;
  tokuly.common.v1.Image cover = 11;
  // Places; 0 = unlimited.
  int32 capacity = 12;
  int32 going_count = 13;
  int32 waitlist_count = 14;
  int32 interested_count = 15;
  // Members who checked in.
  int32 attended_count = 16;
  bool cancelled = 17;
  // Why it was called off.
  string cancel_reason = 18;
  int64 like_count = 19;
  int32 comment_count = 20;
  google.protobuf.Timestamp created_at = 21;
  // Path of the event in the web app.
  string path = 22;
  // Unset for anonymous callers.
  CalendarEventViewer viewer = 23;
}

message CalendarEventViewer {
  // Unspecified when the caller has not answered.
  AttendanceStatus status = 1;
  // Position on the waitlist from 1; 0 when not waitlisted.
  int32 waitlist_position = 2;
  google.protobuf.Timestamp checked_in_at = 3;
  // The caller may edit, cancel and run check-in.
  bool can_manage = 4;
}

message Attendee {
  tokuly.common.v1.UserSummary user = 1;
  AttendanceStatus status = 2;
  google.protobuf.Timestamp responded_at = 3;
  // Only for the organiser and the staff.
  google.protobuf.Timestamp checked_in_at = 4;
}

message CreateEventRequest {
  string community_id = 1;
  string title = 2;
  string description = 3;
  google.protobuf.Timestamp starts_at = 4;
  // Unset = two hours after the start.
  google.protobuf.Timestamp ends_at = 5;
  // Required unless `online`.
  EventPlace place = 6;
  bool online = 7;
  string online_url = 8;
  // Image upload (purpose COMMUNITY_BANNER, BANNER, CHANNEL_BANNER,
  // NOTE_IMAGE or THUMBNAIL).
  string cover_asset_id = 9;
  // 0 = unlimited, at most 100000.
  int32 capacity = 10;
}

message CreateEventResponse {
  CalendarEvent event = 1;
}

message UpdateEventRequest {
  string event_id = 1;
  optional string title = 2;
  optional string description = 3;
  google.protobuf.Timestamp starts_at = 4;
  google.protobuf.Timestamp ends_at = 5;
  // Setting a place makes the event an in-person one.
  EventPlace place = 6;
  // True makes it an online event (the place is dropped).
  optional bool online = 7;
  optional string online_url = 8;
  // Empty string removes the cover.
  optional string cover_asset_id = 9;
  optional int32 capacity = 10;
}

message UpdateEventResponse {
  CalendarEvent event = 1;
}

message CancelEventRequest {
  string event_id = 1;
  // Told to everyone who answered; at most 300 characters.
  string reason = 2;
}

message CancelEventResponse {
  CalendarEvent event = 1;
}

message DeleteEventRequest {
  string event_id = 1;
}

message DeleteEventResponse {}

message GetEventRequest {
  string event_id = 1;
}

message GetEventResponse {
  CalendarEvent event = 1;
}

message ListEventsRequest {
  string community_id = 1;
  // Calendar range (both or neither); at most 92 days.
  google.protobuf.Timestamp from = 2;
  google.protobuf.Timestamp to = 3;
  // Without a range: events that are over, latest first.
  bool past = 4;
  tokuly.common.v1.PageRequest page = 5;
}

message ListEventsResponse {
  repeated CalendarEvent events = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message ListMyEventsRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message ListMyEventsResponse {
  repeated CalendarEvent events = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message RsvpRequest {
  string event_id = 1;
  RsvpAnswer answer = 2;
}

message RsvpResponse {
  CalendarEvent event = 1;
}

message ListAttendeesRequest {
  string event_id = 1;
  // Only this status; unspecified = going.
  AttendanceStatus status = 2;
  // Only members who checked in (organiser and staff).
  bool checked_in_only = 3;
  tokuly.common.v1.PageRequest page = 4;
}

message ListAttendeesResponse {
  repeated Attendee attendees = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message GetCheckInCodeRequest {
  string event_id = 1;
}

message GetCheckInCodeResponse {
  // 6 digits.
  string code = 1;
  // When this code stops being shown; ask again then. (A code is accepted
  // a little longer than it is shown.)
  google.protobuf.Timestamp expires_at = 2;
}

message CheckInRequest {
  string event_id = 1;
  string code = 2;
}

message CheckInResponse {
  CalendarEvent event = 1;
}

message CheckInAttendeeRequest {
  string event_id = 1;
  string user_id = 2;
}

message CheckInAttendeeResponse {
  Attendee attendee = 1;
}

// ───────────────────────────── Discovery ─────────────────────────────

// Finding communities. Only listed communities (public and restricted) ever
// appear; hidden ones are reached by invite. Works anonymously unless noted.
service CommunityDiscoveryService {
  // The directory: listed communities by category, tag, language and name.
  // Errors: QUERY_TOO_LONG, TAG_INVALID, SORT_INVALID, RATE_LIMITED.
  rpc ListDirectory(ListDirectoryRequest) returns (ListDirectoryResponse);
  // Communities that are growing and busy right now, best first. The score
  // (new members and posts of the last week, relative to size) is
  // recomputed by a worker.
  rpc ListTrending(ListTrendingRequest) returns (ListTrendingResponse);
  // Public communities the caller's friends are in — only friends who show
  // that membership on their profile — with those friends, most friends
  // first. Communities the caller is in are left out. Signed-in only.
  rpc ListFriendsCommunities(ListFriendsCommunitiesRequest) returns (ListFriendsCommunitiesResponse);
  // SCHOOL and CLUB communities of the caller's school (the school name on
  // their profile), largest first. Empty when the caller set no school.
  // Signed-in only.
  rpc ListSchoolCommunities(ListSchoolCommunitiesRequest) returns (ListSchoolCommunitiesResponse);
  // The most used tags among listed communities, optionally of one category.
  rpc ListPopularTags(ListPopularTagsRequest) returns (ListPopularTagsResponse);
}

// Order of the directory.
enum DirectorySort {
  DIRECTORY_SORT_UNSPECIFIED = 0;
  // Most members first. The default.
  DIRECTORY_SORT_MEMBERS = 1;
  // Newest first.
  DIRECTORY_SORT_NEW = 2;
  // Most recently active first.
  DIRECTORY_SORT_ACTIVE = 3;
}

message ListDirectoryRequest {
  // Unspecified = every category.
  CommunityCategory category = 1;
  // Only communities carrying this tag.
  string tag = 2;
  // Only communities in this language (locale tag).
  string language = 3;
  // Matches names, handles and descriptions; at most 64 characters.
  string query = 4;
  DirectorySort sort = 5;
  tokuly.common.v1.PageRequest page = 6;
}

message ListDirectoryResponse {
  repeated Community communities = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message ListTrendingRequest {
  CommunityCategory category = 1;
  // At most 50; 0 = 20.
  int32 limit = 2;
}

message ListTrendingResponse {
  repeated Community communities = 1;
}

// A community some of the caller's friends are in.
message FriendsCommunity {
  Community community = 1;
  // Up to 3 of the friends who are members.
  repeated tokuly.common.v1.UserSummary friends = 2;
  int32 friend_count = 3;
}

message ListFriendsCommunitiesRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message ListFriendsCommunitiesResponse {
  repeated FriendsCommunity communities = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message ListSchoolCommunitiesRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message ListSchoolCommunitiesResponse {
  repeated Community communities = 1;
  tokuly.common.v1.PageInfo page = 2;
  // The school the list is for; empty when the caller set none.
  string school_name = 3;
}

message ListPopularTagsRequest {
  CommunityCategory category = 1;
  // At most 100; 0 = 30.
  int32 limit = 2;
}

message TagCount {
  string tag = 1;
  int32 community_count = 2;
}

message ListPopularTagsResponse {
  repeated TagCount tags = 1;
}

// ───────────────────────────── Realtime ─────────────────────────────

// Pushed over the realtime gateway (as a tokuly.realtime.v1.Event).
//
// Board and calendar events travel on the topic `community:<community id>`,
// which members may follow (anyone, for a public community). Membership and
// staff events go straight to the users concerned.
//
// Posts on the topic carry no viewer state. A post or a calendar event is
// left out of its push (only the IDs are sent) and must be fetched with
// GetThread / GetReply / GetEvent, which check who is asking:
// - always in a community that is not public — the topic is checked when it
//   is followed, so someone removed afterwards may still be listening;
// - in a public community, when the post's author has a block with anyone.
// Hidden posts never appear on the topic.
message CommunityEvent {
  oneof event {
    ThreadCreated thread_created = 1;
    ThreadUpdated thread_updated = 2;
    ThreadRemoved thread_removed = 3;
    ReplyCreated reply_created = 4;
    ReplyUpdated reply_updated = 5;
    ReplyRemoved reply_removed = 6;
    ThreadCountsChanged thread_counts_changed = 7;
    ChannelsChanged channels_changed = 8;
    CalendarEventChanged calendar_event_changed = 9;
    CommunityChanged community_changed = 10;
    MembershipChanged membership_changed = 11;
    StaffQueueChanged staff_queue_changed = 12;
    AuthorRevealed author_revealed = 13;
  }
}

// A thread entered public view: posted, or restored after review.
message ThreadCreated {
  string community_id = 1;
  string channel_id = 2;
  string thread_id = 3;
  // Unset when the thread must be fetched (see CommunityEvent).
  Thread thread = 4;
}

// A thread was edited, pinned, locked, marked as an announcement, or its
// poll changed.
message ThreadUpdated {
  string community_id = 1;
  string thread_id = 2;
  Thread thread = 3;
}

// A thread left public view: deleted, hidden or taken down.
message ThreadRemoved {
  string community_id = 1;
  string channel_id = 2;
  string thread_id = 3;
}

// A reply entered public view.
message ReplyCreated {
  string community_id = 1;
  string thread_id = 2;
  string reply_id = 3;
  // Unset when the reply must be fetched (see CommunityEvent).
  Reply reply = 4;
  // The thread's reply count after it.
  int32 reply_count = 5;
}

message ReplyUpdated {
  string community_id = 1;
  string thread_id = 2;
  string reply_id = 3;
  Reply reply = 4;
}

// A reply left public view.
message ReplyRemoved {
  string community_id = 1;
  string thread_id = 2;
  string reply_id = 3;
  int32 reply_count = 4;
}

// Counters of a thread changed (likes and comments arrive at most about
// once a second per thread).
message ThreadCountsChanged {
  string community_id = 1;
  string thread_id = 2;
  int32 reply_count = 3;
  int64 like_count = 4;
  int32 comment_count = 5;
}

// The channel list changed (created, edited, reordered, deleted, slow
// mode): fetch it again.
message ChannelsChanged {
  string community_id = 1;
}

// An event was created, edited, cancelled, removed, or its counters moved.
message CalendarEventChanged {
  string community_id = 1;
  string event_id = 2;
  // Unset when the event was removed, and always in a community that is
  // not public: GetEvent then tells which (EVENT_NOT_FOUND = removed).
  CalendarEvent event = 3;
}

// The community's profile or member count changed.
message CommunityChanged {
  string community_id = 1;
  int32 member_count = 2;
  // The community was closed.
  bool deleted = 3;
}

// To one user: their relation to a community changed (joined, request
// approved, role changed, timed out, removed, banned).
message MembershipChanged {
  string community_id = 1;
  MembershipStatus status = 2;
  MemberRole role = 3;
  google.protobuf.Timestamp timeout_until = 4;
}

// To the staff: the number of join requests or of posts waiting for review
// changed.
message StaffQueueChanged {
  string community_id = 1;
  int32 pending_request_count = 2;
  int32 review_queue_count = 3;
}

// To the staff: someone looked up the author of an anonymous post. The
// author is not named here.
message AuthorRevealed {
  string community_id = 1;
  // Who looked.
  tokuly.common.v1.UserSummary actor = 2;
  string thread_id = 3;
  // Set when the post is a reply.
  string reply_id = 4;
  string reason = 5;
}
