syntax = "proto3";

// School life: timetables (時間割), study sessions and study rooms
// (もくもく部屋), exams and assignments.
//
// Conventions of this package:
// - Every RPC needs a signed-in caller.
// - A calendar date is a `YYYY-MM-DD` string and a time of day is a number of
//   minutes after local midnight, both in the account's time zone
//   (`AccountService.UpdateProfile`, Asia/Tokyo unless changed). Anything
//   "per day" (totals, streaks, countdowns, today's classes) uses that zone.
// - Weeks start on Monday.
// - The server keeps the time. Timers are described by `TimerSnapshot`, which
//   carries the server's clock, so clients only correct for their own clock
//   offset and never report elapsed time themselves.
// - Reasons every RPC may return besides its own: INVALID_ID, INVALID_DATE
//   (not a `YYYY-MM-DD` date, or outside 2000-2100), RATE_LIMITED.
package tokuly.school.v1;

import "google/protobuf/timestamp.proto";
import "tokuly/common/v1/common.proto";

// ───────────────────────────── Settings ─────────────────────────────

// Per-account settings of the school features.
service SchoolService {
  // The caller's settings (the defaults until they are changed).
  rpc GetSchoolSettings(GetSchoolSettingsRequest) returns (GetSchoolSettingsResponse);
  // Changes the settings present in the request; the others keep their value.
  // Errors: SETTINGS_INVALID.
  rpc UpdateSchoolSettings(UpdateSchoolSettingsRequest) returns (UpdateSchoolSettingsResponse);
}

// Who sees that the user is studying.
enum StudyVisibility {
  STUDY_VISIBILITY_UNSPECIFIED = 0;
  // Friends see "勉強中" with the subject and the elapsed time (the default).
  STUDY_VISIBILITY_FRIENDS = 1;
  STUDY_VISIBILITY_NOBODY = 2;
}

message SchoolSettings {
  // Minutes before the first class of the day at which the
  // `school.class_soon` notification is sent (1-120). 0, the default, never
  // sends it: timetable notifications are opt-in.
  int32 class_soon_minutes = 1;
  // Who sees the user studying: on their profile, in `ListStudyingFriends`,
  // in the heatmap of `GetStudyHeatmap`. Default: friends.
  StudyVisibility study_visibility = 2;
  // Finished sessions appear in friends' activity feeds (default true; also
  // needs `study_visibility` to be friends and the account-wide activity
  // sharing of the identity settings).
  bool share_study_activity = 3;
  // Takes part in the weekly ranking among friends (default false). Only
  // participants see the ranking.
  bool join_ranking = 4;
  // Cheers also arrive as a notification (default false: a cheer is a quiet
  // realtime event).
  bool cheer_notifications = 5;
  // Daily study goal in minutes (0 = no goal, up to 1440).
  int32 daily_goal_minutes = 6;
  // Pomodoro lengths used when a session or room is started without any.
  PomodoroConfig pomodoro = 7;
  // Reminders for assignments (`school.assignment_due`), default true.
  bool assignment_reminders = 8;
}

message GetSchoolSettingsRequest {}

message GetSchoolSettingsResponse {
  SchoolSettings settings = 1;
}

message UpdateSchoolSettingsRequest {
  optional int32 class_soon_minutes = 1;
  optional StudyVisibility study_visibility = 2;
  optional bool share_study_activity = 3;
  optional bool join_ranking = 4;
  optional bool cheer_notifications = 5;
  optional int32 daily_goal_minutes = 6;
  // Replaces the default pomodoro lengths when set.
  PomodoroConfig pomodoro = 7;
  optional bool assignment_reminders = 8;
}

message UpdateSchoolSettingsResponse {
  SchoolSettings settings = 1;
}

// ───────────────────────────── Timetable ─────────────────────────────

// Timetables: subjects, terms with their period layout and weekly grid,
// one-off changes, days off, what actually happens on a day, and sharing
// with friends.
//
// A user's own data is private. A term is visible to other people only
// through its audience (`Term.audience`); to everyone else it does not exist
// (TERM_NOT_FOUND / TIMETABLE_NOT_SHARED). Memos are never shown to anyone
// but the owner.
service TimetableService {
  // The ready-made period layouts (high school 50-minute periods, university
  // 90 / 100 / 105-minute コマ...) to start a term from.
  rpc ListLayoutPresets(ListLayoutPresetsRequest) returns (ListLayoutPresetsResponse);

  // The caller's subjects, by name.
  rpc ListSubjects(ListSubjectsRequest) returns (ListSubjectsResponse);
  // Adds a subject to the caller's list. Without a colour one is picked from
  // the palette. Errors: SUBJECT_NAME_INVALID, SUBJECT_NAME_TAKEN,
  // COLOR_INVALID, TEXT_TOO_LONG, SUBJECT_LIMIT_REACHED.
  rpc CreateSubject(CreateSubjectRequest) returns (CreateSubjectResponse);
  // Changes a subject everywhere it is used. Errors: SUBJECT_NOT_FOUND,
  // SUBJECT_NAME_INVALID, SUBJECT_NAME_TAKEN, COLOR_INVALID, TEXT_TOO_LONG.
  rpc UpdateSubject(UpdateSubjectRequest) returns (UpdateSubjectResponse);
  // Removes a subject from the caller's list and from every timetable. Study
  // sessions, exams and assignments keep their subject: when any of them use
  // it, the subject is archived (hidden from pickers) instead of erased.
  // Errors: SUBJECT_NOT_FOUND.
  rpc DeleteSubject(DeleteSubjectRequest) returns (DeleteSubjectResponse);

  // The caller's terms, newest first.
  rpc ListTerms(ListTermsRequest) returns (ListTermsResponse);
  // One term with its weekly grid, changes and day overrides.
  // Errors: TERM_NOT_FOUND.
  rpc GetTerm(GetTermRequest) returns (GetTermResponse);
  // Creates a term. The first term of an account becomes the current one.
  // Errors: TERM_NAME_INVALID, DATE_RANGE_INVALID (end before start, or
  // longer than 400 days), LAYOUT_INVALID, WEEK_A_DATE_REQUIRED,
  // AUDIENCE_INVALID, NOT_FRIENDS (a chosen person is not a friend),
  // TOO_MANY_SHARES, TERM_LIMIT_REACHED.
  rpc CreateTerm(CreateTermRequest) returns (CreateTermResponse);
  // Changes a term: name, dates, layout, A/B weeks, public holidays, the
  // audience, or which term is current. Shrinking the layout removes the
  // classes that no longer fit. Errors: TERM_NOT_FOUND and those of CreateTerm.
  rpc UpdateTerm(UpdateTermRequest) returns (UpdateTermResponse);
  // Deletes a term with its grid, changes and day overrides. When it was the
  // current one, the newest remaining term becomes current.
  // Errors: TERM_NOT_FOUND.
  rpc DeleteTerm(DeleteTermRequest) returns (DeleteTermResponse);

  // Puts classes into slots of the weekly grid. A slot holds either one class
  // every week or one for week A and/or one for week B: whatever a new class
  // collides with is replaced. All or nothing.
  // Errors: TERM_NOT_FOUND, NO_ENTRIES, TOO_MANY_ENTRIES, SLOT_INVALID (weekday
  // or period outside the term's layout), WEEK_PATTERN_INVALID (A/B in a term
  // without alternating weeks), SUBJECT_NOT_FOUND, COLOR_INVALID, TEXT_TOO_LONG.
  rpc PutTimetableEntries(PutTimetableEntriesRequest) returns (PutTimetableEntriesResponse);
  // Empties slots of the weekly grid. Unknown IDs are ignored.
  // Errors: TERM_NOT_FOUND.
  rpc DeleteTimetableEntries(DeleteTimetableEntriesRequest) returns (DeleteTimetableEntriesResponse);

  // Records a one-off change for a date: a class is cancelled (休講), moved to
  // another slot, replaced, or an extra class takes place (補講). A slot has
  // at most one change per date: a new one replaces the old.
  // Errors: TERM_NOT_FOUND, CHANGE_KIND_REQUIRED, DATE_OUTSIDE_TERM,
  // SLOT_INVALID, NO_CLASS_IN_SLOT (cancelling, moving or replacing where
  // nothing is scheduled), SUBJECT_REQUIRED (an extra class), MOVE_TARGET_REQUIRED,
  // SUBJECT_NOT_FOUND, TEXT_TOO_LONG, CHANGE_LIMIT_REACHED.
  rpc CreateTimetableChange(CreateTimetableChangeRequest) returns (CreateTimetableChangeResponse);
  // Withdraws a one-off change. Errors: CHANGE_NOT_FOUND.
  rpc DeleteTimetableChange(DeleteTimetableChangeRequest) returns (DeleteTimetableChangeResponse);

  // Marks dates as a holiday, as a class day (despite a public holiday or a
  // weekday without classes, optionally following another weekday's
  // timetable: 「月曜授業」), or pins them to week A or B.
  // Errors: TERM_NOT_FOUND, OVERRIDE_KIND_REQUIRED, DATE_RANGE_INVALID,
  // DATE_OUTSIDE_TERM, WEEK_PATTERN_INVALID, TEXT_TOO_LONG, OVERRIDE_LIMIT_REACHED.
  rpc CreateDayOverride(CreateDayOverrideRequest) returns (CreateDayOverrideResponse);
  // Removes a day override. Errors: OVERRIDE_NOT_FOUND.
  rpc DeleteDayOverride(DeleteDayOverrideRequest) returns (DeleteDayOverrideResponse);

  // What actually happens on one day: the weekly grid with A/B weeks,
  // holidays and one-off changes applied. The caller's own day, or a friend's
  // when their term for that date is shared with the caller.
  // Errors: TIMETABLE_NOT_SHARED.
  rpc GetDay(GetDayRequest) returns (GetDayResponse);
  // `GetDay` for a range of up to 62 days (a week view, a month calendar).
  // Errors: DATE_RANGE_INVALID, TIMETABLE_NOT_SHARED.
  rpc ListDays(ListDaysRequest) returns (ListDaysResponse);
  // The class taking place right now and the next one (today, or on the
  // next day with classes within two weeks). The caller's, or a friend's.
  // Errors: TIMETABLE_NOT_SHARED.
  rpc GetNow(GetNowRequest) returns (GetNowResponse);

  // Friends whose current term is shared with the caller, with what they
  // are in right now.
  rpc ListFriendTimetables(ListFriendTimetablesRequest) returns (ListFriendTimetablesResponse);
  // A friend's term as shared with the caller: their current term unless
  // another one is asked for. Errors: TIMETABLE_NOT_SHARED.
  rpc GetFriendTimetable(GetFriendTimetableRequest) returns (GetFriendTimetableResponse);
  // Copies a friend's shared term into the caller's account as a starting
  // point (classmates): a new term, or the empty slots of an existing one.
  // Subjects are matched to the caller's by name and created when missing;
  // memos and one-off changes are not copied; a new term also gets the
  // friend's day overrides (the school's holidays and class days). The copy
  // is the caller's own from then on.
  // Errors: TIMETABLE_NOT_SHARED, TERM_NOT_FOUND (the target),
  // TERM_NAME_INVALID, TERM_LIMIT_REACHED, SUBJECT_LIMIT_REACHED.
  rpc CopyFriendTimetable(CopyFriendTimetableRequest) returns (CopyFriendTimetableResponse);
  // 空きコマ: the caller's free periods on up to seven days, each with the
  // friends who are free at the same time. Only friends whose timetable is
  // shared with the caller can be compared.
  // Errors: DATE_RANGE_INVALID, TOO_MANY_USERS.
  rpc FindCommonFreePeriods(FindCommonFreePeriodsRequest) returns (FindCommonFreePeriodsResponse);
}

enum Weekday {
  WEEKDAY_UNSPECIFIED = 0;
  WEEKDAY_MONDAY = 1;
  WEEKDAY_TUESDAY = 2;
  WEEKDAY_WEDNESDAY = 3;
  WEEKDAY_THURSDAY = 4;
  WEEKDAY_FRIDAY = 5;
  WEEKDAY_SATURDAY = 6;
  WEEKDAY_SUNDAY = 7;
}

// In which weeks a class of the weekly grid takes place.
enum WeekPattern {
  WEEK_PATTERN_UNSPECIFIED = 0;
  WEEK_PATTERN_EVERY = 1;
  // A週 only.
  WEEK_PATTERN_A = 2;
  // B週 only.
  WEEK_PATTERN_B = 3;
}

// Who may see a term.
enum TimetableAudience {
  TIMETABLE_AUDIENCE_UNSPECIFIED = 0;
  // Only the owner (the default).
  TIMETABLE_AUDIENCE_NOBODY = 1;
  // The friends listed in `Term.shared_with`.
  TIMETABLE_AUDIENCE_CHOSEN = 2;
  // Every friend.
  TIMETABLE_AUDIENCE_FRIENDS = 3;
}

// Ready-made period layouts.
enum LayoutPreset {
  LAYOUT_PRESET_UNSPECIFIED = 0;
  // The periods were entered by hand.
  LAYOUT_PRESET_CUSTOM = 1;
  // High school: six 50-minute periods from 8:50, lunch after the fourth.
  LAYOUT_PRESET_HIGH_SCHOOL_6 = 2;
  // High school: seven 50-minute periods.
  LAYOUT_PRESET_HIGH_SCHOOL_7 = 3;
  // High school: seven 45-minute periods.
  LAYOUT_PRESET_HIGH_SCHOOL_7_SHORT = 4;
  // University: five 90-minute コマ from 9:00.
  LAYOUT_PRESET_UNIVERSITY_90 = 5;
  // University: five 100-minute コマ from 9:00.
  LAYOUT_PRESET_UNIVERSITY_100 = 6;
  // University: five 105-minute コマ from 8:30.
  LAYOUT_PRESET_UNIVERSITY_105 = 7;
}

// A subject of the caller's list, reused by every term, study session, exam
// and assignment.
message Subject {
  string id = 1;
  // "数学Ⅱ". Unique per account, ignoring case; 1-40 characters.
  string name = 2;
  // Short form for narrow grid cells ("数Ⅱ"), up to 8 characters; optional.
  string short_name = 3;
  // `#rrggbb`.
  string color = 4;
  // One optional emoji.
  string emoji = 5;
  // Usual teacher and room; a timetable entry may say otherwise.
  string teacher = 6;
  string room = 7;
  // Hidden from pickers; kept because sessions, exams or assignments use it.
  bool archived = 8;
  tokuly.common.v1.Timestamps timestamps = 9;
}

// What other people get to see of someone's subject.
message SubjectLabel {
  string name = 1;
  string emoji = 2;
  string color = 3;
}

// One period (コマ) of a school day.
message Period {
  // 1-based position in the day.
  int32 number = 1;
  // Minutes after local midnight; the end is after the start and periods do
  // not overlap.
  int32 start_minute = 2;
  int32 end_minute = 3;
  // Optional name ("1限", "LHR"); clients show the number when empty.
  string label = 4;
}

// The shape of a school week: the periods of a day and the weekdays with classes.
message PeriodLayout {
  // The preset this layout comes from. When creating or updating a term with
  // a preset and no `periods`, the preset's periods are filled in.
  LayoutPreset preset = 1;
  // 1 to 12 periods, numbered 1..n in order of time.
  repeated Period periods = 2;
  // Weekdays with classes; Monday to Friday when empty. Add Saturday for
  // schools with Saturday classes.
  repeated Weekday weekdays = 3;
}

message LayoutPresetInfo {
  LayoutPreset preset = 1;
  tokuly.common.v1.LocalizedText name = 2;
  tokuly.common.v1.LocalizedText description = 3;
  PeriodLayout layout = 4;
}

// A term (学期): 前期 / 後期, 1学期..3学期, a quarter.
message Term {
  string id = 1;
  string owner_id = 2;
  // "2026年度 前期"; 1-40 characters.
  string name = 3;
  // First and last day, inclusive. Days outside every term have no classes;
  // where terms overlap, the current one wins, then the one starting later.
  string start_date = 4;
  string end_date = 5;
  // The term the timetable screen opens with. At most one per account.
  bool current = 6;
  PeriodLayout layout = 7;
  // The timetable alternates between week A and week B.
  bool alternating_weeks = 8;
  // Any date inside a week that runs as week A; weeks alternate from there.
  // Single weeks can be pinned with a day override.
  string week_a_date = 9;
  // Japanese public holidays (祝日, 振替休日) are days off unless a day
  // override says otherwise. Default true.
  bool observe_public_holidays = 10;
  TimetableAudience audience = 11;
  // The chosen friends of a CHOSEN audience. Owner only.
  repeated tokuly.common.v1.UserSummary shared_with = 12;
  // The classmate this term was copied from, if any. Owner only.
  tokuly.common.v1.UserSummary copied_from = 13;
  // Classes in the weekly grid.
  int32 entry_count = 14;
  tokuly.common.v1.Timestamps timestamps = 15;
}

// A class in the weekly grid of a term.
message TimetableEntry {
  string id = 1;
  string term_id = 2;
  Weekday weekday = 3;
  int32 period = 4;
  WeekPattern week_pattern = 5;
  Subject subject = 6;
  // Set when this class differs from the subject's usual teacher, room or
  // colour; empty means "as the subject says".
  string teacher = 7;
  string room = 8;
  string color = 9;
  // Private note; never shown to friends.
  string memo = 10;
}

enum ChangeKind {
  CHANGE_KIND_UNSPECIFIED = 0;
  // 休講: the class in this slot does not take place.
  CHANGE_KIND_CANCELLED = 1;
  // The class in this slot takes place at `to_date` / `to_period` instead.
  CHANGE_KIND_MOVED = 2;
  // Another subject takes the slot; or, without a subject, the same class
  // with a different teacher or room (教室変更).
  CHANGE_KIND_REPLACED = 3;
  // 補講: an additional class in a slot that may be empty otherwise.
  CHANGE_KIND_EXTRA = 4;
}

// A one-off change of the timetable on one date.
message TimetableChange {
  string id = 1;
  string term_id = 2;
  string date = 3;
  int32 period = 4;
  ChangeKind kind = 5;
  // REPLACED / EXTRA: the subject taking place.
  Subject subject = 6;
  // REPLACED / EXTRA: teacher and room of that class, when not the subject's usual ones.
  string teacher = 7;
  string room = 8;
  // Private note.
  string memo = 9;
  // MOVED: where the class goes.
  string to_date = 10;
  int32 to_period = 11;
}

enum DayOverrideKind {
  DAY_OVERRIDE_KIND_UNSPECIFIED = 0;
  // No regular classes: 夏休み, 文化祭, 創立記念日.
  DAY_OVERRIDE_KIND_HOLIDAY = 1;
  // Classes are held even on a public holiday or a weekday without classes
  // (登校日), optionally with another weekday's timetable (振替授業).
  DAY_OVERRIDE_KIND_CLASS_DAY = 2;
  // The dates run as week A or B whatever the alternation says.
  DAY_OVERRIDE_KIND_WEEK_PATTERN = 3;
}

// A rule for a date or a range of dates of a term. Where several apply to
// the same date, the shortest range wins, then the newest.
message DayOverride {
  string id = 1;
  string term_id = 2;
  // First and last date, inclusive.
  string start_date = 3;
  string end_date = 4;
  DayOverrideKind kind = 5;
  // "夏休み", "月曜授業"; optional, up to 40 characters.
  string name = 6;
  // CLASS_DAY: the weekday whose timetable is followed; unset = the date's own.
  Weekday follows_weekday = 7;
  // WEEK_PATTERN: A or B. CLASS_DAY: optionally A or B.
  WeekPattern week_pattern = 8;
}

enum DayKind {
  DAY_KIND_UNSPECIFIED = 0;
  // Classes take place as the timetable says.
  DAY_KIND_SCHOOL_DAY = 1;
  // A weekday without classes in this term (usually the weekend).
  DAY_KIND_DAY_OFF = 2;
  // A public holiday or a holiday set with a day override.
  DAY_KIND_HOLIDAY = 3;
  // No term covers the date.
  DAY_KIND_OUT_OF_TERM = 4;
}

enum ClassStatus {
  CLASS_STATUS_UNSPECIFIED = 0;
  // Takes place as in the weekly grid.
  CLASS_STATUS_SCHEDULED = 1;
  // Does not take place (休講).
  CLASS_STATUS_CANCELLED = 2;
  // Takes place with another subject, teacher or room than usual.
  CLASS_STATUS_REPLACED = 3;
  // An extra class (補講).
  CLASS_STATUS_EXTRA = 4;
  // Does not take place here: moved to `other_date` / `other_period`.
  CLASS_STATUS_MOVED_AWAY = 5;
  // Takes place here instead of `other_date` / `other_period`.
  CLASS_STATUS_MOVED_HERE = 6;
}

// A class on a concrete date.
message ScheduledClass {
  string date = 1;
  int32 period = 2;
  google.protobuf.Timestamp starts_at = 3;
  google.protobuf.Timestamp ends_at = 4;
  int32 start_minute = 5;
  int32 end_minute = 6;
  // CANCELLED and MOVED_AWAY classes are listed so the day shows what
  // changed; they do not take place.
  ClassStatus status = 7;
  Subject subject = 8;
  // Teacher, room and colour that apply (the entry's or change's own, else
  // the subject's).
  string teacher = 9;
  string room = 10;
  string color = 11;
  // The owner's private note; empty for everyone else.
  string memo = 12;
  // The grid entry and the change this class comes from, when any.
  string entry_id = 13;
  string change_id = 14;
  // MOVED_AWAY: where the class went. MOVED_HERE: where it came from.
  string other_date = 15;
  int32 other_period = 16;
  // REPLACED: the subject that would have taken place.
  Subject original_subject = 17;
}

// One day of someone's timetable, resolved.
message TimetableDay {
  string date = 1;
  Weekday weekday = 2;
  DayKind kind = 3;
  // The term covering the date; empty when out of term.
  string term_id = 4;
  string term_name = 5;
  // Name of the holiday or day override in effect ("海の日", "月曜授業").
  string label = 6;
  // A or B in a term with alternating weeks, EVERY otherwise.
  WeekPattern week_pattern = 7;
  // The weekday whose timetable the day follows.
  Weekday follows_weekday = 8;
  // By period, then start time.
  repeated ScheduledClass classes = 9;
  // The periods of the term, to draw the day with its free slots.
  repeated Period periods = 10;
}

message ListLayoutPresetsRequest {}

message ListLayoutPresetsResponse {
  repeated LayoutPresetInfo presets = 1;
}

message ListSubjectsRequest {
  // Also return archived subjects.
  bool include_archived = 1;
}

message ListSubjectsResponse {
  repeated Subject subjects = 1;
}

message CreateSubjectRequest {
  string name = 1;
  string short_name = 2;
  string color = 3;
  string emoji = 4;
  string teacher = 5;
  string room = 6;
}

message CreateSubjectResponse {
  Subject subject = 1;
}

message UpdateSubjectRequest {
  string subject_id = 1;
  optional string name = 2;
  optional string short_name = 3;
  optional string color = 4;
  optional string emoji = 5;
  optional string teacher = 6;
  optional string room = 7;
  // Brings an archived subject back, or hides one from pickers.
  optional bool archived = 8;
}

message UpdateSubjectResponse {
  Subject subject = 1;
}

message DeleteSubjectRequest {
  string subject_id = 1;
}

message DeleteSubjectResponse {
  // True when the subject is still used by sessions, exams or assignments
  // and was archived instead of erased.
  bool archived = 1;
  // Classes removed from weekly grids.
  int32 removed_entry_count = 2;
}

message ListTermsRequest {}

message ListTermsResponse {
  repeated Term terms = 1;
}

message GetTermRequest {
  string term_id = 1;
}

message GetTermResponse {
  Term term = 1;
  repeated TimetableEntry entries = 2;
  // By date.
  repeated TimetableChange changes = 3;
  // By start date.
  repeated DayOverride day_overrides = 4;
}

message CreateTermRequest {
  string name = 1;
  string start_date = 2;
  string end_date = 3;
  // A preset, custom periods, or nothing (HIGH_SCHOOL_6, Monday to Friday).
  PeriodLayout layout = 4;
  bool alternating_weeks = 5;
  // Required with `alternating_weeks`.
  string week_a_date = 6;
  // Default true.
  optional bool observe_public_holidays = 7;
  // Default NOBODY.
  TimetableAudience audience = 8;
  // The chosen friends of a CHOSEN audience (up to 200).
  repeated string shared_with_user_ids = 9;
  // Make it the current term (always true for the first term).
  bool current = 10;
}

message CreateTermResponse {
  Term term = 1;
}

// Wrapper so "replace the list" can be told from "leave it alone".
message UserIdList {
  repeated string user_ids = 1;
}

message UpdateTermRequest {
  string term_id = 1;
  optional string name = 2;
  optional string start_date = 3;
  optional string end_date = 4;
  // Replaces the layout when set.
  PeriodLayout layout = 5;
  optional bool alternating_weeks = 6;
  optional string week_a_date = 7;
  optional bool observe_public_holidays = 8;
  // Unset (UNSPECIFIED) keeps the audience.
  TimetableAudience audience = 9;
  // Replaces the chosen friends when set.
  UserIdList shared_with = 10;
  // True makes this the current term. A term stops being current only when
  // another one becomes current.
  optional bool current = 11;
}

message UpdateTermResponse {
  Term term = 1;
  // Classes removed because the new layout has no slot for them.
  int32 removed_entry_count = 2;
}

message DeleteTermRequest {
  string term_id = 1;
}

message DeleteTermResponse {}

// A class to put into a slot.
message TimetableEntryInput {
  Weekday weekday = 1;
  int32 period = 2;
  // EVERY when unset.
  WeekPattern week_pattern = 3;
  string subject_id = 4;
  string teacher = 5;
  string room = 6;
  string color = 7;
  string memo = 8;
}

message PutTimetableEntriesRequest {
  string term_id = 1;
  // 1 to 100 classes; no two for the same slot and week.
  repeated TimetableEntryInput entries = 2;
}

message PutTimetableEntriesResponse {
  repeated TimetableEntry entries = 1;
  // Entries that were in the way and are gone now.
  repeated string replaced_entry_ids = 2;
}

message DeleteTimetableEntriesRequest {
  string term_id = 1;
  repeated string entry_ids = 2;
}

message DeleteTimetableEntriesResponse {
  int32 deleted_count = 1;
}

message CreateTimetableChangeRequest {
  string term_id = 1;
  string date = 2;
  int32 period = 3;
  ChangeKind kind = 4;
  // REPLACED (optional) / EXTRA (required).
  string subject_id = 5;
  string teacher = 6;
  string room = 7;
  string memo = 8;
  // MOVED: the new slot, inside the term.
  string to_date = 9;
  int32 to_period = 10;
}

