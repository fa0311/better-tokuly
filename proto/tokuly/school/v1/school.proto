}

// ───────────────────────────── Study rooms ─────────────────────────────

// もくもく部屋: rooms for studying side by side. Everyone in a room follows
// one shared timer, sees who is there and what they study, and can send a
// few fixed reactions — there is no chat, on purpose.
//
// Being in a room is a study session (`SessionSource.ROOM`): members send
// `StudyService.HeartbeatStudySession` like for any session, are removed
// when they fall silent, and the time the room's timer spends in a work
// phase while they are present counts as their study time. A user is in at
// most one room.
//
// A room that the caller may not enter does not exist for them
// (ROOM_NOT_FOUND). Live updates arrive as `SchoolEvent` on the realtime
// topic `study:{room_id}`, which the same people may subscribe to.
//
// Rooms can be reported (`SUBJECT_TYPE_STUDY_ROOM`) by anyone who may enter
// them, and by anyone they were put in front of — invited, inside, removed
// — also after the invitation was withdrawn or the room closed.
service StudyRoomService {
  // Opens a room and puts the caller in it as its host. The timer waits for
  // the host to start it. An active session of the caller's ends first (it
  // is logged), and a room of theirs that stands empty closes.
  // Errors: ROOM_TITLE_INVALID, AUDIENCE_INVALID, MEMBER_CAP_INVALID,
  // POMODORO_INVALID, STUDY_MODE_REQUIRED, SUBJECT_NOT_FOUND, NOT_FRIENDS
  // (an invitee), ALREADY_HOSTING (one open room per host), RATE_LIMITED.
  rpc CreateStudyRoom(CreateStudyRoomRequest) returns (CreateStudyRoomResponse);
  // A room with its members. Errors: ROOM_NOT_FOUND.
  rpc GetStudyRoom(GetStudyRoomRequest) returns (GetStudyRoomResponse);
  // Host: changes the title, the audience, the member cap or the timer's
  // lengths (which restarts the cycle). Narrowing the audience removes
  // nobody who is already inside.
  // Errors: ROOM_NOT_FOUND, NOT_HOST, ROOM_CLOSED and those of CreateStudyRoom.
  rpc UpdateStudyRoom(UpdateStudyRoomRequest) returns (UpdateStudyRoomResponse);
  // Host: closes the room for everyone; their sessions end and are logged.
  // Errors: ROOM_NOT_FOUND, NOT_HOST.
  rpc CloseStudyRoom(CloseStudyRoomRequest) returns (CloseStudyRoomResponse);
  // Open rooms: public ones, the ones of friends and invitations, or the
  // one the caller is in or hosts. Fullest first.
  // Errors: ROOM_SCOPE_REQUIRED.
  rpc ListStudyRooms(ListStudyRoomsRequest) returns (ListStudyRoomsResponse);

  // Enters a room. An active session of the caller's ends first (it is
  // logged), as does their stay in another room. Entering the room one is
  // in already changes nothing.
  // Errors: ROOM_NOT_FOUND, ROOM_CLOSED, ROOM_FULL, SUBJECT_NOT_FOUND,
  // SESSION_ALREADY_ACTIVE (another request of the caller's started a session
  // at the same moment; try again).
  rpc JoinStudyRoom(JoinStudyRoomRequest) returns (JoinStudyRoomResponse);
  // Leaves the room; the session ends and is logged. The room stays open
  // for the others, and closes by itself after being empty for a while.
  // Errors: NOT_IN_ROOM.
  rpc LeaveStudyRoom(LeaveStudyRoomRequest) returns (LeaveStudyRoomResponse);
  // Says what the caller studies now. The time so far is logged under the
  // previous subject. Errors: NOT_IN_ROOM, SUBJECT_NOT_FOUND.
  rpc SetStudyRoomSubject(SetStudyRoomSubjectRequest) returns (SetStudyRoomSubjectResponse);

  // Host: starts, pauses, resumes or resets the shared timer, or skips to
  // the next phase. Errors: ROOM_NOT_FOUND, NOT_HOST, ROOM_CLOSED,
  // TIMER_ACTION_REQUIRED, TIMER_ACTION_INVALID (pausing a timer that is not
  // running, skipping in a room without phases...).
  rpc ControlStudyRoomTimer(ControlStudyRoomTimerRequest) returns (ControlStudyRoomTimerResponse);
  // Sends one of the fixed reactions to the room, or to one member.
  // Errors: NOT_IN_ROOM, REACTION_REQUIRED, USER_NOT_IN_ROOM, RATE_LIMITED.
  rpc SendStudyRoomReaction(SendStudyRoomReactionRequest) returns (SendStudyRoomReactionResponse);

  // Host: invites friends. They are notified and may enter whatever the
  // audience is. Errors: ROOM_NOT_FOUND, NOT_HOST, ROOM_CLOSED, NO_USERS,
  // TOO_MANY_USERS, NOT_FRIENDS, RATE_LIMITED.
  rpc InviteToStudyRoom(InviteToStudyRoomRequest) returns (InviteToStudyRoomResponse);
  // Host: withdraws an invitation. Someone already inside stays. (The
  // invitee can still report the room they were invited to.)
  // Errors: ROOM_NOT_FOUND, NOT_HOST.
  rpc UninviteFromStudyRoom(UninviteFromStudyRoomRequest) returns (UninviteFromStudyRoomResponse);
  // Host: removes someone who is in the room, or was in it earlier; they
  // cannot come (back) in. Errors: ROOM_NOT_FOUND, NOT_HOST, USER_NOT_IN_ROOM
  // (never was), CANNOT_REMOVE_SELF.
  rpc RemoveStudyRoomMember(RemoveStudyRoomMemberRequest) returns (RemoveStudyRoomMemberResponse);
}

// Who may find and enter a room.
enum RoomAudience {
  ROOM_AUDIENCE_UNSPECIFIED = 0;
  // Anyone signed in; listed publicly.
  ROOM_AUDIENCE_PUBLIC = 1;
  // Friends of the host, and people the host invited.
  ROOM_AUDIENCE_FRIENDS = 2;
  // Only people the host invited.
  ROOM_AUDIENCE_INVITED = 3;
}

// The reactions a room allows instead of chat.
enum RoomReaction {
  ROOM_REACTION_UNSPECIFIED = 0;
  // がんばれ!
  ROOM_REACTION_CHEER = 1;
  // おつかれ!
  ROOM_REACTION_CLAP = 2;
  // 集中!
  ROOM_REACTION_FIRE = 3;
  // 休憩しよ
  ROOM_REACTION_COFFEE = 4;
  // やっほー / またね
  ROOM_REACTION_WAVE = 5;
}

// Someone present in a room.
message RoomMember {
  tokuly.common.v1.UserSummary user = 1;
  // What they are studying; unset when they did not say.
  SubjectLabel subject = 2;
  google.protobuf.Timestamp joined_at = 3;
  // Study time of their current session in this room, at the room timer's `server_time`.
  int32 studied_seconds = 4;
  bool host = 5;
}

message StudyRoom {
  string id = 1;
  // 1-40 characters.
  string title = 2;
  tokuly.common.v1.UserSummary host = 3;
  RoomAudience audience = 4;
  // The shared timer every member's client follows.
  TimerSnapshot timer = 5;
  // People inside, as far as the caller may know of them (see `members`).
  int32 member_count = 6;
  // 2-50.
  int32 member_cap = 7;
  // Everyone present (`GetStudyRoom`, join, create); the first few in lists.
  // People in a block with the caller are left out.
  repeated RoomMember members = 8;
  // The caller is in the room.
  bool joined = 9;
  // The host is in the room. While they are away the timer keeps running.
  bool host_present = 10;
  // The caller holds an invitation.
  bool invited = 11;
  // Host only: everyone invited.
  repeated tokuly.common.v1.UserSummary invitees = 12;
  // Realtime topic of the room: `study:{id}`.
  string topic = 13;
  google.protobuf.Timestamp created_at = 14;
  // Set once the room is closed.
  google.protobuf.Timestamp closed_at = 15;
}

message CreateStudyRoomRequest {
  string title = 1;
  // FRIENDS when unset.
  RoomAudience audience = 2;
  // POMODORO when unset. STOPWATCH is an open-ended timer.
  StudyMode mode = 3;
  // Pomodoro lengths; the host's defaults when unset.
  PomodoroConfig pomodoro = 4;
  // 2-50; the server's default when zero.
  int32 member_cap = 5;
  // What the host studies; optional.
  string subject_id = 6;
  // Friends to invite right away.
  repeated string invite_user_ids = 7;
}

message CreateStudyRoomResponse {
  StudyRoom room = 1;
  // The host's session in the room.
  StudySession session = 2;
  int32 heartbeat_interval_seconds = 3;
}

message GetStudyRoomRequest {
  string room_id = 1;
}

message GetStudyRoomResponse {
  StudyRoom room = 1;
}

message UpdateStudyRoomRequest {
  string room_id = 1;
  optional string title = 2;
  // Unset (UNSPECIFIED) keeps the audience.
  RoomAudience audience = 3;
  optional int32 member_cap = 4;
  // Unset (UNSPECIFIED) keeps the mode.
  StudyMode mode = 5;
  // Replaces the pomodoro lengths when set.
  PomodoroConfig pomodoro = 6;
}

message UpdateStudyRoomResponse {
  StudyRoom room = 1;
}

message CloseStudyRoomRequest {
  string room_id = 1;
}

message CloseStudyRoomResponse {}

enum RoomScope {
  ROOM_SCOPE_UNSPECIFIED = 0;
  // Public rooms.
  ROOM_SCOPE_PUBLIC = 1;
  // Rooms hosted by friends that the caller may enter, and rooms the caller is invited to.
  ROOM_SCOPE_FRIENDS = 2;
  // The room the caller is in and the one they host.
  ROOM_SCOPE_MINE = 3;
}

message ListStudyRoomsRequest {
  RoomScope scope = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListStudyRoomsResponse {
  repeated StudyRoom rooms = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message JoinStudyRoomRequest {
  string room_id = 1;
  // What the caller is going to study; optional.
  string subject_id = 2;
}

message JoinStudyRoomResponse {
  StudyRoom room = 1;
  StudySession session = 2;
  int32 heartbeat_interval_seconds = 3;
}

message LeaveStudyRoomRequest {}

message LeaveStudyRoomResponse {
  // The finished session.
  StudySession session = 1;
}

message SetStudyRoomSubjectRequest {
  // Empty: no subject.
  string subject_id = 1;
}

message SetStudyRoomSubjectResponse {
  // The new session under the new subject.
  StudySession session = 1;
}

enum TimerAction {
  TIMER_ACTION_UNSPECIFIED = 0;
  // Starts an idle timer.
  TIMER_ACTION_START = 1;
  TIMER_ACTION_PAUSE = 2;
  TIMER_ACTION_RESUME = 3;
  // Pomodoro: ends the current phase now.
  TIMER_ACTION_SKIP = 4;
  // Back to the first work phase, idle.
  TIMER_ACTION_RESET = 5;
}

message ControlStudyRoomTimerRequest {
  string room_id = 1;
  TimerAction action = 2;
}

message ControlStudyRoomTimerResponse {
  TimerSnapshot timer = 1;
}

message SendStudyRoomReactionRequest {
  RoomReaction reaction = 1;
  // A member to address; the whole room when empty.
  string to_user_id = 2;
}

message SendStudyRoomReactionResponse {}

message InviteToStudyRoomRequest {
  string room_id = 1;
  // 1 to 50 friends.
  repeated string user_ids = 2;
}

message InviteToStudyRoomResponse {
  // Everyone invited to the room now.
  repeated tokuly.common.v1.UserSummary invitees = 1;
}

message UninviteFromStudyRoomRequest {
  string room_id = 1;
  string user_id = 2;
}

message UninviteFromStudyRoomResponse {}

message RemoveStudyRoomMemberRequest {
  string room_id = 1;
  string user_id = 2;
}

message RemoveStudyRoomMemberResponse {}

// ───────────────────────────── Exams ─────────────────────────────

// Exam periods (定期テスト) with their subjects, countdowns and private
// results. Everything here is private to the caller except the optional
// "テスト期間" marker on the profile (`Exam.show_on_profile`), which friends see.
service ExamService {
  // The caller's exams: upcoming and ongoing ones first (soonest first),
  // then finished ones (latest first).
  rpc ListExams(ListExamsRequest) returns (ListExamsResponse);
  // One exam with its subjects. Errors: EXAM_NOT_FOUND.
  rpc GetExam(GetExamRequest) returns (GetExamResponse);
  // Creates an exam period. Errors: EXAM_NAME_INVALID, DATE_RANGE_INVALID
  // (end before start, or longer than 60 days), TEXT_TOO_LONG, EXAM_LIMIT_REACHED.
  rpc CreateExam(CreateExamRequest) returns (CreateExamResponse);
  // Errors: EXAM_NOT_FOUND and those of CreateExam.
  rpc UpdateExam(UpdateExamRequest) returns (UpdateExamResponse);
  // Deletes an exam with its subjects and results. Errors: EXAM_NOT_FOUND.
  rpc DeleteExam(DeleteExamRequest) returns (DeleteExamResponse);
  // Adds a subject to an exam, or changes one (date, period, what is covered).
  // An exam has each subject once.
  // Errors: EXAM_NOT_FOUND, EXAM_SUBJECT_NOT_FOUND, SUBJECT_NOT_FOUND,
  // EXAM_SUBJECT_EXISTS, DATE_OUTSIDE_EXAM, PERIOD_INVALID, TEXT_TOO_LONG,
  // EXAM_SUBJECT_LIMIT_REACHED.
  rpc PutExamSubject(PutExamSubjectRequest) returns (PutExamSubjectResponse);
  // Removes a subject and its result from an exam.
  // Errors: EXAM_SUBJECT_NOT_FOUND.
  rpc DeleteExamSubject(DeleteExamSubjectRequest) returns (DeleteExamSubjectResponse);
  // Records (or clears) the private result of one subject.
  // Errors: EXAM_SUBJECT_NOT_FOUND, RESULT_INVALID, TEXT_TOO_LONG.
  rpc SetExamResult(SetExamResultRequest) returns (SetExamResultResponse);
}

enum ExamStatus {
  EXAM_STATUS_UNSPECIFIED = 0;
  EXAM_STATUS_UPCOMING = 1;
  EXAM_STATUS_ONGOING = 2;
  EXAM_STATUS_FINISHED = 3;
}

// The caller's private note of how a test went.
message ExamResult {
  optional int32 score = 1;
  // 100 when zero.
  int32 max_score = 2;
  // Class or year average, when known.
  optional double average = 3;
  // Rank in the class or year, when known.
  optional int32 rank = 4;
  string memo = 5;
}

// One test of an exam period.
message ExamSubject {
  string id = 1;
  string exam_id = 2;
  Subject subject = 3;
  // The day of the test; empty until it is announced.
  string date = 4;
  // The period it takes place in (0 = not known).
  int32 period = 5;
  // What it covers (テスト範囲).
  string scope = 6;
  // Unset until a result is recorded.
  ExamResult result = 7;
}

// An exam period: 中間テスト, 期末テスト, 模試.
message Exam {
  string id = 1;
  // 1-40 characters.
  string name = 2;
  // First and last day, inclusive.
  string start_date = 3;
  string end_date = 4;
  ExamStatus status = 5;
  // Days until the first day (0 once it has begun).
  int32 days_until_start = 6;
  // Days until the last day is over, today included (0 once finished).
  int32 days_left = 7;
  // Shows "テスト期間" with the countdown on the profile to friends, from
  // two weeks before the first day until the last. Default false.
  bool show_on_profile = 8;
  string memo = 9;
  // By date, then period.
  repeated ExamSubject subjects = 10;
  tokuly.common.v1.Timestamps timestamps = 11;
}

message ListExamsRequest {}

message ListExamsResponse {
  repeated Exam exams = 1;
}

message GetExamRequest {
  string exam_id = 1;
}

message GetExamResponse {
  Exam exam = 1;
}

message CreateExamRequest {
  string name = 1;
  string start_date = 2;
  // The start date when empty.
  string end_date = 3;
  bool show_on_profile = 4;
  string memo = 5;
}

message CreateExamResponse {
  Exam exam = 1;
}

message UpdateExamRequest {
  string exam_id = 1;
  optional string name = 2;
  optional string start_date = 3;
  optional string end_date = 4;
  optional bool show_on_profile = 5;
  optional string memo = 6;
}

message UpdateExamResponse {
  Exam exam = 1;
}

message DeleteExamRequest {
  string exam_id = 1;
}

message DeleteExamResponse {}

message PutExamSubjectRequest {
  string exam_id = 1;
  // Change this exam subject; add a new one when empty.
  string exam_subject_id = 2;
  string subject_id = 3;
  string date = 4;
  int32 period = 5;
  string scope = 6;
}

message PutExamSubjectResponse {
  ExamSubject exam_subject = 1;
}

message DeleteExamSubjectRequest {
  string exam_subject_id = 1;
}

message DeleteExamSubjectResponse {}

message SetExamResultRequest {
  string exam_subject_id = 1;
  // Unset clears the result.
  ExamResult result = 2;
}

message SetExamResultResponse {
  ExamSubject exam_subject = 1;
}

// ───────────────────────────── Assignments ─────────────────────────────

// Homework and reports with due times. Private to the caller. Unless
// switched off (`SchoolSettings.assignment_reminders`, `Assignment.remind`),
// `school.assignment_due` reminds on the evening before and one hour before
// an assignment is due.
service AssignmentService {
  // The caller's assignments by urgency: open ones first, soonest (and
  // overdue) first; finished ones after them, most recently finished first.
  rpc ListAssignments(ListAssignmentsRequest) returns (ListAssignmentsResponse);
  // Errors: ASSIGNMENT_TITLE_INVALID, DUE_REQUIRED, DUE_INVALID (more than
  // two years away), SUBJECT_NOT_FOUND, TEXT_TOO_LONG, ASSIGNMENT_LIMIT_REACHED.
  rpc CreateAssignment(CreateAssignmentRequest) returns (CreateAssignmentResponse);
  // Changes an assignment or ticks it off. Errors: ASSIGNMENT_NOT_FOUND and
  // those of CreateAssignment.
  rpc UpdateAssignment(UpdateAssignmentRequest) returns (UpdateAssignmentResponse);
  // Errors: ASSIGNMENT_NOT_FOUND.
  rpc DeleteAssignment(DeleteAssignmentRequest) returns (DeleteAssignmentResponse);
}

// How pressing an assignment is, by the caller's calendar.
enum AssignmentUrgency {
  ASSIGNMENT_URGENCY_UNSPECIFIED = 0;
  // Past due and not done.
  ASSIGNMENT_URGENCY_OVERDUE = 1;
  ASSIGNMENT_URGENCY_TODAY = 2;
  ASSIGNMENT_URGENCY_TOMORROW = 3;
  // Due within seven days.
  ASSIGNMENT_URGENCY_THIS_WEEK = 4;
  ASSIGNMENT_URGENCY_LATER = 5;
  ASSIGNMENT_URGENCY_DONE = 6;
}

message Assignment {
  string id = 1;
  // 1-80 characters.
  string title = 2;
  // Optional.
  Subject subject = 3;
  google.protobuf.Timestamp due_at = 4;
  bool done = 5;
  google.protobuf.Timestamp done_at = 6;
  string memo = 7;
  AssignmentUrgency urgency = 8;
  // Send reminders for this assignment (default true).
  bool remind = 9;
  tokuly.common.v1.Timestamps timestamps = 10;
}

enum AssignmentFilter {
  // Same as OPEN.
  ASSIGNMENT_FILTER_UNSPECIFIED = 0;
  ASSIGNMENT_FILTER_OPEN = 1;
  ASSIGNMENT_FILTER_DONE = 2;
  ASSIGNMENT_FILTER_ALL = 3;
}

message ListAssignmentsRequest {
  AssignmentFilter filter = 1;
  // Only assignments of this subject.
  string subject_id = 2;
  tokuly.common.v1.PageRequest page = 3;
}

message ListAssignmentsResponse {
  repeated Assignment assignments = 1;
  tokuly.common.v1.PageInfo page = 2;
  // Open assignments in total, and how many of them are overdue.
  int32 open_count = 3;
  int32 overdue_count = 4;
}

message CreateAssignmentRequest {
  string title = 1;
  string subject_id = 2;
  google.protobuf.Timestamp due_at = 3;
  string memo = 4;
  // Default true.
  optional bool remind = 5;
}

message CreateAssignmentResponse {
  Assignment assignment = 1;
}

message UpdateAssignmentRequest {
  string assignment_id = 1;
  optional string title = 2;
  // An empty string clears the subject.
  optional string subject_id = 3;
  // Replaces the due time when set.
  google.protobuf.Timestamp due_at = 4;
  optional string memo = 5;
  optional bool done = 6;
  optional bool remind = 7;
}

message UpdateAssignmentResponse {
  Assignment assignment = 1;
}

message DeleteAssignmentRequest {
  string assignment_id = 1;
}

message DeleteAssignmentResponse {}

// ───────────────────────────── Realtime ─────────────────────────────

// Pushed over the realtime gateway (tokuly.realtime.v1.ServerFrame.school).
//
// User-scoped (every device of the user): `session`, `friend_studying`,
// `cheer`, `room_invitation`, `room_left`.
// Topic `study:{room_id}`: `room_timer`, `room_member_joined`,
// `room_member_left`, `room_member_updated`, `room_reaction`, `room_updated`,
// `room_closed`.
message SchoolEvent {
  oneof event {
    // The user's own session changed: started, paused, resumed, a phase was
    // skipped, stopped (possibly by the server), or re-labelled.
    StudySession session = 1;
    // A friend started or stopped studying, or paused or resumed.
    FriendStudying friend_studying = 2;
    // A friend cheered the user on.
    StudyCheer cheer = 3;
    // The user was invited to a study room.
    StudyRoom room_invitation = 4;
    // The user is no longer in a room without having left it themselves.
    RoomLeft room_left = 5;

    // The shared timer changed: the host acted, or a phase ended.
    TimerSnapshot room_timer = 10;
    RoomMember room_member_joined = 11;
    RoomMemberLeft room_member_left = 12;
    // A member changed what they study.
    RoomMember room_member_updated = 13;
    RoomReactionSent room_reaction = 14;
    // Title, audience or member cap changed (`members` is not filled).
    StudyRoom room_updated = 15;
    RoomClosed room_closed = 16;
  }
}

message FriendStudying {
  string user_id = 1;
  // False: they stopped; `friend` is unset.
  bool studying = 2;
  StudyingFriend friend = 3;
}

enum RoomLeaveReason {
  ROOM_LEAVE_REASON_UNSPECIFIED = 0;
  // They left.
  ROOM_LEAVE_REASON_LEFT = 1;
  // Their client stopped sending heartbeats.
  ROOM_LEAVE_REASON_IDLE = 2;
  // The host removed them (or a block or unfriending made them leave).
  ROOM_LEAVE_REASON_REMOVED = 3;
  // The room closed.
  ROOM_LEAVE_REASON_CLOSED = 4;
}

message RoomLeft {
  string room_id = 1;
  RoomLeaveReason reason = 2;
  // The session that ended with it.
  StudySession session = 3;
}

message RoomMemberLeft {
  string user_id = 1;
  RoomLeaveReason reason = 2;
  int32 member_count = 3;
}

message RoomReactionSent {
  tokuly.common.v1.UserSummary from = 1;
  RoomReaction reaction = 2;
  // The member it is addressed to; empty for the whole room.
  string to_user_id = 3;
}

enum RoomCloseReason {
  ROOM_CLOSE_REASON_UNSPECIFIED = 0;
  // The host closed it.
  ROOM_CLOSE_REASON_HOST = 1;
  // Nobody was in it for a while.
  ROOM_CLOSE_REASON_EMPTY = 2;
  // Taken down by moderation, or the host's account is gone.
  ROOM_CLOSE_REASON_REMOVED = 3;
}

message RoomClosed {
  string room_id = 1;
  RoomCloseReason reason = 2;
}
