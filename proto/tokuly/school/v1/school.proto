// ───────────────────────────── Study sessions ─────────────────────────────

// The focus timer and the study log.
//
// A user has at most one active session. While it is active the client sends
// `HeartbeatStudySession` at least every `heartbeat_interval_seconds`; the
// server counts study time up to the last heartbeat only. A session that
// stays silent for the idle limit is stopped by the server and keeps the
// time counted until its last heartbeat.
service StudyService {
  // Starts the timer: a stopwatch or a pomodoro. Joining a study room starts
  // a session too (`StudyRoomService.JoinStudyRoom`).
  // Errors: SESSION_ALREADY_ACTIVE, STUDY_MODE_REQUIRED, POMODORO_INVALID,
  // SUBJECT_NOT_FOUND, TEXT_TOO_LONG.
  rpc StartStudySession(StartStudySessionRequest) returns (StartStudySessionResponse);
  // Pauses the caller's timer. Errors: NO_ACTIVE_SESSION, SESSION_NOT_RUNNING,
  // ROOM_SESSION (the room's host controls a room's timer).
  rpc PauseStudySession(PauseStudySessionRequest) returns (PauseStudySessionResponse);
  // Continues a paused timer. Errors: NO_ACTIVE_SESSION, SESSION_NOT_PAUSED,
  // ROOM_SESSION.
  rpc ResumeStudySession(ResumeStudySessionRequest) returns (ResumeStudySessionResponse);
  // Ends the caller's session and logs it. A session in a study room ends by
  // leaving the room, which this does too. Errors: NO_ACTIVE_SESSION.
  rpc StopStudySession(StopStudySessionRequest) returns (StopStudySessionResponse);
  // "Still here": counts the time since the last heartbeat. Returns the
  // session; `state` is ENDED with `auto_stopped` when the server gave up on
  // it in the meantime. Errors: NO_ACTIVE_SESSION.
  rpc HeartbeatStudySession(HeartbeatStudySessionRequest) returns (HeartbeatStudySessionResponse);
  // Pomodoro: ends the current work or break phase now.
  // Errors: NO_ACTIVE_SESSION, NOT_POMODORO, SESSION_NOT_RUNNING, ROOM_SESSION.
  rpc SkipStudyPhase(SkipStudyPhaseRequest) returns (SkipStudyPhaseResponse);
  // The caller's active session, if any (to restore the timer on another
  // device). Not a heartbeat.
  rpc GetCurrentStudySession(GetCurrentStudySessionRequest) returns (GetCurrentStudySessionResponse);

  // Logs study time after the fact. Errors: TIME_RANGE_INVALID (not in the
  // past, end before start, longer than 24 hours, older than 2 years),
  // SESSION_OVERLAPS (study time is already logged in that window),
  // SUBJECT_NOT_FOUND, TEXT_TOO_LONG.
  rpc LogStudySession(LogStudySessionRequest) returns (LogStudySessionResponse);
  // Changes the subject or memo of a session, or the start and end of a
  // finished one. Errors: SESSION_NOT_FOUND, SESSION_ACTIVE (times of a
  // session that is still running), ROOM_SESSION (the subject of a stay in a
  // study room changes with `SetStudyRoomSubject`), TIME_RANGE_INVALID,
  // SESSION_OVERLAPS, SUBJECT_NOT_FOUND, TEXT_TOO_LONG.
  rpc UpdateStudySession(UpdateStudySessionRequest) returns (UpdateStudySessionResponse);
  // Deletes a finished session from the log. Errors: SESSION_NOT_FOUND,
  // SESSION_ACTIVE.
  rpc DeleteStudySession(DeleteStudySessionRequest) returns (DeleteStudySessionResponse);
  // The caller's study log, newest first.
  rpc ListStudySessions(ListStudySessionsRequest) returns (ListStudySessionsResponse);

  // Study time of a day, week or month: the total, each day and each
  // subject. A session across midnight counts towards both days.
  // Errors: STATS_PERIOD_REQUIRED.
  rpc GetStudySummary(GetStudySummaryRequest) returns (GetStudySummaryResponse);
  // Today against the daily goal, and the streak.
  rpc GetStudyProgress(GetStudyProgressRequest) returns (GetStudyProgressResponse);
  // Study time per day for a year, for a contribution-graph calendar. The
  // caller's, or a friend's who shows their studying to friends.
  // Errors: STUDY_NOT_SHARED.
  rpc GetStudyHeatmap(GetStudyHeatmapRequest) returns (GetStudyHeatmapResponse);

  // Friends who are studying right now and show it, longest session first.
  rpc ListStudyingFriends(ListStudyingFriendsRequest) returns (ListStudyingFriendsResponse);
  // This week's (or another week's) study time among the caller and the
  // friends who joined the ranking. Only time the server timed counts (the
  // timer and study rooms): sessions logged by hand (`SessionSource.MANUAL`)
  // show in one's own totals and are left out here. Empty with
  // `joined = false` until the caller joins (`SchoolSettings.join_ranking`).
  rpc GetStudyRanking(GetStudyRankingRequest) returns (GetStudyRankingResponse);
  // Sends "がんばれ!" to a friend who is studying. Quiet: a realtime event,
  // and a notification only if the friend asked for those.
  // Errors: NOT_STUDYING (not a friend, not studying, or not showing it),
  // CANNOT_CHEER_SELF, RATE_LIMITED (one cheer per friend every few minutes).
  rpc CheerStudy(CheerStudyRequest) returns (CheerStudyResponse);
  // Cheers received during one of the caller's sessions, newest first.
  // Errors: SESSION_NOT_FOUND.
  rpc ListStudyCheers(ListStudyCheersRequest) returns (ListStudyCheersResponse);
}

enum StudyMode {
  STUDY_MODE_UNSPECIFIED = 0;
  // Counts up until stopped.
  STUDY_MODE_STOPWATCH = 1;
  // Work phases separated by breaks; only the work counts as study time.
  STUDY_MODE_POMODORO = 2;
}

// Lengths of a pomodoro cycle.
message PomodoroConfig {
  // 1-180; 25 when zero.
  int32 work_minutes = 1;
  // 1-60; 5 when zero.
  int32 break_minutes = 2;
  // The break after every `rounds` work phases, 1-120; 15 when zero.
  int32 long_break_minutes = 3;
  // Work phases before the long break, 1-12; 4 when zero.
  int32 rounds = 4;
}

enum TimerState {
  TIMER_STATE_UNSPECIFIED = 0;
  // Not started yet (study rooms only).
  TIMER_STATE_IDLE = 1;
  TIMER_STATE_RUNNING = 2;
  TIMER_STATE_PAUSED = 3;
}

enum TimerPhase {
  TIMER_PHASE_UNSPECIFIED = 0;
  // Study time. A stopwatch is always in this phase.
  TIMER_PHASE_WORK = 1;
  TIMER_PHASE_BREAK = 2;
  TIMER_PHASE_LONG_BREAK = 3;
}

// A timer as the server sees it at `server_time`. Clients compute their
// offset to the server clock from `server_time` and render the countdown
// from `phase_ends_at`; while RUNNING the phases follow each other by
// themselves according to `pomodoro`.
message TimerSnapshot {
  StudyMode mode = 1;
  // Set for pomodoro timers.
  PomodoroConfig pomodoro = 2;
  TimerState state = 3;
  TimerPhase phase = 4;
  // 1-based count of work phases, including the current or upcoming one.
  int32 round = 5;
  // RUNNING pomodoro: when the current phase began (shifted by pauses) and ends.
  google.protobuf.Timestamp phase_started_at = 6;
  google.protobuf.Timestamp phase_ends_at = 7;
  // Pomodoro: time left in the current phase.
  int32 phase_remaining_seconds = 8;
  // Position on the timer's timeline: the time it has been running, pauses
  // excluded and breaks included (skipping a phase jumps ahead).
  int32 elapsed_seconds = 9;
  // The server's clock when this snapshot was taken.
  google.protobuf.Timestamp server_time = 10;
}

enum SessionState {
  SESSION_STATE_UNSPECIFIED = 0;
  SESSION_STATE_RUNNING = 1;
  SESSION_STATE_PAUSED = 2;
  SESSION_STATE_ENDED = 3;
}

enum SessionSource {
  SESSION_SOURCE_UNSPECIFIED = 0;
  // The caller's own timer.
  SESSION_SOURCE_TIMER = 1;
  // Time spent in a study room, following the room's timer.
  SESSION_SOURCE_ROOM = 2;
  // Logged afterwards by hand.
  SESSION_SOURCE_MANUAL = 3;
}

// One stretch of studying.
message StudySession {
  string id = 1;
  SessionState state = 2;
  SessionSource source = 3;
  // Unset for "no subject".
  Subject subject = 4;
  // Private note ("p.42-58").
  string memo = 5;
  google.protobuf.Timestamp started_at = 6;
  google.protobuf.Timestamp ended_at = 7;
  // Study time counted so far: pauses and pomodoro breaks excluded. For an
  // active session this is the value at `timer.server_time`.
  int32 studied_seconds = 8;
  // Active sessions: the timer to render. A room session shows the room's timer.
  TimerSnapshot timer = 9;
  // The study room the session takes place in, if any.
  string room_id = 10;
  // The server ended the session because heartbeats stopped (or the pause
  // or the session ran too long).
  bool auto_stopped = 11;
  // Cheers received during the session.
  int32 cheer_count = 12;
}

message StartStudySessionRequest {
  StudyMode mode = 1;
  // Pomodoro lengths; the caller's defaults when unset.
  PomodoroConfig pomodoro = 2;
  // Optional.
  string subject_id = 3;
  string memo = 4;
}

message StartStudySessionResponse {
  StudySession session = 1;
  // Send a heartbeat at least this often.
  int32 heartbeat_interval_seconds = 2;
  // Silence after which the server stops the session.
  int32 idle_timeout_seconds = 3;
}

message PauseStudySessionRequest {}

message PauseStudySessionResponse {
  StudySession session = 1;
}

message ResumeStudySessionRequest {}

message ResumeStudySessionResponse {
  StudySession session = 1;
}

message StopStudySessionRequest {
  // Replaces the memo when set.
  optional string memo = 1;
}

message StopStudySessionResponse {
  StudySession session = 1;
  // The day's progress after this session.
  StudyProgress progress = 2;
}

message HeartbeatStudySessionRequest {}

message HeartbeatStudySessionResponse {
  StudySession session = 1;
  int32 heartbeat_interval_seconds = 2;
}

message SkipStudyPhaseRequest {}

message SkipStudyPhaseResponse {
  StudySession session = 1;
}

message GetCurrentStudySessionRequest {}

message GetCurrentStudySessionResponse {
  // Unset when the caller is not studying.
  StudySession session = 1;
  int32 heartbeat_interval_seconds = 2;
  int32 idle_timeout_seconds = 3;
}

message LogStudySessionRequest {
  google.protobuf.Timestamp started_at = 1;
  google.protobuf.Timestamp ended_at = 2;
  string subject_id = 3;
  string memo = 4;
}

message LogStudySessionResponse {
  StudySession session = 1;
}

message UpdateStudySessionRequest {
  string session_id = 1;
  // An empty string clears the subject.
  optional string subject_id = 2;
  optional string memo = 3;
  // Finished sessions only; both together. A session logged by hand then
  // counts as one uninterrupted stretch between them. A session the server
  // timed can only be shortened: the new start and end must lie within the
  // time it counted (TIME_RANGE_INVALID otherwise), and pauses and breaks
  // inside stay uncounted.
  google.protobuf.Timestamp started_at = 4;
  google.protobuf.Timestamp ended_at = 5;
}

message UpdateStudySessionResponse {
  StudySession session = 1;
}

message DeleteStudySessionRequest {
  string session_id = 1;
}

message DeleteStudySessionResponse {}

message ListStudySessionsRequest {
  tokuly.common.v1.PageRequest page = 1;
  // Only sessions of this subject.
  string subject_id = 2;
  // Only sessions started on or after / on or before these dates.
  string from_date = 3;
  string to_date = 4;
}

message ListStudySessionsResponse {
  repeated StudySession sessions = 1;
  tokuly.common.v1.PageInfo page = 2;
}

enum StatsPeriod {
  STATS_PERIOD_UNSPECIFIED = 0;
  STATS_PERIOD_DAY = 1;
  // Monday to Sunday.
  STATS_PERIOD_WEEK = 2;
  STATS_PERIOD_MONTH = 3;
}

message DayTotal {
  string date = 1;
  int32 seconds = 2;
}

message SubjectTotal {
  // Unset for time without a subject.
  Subject subject = 1;
  int32 seconds = 2;
}

message GetStudySummaryRequest {
  StatsPeriod period = 1;
  // Any date inside the period; today when empty.
  string anchor_date = 2;
}

message GetStudySummaryResponse {
  // First and last day of the period, inclusive.
  string start_date = 1;
  string end_date = 2;
  int32 total_seconds = 3;
  // The period before, for "先週より+2時間".
  int32 previous_total_seconds = 4;
  // Every day of the period, including days without study.
  repeated DayTotal days = 5;
  // Most studied first.
  repeated SubjectTotal subjects = 6;
}

// Today against the goal, and the streak.
message StudyProgress {
  string date = 1;
  int32 today_seconds = 2;
  // The daily goal (0 = none).
  int32 goal_minutes = 3;
  bool goal_reached = 4;
  // Consecutive days, ending today or yesterday, on which the goal was
  // reached — or, without a goal, on which the user studied at all.
  int32 streak_days = 5;
  int32 longest_streak_days = 6;
  // Monday until today.
  int32 week_seconds = 7;
  // Everything ever logged.
  int64 total_seconds = 8;
}

message GetStudyProgressRequest {}

message GetStudyProgressResponse {
  StudyProgress progress = 1;
}

message GetStudyHeatmapRequest {
  // A friend; the caller when empty.
  string user_id = 1;
  // Last day of the calendar; today when empty.
  string end_date = 2;
  // Days covered, ending at `end_date`: 1-371, 365 when zero.
  int32 days = 3;
}

message GetStudyHeatmapResponse {
  string start_date = 1;
  string end_date = 2;
  // Days with study time only.
  repeated DayTotal days = 3;
  // The busiest day's time, to scale the colours.
  int32 max_seconds = 4;
  int32 total_seconds = 5;
}

// A friend who is studying right now.
message StudyingFriend {
  tokuly.common.v1.UserSummary user = 1;
  string session_id = 2;
  // RUNNING or PAUSED.
  SessionState state = 3;
  // Unset when they study without a subject.
  SubjectLabel subject = 4;
  google.protobuf.Timestamp started_at = 5;
  // Study time of this session at `server_time`.
  int32 studied_seconds = 6;
  // WORK, or a break of their pomodoro.
  TimerPhase phase = 7;
  // The study room they are in, when the caller may enter it.
  string room_id = 8;
  string room_title = 9;
  google.protobuf.Timestamp server_time = 10;
}

message ListStudyingFriendsRequest {}

message ListStudyingFriendsResponse {
  repeated StudyingFriend friends = 1;
}

message GetStudyRankingRequest {
  // Any date inside the week; today when empty.
  string anchor_date = 1;
}

message RankingEntry {
  // 1-based; equal times share a rank.
  int32 rank = 1;
  tokuly.common.v1.UserSummary user = 2;
  int32 seconds = 3;
  bool me = 4;
}

message GetStudyRankingResponse {
  // Whether the caller takes part. False: `entries` is empty.
  bool joined = 1;
  string start_date = 2;
  string end_date = 3;
  // Most study time first; up to 100.
  repeated RankingEntry entries = 4;
}

message CheerStudyRequest {
  string user_id = 1;
}

// "がんばれ!" from a friend.
message StudyCheer {
  string id = 1;
  tokuly.common.v1.UserSummary from = 2;
  string session_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message CheerStudyResponse {
  StudyCheer cheer = 1;
}

message ListStudyCheersRequest {
  string session_id = 1;
