// ───────────────────────────── Muting ─────────────────────────────

// What the caller does not want to see in timelines: muted words (plain, or
// regular expressions run by a linear-time engine), conversations they
// muted (no notifications from replies and mentions in them), and people
// whose renotes they hide. Muting accounts themselves is the social domain's
// (tokuly.social.v1 follow mutes), which timelines apply too. Only the caller
// ever sees their mutes. Every RPC needs a signed-in caller.
service NoteMuteService {
  rpc GetMuteSettings(GetMuteSettingsRequest) returns (GetMuteSettingsResponse);
  // Replaces the muted words. At most 100, each 1–100 characters; a regular
  // expression must compile within the engine's size limit.
  // Errors: TOO_MANY_MUTED_WORDS, INVALID_MUTED_WORD.
  rpc UpdateMutedWords(UpdateMutedWordsRequest) returns (UpdateMutedWordsResponse);
  // Mutes the conversation a note is in. Errors: NOTE_NOT_FOUND,
  // TOO_MANY_MUTED_THREADS (1000).
  rpc MuteThread(MuteThreadRequest) returns (MuteThreadResponse);
  rpc UnmuteThread(UnmuteThreadRequest) returns (UnmuteThreadResponse);
  // Errors: USER_NOT_FOUND, TOO_MANY_RENOTE_MUTES (1000).
  rpc HideRenotesFrom(HideRenotesFromRequest) returns (HideRenotesFromResponse);
  rpc ShowRenotesFrom(ShowRenotesFromRequest) returns (ShowRenotesFromResponse);
}

message MutedWord {
  string text = 1;
  // `text` is a regular expression (case-insensitive), not a plain word.
  bool regex = 2;
}

message GetMuteSettingsRequest {}

message GetMuteSettingsResponse {
  repeated MutedWord words = 1;
  // People whose renotes are hidden.
  repeated tokuly.common.v1.UserSummary renotes_hidden_from = 2;
  // Root notes of muted conversations (newest first, at most 100).
  repeated string muted_thread_ids = 3;
}

message UpdateMutedWordsRequest {
  repeated MutedWord words = 1;
}

message UpdateMutedWordsResponse {
  repeated MutedWord words = 1;
}

message MuteThreadRequest {
  string note_id = 1;
}

message MuteThreadResponse {}

message UnmuteThreadRequest {
  string note_id = 1;
}

message UnmuteThreadResponse {}

message HideRenotesFromRequest {
  string user_id = 1;
}

message HideRenotesFromResponse {}

message ShowRenotesFromRequest {
  string user_id = 1;
}

message ShowRenotesFromResponse {}

// ───────────────────────────── Stories ─────────────────────────────

// Stories (記憶): a title plus 1–10 photos or videos, shown to the owner's
// friends for 24 hours and then kept in the owner's archive.
//
// Who may see a story:
// - the owner, always (the archive);
// - friends of the owner (never across a block), while the story is live
//   or for as long as the owner keeps it in a highlight — and, for a
//   CLOSE_FRIENDS story, only the friends the owner chose.
// Everyone else gets STORY_NOT_FOUND. Every RPC needs a signed-in caller.
// Replies to a story are ordinary direct messages (tokuly.chat.v1) that
// quote it.
service StoryService {
  // Posts a story.
  // Errors: STORY_EMPTY, TOO_MANY_ITEMS (more than 10), TITLE_TOO_LONG,
  // CAPTION_TOO_LONG, ATTACHMENT_UNSUPPORTED (not an image or a video),
  // ASSET_NOT_FOUND, ASSET_WRONG_PURPOSE, ASSET_NOT_READY, ASSET_FAILED,
  // AUDIENCE_EMPTY, AUDIENCE_TOO_LARGE, AUDIENCE_NOT_FRIENDS,
  // INVALID_IDEMPOTENCY_KEY, REQUEST_IN_PROGRESS, RATE_LIMITED.
  rpc CreateStory(CreateStoryRequest) returns (CreateStoryResponse);
  // Deletes one of the caller's stories, live or archived, from everywhere
  // (highlights included). Errors: STORY_NOT_FOUND.
  rpc DeleteStory(DeleteStoryRequest) returns (DeleteStoryResponse);
  // One story. Errors: STORY_NOT_FOUND.
  rpc GetStory(GetStoryRequest) returns (GetStoryResponse);
  // The story tray: the caller and every friend with live stories the
  // caller may see. The caller's own reel comes first, then friends with
  // stories the caller has not seen, then the rest; newest first within
  // each group.
  rpc GetStoryTray(GetStoryTrayRequest) returns (GetStoryTrayResponse);
  // The live stories of one user that the caller may see, oldest first
  // (the order they play in). Empty when there are none to show.
  rpc ListUserStories(ListUserStoriesRequest) returns (ListUserStoriesResponse);
  // Records that the caller watched a story. The first time counts as a
  // view and adds the caller to the owner's viewer list; the owner's own
  // views are ignored. Errors: STORY_NOT_FOUND.
  rpc MarkStoryViewed(MarkStoryViewedRequest) returns (MarkStoryViewedResponse);
  // Who watched one of the caller's stories and how they reacted, most
  // recent first. Errors: STORY_NOT_FOUND (also for other people's stories).
  rpc ListStoryViewers(ListStoryViewersRequest) returns (ListStoryViewersResponse);
  // Reacts to a friend's story with one emoji; reacting again replaces the
  // emoji. Reacting also counts as having watched the story.
  // Errors: STORY_NOT_FOUND, INVALID_REACTION, CANNOT_REACT_TO_OWN_STORY,
  // RATE_LIMITED.
  rpc ReactToStory(ReactToStoryRequest) returns (ReactToStoryResponse);
  // Takes the caller's reaction back. Succeeds when there was none.
  // Errors: STORY_NOT_FOUND.
  rpc RemoveStoryReaction(RemoveStoryReactionRequest) returns (RemoveStoryReactionResponse);

  // The days of one month on which the caller posted stories, for the
  // archive calendar. Days are counted in the caller's time zone.
  // Errors: INVALID_MONTH.
  rpc GetStoryCalendar(GetStoryCalendarRequest) returns (GetStoryCalendarResponse);
  // The caller's own stories, live and archived, newest first; optionally
  // only those of one day. Errors: INVALID_DATE.
  rpc ListArchivedStories(ListArchivedStoriesRequest) returns (ListArchivedStoriesResponse);

  // Creates a highlight: a titled group of the caller's stories that stays
  // on their profile.
  // Errors: TITLE_INVALID, HIGHLIGHT_EMPTY, TOO_MANY_STORIES,
  // TOO_MANY_HIGHLIGHTS, STORY_NOT_FOUND (a story that is not the caller's).
  rpc CreateHighlight(CreateHighlightRequest) returns (CreateHighlightResponse);
  // Replaces the title and the stories of a highlight.
  // Errors: HIGHLIGHT_NOT_FOUND, TITLE_INVALID, HIGHLIGHT_EMPTY,
  // TOO_MANY_STORIES, STORY_NOT_FOUND.
  rpc UpdateHighlight(UpdateHighlightRequest) returns (UpdateHighlightResponse);
  // Removes a highlight from the profile. Its stories stay in the archive.
  // Errors: HIGHLIGHT_NOT_FOUND.
  rpc DeleteHighlight(DeleteHighlightRequest) returns (DeleteHighlightResponse);
  // Sets the order of the caller's highlights on their profile. The request
  // must name each of them exactly once. Errors: HIGHLIGHTS_MISMATCH.
  rpc ReorderHighlights(ReorderHighlightsRequest) returns (ReorderHighlightsResponse);
  // The highlights on a user's profile that hold at least one story the
  // caller may see. Empty for people who are not the user's friends.
  rpc ListHighlights(ListHighlightsRequest) returns (ListHighlightsResponse);
  // One highlight with the stories in it that the caller may see.
  // Errors: HIGHLIGHT_NOT_FOUND.
  rpc GetHighlight(GetHighlightRequest) returns (GetHighlightResponse);
}

// Who a story is shown to.
enum StoryAudience {
  // Same as FRIENDS.
  STORY_AUDIENCE_UNSPECIFIED = 0;
  // Every friend of the owner.
  STORY_AUDIENCE_FRIENDS = 1;
  // Only the friends the owner picked for this story ("親しい友達").
  STORY_AUDIENCE_CLOSE_FRIENDS = 2;
}

// A story (記憶).
message Story {
  string id = 1;
  tokuly.common.v1.UserSummary owner = 2;
  // At most 140 characters; may be empty.
  string title = 3;
  // 1–10 photos or videos, in playing order.
  repeated StoryItem items = 4;
  StoryAudience audience = 5;
  google.protobuf.Timestamp created_at = 6;
  // When the story leaves the tray (24 hours after posting).
  google.protobuf.Timestamp expires_at = 7;
  // The story is past `expires_at`: only its owner sees it, plus friends
  // through a highlight.
  bool expired = 8;
  // The caller watched the story.
  bool viewed = 9;
  // The caller's reaction emoji; empty when none.
  string my_reaction = 10;
  // The fields below are filled in for the owner only.
  //
  // People who watched the story.
  int32 view_count = 11;
  // People who reacted to it.
  int32 reaction_count = 12;
  // The chosen friends of a CLOSE_FRIENDS story.
  repeated string audience_user_ids = 13;
  // The story is in at least one highlight.
  bool highlighted = 14;
}

// One photo or video of a story.
message StoryItem {
  tokuly.media.v1.Attachment media = 1;
  // At most 200 characters; may be empty.
  string caption = 2;
}

// The live stories of one person, as shown in the story tray.
message StoryReel {
  tokuly.common.v1.UserSummary user = 1;
  // Oldest first (the order they play in).
  repeated Story stories = 2;
  // At least one of the stories was not watched by the caller yet.
  bool has_unseen = 3;
  // When the newest story was posted.
  google.protobuf.Timestamp latest_at = 4;
}

// One entry of a story's viewer list.
message StoryViewer {
  tokuly.common.v1.UserSummary user = 1;
  google.protobuf.Timestamp viewed_at = 2;
  // Their reaction emoji; empty when none.
  string reaction = 3;
}

// One day of the archive calendar.
message StoryDay {
  // Calendar date in the caller's time zone, `YYYY-MM-DD`.
  string date = 1;
  int32 story_count = 2;
  // Picture of the day: the first photo (or video poster) posted that day.
  tokuly.common.v1.Image cover = 3;
}

// A titled group of stories pinned to a profile.
message Highlight {
  string id = 1;
  string owner_id = 2;
  // 1–30 characters.
  string title = 3;
  // First photo (or video poster) of the first story the caller may see.
  tokuly.common.v1.Image cover = 4;
  // Stories in the highlight that the caller may see.
  int32 story_count = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message StoryItemInput {
  // An upload made for stories (purpose STORY): an image or a video.
  string asset_id = 1;
  string caption = 2;
}

message CreateStoryRequest {
  string title = 1;
  repeated StoryItemInput items = 2;
  StoryAudience audience = 3;
  // For CLOSE_FRIENDS: the friends who may see the story (1–150, all of
  // them friends of the caller). Ignored otherwise.
  repeated string audience_user_ids = 4;
  // Optional client-generated key (at most 64 characters): posting again
  // with the same key within 10 minutes returns the first story
  // (REQUEST_IN_PROGRESS while the first request is still running).
  string idempotency_key = 5;
}

message CreateStoryResponse {
  Story story = 1;
}

message DeleteStoryRequest {
  string story_id = 1;
}

message DeleteStoryResponse {}

message GetStoryRequest {
  string story_id = 1;
}

message GetStoryResponse {
  Story story = 1;
}

message GetStoryTrayRequest {}

message GetStoryTrayResponse {
  repeated StoryReel reels = 1;
}

message ListUserStoriesRequest {
  string user_id = 1;
}

message ListUserStoriesResponse {
  repeated Story stories = 1;
}

message MarkStoryViewedRequest {
  string story_id = 1;
}

message MarkStoryViewedResponse {}

message ListStoryViewersRequest {
  string story_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListStoryViewersResponse {
  repeated StoryViewer viewers = 1;
  tokuly.common.v1.PageInfo page = 2;
  int32 view_count = 3;
  int32 reaction_count = 4;
}

message ReactToStoryRequest {
  string story_id = 1;
  // Exactly one emoji.
  string emoji = 2;
}

message ReactToStoryResponse {}

message RemoveStoryReactionRequest {
  string story_id = 1;
}

message RemoveStoryReactionResponse {}

message GetStoryCalendarRequest {
  int32 year = 1;
  // 1–12.
  int32 month = 2;
}

message GetStoryCalendarResponse {
  // Days with at least one story, in ascending order.
  repeated StoryDay days = 1;
}

message ListArchivedStoriesRequest {
  tokuly.common.v1.PageRequest page = 1;
  // Only stories posted on this day (`YYYY-MM-DD`, the caller's time zone).
  // Empty = all of them.
  string date = 2;
}

message ListArchivedStoriesResponse {
  repeated Story stories = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message CreateHighlightRequest {
  string title = 1;
  // The caller's stories, in playing order (1–100).
  repeated string story_ids = 2;
}

message CreateHighlightResponse {
  Highlight highlight = 1;
}

message UpdateHighlightRequest {
  string highlight_id = 1;
  string title = 2;
  // The complete new list of stories, in playing order (1–100).
  repeated string story_ids = 3;
}

message UpdateHighlightResponse {
  Highlight highlight = 1;
}

message DeleteHighlightRequest {
  string highlight_id = 1;
}

message DeleteHighlightResponse {}

message ReorderHighlightsRequest {
  // Every highlight of the caller, in the new order.
  repeated string highlight_ids = 1;
}

message ReorderHighlightsResponse {}

message ListHighlightsRequest {
  string user_id = 1;
}

message ListHighlightsResponse {
  repeated Highlight highlights = 1;
}

message GetHighlightRequest {
  string highlight_id = 1;
}

message GetHighlightResponse {
  Highlight highlight = 1;
  // In playing order.
  repeated Story stories = 2;
}

// ───────────────────────────── Realtime ─────────────────────────────

// Pushed over the realtime gateway (as a tokuly.realtime.v1.Event).
//
// The first three events are topic-scoped: clients showing a note subscribe
// to `subject:3:<note_id>` (3 = SUBJECT_TYPE_NOTE) and get its numbers live.
// Whether a client may follow the topic is checked once, when it subscribes
// (it must be able to see the note then), so the topic only ever carries
// numbers and IDs, plus content that is public anyway.
// The story events are user-scoped and need no subscription.
message NotesEvent {
  oneof event {
    // Topic: likes, renotes, replies or quotes of the note changed. Views
    // alone do not trigger a push; the view count rides along with the next
    // one.
    NoteCounters counters_changed = 1;
    // Topic: the note was deleted. The value is its ID.
    string note_deleted_id = 2;
    // The preview of the note's first link is ready. Sent to the author, and
    // to the topic when the note is public.
    NoteLinkPreview link_preview_resolved = 3;
    // To everyone a new story is shown to: a friend posted it.
    Story story_posted = 4;
    // To the same people: the story was deleted before it expired.
    StoryRef story_deleted = 5;
    // To the owner: someone reacted to their story.
    StoryReaction story_reaction = 6;
    // To the owner: someone new watched their story.
    StoryViewCount story_viewed = 7;
    // Topic: someone voted in the note's poll, or it closed. Carries no
    // counts (what a reader may see of them differs): read the note again.
    PollTally poll_updated = 8;
    // Topic: the note was edited. Read it again.
    NoteEdited note_edited = 9;
  }
}

message PollTally {
  string note_id = 1;
  int64 voter_count = 2;
  bool closed = 3;
}

message NoteEdited {
  string note_id = 1;
  google.protobuf.Timestamp edited_at = 2;
}

message NoteLinkPreview {
  string note_id = 1;
  tokuly.media.v1.LinkPreview link_preview = 2;
}

message StoryRef {
  string story_id = 1;
  string owner_id = 2;
}

message StoryReaction {
  string story_id = 1;
  tokuly.common.v1.UserSummary user = 2;
  string emoji = 3;
  google.protobuf.Timestamp reacted_at = 4;
}

message StoryViewCount {
  string story_id = 1;
  int32 view_count = 2;
}
