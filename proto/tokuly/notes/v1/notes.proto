syntax = "proto3";

// Notes (ノート: short posts, "今何してる?") and stories (記憶: a titled set of
// photos and videos that friends can see for a day).
//
// Who may see a note is decided in one place for every RPC here, with the
// audiences of the social graph (tokuly.social.v1: friends, follows,
// circles, locked accounts):
// - the author always sees their own notes;
// - nobody sees the notes of someone they blocked or who blocked them, nor
//   those of a suspended account;
// - PUBLIC notes are visible to everyone, signed in or not — except that the
//   public notes of a LOCKED account reach only its followers and friends;
// - FOLLOWERS notes: the author's followers and friends;
// - FRIENDS notes: the author's friends;
// - CLOSE_FRIENDS notes: the members of the author's close-friends circle;
// - CIRCLE notes: the members of one of the author's custom circles;
//   (circle members count while they are still a friend or follower)
// - a reply shared with anything narrower than PUBLIC is also visible to the
//   author of the note it answers (unless it is PRIVATE);
// - DIRECT notes (PRIVATE plus named people, `direct_recipients`): the
//   people named;
// - PRIVATE notes: nobody else.
// A note the caller may not see is indistinguishable from one that does not
// exist (NOTE_NOT_FOUND, or it is simply absent from lists).
//
// Stories are for friends only: see StoryService.
package tokuly.notes.v1;

import "google/protobuf/timestamp.proto";
import "tokuly/common/v1/common.proto";
import "tokuly/media/v1/media.proto";

// ───────────────────────────── Notes ─────────────────────────────

// Posting, reading and reacting to notes, and the note timelines.
//
// Reading public notes, user timelines, threads and hashtags works without
// signing in; everything that changes something needs a signed-in caller.
// Timelines are cursor-paginated newest first; `page.has_more = false` is
// where clients show 「最後まで読み切りました」.
service NoteService {
  // The posting rules everyone agrees to before their first note, in the
  // caller's language, and whether the caller has agreed to the current
  // version. Works anonymously (`agreed` is then false).
  rpc GetNoteRules(GetNoteRulesRequest) returns (GetNoteRulesResponse);
  // Records that the caller agrees to the rules. `version` must be the
  // current one, so nobody agrees to a text they were not shown.
  // Errors: RULES_VERSION_MISMATCH.
  rpc AgreeToNoteRules(AgreeToNoteRulesRequest) returns (AgreeToNoteRulesResponse);

  // Posts a note, a reply (`reply_to_id`) or a quote note (`quote_of_id`),
  // optionally with a poll or into a channel. A note needs text, media, a
  // stamp or a poll. Its author may edit it for an hour (EditNote).
  // Errors: RULES_NOT_ACCEPTED, NOTE_EMPTY, NOTE_TOO_LONG, CW_TOO_LONG,
  // ALT_TEXT_TOO_LONG, TOO_MANY_ATTACHMENTS (more than 10), ATTACHMENTS_MIXED
  // (a video comes alone), ATTACHMENT_UNSUPPORTED (not an image or a video),
  // INVALID_POLL, CHANNEL_NOT_FOUND, CHANNEL_ARCHIVED, ASSET_NOT_FOUND,
  // ASSET_WRONG_PURPOSE, ASSET_NOT_READY, ASSET_FAILED, STAMP_NOT_USABLE,
  // INVALID_PLACE, INVALID_VISIBILITY, CIRCLE_NOT_FOUND (not a circle of the
  // caller), TOO_MANY_RECIPIENTS (a direct note names at most 20 people),
  // RECIPIENT_NOT_FOUND, INVALID_IDEMPOTENCY_KEY, REQUEST_IN_PROGRESS,
  // NOTE_NOT_FOUND (the note replied to or quoted), NOTE_NOT_PUBLIC (only
  // notes everyone may see can be quoted), RATE_LIMITED.
  rpc CreateNote(CreateNoteRequest) returns (CreateNoteResponse);
  // Deletes one of the caller's notes. Replies to it stay (they show the
  // note they answered as unavailable); renotes of it disappear.
  // Errors: NOTE_NOT_FOUND, NOT_NOTE_AUTHOR.
  rpc DeleteNote(DeleteNoteRequest) returns (DeleteNoteResponse);
  // Changes who may see one of the caller's notes (the same audiences as
  // CreateNote). A reply is never shown more widely than the note it
  // answers; the audience actually applied is in the returned note.
  // Errors: NOTE_NOT_FOUND, NOT_NOTE_AUTHOR, INVALID_VISIBILITY,
  // CIRCLE_NOT_FOUND, TOO_MANY_RECIPIENTS, RECIPIENT_NOT_FOUND, RATE_LIMITED
  // (more than 30 changes per minute).
  rpc SetNoteVisibility(SetNoteVisibilityRequest) returns (SetNoteVisibilityResponse);
  // Pins one of the caller's notes to the top of their profile (up to five,
  // the latest pinned first). Pinning a pinned note changes nothing.
  // Errors: NOTE_NOT_FOUND, NOT_NOTE_AUTHOR, TOO_MANY_PINNED.
  rpc PinNote(PinNoteRequest) returns (PinNoteResponse);
  // Takes one of the caller's notes off their profile. Succeeds when it was
  // not pinned.
  rpc UnpinNote(UnpinNoteRequest) returns (UnpinNoteResponse);
  // Changes the text, content warning and the alt text / sensitive marks of
  // the attachments of one of the caller's notes, within an hour of posting
  // and at most 10 times. The earlier versions stay readable by everyone
  // who may see the note (ListNoteEdits). People newly mentioned are told;
  // a poll, the media themselves and the audience do not change here.
  // Errors: NOTE_NOT_FOUND, NOT_NOTE_AUTHOR, EDIT_WINDOW_CLOSED,
  // TOO_MANY_EDITS, NOTE_EMPTY, NOTE_TOO_LONG, CW_TOO_LONG, ALT_TEXT_TOO_LONG,
  // RATE_LIMITED.
  rpc EditNote(EditNoteRequest) returns (EditNoteResponse);
  // The earlier versions of an edited note, newest first.
  // Errors: NOTE_NOT_FOUND.
  rpc ListNoteEdits(ListNoteEditsRequest) returns (ListNoteEditsResponse);
  // Deletes one of the caller's notes and returns a draft
  // (NoteDraftService) with its content, uploads included, to post again
  // ("削除して再編集"). Errors: NOTE_NOT_FOUND, NOT_NOTE_AUTHOR,
  // TOO_MANY_DRAFTS.
  rpc RedraftNote(RedraftNoteRequest) returns (RedraftNoteResponse);
  // Votes in a note's poll: one choice, or several when the poll allows it.
  // A vote is final, and who voted for what is never shown to anyone.
  // Errors: NOTE_NOT_FOUND, POLL_NOT_FOUND, POLL_CLOSED, ALREADY_VOTED,
  // INVALID_CHOICE, RATE_LIMITED.
  rpc VotePoll(VotePollRequest) returns (VotePollResponse);
  // Numbers of one of the caller's notes: impressions per hour over the
  // last two days and the engagement it got. Author only.
  // Errors: NOTE_NOT_FOUND, NOT_NOTE_AUTHOR.
  rpc GetNoteAnalytics(GetNoteAnalyticsRequest) returns (GetNoteAnalyticsResponse);

  // One note. Errors: NOTE_NOT_FOUND.
  rpc GetNote(GetNoteRequest) returns (GetNoteResponse);
  // Several notes at once (at most 100), in the order asked for. Notes that
  // do not exist or that the caller may not see are left out.
  // Errors: TOO_MANY_NOTES.
  rpc BatchGetNotes(BatchGetNotesRequest) returns (BatchGetNotesResponse);
  // A note in its conversation: the notes it answers, the note itself and
  // its direct replies (oldest first, paginated). Opening a thread counts
  // as a view of the note. Errors: NOTE_NOT_FOUND.
  rpc GetNoteThread(GetNoteThreadRequest) returns (GetNoteThreadResponse);
  // Quote notes of a note, newest first. Errors: NOTE_NOT_FOUND.
  rpc ListNoteQuotes(ListNoteQuotesRequest) returns (ListNoteQuotesResponse);
  // Reports that notes were shown on screen (at most 100 per call). Each
  // viewer counts once per note every few hours; authors never count
  // towards their own notes. Works anonymously. Errors: TOO_MANY_NOTES.
  rpc RecordNoteViews(RecordNoteViewsRequest) returns (RecordNoteViewsResponse);

  // Likes a note. Liking twice changes nothing.
  // Errors: NOTE_NOT_FOUND, RATE_LIMITED.
  rpc LikeNote(LikeNoteRequest) returns (LikeNoteResponse);
  // Takes a like back. Succeeds when the note was not liked.
  // Errors: NOTE_NOT_FOUND.
  rpc UnlikeNote(UnlikeNoteRequest) returns (UnlikeNoteResponse);
  // Renotes (Reノート) a note into the timelines of the caller's friends and
  // followers: once per note, undoable. Renoting twice changes nothing.
  // Who may renote (`NoteViewerState.can_renote`): anyone who sees a note
  // that everyone may see (PUBLIC, author not locked); only its author for
  // FOLLOWERS, FRIENDS, CLOSE_FRIENDS and CIRCLE notes and for the public
  // notes of a locked account; nobody for DIRECT and PRIVATE notes. A
  // renote never widens the note's audience: timelines show it only to
  // people who may see the note itself.
  // Errors: NOTE_NOT_FOUND, NOTE_NOT_RENOTABLE, RATE_LIMITED.
  rpc RenoteNote(RenoteNoteRequest) returns (RenoteNoteResponse);
  // Takes a renote back. Succeeds when the note was not renoted.
  // Errors: NOTE_NOT_FOUND.
  rpc UndoRenote(UndoRenoteRequest) returns (UndoRenoteResponse);
  // Who liked a note, most recent first. Errors: NOTE_NOT_FOUND.
  rpc ListNoteLikers(ListNoteLikersRequest) returns (ListNoteLikersResponse);
  // Who renoted a note, most recent first. Errors: NOTE_NOT_FOUND.
  rpc ListNoteRenoters(ListNoteRenotersRequest) returns (ListNoteRenotersResponse);

  // The caller's home (friends) timeline: notes, quotes and renotes by the
  // caller and their friends, plus replies exchanged between those people,
  // and the notes of channels the caller follows.
  //
  // Every timeline leaves out what the caller muted (NoteMuteService: muted
  // words, renotes hidden from someone; tokuly.social.v1 follow mutes), and
  // the notes posted into a channel stay out of the home, following and
  // global timelines unless the caller follows the channel.
  rpc GetHomeTimeline(GetHomeTimelineRequest) returns (GetHomeTimelineResponse);
  // The caller's following timeline: the same for the caller and the
  // accounts they follow, leaving out the ones they muted
  // (tokuly.social.v1 follow mutes).
  rpc GetFollowingTimeline(GetFollowingTimelineRequest) returns (GetFollowingTimelineResponse);
  // Every note that is not a reply and that everyone may see (PUBLIC, author
  // not locked). Works anonymously.
  rpc GetGlobalTimeline(GetGlobalTimelineRequest) returns (GetGlobalTimelineResponse);
  // One user's notes as the caller may see them. Works anonymously.
  // Errors: USER_NOT_FOUND (also when either side blocked the other).
  rpc GetUserTimeline(GetUserTimelineRequest) returns (GetUserTimelineResponse);
  // Notes carrying a hashtag. Works anonymously. An unused hashtag gives an
  // empty timeline. Errors: INVALID_HASHTAG.
  rpc GetHashtagTimeline(GetHashtagTimelineRequest) returns (GetHashtagTimelineResponse);
  // Notes that mention the caller, answer one of the caller's notes or are
  // addressed to the caller (direct notes).
  rpc GetMentionsTimeline(GetMentionsTimelineRequest) returns (GetMentionsTimelineResponse);
  // Hashtags that many different people are using in listed notes right
  // now, best first, optionally in one language. Recomputed every few
  // minutes. One account counts once per hashtag; new accounts count for
  // little, and a group of accounts created around the same day counts as
  // one person. Works anonymously.
  rpc ListTrendingHashtags(ListTrendingHashtagsRequest) returns (ListTrendingHashtagsResponse);
  // Notes everyone may see that are getting attention right now (likes,
  // renotes, replies and quotes by different, established people, decayed
  // over hours), best first, optionally in one language. Muted words and
  // accounts of the caller apply. Works anonymously.
  rpc ListTrendingNotes(ListTrendingNotesRequest) returns (ListTrendingNotesResponse);
  // Hashtags starting with what the user typed, most used first: completion
  // while writing a note. Works anonymously. Errors: RATE_LIMITED.
  rpc SearchHashtags(SearchHashtagsRequest) returns (SearchHashtagsResponse);
}

// A short post.
message Note {
  string id = 1;
  tokuly.common.v1.UserSummary author = 2;
  // The text as written (at most 3000 characters), markup included. May be
  // empty when the note has media, a stamp or a poll. Clients render `body`.
  string text = 3;
  // Up to 10 images, or exactly one video.
  repeated tokuly.media.v1.Attachment attachments = 4;
  // Unset when the note has no stamp or the stamp is no longer available.
  tokuly.common.v1.StampRef stamp = 5;
  PlaceTag place = 6;
  // PUBLIC, FOLLOWERS, FRIENDS, CLOSE_FRIENDS, CIRCLE or PRIVATE (with
  // `direct_recipients`: a direct note). To anyone but the author a CIRCLE
  // note reads as FOLLOWERS: members of custom circles are never told
  // about them (the close-friends mark is shown).
  tokuly.common.v1.Visibility visibility = 7;
  // The note is folded behind a content warning: clients show
  // `content_warning_text` (or a generic 「センシティブな内容」) and the rest
  // behind a tap.
  bool content_warning = 8;
  // Set when the note is a reply.
  ReplyTarget reply_to = 9;
  // Set when the note quotes another note.
  QuotedNote quote = 10;
  // Hashtags found in the text, normalized (lowercase, no '#'), in order of
  // appearance. Clients link `#tag` in the text to the hashtag timeline.
  repeated string hashtags = 11;
  // `@handle` mentions in the text that name existing users.
  repeated Mention mentions = 12;
  // Preview of the first link in the text. It may arrive a moment after the
  // note was posted (NotesEvent.link_preview_resolved).
  tokuly.media.v1.LinkPreview link_preview = 13;
  NoteCounters counters = 14;
  // What the caller did with the note. Unset for anonymous callers.
  NoteViewerState viewer = 15;
  // The author pinned this note to their profile.
  bool pinned = 16;
  google.protobuf.Timestamp created_at = 17;
  // The author only: the circle (tokuly.social.v1.Circle.id) a CIRCLE note
  // is shared with.
  string circle_id = 18;
  // A direct note: the people it is addressed to (people hidden from the
  // caller by a block left out).
  repeated tokuly.common.v1.UserSummary direct_recipients = 19;
  // The content warning line (at most 100 characters); empty for a generic
  // one or none.
  string content_warning_text = 20;
  // Alt text and sensitive mark of each attachment, in the order of
  // `attachments`.
  repeated AttachmentDetails attachment_details = 21;
  // `text` parsed into its markup (see RichText): what clients render.
  RichText body = 22;
  Poll poll = 23;
  // The channel the note was posted into.
  ChannelRef channel = 24;
  // When the note was last edited; unset if never.
  google.protobuf.Timestamp edited_at = 25;
  int32 edit_count = 26;
  // Language of the text when it can be told (`ja`, `en`), else empty.
  string language = 27;
}

// The alt text and sensitive mark of one attachment of a note.
message AttachmentDetails {
  string asset_id = 1;
  // At most 1500 characters.
  string alt_text = 2;
  // Shown blurred until tapped (also when the note has no content warning).
  bool sensitive = 3;
}

// The channel a note belongs to, as shown on the note.
message ChannelRef {
  string id = 1;
  string name = 2;
  // Theme colour, `#rrggbb`; empty for the default.
  string color = 3;
}

// ── Rich text ──
//
// A note's text parsed on the server into a typed tree, stored with the
// note and returned in `Note.body`: clients render it and never parse the
// text themselves, and nothing outside this tree can be expressed (no HTML,
// no styles). The grammar (docs/events/notes.md has the full rules):
//
//   blocks:  `> ` at the start of lines → quote; a line of ``` (optionally
//            followed by a language) up to the next line of ``` → code
//            block; `<center>` … `</center>` → centred; anything else →
//            paragraphs (one per run of lines; line breaks are kept as
//            "\n" in text).
//   inline:  **bold**, <b>…</b>, *italic*, <i>…</i>, ~~strike~~, <s>…</s>,
//            <small>…</small>, `code`, [label](https://…), bare http(s)
//            links, @handle, #hashtag, :emoji:, $[effect …], and a
//            backslash before any of those characters to write it plainly.
//   effects: tada, jelly, jump, bounce, shake, spin, rainbow, sparkle, x2 —
//            clients play them only when the reader has not asked for
//            reduced motion. Nesting stops at depth 8.
message RichText {
  repeated TextBlock blocks = 1;
}

message TextBlock {
  oneof block {
    TextParagraph paragraph = 1;
    // Quoted lines (another note's words, a reply in a reply).
    TextParagraphs quote = 2;
    TextCodeBlock code = 3;
    TextParagraphs center = 4;
  }
}

message TextParagraph {
  repeated TextInline inlines = 1;
}

message TextParagraphs {
  repeated TextParagraph paragraphs = 1;
}

message TextCodeBlock {
  // As written after the opening ```, e.g. `rust`; may be empty.
  string language = 1;
  string code = 2;
}

message TextInline {
  oneof inline {
    // Plain text; "\n" is a line break.
    string text = 1;
    TextSpan span = 2;
    // Inline code, shown in a monospace font.
    string code = 3;
    TextLink link = 4;
    TextMention mention = 5;
    TextHashtag hashtag = 6;
    TextEmoji emoji = 7;
    TextEffect effect = 8;
  }
}

enum TextStyle {
  TEXT_STYLE_UNSPECIFIED = 0;
  TEXT_STYLE_BOLD = 1;
  TEXT_STYLE_ITALIC = 2;
  TEXT_STYLE_STRIKE = 3;
  TEXT_STYLE_SMALL = 4;
}

message TextSpan {
  TextStyle style = 1;
  repeated TextInline children = 2;
}

message TextLink {
  // An http(s) URL.
  string url = 1;
  // `[label](url)`: the label (no links inside); empty for a bare link,
  // which shows the URL.
  repeated TextInline label = 2;
}

message TextMention {
  // Lowercase, without '@'.
  string handle = 1;
  // The user when the handle names one the reader may know of; empty
  // otherwise (render as plain text).
  string user_id = 2;
}

message TextHashtag {
  // Normalized (the hashtag timeline's key).
  string tag = 1;
  // As written, without '#'.
  string text = 2;
}

message TextEmoji {
  // The shortcode without colons.
  string name = 1;
  // Unset when no such custom emoji exists (render `:name:`).
  tokuly.common.v1.Image image = 2;
}

enum TextEffectKind {
  TEXT_EFFECT_KIND_UNSPECIFIED = 0;
  TEXT_EFFECT_KIND_TADA = 1;
  TEXT_EFFECT_KIND_JELLY = 2;
  TEXT_EFFECT_KIND_JUMP = 3;
  TEXT_EFFECT_KIND_BOUNCE = 4;
  TEXT_EFFECT_KIND_SHAKE = 5;
  TEXT_EFFECT_KIND_SPIN = 6;
  TEXT_EFFECT_KIND_RAINBOW = 7;
  TEXT_EFFECT_KIND_SPARKLE = 8;
  // Twice the size (no larger sizes exist).
  TEXT_EFFECT_KIND_X2 = 9;
}

message TextEffect {
  TextEffectKind kind = 1;
  repeated TextInline children = 2;
}

// ── Polls ──

// Who sees how many votes each choice got.
enum PollResultsVisibility {
  // Same as ALWAYS.
  POLL_RESULTS_VISIBILITY_UNSPECIFIED = 0;
  POLL_RESULTS_VISIBILITY_ALWAYS = 1;
  // Once the reader voted (and for everyone once the poll ended).
  POLL_RESULTS_VISIBILITY_AFTER_VOTING = 2;
  // Only once the poll ended (the author too).
  POLL_RESULTS_VISIBILITY_AFTER_END = 3;
}

// A poll as one reader sees it. Votes are private: nobody, the author
// included, learns who voted for what.
message Poll {
  repeated PollChoice choices = 1;
  // Several choices may be picked.
  bool multiple = 2;
  google.protobuf.Timestamp ends_at = 3;
  PollResultsVisibility results_visibility = 4;
  // The poll is over (`ends_at` passed).
  bool closed = 5;
  // The counts are shown to this reader (see results_visibility); when
  // false every `votes` and `voter_count` is 0.
  bool results_visible = 6;
  // People who voted.
  int64 voter_count = 7;
  // The reader's own choices (indexes into `choices`); empty if they have
  // not voted.
  repeated int32 my_choices = 8;
}

message PollChoice {
  // 1–50 characters.
  string text = 1;
  int64 votes = 2;
}

message PollInput {
  // 2–10 choices of 1–50 characters, all different.
  repeated string choices = 1;
  bool multiple = 2;
  // How long the poll runs: 5 minutes to 30 days.
  int64 duration_seconds = 3;
  PollResultsVisibility results_visibility = 4;
}

// What the author says about one attachment when posting or editing.
message AttachmentDetailsInput {
  string asset_id = 1;
  string alt_text = 2;
  bool sensitive = 3;
}

// A place a note is tagged with. The client supplies it (from the map or a
// place search); the server only checks its shape.
message PlaceTag {
  // Display name, 1–100 characters.
  string name = 1;
  tokuly.common.v1.LatLng location = 2;
  // ID of the place in the map's place directory when the user picked one
  // there, so the tag can open the place page. Optional.
  string place_id = 3;
}

// Engagement numbers of a note. Also pushed live (NotesEvent.counters_changed).
message NoteCounters {
  string note_id = 1;
  int64 reply_count = 2;
  int64 renote_count = 3;
  int64 quote_count = 4;
  int64 like_count = 5;
  int64 view_count = 6;
  // Public clips (ClipService) that hold the note.
  int64 clip_count = 7;
}

message NoteViewerState {
  bool liked = 1;
  bool renoted = 2;
  // The caller may renote the note (see RenoteNote).
  bool can_renote = 3;
  // The caller may quote the note: everyone may see it.
  bool can_quote = 4;
  // The caller wrote the note and may still edit it.
  bool can_edit = 5;
  // The caller muted the conversation this note is in.
  bool thread_muted = 6;
}

// An `@handle` in a note's text that names a user.
message Mention {
  // The handle as written in the text, lowercased, without '@'.
  string handle = 1;
  string user_id = 2;
}

// The note a reply answers.
message ReplyTarget {
  string note_id = 1;
  // Author of that note; known even after the note was deleted, so
  // 「返信先: @handle」 keeps rendering.
  tokuly.common.v1.UserSummary author = 2;
  // The note was deleted or the caller may not see it.
  bool unavailable = 3;
}

// The note a quote note shows underneath its own text.
message QuotedNote {
  string note_id = 1;
  // The quoted note (without the note it quotes in turn). Unset when
  // `unavailable`.
  Note note = 2;
  // The note was deleted or the caller may not see it.
  bool unavailable = 3;
}

// One row of a timeline: a note, possibly there because someone renoted it.
message TimelineEntry {
  Note note = 1;
  // Set when this row is a renote: who renoted the note, and when.
  RenoteInfo renote = 2;
}

message RenoteInfo {
  tokuly.common.v1.UserSummary user = 1;
  google.protobuf.Timestamp renoted_at = 2;
}

// One rule of the posting rules.
message NoteRule {
  string title = 1;
  string body = 2;
}

message GetNoteRulesRequest {}

message GetNoteRulesResponse {
  // Version of the rules below. Agreeing names it.
  int32 version = 1;
  repeated NoteRule rules = 2;
  // The caller agreed to this version and may post.
  bool agreed = 3;
  // The version the caller agreed to last (0 = never). When it is older
  // than `version` the rules changed since: 「ルールが更新されたよ」.
  int32 agreed_version = 4;
  google.protobuf.Timestamp agreed_at = 5;
}

message AgreeToNoteRulesRequest {
  // The version shown to the user (GetNoteRulesResponse.version).
  int32 version = 1;
}

message AgreeToNoteRulesResponse {
  google.protobuf.Timestamp agreed_at = 1;
}

message CreateNoteRequest {
  string text = 1;
  // Uploads made for notes (NOTE_IMAGE / NOTE_VIDEO), in display order: up
  // to 10 images, or one video.
  repeated string asset_ids = 2;
  // A stamp the caller may send. Optional.
  string stamp_id = 3;
  PlaceTag place = 4;
  // PUBLIC, FOLLOWERS, FRIENDS, CLOSE_FRIENDS, CIRCLE (with `circle_id`) or
  // PRIVATE (with `direct_user_ids`: a direct note). UNSPECIFIED uses the
  // caller's default (privacy setting `default_note_visibility`). A reply is
  // never shown more widely than the note it answers: a reply to a PUBLIC,
  // FOLLOWERS or FRIENDS note takes the narrower of the two; a reply to a
  // CLOSE_FRIENDS, CIRCLE or direct note becomes a direct note to that
  // note's author (and the people it was addressed to); a reply to a
  // PRIVATE note is private.
  tokuly.common.v1.Visibility visibility = 5;
  // Makes the note a reply to this note.
  string reply_to_id = 6;
  // Makes the note a quote of this (public) note.
  string quote_of_id = 7;
  bool content_warning = 8;
  // Optional client-generated key (at most 64 characters) that makes a
  // retried request safe: posting again with the same key within 10
  // minutes returns the note created the first time. A retry that arrives
  // while the first request is still running fails with REQUEST_IN_PROGRESS
  // (unavailable): try again shortly.
  string idempotency_key = 9;
  // For CIRCLE: one of the caller's circles.
  string circle_id = 10;
  // For PRIVATE: the people a direct note is addressed to (1–20 user IDs;
  // empty = a note to oneself). They are told about it.
  repeated string direct_user_ids = 11;
  // The content warning line (at most 100 characters). Setting it folds
  // the note like `content_warning`.
  string content_warning_text = 12;
  // Alt text and sensitive marks, by asset ID (assets not named here have
  // neither).
  repeated AttachmentDetailsInput attachment_details = 13;
  PollInput poll = 14;
  // Posts the note into this channel (NoteChannelService). Channel notes are
  // PUBLIC; a reply to a channel note stays in its channel.
  string channel_id = 15;
}

message CreateNoteResponse {
  Note note = 1;
}

message DeleteNoteRequest {
  string note_id = 1;
}

message DeleteNoteResponse {}

message SetNoteVisibilityRequest {
  string note_id = 1;
