// ───────────────────────────── Clips ─────────────────────────────

// Clips (クリップ): curated collections of notes, public or private, with a
// description. A public clip shows on its owner's profile and counts
// towards the clip count of every note in it. A clip only ever shows each
// reader the notes they may see (its counts too). At most 100 clips of
// 1000 notes each.
service ClipService {
  // Errors: INVALID_NAME (1–50), DESCRIPTION_TOO_LONG (500), TOO_MANY_CLIPS,
  // RATE_LIMITED.
  rpc CreateClip(CreateClipRequest) returns (CreateClipResponse);
  // Errors: CLIP_NOT_FOUND, INVALID_NAME, DESCRIPTION_TOO_LONG.
  rpc UpdateClip(UpdateClipRequest) returns (UpdateClipResponse);
  // Errors: CLIP_NOT_FOUND.
  rpc DeleteClip(DeleteClipRequest) returns (DeleteClipResponse);
  // The caller's own clip, or a public one. Works anonymously.
  // Errors: CLIP_NOT_FOUND.
  rpc GetClip(GetClipRequest) returns (GetClipResponse);
  // A user's clips (all for the owner, public ones for others), latest
  // changed first. Works anonymously. Errors: USER_NOT_FOUND.
  rpc ListClips(ListClipsRequest) returns (ListClipsResponse);
  // Errors: CLIP_NOT_FOUND, NOTE_NOT_FOUND, TOO_MANY_CLIPPED_NOTES,
  // RATE_LIMITED. Adding twice changes nothing.
  rpc AddNoteToClip(AddNoteToClipRequest) returns (AddNoteToClipResponse);
  // Errors: CLIP_NOT_FOUND.
  rpc RemoveNoteFromClip(RemoveNoteFromClipRequest) returns (RemoveNoteFromClipResponse);
  // The notes of a clip the caller may see, most recently added first.
  // Errors: CLIP_NOT_FOUND.
  rpc GetClipNotes(GetClipNotesRequest) returns (GetClipNotesResponse);
  // Public clips that hold a note (and the caller's own ones), latest first.
  // Errors: NOTE_NOT_FOUND.
  rpc ListNoteClips(ListNoteClipsRequest) returns (ListNoteClipsResponse);
}

message Clip {
  string id = 1;
  tokuly.common.v1.UserSummary owner = 2;
  string name = 3;
  string description = 4;
  bool public = 5;
  // Notes in it the caller may see.
  int32 note_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  // The note asked about is in it (ListNoteClips, AddNoteToClip).
  bool contains_note = 9;
}

message CreateClipRequest {
  string name = 1;
  string description = 2;
  bool public = 3;
}

message CreateClipResponse {
  Clip clip = 1;
}

message UpdateClipRequest {
  string clip_id = 1;
  string name = 2;
  string description = 3;
  bool public = 4;
}

message UpdateClipResponse {
  Clip clip = 1;
}

message DeleteClipRequest {
  string clip_id = 1;
}

message DeleteClipResponse {}

message GetClipRequest {
  string clip_id = 1;
}

message GetClipResponse {
  Clip clip = 1;
}

message ListClipsRequest {
  // Empty = the caller.
  string user_id = 1;
  tokuly.common.v1.PageRequest page = 2;
  // When set, each clip says whether it holds this note (for the "add to
  // clip" sheet).
  string note_id = 3;
}

message ListClipsResponse {
  repeated Clip clips = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message AddNoteToClipRequest {
