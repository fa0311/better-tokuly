// ───────────────────────────── Antennas ─────────────────────────────

// Antennas (アンテナ): saved searches that collect matching new notes into a
// timeline of their own, as notes are posted (never by polling). A note
// matches when its text contains every word of at least one keyword group
// and none of the excluded words (case and width folded), it comes from the
// chosen source, and the owner may see it. At most 5 antennas per person,
// 10 groups of 5 words each, 10 excluded words, 50 accounts; matching costs
// the same however many antennas exist (one pass over the text). Each
// antenna keeps its latest 1000 notes. Only the owner sees an antenna.
service AntennaService {
  // Errors: INVALID_NAME (1–30), INVALID_KEYWORDS, LIST_NOT_FOUND,
  // USER_NOT_FOUND, TOO_MANY_ANTENNAS, RATE_LIMITED.
  rpc CreateAntenna(CreateAntennaRequest) returns (CreateAntennaResponse);
  // Changes what the antenna collects from now on; what it collected stays.
  // Errors: ANTENNA_NOT_FOUND and CreateAntenna's.
  rpc UpdateAntenna(UpdateAntennaRequest) returns (UpdateAntennaResponse);
  // Errors: ANTENNA_NOT_FOUND.
  rpc DeleteAntenna(DeleteAntennaRequest) returns (DeleteAntennaResponse);
  // Errors: ANTENNA_NOT_FOUND.
  rpc GetAntenna(GetAntennaRequest) returns (GetAntennaResponse);
  rpc ListAntennas(ListAntennasRequest) returns (ListAntennasResponse);
  // Collected notes the caller may still see, newest first.
  // Errors: ANTENNA_NOT_FOUND.
  rpc GetAntennaTimeline(GetAntennaTimelineRequest) returns (GetAntennaTimelineResponse);
}

// Where an antenna looks.
enum AntennaSource {
  // Same as EVERYONE.
  ANTENNA_SOURCE_UNSPECIFIED = 0;
  // Every note the owner may see.
  ANTENNA_SOURCE_EVERYONE = 1;
  // Notes of the accounts the owner follows and of their friends.
  ANTENNA_SOURCE_FOLLOWING = 2;
  // Notes of the members of one of the owner's lists.
  ANTENNA_SOURCE_LIST = 3;
  // Notes of the accounts named in `user_ids`.
  ANTENNA_SOURCE_USERS = 4;
}

// All words of a group must appear (AND); any group may match (OR).
message KeywordGroup {
  repeated string words = 1;
}

message AntennaInput {
  string name = 1;
  // At least one group, unless the source is LIST or USERS (then empty =
  // every note of those accounts).
  repeated KeywordGroup keywords = 2;
  repeated string exclude_words = 3;
  AntennaSource source = 4;
  // For LIST.
  string list_id = 5;
  // For USERS: 1–50 accounts.
  repeated string user_ids = 6;
  // Replies are collected too.
  bool with_replies = 7;
  // Only notes with pictures or a video.
  bool media_only = 8;
  // Tell the owner about new matches (notes.antenna, collapsed per antenna).
  bool notify = 9;
}

message Antenna {
  string id = 1;
  string name = 2;
  repeated KeywordGroup keywords = 3;
  repeated string exclude_words = 4;
  AntennaSource source = 5;
  string list_id = 6;
  repeated tokuly.common.v1.UserSummary users = 7;
  bool with_replies = 8;
  bool media_only = 9;
  bool notify = 10;
  // When the latest note was collected.
  google.protobuf.Timestamp last_matched_at = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

message CreateAntennaRequest {
  AntennaInput antenna = 1;
}

message CreateAntennaResponse {
  Antenna antenna = 1;
}

message UpdateAntennaRequest {
  string antenna_id = 1;
  AntennaInput antenna = 2;
}

message UpdateAntennaResponse {
  Antenna antenna = 1;
}

message DeleteAntennaRequest {
  string antenna_id = 1;
}

message DeleteAntennaResponse {}

message GetAntennaRequest {
  string antenna_id = 1;
}

message GetAntennaResponse {
  Antenna antenna = 1;
}

message ListAntennasRequest {}

message ListAntennasResponse {
  repeated Antenna antennas = 1;
}

message GetAntennaTimelineRequest {
  string antenna_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message GetAntennaTimelineResponse {
  repeated TimelineEntry entries = 1;
  tokuly.common.v1.PageInfo page = 2;
}

// ───────────────────────────── Channels ─────────────────────────────

// Channels (チャンネル): topic timelines anyone can post into, with a name,
// description, banner and colour, pinned notes, followers, an owner and
// moderators. A note belongs to at most one channel and is PUBLIC; channel
// notes stay out of the home, following and global timelines unless the
// reader follows the channel. Moderators (and the owner) pin notes and take
// notes out of the channel; the owner names moderators and archives the
// channel (read-only from then on). Reading works anonymously. At most 10
// channels per owner.
service NoteChannelService {
  // Errors: INVALID_NAME (1–50), DESCRIPTION_TOO_LONG (500), INVALID_COLOR,
  // ASSET_NOT_FOUND, ASSET_WRONG_PURPOSE (banner: a NOTE_IMAGE upload),
  // ASSET_NOT_READY, TOO_MANY_CHANNELS, RATE_LIMITED.
  rpc CreateChannel(CreateChannelRequest) returns (CreateChannelResponse);
  // Owner and moderators. Errors: CHANNEL_NOT_FOUND, NOT_CHANNEL_MODERATOR,
  // CHANNEL_ARCHIVED and CreateChannel's.
  rpc UpdateChannel(UpdateChannelRequest) returns (UpdateChannelResponse);
  // Owner only; `archived = false` opens it again.
  // Errors: CHANNEL_NOT_FOUND, NOT_CHANNEL_OWNER.
  rpc ArchiveChannel(ArchiveChannelRequest) returns (ArchiveChannelResponse);
  // Errors: CHANNEL_NOT_FOUND.
  rpc GetChannel(GetChannelRequest) returns (GetChannelResponse);
  // Channels by filter, optionally matching a name.
  rpc ListChannels(ListChannelsRequest) returns (ListChannelsResponse);
  // Errors: CHANNEL_NOT_FOUND, TOO_MANY_FOLLOWED_CHANNELS (500).
  rpc FollowChannel(FollowChannelRequest) returns (FollowChannelResponse);
  rpc UnfollowChannel(UnfollowChannelRequest) returns (UnfollowChannelResponse);
  // Owner only, at most 20 moderators. Errors: CHANNEL_NOT_FOUND,
  // NOT_CHANNEL_OWNER, USER_NOT_FOUND, TOO_MANY_MODERATORS.
  rpc AddChannelModerator(AddChannelModeratorRequest) returns (AddChannelModeratorResponse);
  // The owner removes anyone; a moderator removes themself.
  // Errors: CHANNEL_NOT_FOUND, NOT_CHANNEL_OWNER.
  rpc RemoveChannelModerator(RemoveChannelModeratorRequest) returns (RemoveChannelModeratorResponse);
  rpc ListChannelModerators(ListChannelModeratorsRequest) returns (ListChannelModeratorsResponse);
  // Up to 5 pinned notes, latest first. Errors: CHANNEL_NOT_FOUND,
  // NOT_CHANNEL_MODERATOR, NOTE_NOT_FOUND (also a note of another channel),
  // TOO_MANY_PINNED.
  rpc PinChannelNote(PinChannelNoteRequest) returns (PinChannelNoteResponse);
  rpc UnpinChannelNote(UnpinChannelNoteRequest) returns (UnpinChannelNoteResponse);
  // Takes a note out of the channel (it stays on its author's profile).
  // The author is told. Errors: CHANNEL_NOT_FOUND, NOT_CHANNEL_MODERATOR,
  // NOTE_NOT_FOUND.
  rpc RemoveChannelNote(RemoveChannelNoteRequest) returns (RemoveChannelNoteResponse);
  // The channel's notes the caller may see, newest first; its pinned notes
  // on the first page. Errors: CHANNEL_NOT_FOUND.
  rpc GetChannelTimeline(GetChannelTimelineRequest) returns (GetChannelTimelineResponse);
}

message NoteChannel {
  string id = 1;
  tokuly.common.v1.UserSummary owner = 2;
  string name = 3;
  string description = 4;
  tokuly.common.v1.Image banner = 5;
  // `#rrggbb`; empty for the default.
  string color = 6;
  int64 follower_count = 7;
  int64 note_count = 8;
  bool archived = 9;
  // When the latest note was posted into it.
  google.protobuf.Timestamp last_note_at = 10;
  google.protobuf.Timestamp created_at = 11;
  // The caller's relationship to it.
  bool following = 12;
  bool is_owner = 13;
  bool is_moderator = 14;
  repeated string pinned_note_ids = 15;
}

message CreateChannelRequest {
  string name = 1;
  string description = 2;
  // A NOTE_IMAGE upload; optional.
  string banner_asset_id = 3;
  string color = 4;
}

message CreateChannelResponse {
  NoteChannel channel = 1;
}

message UpdateChannelRequest {
  string channel_id = 1;
  string name = 2;
  string description = 3;
  // Empty removes the banner.
  string banner_asset_id = 4;
  string color = 5;
}

message UpdateChannelResponse {
  NoteChannel channel = 1;
}

message ArchiveChannelRequest {
  string channel_id = 1;
  bool archived = 2;
}

