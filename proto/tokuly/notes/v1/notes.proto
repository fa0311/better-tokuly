// ───────────────────────────── Drafts ─────────────────────────────

// Notes started and not posted yet, kept on the server so they follow the
// person to every device, and notes scheduled for later. A draft holds its
// uploads (they are not cleaned up while it exists). At most 100 drafts,
// 30 of them scheduled. Every RPC needs a signed-in caller and works on the
// caller's own drafts only.
service NoteDraftService {
  // Creates a draft (`draft_id` empty) or replaces one, optionally scheduled.
  // Nothing about the content is checked until it is posted, except its
  // size. Errors: DRAFT_NOT_FOUND, TOO_MANY_DRAFTS, TOO_MANY_SCHEDULED,
  // INVALID_SCHEDULE (less than 5 minutes or more than 90 days ahead),
  // NOTE_TOO_LONG, ASSET_NOT_FOUND, RATE_LIMITED.
  rpc SaveDraft(SaveDraftRequest) returns (SaveDraftResponse);
  // Errors: DRAFT_NOT_FOUND.
  rpc GetDraft(GetDraftRequest) returns (GetDraftResponse);
  // Most recently changed first; optionally only the scheduled ones (soonest first).
  rpc ListDrafts(ListDraftsRequest) returns (ListDraftsResponse);
  // Errors: DRAFT_NOT_FOUND.
  rpc DeleteDraft(DeleteDraftRequest) returns (DeleteDraftResponse);
  // Posts a draft now (as CreateNote would, with its errors) and deletes it.
  // Errors: DRAFT_NOT_FOUND and CreateNote's.
  rpc PublishDraft(PublishDraftRequest) returns (PublishDraftResponse);
}

// What a draft would post: CreateNoteRequest's fields.
message DraftContent {
  string text = 1;
  repeated string asset_ids = 2;
  string stamp_id = 3;
  PlaceTag place = 4;
  tokuly.common.v1.Visibility visibility = 5;
  string reply_to_id = 6;
  string quote_of_id = 7;
  bool content_warning = 8;
  string circle_id = 10;
  repeated string direct_user_ids = 11;
  string content_warning_text = 12;
  repeated AttachmentDetailsInput attachment_details = 13;
  PollInput poll = 14;
  string channel_id = 15;
}

message Draft {
  string id = 1;
  DraftContent content = 2;
  // The uploads of `content.asset_ids` that still exist, for previews.
  repeated tokuly.media.v1.Attachment attachments = 3;
  // When it will be posted; unset for a plain draft.
  google.protobuf.Timestamp scheduled_at = 4;
  // Why posting it at `scheduled_at` failed (an error reason such as
  // NOTE_NOT_FOUND); empty otherwise. A failed draft is no longer scheduled.
  string failure_reason = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

message SaveDraftRequest {
  // Empty creates a draft.
  string draft_id = 1;
  DraftContent content = 2;
  // Unset = not scheduled.
  google.protobuf.Timestamp scheduled_at = 3;
}

message SaveDraftResponse {
  Draft draft = 1;
}

message GetDraftRequest {
  string draft_id = 1;
}

message GetDraftResponse {
  Draft draft = 1;
}

message ListDraftsRequest {
  tokuly.common.v1.PageRequest page = 1;
  bool scheduled_only = 2;
}

message ListDraftsResponse {
  repeated Draft drafts = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message DeleteDraftRequest {
  string draft_id = 1;
}

message DeleteDraftResponse {}

message PublishDraftRequest {
  string draft_id = 1;
}

message PublishDraftResponse {
  Note note = 1;
}

// ───────────────────────────── Lists ─────────────────────────────

// Lists (リスト): named sets of accounts with a timeline of their own.
// Members can be added without following them. A public list shows on its
// owner's profile, can be followed by others, and tells the people added to
// it (who can take themselves off it); a private list is only its owner's.
// Nobody can be added across a block, a locked account only to a list of
// someone it approved as a follower (or a private one), and a block takes
// the two off each other's lists. At most 50 lists of 500 members each.
service NoteListService {
  // Errors: INVALID_NAME (1–50 characters), DESCRIPTION_TOO_LONG (200),
  // TOO_MANY_LISTS, RATE_LIMITED.
  rpc CreateList(CreateListRequest) returns (CreateListResponse);
  // Errors: LIST_NOT_FOUND, INVALID_NAME, DESCRIPTION_TOO_LONG.
  rpc UpdateList(UpdateListRequest) returns (UpdateListResponse);
  // Errors: LIST_NOT_FOUND.
  rpc DeleteList(DeleteListRequest) returns (DeleteListResponse);
  // A list the caller owns, or a public one. Works anonymously.
  // Errors: LIST_NOT_FOUND.
  rpc GetList(GetListRequest) returns (GetListResponse);
  // The lists of a user (all of them for the owner, public ones for
  // others), in the owner's order. Works anonymously. Errors: USER_NOT_FOUND.
  rpc ListLists(ListListsRequest) returns (ListListsResponse);
  // Public lists the caller follows, most recently followed first.
  rpc ListFollowedLists(ListFollowedListsRequest) returns (ListFollowedListsResponse);
  // Public lists the caller is a member of.
  rpc ListListsContainingMe(ListListsContainingMeRequest) returns (ListListsContainingMeResponse);
  // Adds accounts to one of the caller's lists (at most 50 per call).
  // Errors: LIST_NOT_FOUND, USER_NOT_FOUND (also across a block),
  // MEMBER_NOT_ALLOWED (a locked account that does not let the caller
  // follow it, on a public list), TOO_MANY_MEMBERS, RATE_LIMITED.
  rpc AddListMembers(AddListMembersRequest) returns (AddListMembersResponse);
  // Errors: LIST_NOT_FOUND.
  rpc RemoveListMembers(RemoveListMembersRequest) returns (RemoveListMembersResponse);
  // Members, most recently added first (people hidden from the caller by a
  // block left out). Works anonymously for public lists. Errors: LIST_NOT_FOUND.
  rpc ListListMembers(ListListMembersRequest) returns (ListListMembersResponse);
  // Takes the caller off someone's public list. Errors: LIST_NOT_FOUND.
  rpc LeaveList(LeaveListRequest) returns (LeaveListResponse);
  // Follows a public list of someone else. Errors: LIST_NOT_FOUND,
  // CANNOT_FOLLOW_OWN_LIST, TOO_MANY_FOLLOWED_LISTS (200).
  rpc FollowList(FollowListRequest) returns (FollowListResponse);
  rpc UnfollowList(UnfollowListRequest) returns (UnfollowListResponse);
  // Notes and renotes of the members as the caller may see them, newest
  // first, plus replies among members. Works anonymously for public lists.
  // Errors: LIST_NOT_FOUND.
  rpc GetListTimeline(GetListTimelineRequest) returns (GetListTimelineResponse);
}

message NoteList {
  string id = 1;
  tokuly.common.v1.UserSummary owner = 2;
  string name = 3;
  string description = 4;
  bool public = 5;
  // Members the caller may see.
  int32 member_count = 6;
  int32 follower_count = 7;
  // The caller follows it.
  bool following = 8;
  // The caller is a member.
  bool is_member = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message CreateListRequest {
  string name = 1;
  string description = 2;
  bool public = 3;
}

message CreateListResponse {
  NoteList list = 1;
}

message UpdateListRequest {
