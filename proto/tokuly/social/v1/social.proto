syntax = "proto3";

// The friend graph and everything playful that happens between friends:
// requests, best friends, invites, nearby discovery, bumps, buzzes, knocks
// and map reactions ("supersends"); follows (with locked accounts) and
// circles (close friends and custom lists) for what people share.
package tokuly.social.v1;

import "google/protobuf/timestamp.proto";
import "tokuly/common/v1/common.proto";
import "tokuly/identity/v1/identity.proto";

// ───────────────────────────── Friends ─────────────────────────────

// The friend graph: requests, friends, best friends, suggestions, blocks,
// invites and nearby discovery.
//
// Every RPC except ResolveInvite needs a signed-in caller. Blocking is
// silent: a user who was blocked gets the same errors as for a user that does
// not exist (USER_NOT_FOUND).
service FriendService {
  // Sends a friend request. When the target had already requested the caller
  // the two become friends right away (crossed requests auto-accept). Sending
  // the same request again returns the pending one.
  // Errors: MISSING_TARGET, USER_NOT_FOUND, CANNOT_FRIEND_SELF, USER_BLOCKED
  // (the caller blocked the target), ALREADY_FRIENDS,
  // FRIEND_REQUESTS_RESTRICTED (the target's privacy), FRIEND_LIMIT_REACHED,
  // TOO_MANY_PENDING_REQUESTS, MESSAGE_TOO_LONG, RATE_LIMITED, REQUEST_CHANGED
  // (aborted: the other side withdrew their request at the same moment; retry).
  rpc SendFriendRequest(SendFriendRequestRequest) returns (SendFriendRequestResponse);
  // Withdraws a request the caller sent. Errors: REQUEST_NOT_FOUND.
  rpc CancelFriendRequest(CancelFriendRequestRequest) returns (CancelFriendRequestResponse);
  // Accepts or declines a request addressed to the caller. Declining is
  // silent: the sender keeps seeing the request as pending.
  // Errors: REQUEST_NOT_FOUND, FRIEND_LIMIT_REACHED.
  rpc RespondFriendRequest(RespondFriendRequestRequest) returns (RespondFriendRequestResponse);
  // Pending requests in one direction, newest first.
  rpc ListFriendRequests(ListFriendRequestsRequest) returns (ListFriendRequestsResponse);

  // Friends of the caller, or of another user when their privacy allows it,
  // newest friendships first.
  // Errors: USER_NOT_FOUND, FRIEND_LIST_PRIVATE, QUERY_TOO_LONG.
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  // Ends a friendship (both sides). Errors: NOT_FRIENDS.
  rpc RemoveFriend(RemoveFriendRequest) returns (RemoveFriendResponse);
  // Relationship details between the caller and one friend. Errors: NOT_FRIENDS.
  rpc GetFriendship(GetFriendshipRequest) returns (GetFriendshipResponse);
  // Per-friend preferences (nickname, favorite, mute).
  // Errors: NOT_FRIENDS, NICKNAME_TOO_LONG, TOO_MANY_FAVORITES.
  rpc UpdateFriendPrefs(UpdateFriendPrefsRequest) returns (UpdateFriendPrefsResponse);

  // Automatically ranked closest friends plus manually starred ones.
  // Someone else's list is shown to their friends only, and only to those
  // their friend list privacy lets see it.
  // Errors: NOT_FRIENDS, FRIEND_LIST_PRIVATE.
  rpc ListBestFriends(ListBestFriendsRequest) returns (ListBestFriendsResponse);
  // "もしかして、友達!?" — friends of friends, contacts, and people met via invites.
  rpc ListSuggestions(ListSuggestionsRequest) returns (ListSuggestionsResponse);
  // Hides a suggested user from the caller's suggestions for good.
  // Errors: USER_NOT_FOUND.
  rpc DismissSuggestion(DismissSuggestionRequest) returns (DismissSuggestionResponse);
  // Matches hashed emails from the address book against discoverable accounts
  // with a verified email. The uploaded hashes are not stored. A user can
  // look up 5000 different hashes a day (sending the same ones again is
  // free), in at most 6 calls an hour.
  // Errors: TOO_MANY_CONTACTS (more than 2000), INVALID_CONTACT_HASH, RATE_LIMITED.
  rpc MatchContacts(MatchContactsRequest) returns (MatchContactsResponse);

  // Blocks a user silently: ends the friendship, drops pending requests in
  // both directions and hides both users from each other everywhere.
  // Errors: USER_NOT_FOUND, CANNOT_BLOCK_SELF, RATE_LIMITED.
  rpc BlockUser(BlockUserRequest) returns (BlockUserResponse);
  // Lifts a block (the friendship is not restored). Succeeds when not blocked.
  rpc UnblockUser(UnblockUserRequest) returns (UnblockUserResponse);
  // Users the caller blocked, most recent first.
  rpc ListBlockedUsers(ListBlockedUsersRequest) returns (ListBlockedUsersResponse);

  // Invite links and QR codes. Signing up through one counts as an "intro".
  //
  // The caller's invite, created on first use.
  rpc GetMyInvite(GetMyInviteRequest) returns (GetMyInviteResponse);
  // Replaces the caller's code; the old link stops working. Errors: RATE_LIMITED.
  rpc ResetMyInvite(ResetMyInviteRequest) returns (ResetMyInviteResponse);
  // Who an invite code belongs to. Works anonymously, so the sign-up page can
  // show the inviter. Errors: INVITE_NOT_FOUND, RATE_LIMITED.
  rpc ResolveInvite(ResolveInviteRequest) returns (ResolveInviteResponse);
  // People who joined through a user's invites, newest first. Someone else's
  // list follows their friend list privacy.
  // Errors: USER_NOT_FOUND, FRIEND_LIST_PRIVATE.
  rpc ListIntros(ListIntrosRequest) returns (ListIntrosResponse);

  // Nearby discovery: while a client keeps this stream open it is visible to,
  // and receives, other users with the add-friend screen open within ~50 m.
  // Minors and adults never see each other here.
  // The first message arrives immediately (possibly empty). The server ends
  // the stream after 10 minutes; reopen it to keep going or after moving
  // (at most 20 streams per 10 minutes). A user has one stream at a time:
  // opening a new one ends the previous one.
  // `location` must agree with the caller's own location as the server last
  // received it (LocationService / the realtime gateway): a fix from the
  // last 10 minutes (45 while staying in one spot), accurate to 100 m, not
  // from a mock location, and within a few hundred meters of the claim; a
  // fix far from the previous one counts only after a few consistent fixes
  // over two minutes. Clients report a fresh fix before opening the stream.
  // Errors: INVALID_LOCATION, NEARBY_DISCOVERY_DISABLED (the caller switched
  // off `nearby_discoverable`), LOCATION_NOT_VERIFIED (no such fix, or the
  // location is too far from it), LOCATION_TOO_COARSE (the same, while the
  // device only reports approximate locations, worse than 100 m: the client
  // asks for precise location), RATE_LIMITED.
  rpc DiscoverNearby(DiscoverNearbyRequest) returns (stream DiscoverNearbyResponse);
}

// How a friend request or friendship came to be.
enum FriendSource {
  FRIEND_SOURCE_UNSPECIFIED = 0;
  FRIEND_SOURCE_HANDLE = 1;
  FRIEND_SOURCE_QR = 2;
  FRIEND_SOURCE_INVITE_LINK = 3;
  FRIEND_SOURCE_NEARBY = 4;
  FRIEND_SOURCE_BUMP = 5;
  FRIEND_SOURCE_SUGGESTION = 6;
  FRIEND_SOURCE_CONTACTS = 7;
  FRIEND_SOURCE_PROFILE = 8;
}

message SendFriendRequestRequest {
  oneof target {
    string user_id = 1;
    string handle = 2;
  }
  FriendSource source = 3;
  // Optional short greeting shown with the request.
  string message = 4;
}

message SendFriendRequestResponse {
  // FRIENDS when the other side had already sent a request (auto-accept),
  // otherwise REQUEST_SENT.
  tokuly.identity.v1.Relationship relationship = 1;
  FriendRequest request = 2;
}

message CancelFriendRequestRequest {
  string request_id = 1;
}

message CancelFriendRequestResponse {}

message RespondFriendRequestRequest {
  string request_id = 1;
  bool accept = 2;
}

message RespondFriendRequestResponse {
  // Set when accepted.
  Friend friend = 1;
}

message FriendRequest {
  string id = 1;
  tokuly.common.v1.UserSummary from = 2;
  tokuly.common.v1.UserSummary to = 3;
  FriendSource source = 4;
  string message = 5;
  google.protobuf.Timestamp created_at = 6;
  // Friends the caller shares with the other side; 0 unless the other
  // side's friend list is visible to the caller (mutual friends are part
  // of it). The same rule holds for every mutual-friend field.
  int32 mutual_friend_count = 7;
}

enum FriendRequestDirection {
  FRIEND_REQUEST_DIRECTION_UNSPECIFIED = 0;
  // Requests waiting for my answer ("リクエスト").
  FRIEND_REQUEST_DIRECTION_INCOMING = 1;
  // Requests I sent that are pending ("保留中").
  FRIEND_REQUEST_DIRECTION_OUTGOING = 2;
}

message ListFriendRequestsRequest {
  FriendRequestDirection direction = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListFriendRequestsResponse {
  repeated FriendRequest requests = 1;
  tokuly.common.v1.PageInfo page = 2;
  int32 incoming_count = 3;
}

message Friend {
  tokuly.common.v1.UserSummary user = 1;
  google.protobuf.Timestamp friends_since = 2;
  // Private nickname set by the caller.
  string nickname = 3;
  // Manually starred.
  bool favorite = 4;
  // Rank among best friends (1 = closest); 0 when not a best friend.
  int32 best_friend_rank = 5;
  // Muted friends do not trigger notifications.
  bool muted = 6;
  tokuly.identity.v1.Status status = 7;
  // The friend has the app open right now. Always false when they do not
  // share their online status. Later changes arrive as
  // tokuly.realtime.v1.PresenceEvent.
  bool online = 8;
  // When the friend was last online; unset when unknown or not shared.
  google.protobuf.Timestamp last_seen_at = 9;
}

message ListFriendsRequest {
  // Empty = the caller.
  string user_id = 1;
  // Optional name/handle filter.
  string query = 2;
  tokuly.common.v1.PageRequest page = 3;
}

message ListFriendsResponse {
  repeated Friend friends = 1;
  tokuly.common.v1.PageInfo page = 2;
  int32 total = 3;
}

message RemoveFriendRequest {
  string user_id = 1;
}

message RemoveFriendResponse {}

message GetFriendshipRequest {
  string user_id = 1;
}

message GetFriendshipResponse {
  Friendship friendship = 1;
}

// Shared history between the caller and a friend.
message Friendship {
  Friend friend = 1;
  FriendSource source = 2;
  int32 bump_count = 3;
  google.protobuf.Timestamp last_bump_at = 4;
  // Total time physically spent together.
  int64 time_together_seconds = 5;
  // Number of nights spent at the same place.
  int32 nights_together = 6;
  // Consecutive weeks with interaction (the best-friend counter).
  int32 streak_weeks = 7;
  // Relationship titles such as "MUTUAL_LOVE" (each other's top time-together)
  // and "PARTY_PEOPLE" (frequent night meetups). The full set:
  // BFF (each other's closest friend), MUTUAL_LOVE, PARTY_PEOPLE,
  // BUMP_BUDDIES (5+ bumps in 30 days), CHATTERBOX (200+ messages and stamps
  // in 30 days), ON_FIRE (streak of 4+ weeks), NEW_FRIENDS (first week).
  repeated string titles = 8;
  // 0 unless the friend's friend list is visible to the caller.
  int32 mutual_friend_count = 9;
  // Messages + stamps exchanged in the last 30 days.
  int32 interaction_score = 10;
}

message UpdateFriendPrefsRequest {
  string user_id = 1;
  optional string nickname = 2;
  optional bool favorite = 3;
  optional bool muted = 4;
}

message UpdateFriendPrefsResponse {
  Friend friend = 1;
}

message ListBestFriendsRequest {
  // Empty = the caller. Other users' best friends are visible to their
  // friends, within the owner's friend list privacy.
  string user_id = 1;
}

message ListBestFriendsResponse {
  repeated Friend friends = 1;
}

message Suggestion {
  tokuly.common.v1.UserSummary user = 1;
  // FRIEND_OF_FRIEND | CONTACT | INVITED_BY (they invited the caller) |
  // INVITED (they joined through the caller's invite) | SAME_SCHOOL |
  // NEARBY_OFTEN
  string reason = 2;
  // Both empty unless the suggested user's friend list is visible to the
  // caller.
  int32 mutual_friend_count = 3;
  repeated tokuly.common.v1.UserSummary mutual_friends = 4;
}

message ListSuggestionsRequest {
  // 0 = 20; at most 50.
  int32 limit = 1;
}

message ListSuggestionsResponse {
  repeated Suggestion suggestions = 1;
}

message DismissSuggestionRequest {
  string user_id = 1;
}

message DismissSuggestionResponse {}

message MatchContactsRequest {
  // SHA-256 (hex) of normalized E.164 phone numbers or lowercased emails.
  // Accounts are matched by verified email; phone hashes are accepted so
  // clients can send the whole address book, but never match.
  repeated string contact_hashes = 1;
}

message MatchContactsResponse {
  repeated ContactMatch matches = 1;
}

message ContactMatch {
  string contact_hash = 1;
  tokuly.common.v1.UserSummary user = 2;
  tokuly.identity.v1.Relationship relationship = 3;
}

message BlockUserRequest {
  string user_id = 1;
}

message BlockUserResponse {}

message UnblockUserRequest {
  string user_id = 1;
}

message UnblockUserResponse {}

message ListBlockedUsersRequest {
  tokuly.common.v1.PageRequest page = 1;
}

message ListBlockedUsersResponse {
  repeated tokuly.common.v1.UserSummary users = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message Invite {
  string code = 1;
  // Full URL, also what the QR code encodes.
  string url = 2;
  int32 intro_count = 3;
}

message GetMyInviteRequest {}

message GetMyInviteResponse {
  Invite invite = 1;
}

message ResetMyInviteRequest {}

message ResetMyInviteResponse {
  Invite invite = 1;
}

message ResolveInviteRequest {
  // The invite code, or the whole invite link.
  string code = 1;
}

message ResolveInviteResponse {
  tokuly.common.v1.UserSummary inviter = 1;
  // What the caller is to the inviter; UNSPECIFIED for anonymous callers.
  tokuly.identity.v1.Relationship relationship = 2;
}

message ListIntrosRequest {
  // Empty = the caller.
  string user_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListIntrosResponse {
  repeated tokuly.common.v1.UserSummary users = 1;
  tokuly.common.v1.PageInfo page = 2;
  int32 total = 3;
}

message DiscoverNearbyRequest {
  // Where the caller is. Never shown to other users; they only get a distance.
  tokuly.common.v1.LatLng location = 1;
  // Reported GPS accuracy; widens the search radius a little (capped).
  double accuracy_meters = 2;
}

message DiscoverNearbyResponse {
  // Full current set of nearby users; sent whenever it changes.
  repeated NearbyUser users = 1;
}

message NearbyUser {
  tokuly.common.v1.UserSummary user = 1;
  // How far away they are, in bands: 10, 25, 50 or 75 ("within N m").
  // Never the exact distance.
  double distance_meters = 2;
  tokuly.identity.v1.Relationship relationship = 3;
}

// ───────────────────────────── Interactions ─────────────────────────────

// Physical-world and map interactions between friends. Every RPC needs a
// signed-in caller; the ones aimed at a user answer NOT_FRIENDS unless that
// user is a friend.
service InteractionService {
  // Call when the phone detects a shake. Two attempts within a few seconds and
  // ~30 m of each other become a bump; mutual friends are told
  // "A and B bumped!". Bumping a non-friend creates a friend request; two
  // strangers only bump when both have `nearby_discoverable` on, both are
  // minors or both adults (by their birthdates), and each is the other's
  // best match; one shake bumps at most one stranger. The
  // other participant learns about the bump through SocialEvent.bump.
  // Calling again within a few seconds returns the same bump, not a new one.
  // `location` is checked like DiscoverNearby's: a shake where the caller's
  // own recent fixes do not put them is refused before it can match anyone.
  // Errors: INVALID_LOCATION, LOCATION_NOT_VERIFIED, LOCATION_TOO_COARSE,
  // RATE_LIMITED.
  rpc Bump(BumpRequest) returns (BumpResponse);
  // The caller's bumps, newest first. Errors: INVALID_ID.
  rpc ListBumps(ListBumpsRequest) returns (ListBumpsResponse);

  // Buzz: a burst of notifications/vibration; only allowed while physically near.
  // Errors: NOT_FRIENDS, NOT_NEARBY (farther than 200 m apart, or one of the
  // two has no location from the last 10 minutes), RATE_LIMITED.
  rpc Buzz(BuzzRequest) returns (BuzzResponse);
  // Knock: a 3D knock on the friend's map screen. Repeated knocks stack.
  // Errors: NOT_FRIENDS, INVALID_KNOCK_COUNT, RATE_LIMITED.
  rpc Knock(KnockRequest) returns (KnockResponse);

  // Map reactions ("supersends"): animated emoji or stamps thrown at a friend's
  // pin or a whole gathering. They play immediately when the recipient is
  // online and are replayed on next app open otherwise.
  // Errors: NO_RECIPIENTS, TOO_MANY_RECIPIENTS (more than 50), NOT_FRIENDS,
  // INVALID_REACTION_KIND, INVALID_EMOJI, INVALID_ID (stamp), INVALID_INTENSITY,
  // RATE_LIMITED.
  rpc SendMapReaction(SendMapReactionRequest) returns (SendMapReactionResponse);
  // Reactions the caller has not acknowledged yet (oldest first, last 7 days).
  rpc ListPendingMapReactions(ListPendingMapReactionsRequest) returns (ListPendingMapReactionsResponse);
  // Marks reactions as played so they are not replayed. Unknown IDs and
  // reactions addressed to someone else are ignored.
  // Errors: INVALID_ID, TOO_MANY_IDS (more than 500).
  rpc AckMapReactions(AckMapReactionsRequest) returns (AckMapReactionsResponse);

  // Records that the caller opened a friend's pin ("eyes" / map views).
  // Repeats within a minute count once. Errors: NOT_FRIENDS, RATE_LIMITED.
  rpc RecordMapView(RecordMapViewRequest) returns (RecordMapViewResponse);
  // Who looked at my location in the last 24 h (count only unless shared).
  rpc GetMapViews(GetMapViewsRequest) returns (GetMapViewsResponse);
}

message BumpRequest {
  tokuly.common.v1.LatLng location = 1;
  double accuracy_meters = 2;
  // Device time of the shake.
  google.protobuf.Timestamp shaken_at = 3;
  // Peak acceleration magnitude in g, for ranking simultaneous candidates.
  double intensity = 4;
}

message BumpResponse {
  // Empty when nobody else shook nearby (clients may retry for a few seconds).
  repeated Bump bumps = 1;
}

message Bump {
  string id = 1;
  repeated tokuly.common.v1.UserSummary participants = 2;
  // Between the two phones for friends. For two people who were not friends
  // when they shook, each gets the position of their own shake: never
  // anything that tells them where the other was.
  tokuly.common.v1.LatLng location = 3;
  string place_name = 4;
  google.protobuf.Timestamp created_at = 5;
  // Total bumps between the caller and the other participant so far.
  int32 pair_count = 6;
  // True when this bump created a friend request instead (not yet friends).
  bool friend_request_created = 7;
}

message ListBumpsRequest {
  // Optional: only bumps involving this friend.
  string with_user_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListBumpsResponse {
  repeated Bump bumps = 1;
  tokuly.common.v1.PageInfo page = 2;
}

message BuzzRequest {
  string user_id = 1;
}

message BuzzResponse {}

message KnockRequest {
  string user_id = 1;
  // Number of knocks in this burst (1-20).
  int32 count = 2;
}

message KnockResponse {}

enum MapReactionKind {
  MAP_REACTION_KIND_UNSPECIFIED = 0;
  // Shower of hearts (tap) or one giant heart (hold).
  MAP_REACTION_KIND_HEARTS = 1;
  // "I checked on you".
  MAP_REACTION_KIND_EYES = 2;
  // "Let's hang out".
  MAP_REACTION_KIND_DRINKS = 3;
  // Any emoji, rained over the screen.
  MAP_REACTION_KIND_EMOJI = 4;
  // A stamp thrown at the pin.
  MAP_REACTION_KIND_STAMP = 5;
}

message SendMapReactionRequest {
  // One friend, or several at once (e.g. every member of a gathering).
  repeated string user_ids = 1;
  reserved 2;
  MapReactionKind kind = 3;
  // For EMOJI.
  string emoji = 4;
  // For STAMP.
  string stamp_id = 5;
  // 1 (tap) .. 5 (long press): scales the animation.
  int32 intensity = 6;
}

message SendMapReactionResponse {
  repeated MapReaction reactions = 1;
}

message MapReaction {
  string id = 1;
  tokuly.common.v1.UserSummary from = 2;
  string to_user_id = 3;
  MapReactionKind kind = 4;
  string emoji = 5;
  tokuly.common.v1.StampRef stamp = 6;
  int32 intensity = 7;
  google.protobuf.Timestamp created_at = 8;
}

message ListPendingMapReactionsRequest {}

message ListPendingMapReactionsResponse {
  repeated MapReaction reactions = 1;
}

message AckMapReactionsRequest {
  repeated string reaction_ids = 1;
}

message AckMapReactionsResponse {}

message RecordMapViewRequest {
  string user_id = 1;
}

message RecordMapViewResponse {}

message GetMapViewsRequest {}

message GetMapViewsResponse {
  // Distinct friends who looked in the last 24 h.
  int32 viewer_count = 1;
  int32 view_count = 2;
  // Viewers who share their views.
  repeated tokuly.common.v1.UserSummary viewers = 3;
}

// ───────────────────────────── Follows ─────────────────────────────

// Follows: the one-way relationship behind public content (notes, shorts,
// videos, lives, communities), next to the mutual friendship behind the map.
//
// A friendship does not imply a follow, nor the reverse: friends see what is
// shared with friends (and with followers), followers see what is shared
// with followers. Following someone never gives access to their location.
//
// Locked accounts approve every new follower. Accounts of minors (by their
// birthdate) are locked until their owner unlocks them.
//
// Every RPC needs a signed-in caller. Blocking is silent here too: a user who
// blocked the caller looks like one that does not exist (USER_NOT_FOUND), and
// a block ends follows and follow requests in both directions.
service FollowService {
  // Follows a user, or asks to when their account is locked. Following
  // someone already followed (or asking again) returns the current state.
  // Errors: MISSING_TARGET, USER_NOT_FOUND, CANNOT_FOLLOW_SELF, USER_BLOCKED
  // (the caller blocked the target), FOLLOW_LIMIT_REACHED (following plus
  // pending requests), RATE_LIMITED.
  rpc Follow(FollowRequest) returns (FollowResponse);
  // Stops following a user, or withdraws a pending request to them.
  // Succeeds when there was nothing to undo.
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
  // Removes a follower of the caller. Silent: they are not told, and can
  // follow again (or ask to, when the caller is locked). Succeeds when the
  // user does not follow the caller. Errors: RATE_LIMITED.
  rpc RemoveFollower(RemoveFollowerRequest) returns (RemoveFollowerResponse);

  // Follow requests in one direction, newest first. Incoming requests are
  // the ones the caller has not answered; outgoing ones include requests
  // that were declined (declining is silent).
  rpc ListFollowRequests(ListFollowRequestsRequest) returns (ListFollowRequestsResponse);
  // Approves or (silently) declines a request to follow the caller.
  // Errors: REQUEST_NOT_FOUND.
  rpc RespondFollowRequest(RespondFollowRequestRequest) returns (RespondFollowRequestResponse);
  // Withdraws a follow request the caller sent. Errors: REQUEST_NOT_FOUND.
  rpc CancelFollowRequest(CancelFollowRequestRequest) returns (CancelFollowRequestResponse);

  // Someone's followers, the accounts they follow, their mutual follows, or
  // their followers the caller follows too ("followed by ..."), newest
  // first, each with the caller's relationship to them. The lists of a
  // locked account are shown to the owner, their followers and their
  // friends only. People in a block with the caller are left out of lists
  // and totals alike.
  // Errors: USER_NOT_FOUND, FOLLOW_LIST_PRIVATE, QUERY_TOO_LONG.
  rpc ListFollows(ListFollowsRequest) returns (ListFollowsResponse);
  // Counts and the caller's relationship to one user (what a profile header
  // shows). Errors: USER_NOT_FOUND.
  rpc GetFollowSummary(GetFollowSummaryRequest) returns (GetFollowSummaryResponse);
  // The caller's own settings for one account they follow: mute (with an
  // optional duration) and notifications for their posts. Both are private.
  // Errors: NOT_FOLLOWING, INVALID_MUTE_DURATION.
  rpc UpdateFollowPrefs(UpdateFollowPrefsRequest) returns (UpdateFollowPrefsResponse);

  // The caller's follow settings.
  rpc GetFollowSettings(GetFollowSettingsRequest) returns (GetFollowSettingsResponse);
  // Locks or unlocks the caller's account. Unlocking approves every request
  // that is still waiting (not the declined ones).
  rpc UpdateFollowSettings(UpdateFollowSettingsRequest) returns (UpdateFollowSettingsResponse);

  // Accounts the caller may want to follow: people who follow the caller,
  // friends of friends, accounts followed by people the caller follows,
  // accounts popular among the caller's schoolmates (and other signals as
  // domains provide them). Only discoverable accounts in the caller's own
  // age group. Errors: RATE_LIMITED.
  rpc ListFollowSuggestions(ListFollowSuggestionsRequest) returns (ListFollowSuggestionsResponse);
  // Stops suggesting a user to follow, for good. Errors: USER_NOT_FOUND.
  rpc DismissFollowSuggestion(DismissFollowSuggestionRequest) returns (DismissFollowSuggestionResponse);
}

// Whether the viewer follows someone.
enum FollowState {
  FOLLOW_STATE_UNSPECIFIED = 0;
  FOLLOW_STATE_NONE = 1;
  FOLLOW_STATE_FOLLOWING = 2;
  // The viewer asked to follow a locked account and has no answer yet.
  // (A declined request also reads as REQUESTED: declining is silent.)
  FOLLOW_STATE_REQUESTED = 3;
}

// Notifications about an account's new posts.
enum FollowNotifyLevel {
  FOLLOW_NOTIFY_LEVEL_UNSPECIFIED = 0;
  // Nothing (the default).
  FOLLOW_NOTIFY_LEVEL_NONE = 1;
  // Every new post (the bell).
  FOLLOW_NOTIFY_LEVEL_ALL = 2;
}

// What the viewer is to one user, as far as follows go.
message FollowRelation {
  // Whether the viewer follows them.
  FollowState following = 1;
  // They follow the viewer ("フォローされています").
  bool follows_you = 2;
  // The two are friends (mutual, with the map).
  bool friends = 3;
  // The user is the viewer.
  bool self = 4;
  // The viewer blocked them.
  bool blocked = 5;
}

message FollowRequest {
  oneof target {
    string user_id = 1;
    string handle = 2;
  }
}

message FollowResponse {
  // FOLLOWING, or REQUESTED for a locked account.
  FollowState state = 1;
  // The pending request, when REQUESTED.
  FollowRequestEntry request = 2;
}

message UnfollowRequest {
  string user_id = 1;
}

message UnfollowResponse {}

message RemoveFollowerRequest {
  string user_id = 1;
}

message RemoveFollowerResponse {}

// A request to follow a locked account.
message FollowRequestEntry {
  string id = 1;
  tokuly.common.v1.UserSummary from = 2;
  tokuly.common.v1.UserSummary to = 3;
  google.protobuf.Timestamp created_at = 4;
  // People the viewer follows who follow the other side; 0 unless the
  // other side's follow lists are visible to the viewer.
  int32 known_follower_count = 5;
}

enum FollowRequestDirection {
  FOLLOW_REQUEST_DIRECTION_UNSPECIFIED = 0;
  // Requests waiting for the caller's answer.
  FOLLOW_REQUEST_DIRECTION_INCOMING = 1;
  // Requests the caller sent.
  FOLLOW_REQUEST_DIRECTION_OUTGOING = 2;
}

message ListFollowRequestsRequest {
  FollowRequestDirection direction = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListFollowRequestsResponse {
  repeated FollowRequestEntry requests = 1;
  tokuly.common.v1.PageInfo page = 2;
  // Requests waiting for the caller's answer.
  int32 incoming_count = 3;
}

message RespondFollowRequestRequest {
  string request_id = 1;
  bool approve = 2;
}

message RespondFollowRequestResponse {
  // The new follower, when approved.
  FollowEntry follower = 1;
}

message CancelFollowRequestRequest {
  string request_id = 1;
}

message CancelFollowRequestResponse {}

// Which list of a user's follows.
enum FollowList {
  FOLLOW_LIST_UNSPECIFIED = 0;
  // Who follows the user (the default).
  FOLLOW_LIST_FOLLOWERS = 1;
  // Whom the user follows.
  FOLLOW_LIST_FOLLOWING = 2;
  // People the user follows who follow them back.
  FOLLOW_LIST_MUTUALS = 3;
  // The user's followers the viewer follows too ("followed by ...").
  FOLLOW_LIST_KNOWN_FOLLOWERS = 4;
}

// One row of a follow list.
message FollowEntry {
  tokuly.common.v1.UserSummary user = 1;
  // When the follow in this list began.
  google.protobuf.Timestamp followed_at = 2;
  // What the viewer is to this user.
  FollowRelation relation = 3;
  // The viewer's own preferences, set only in the viewer's FOLLOWING list.
  FollowPrefs prefs = 4;
}

// What the follower keeps about one account they follow.
message FollowPrefs {
  // Muted: still followed, but left out of the follower's timelines.
  bool muted = 1;
  // When a timed mute ends; unset for a mute without end (or no mute).
  google.protobuf.Timestamp muted_until = 2;
  FollowNotifyLevel notify_level = 3;
}

message ListFollowsRequest {
  // Empty = the caller.
  string user_id = 1;
  FollowList list = 2;
  // Optional name/handle filter.
  string query = 3;
  tokuly.common.v1.PageRequest page = 4;
}

message ListFollowsResponse {
  repeated FollowEntry entries = 1;
  tokuly.common.v1.PageInfo page = 2;
  // Rows matching the query, as the caller may see them.
  int32 total = 3;
}

message GetFollowSummaryRequest {
  string user_id = 1;
}

message GetFollowSummaryResponse {
  FollowSummary summary = 1;
}

// A user's follow numbers as the viewer sees them.
message FollowSummary {
  string user_id = 1;
  // Counted like the lists: active accounts, without people in a block
  // with the viewer.
  int32 follower_count = 2;
  int32 following_count = 3;
  FollowRelation relation = 4;
  // The account approves its followers.
  bool locked = 5;
  // Followers of the user whom the viewer follows ("followed by A, B and
  // N others"); empty unless the user's lists are visible to the viewer.
  int32 known_follower_count = 6;
  repeated tokuly.common.v1.UserSummary known_followers = 7;
  // The viewer's preferences, when they follow the user.
  FollowPrefs prefs = 8;
}

message UpdateFollowPrefsRequest {
  string user_id = 1;
  // Mute or unmute.
  optional bool muted = 2;
  // With `muted: true`: how long, in seconds (1 hour to 365 days);
  // 0 = until unmuted.
  int64 mute_seconds = 3;
  optional FollowNotifyLevel notify_level = 4;
}

message UpdateFollowPrefsResponse {
  FollowPrefs prefs = 1;
}

message FollowSettings {
  // New followers need the owner's approval, and what the owner shares
  // publicly is shown to their followers (and friends) only.
  bool locked = 1;
}

message GetFollowSettingsRequest {}

message GetFollowSettingsResponse {
  FollowSettings settings = 1;
  // Requests waiting for the caller's answer.
  int32 pending_request_count = 2;
}

message UpdateFollowSettingsRequest {
  FollowSettings settings = 1;
}

message UpdateFollowSettingsResponse {
  FollowSettings settings = 1;
  // Requests approved because the account was unlocked.
  int32 approved_request_count = 2;
}

message FollowSuggestion {
  tokuly.common.v1.UserSummary user = 1;
  // Why, strongest first: FOLLOWS_YOU | FRIEND_OF_FRIEND |
  // FOLLOWED_BY_FOLLOWING | POPULAR_AT_SCHOOL, or a reason another domain
  // contributes (POPULAR_IN_COMMUNITY).
  repeated string reasons = 2;
  // People the caller follows who follow this user (up to 3), when the
  // user's lists are visible to the caller.
  repeated tokuly.common.v1.UserSummary followed_by = 3;
  int32 followed_by_count = 4;
  FollowRelation relation = 5;
}

message ListFollowSuggestionsRequest {
  // 0 = 20; at most 50.
  int32 limit = 1;
}

message ListFollowSuggestionsResponse {
  repeated FollowSuggestion suggestions = 1;
}

message DismissFollowSuggestionRequest {
  string user_id = 1;
}

message DismissFollowSuggestionResponse {}

// ───────────────────────────── Circles ─────────────────────────────

// Circles: lists of people to share with. Everyone has one built-in
// "close friends" circle (親しい友達) and can make custom ones.
//
// Members are drawn from the owner's friends and followers: a circle is an
// audience for what the owner shares, and only people who already have a
// tie to the owner can be in it (no lists of strangers). Someone who stops
// being either is taken out of the owner's circles.
//
// Members are never told which circles they are in, and cannot find out:
// adding or removing is silent and no RPC answers "am I in it". The one
// exception is content shared with close friends, which may carry a mark
// for its viewers (as on Instagram).
//
// Every RPC needs a signed-in caller and works on the caller's own circles;
// someone else's circle answers CIRCLE_NOT_FOUND.
service CircleService {
  // The caller's circles: close friends first, then custom circles in the
  // caller's order.
  rpc ListCircles(ListCirclesRequest) returns (ListCirclesResponse);
  // Errors: CIRCLE_NOT_FOUND.
  rpc GetCircle(GetCircleRequest) returns (GetCircleResponse);
  // Errors: NAME_REQUIRED, NAME_TOO_LONG, INVALID_EMOJI, TOO_MANY_CIRCLES,
  // RATE_LIMITED.
  rpc CreateCircle(CreateCircleRequest) returns (CreateCircleResponse);
  // Renames, re-emojis or recolours a custom circle (close friends only
  // takes a colour). Errors: CIRCLE_NOT_FOUND, NAME_REQUIRED, NAME_TOO_LONG,
  // INVALID_EMOJI, CLOSE_FRIENDS_FIXED.
  rpc UpdateCircle(UpdateCircleRequest) returns (UpdateCircleResponse);
  // Deletes a custom circle. Content shared with it stays visible to its
  // owner only. Errors: CIRCLE_NOT_FOUND, CLOSE_FRIENDS_FIXED.
  rpc DeleteCircle(DeleteCircleRequest) returns (DeleteCircleResponse);
  // Puts the custom circles in a new order: every custom circle's ID,
  // exactly once. Errors: INVALID_ORDER.
  rpc ReorderCircles(ReorderCirclesRequest) returns (ReorderCirclesResponse);

  // Adds people (up to 100 per call). Adding a member again is harmless.
  // Errors: CIRCLE_NOT_FOUND, INVALID_ID, TOO_MANY_IDS, NOT_CONNECTED (one of
  // them is neither a friend nor a follower of the caller), TOO_MANY_MEMBERS,
  // RATE_LIMITED.
  rpc AddCircleMembers(AddCircleMembersRequest) returns (AddCircleMembersResponse);
  // Removes people (up to 100 per call); unknown ones are ignored.
  // Errors: CIRCLE_NOT_FOUND, INVALID_ID, TOO_MANY_IDS.
  rpc RemoveCircleMembers(RemoveCircleMembersRequest) returns (RemoveCircleMembersResponse);
  // Members, most recently added first. Errors: CIRCLE_NOT_FOUND.
  rpc ListCircleMembers(ListCircleMembersRequest) returns (ListCircleMembersResponse);
  // People who can be added: the caller's friends and followers, by name,
  // each marked if already a member. Errors: CIRCLE_NOT_FOUND, QUERY_TOO_LONG.
  rpc ListCircleCandidates(ListCircleCandidatesRequest) returns (ListCircleCandidatesResponse);
}

enum CircleKind {
  CIRCLE_KIND_UNSPECIFIED = 0;
  // The one built-in list (親しい友達). Cannot be renamed or deleted.
  CIRCLE_KIND_CLOSE_FRIENDS = 1;
  CIRCLE_KIND_CUSTOM = 2;
}

// Colours of the app's palette.
enum CircleColor {
  CIRCLE_COLOR_UNSPECIFIED = 0;
  CIRCLE_COLOR_BRAND = 1;
  CIRCLE_COLOR_LIME = 2;
  CIRCLE_COLOR_SUN = 3;
  CIRCLE_COLOR_SKY = 4;
  CIRCLE_COLOR_PINK = 5;
  CIRCLE_COLOR_MINT = 6;
  CIRCLE_COLOR_CORAL = 7;
}

message Circle {
  string id = 1;
  CircleKind kind = 2;
  // Empty for close friends (clients show their own words for it).
  string name = 3;
  // One emoji, or empty.
  string emoji = 4;
  CircleColor color = 5;
  int32 member_count = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message ListCirclesRequest {}

message ListCirclesResponse {
  repeated Circle circles = 1;
}

message GetCircleRequest {
  string circle_id = 1;
}

message GetCircleResponse {
  Circle circle = 1;
}

message CreateCircleRequest {
  // 1-30 characters.
  string name = 1;
  string emoji = 2;
  CircleColor color = 3;
}

message CreateCircleResponse {
  Circle circle = 1;
}

message UpdateCircleRequest {
  string circle_id = 1;
  optional string name = 2;
  // Empty clears it.
  optional string emoji = 3;
  optional CircleColor color = 4;
}

message UpdateCircleResponse {
  Circle circle = 1;
}

message DeleteCircleRequest {
  string circle_id = 1;
}

message DeleteCircleResponse {}

message ReorderCirclesRequest {
  repeated string circle_ids = 1;
}

message ReorderCirclesResponse {
  repeated Circle circles = 1;
}

message AddCircleMembersRequest {
  string circle_id = 1;
  repeated string user_ids = 2;
}

message AddCircleMembersResponse {
  Circle circle = 1;
}

message RemoveCircleMembersRequest {
  string circle_id = 1;
  repeated string user_ids = 2;
}

message RemoveCircleMembersResponse {
  Circle circle = 1;
}

message CircleMember {
  tokuly.common.v1.UserSummary user = 1;
  google.protobuf.Timestamp added_at = 2;
  // Why they can be in the circle.
  bool friend = 3;
  bool follower = 4;
}

message ListCircleMembersRequest {
  string circle_id = 1;
  tokuly.common.v1.PageRequest page = 2;
}

message ListCircleMembersResponse {
  repeated CircleMember members = 1;
  tokuly.common.v1.PageInfo page = 2;
  int32 total = 3;
}

message CircleCandidate {
  tokuly.common.v1.UserSummary user = 1;
  bool friend = 2;
  bool follower = 3;
  // Already in the circle.
  bool member = 4;
}

message ListCircleCandidatesRequest {
  string circle_id = 1;
  // Optional name/handle filter.
  string query = 2;
  tokuly.common.v1.PageRequest page = 3;
}

message ListCircleCandidatesResponse {
  repeated CircleCandidate candidates = 1;
  tokuly.common.v1.PageInfo page = 2;
}

// ───────────────────────────── Realtime events ─────────────────────────────

// Pushed over the realtime gateway (as a tokuly.realtime.v1.Event).
message SocialEvent {
  oneof event {
    FriendRequest friend_request_received = 1;
    Friend friend_request_accepted = 2;
    // A friendship ended or a user blocked the recipient; drop them from the map.
    string friend_removed_user_id = 3;
    Bump bump = 4;
    // A bump between two of the recipient's friends ("A and B bumped!").
    // Carries no location: either of the two may hide their position from
    // the recipient.
    Bump friends_bumped = 5;
    BuzzEvent buzz = 6;
    KnockEvent knock = 7;
    MapReaction map_reaction = 8;
    // Someone opened the recipient's pin.
    MapViewEvent map_view = 9;
    // ID of a request to the recipient that its sender withdrew.
    string friend_request_cancelled_id = 10;
    // Someone asked to follow the recipient (a locked account).
    FollowRequestEntry follow_request_received = 11;
    // ID of a follow request to the recipient that its sender withdrew.
    string follow_request_cancelled_id = 12;
    // The recipient's request was approved: they follow the user now.
    FollowEntry follow_request_approved = 13;
    // Someone started following the recipient.
    FollowEntry new_follower = 14;
  }
}

message BuzzEvent {
  tokuly.common.v1.UserSummary from = 1;
  google.protobuf.Timestamp created_at = 2;
}

message KnockEvent {
  tokuly.common.v1.UserSummary from = 1;
  int32 count = 2;
  google.protobuf.Timestamp created_at = 3;
}

message MapViewEvent {
  // Set only when the viewer shares views.
  tokuly.common.v1.UserSummary viewer = 1;
  int32 viewer_count_24h = 2;
}
