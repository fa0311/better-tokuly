<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="tokuly-hosts" content="%HOST_ORIGINS%" />
    <title>割り勘</title>
    <script type="importmap">
      { "imports": { "@tokuly/miniapp": "/sdk/index.ts" } }
    </script>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; color: #17122b; }
      body { margin: 0; background: #fff8ec; }
      main { max-width: 26rem; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 14px; }
      h1 { margin: 0; font-size: 26px; }
      .card { background: #fff; border: 2px solid #17122b; border-radius: 20px; padding: 14px; display: grid; gap: 10px; }
      label { font-weight: 700; font-size: 14px; }
      input { font: inherit; font-size: 20px; padding: 10px 12px; border: 2px solid #17122b; border-radius: 14px; width: 100%; box-sizing: border-box; }
      button { font: inherit; font-weight: 800; padding: 12px 16px; border-radius: 999px; border: 2px solid #17122b; background: #ffd23f; color: #17122b; cursor: pointer; }
      button.main { background: #7c5cff; color: #fff; }
      button:disabled { opacity: 0.5; }
      .people { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
      .people li { display: flex; align-items: center; gap: 6px; background: #f1ecff; border-radius: 999px; padding: 4px 10px 4px 4px; font-weight: 700; font-size: 14px; }
      .people img, .people .dot { width: 24px; height: 24px; border-radius: 50%; background: #c9b8ff; object-fit: cover; }
      .result { font-size: 34px; font-weight: 900; margin: 0; }
      .muted { color: #6b6480; font-size: 13px; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>🧮 割り勘</h1>
      <p class="muted" id="hello">Tokulyにつないでいます…</p>
      <section class="card">
        <label for="total">合計金額（円）</label>
        <input id="total" inputmode="numeric" value="12000" />
        <div>
          <p class="muted">いっしょに払う人</p>
          <ul class="people" id="people"></ul>
        </div>
        <button type="button" id="pick">友達をえらぶ</button>
      </section>
      <section class="card">
        <p class="muted">1人あたり</p>
        <p class="result" id="each">¥12,000</p>
        <button type="button" class="main" id="share" disabled>チャットに送る</button>
      </section>
      <p class="muted" id="status" role="status"></p>
    </main>
    <script type="module" src="/app.ts"></script>
  </body>
</html>
