<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when a page cannot be loaded.
  Self-contained on purpose: no script, style, font or image of the app may be
  needed to draw it. The colours and shapes repeat src/styles.css, the theme
  and language are read the way the app stores them.
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#f4f1ff" />
    <title>Tokuly</title>
    <script>
      // Before first paint: the theme the app last used here, and its language.
      (() => {
        var root = document.documentElement;
        var theme;
        var dark;
        try {
          theme = localStorage.getItem("tokuly.theme");
          dark = theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
          root.dataset.theme = dark ? "dark" : "light";
          root.dataset.dopa = localStorage.getItem("tokuly.dopa") || "3";
          document.querySelector('meta[name="theme-color"]').content = dark ? "#0d0b14" : "#f4f1ff";
        } catch (_) {}
        var chosen = /(?:^|; )tokuly_lang=(\w+)/.exec(document.cookie);
        var language = chosen ? chosen[1] : navigator.language || "ja";
        root.lang = /^ja/i.test(language) ? "ja" : "en";
      })();
    </script>
    <style>
      :root {
        --bg: #f4f1ff;
        --surface: #ffffff;
        --ink: #17122b;
        --ink-soft: #5d5778;
        --shadow: #17122b;
        --brand: #7c5cff;
        --on-brand: #ffffff;
        --lime: #c6f24e;
        --pink: #ff5c9d;
        --sun: #ffd23f;
        color-scheme: light;
      }
      :root[data-theme="dark"] {
        --bg: #0d0b14;
        --surface: #17132a;
        --ink: #f6f3ff;
        --ink-soft: #b4adcf;
        --shadow: #000000;
        --brand: #9a82ff;
        --on-brand: #120c2b;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html {
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "M PLUS Rounded 1c", ui-rounded, "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 100%;
        margin: 0;
        padding: max(env(safe-area-inset-top), 1.5rem) max(env(safe-area-inset-right), 1rem) max(env(safe-area-inset-bottom), 1.5rem)
          max(env(safe-area-inset-left), 1rem);
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Soft colour blobs, as behind the sign-in form. */
      .blob {
        position: absolute;
        z-index: -1;
        border-radius: 50%;
        filter: blur(64px);
      }
      .blob-brand {
        top: -6rem;
        left: -5rem;
        width: 20rem;
        height: 20rem;
        background: color-mix(in srgb, var(--brand) 25%, transparent);
      }
      .blob-lime {
        top: 33%;
        right: -6rem;
        width: 24rem;
        height: 24rem;
        background: color-mix(in srgb, var(--lime) 30%, transparent);
      }
      .blob-pink {
        bottom: -7rem;
        left: 25%;
        width: 24rem;
        height: 24rem;
        background: color-mix(in srgb, var(--pink) 20%, transparent);
      }
      /* A sticker: ink outline and a hard shadow. */
      .card {
        width: 100%;
        max-width: 26rem;
        padding: 2rem 1.5rem 1.75rem;
        border: 3px solid var(--ink);
        border-radius: 2rem;
        background: var(--surface);
        box-shadow: 0 6px 0 0 var(--shadow);
        text-align: center;
      }
      .mark {
        position: relative;
        width: 6rem;
        height: 6rem;
        margin: 0 auto;
        animation: float 3s ease-in-out infinite;
      }
      .mark svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .mark .signal {
        position: absolute;
        right: -0.75rem;
        bottom: -0.25rem;
        width: 2.75rem;
        height: 2.75rem;
        transform: rotate(8deg);
      }
      h1 {
        margin: 1.25rem 0 0;
        font-size: 1.5rem;
        font-weight: 900;
        line-height: 1.35;
        text-wrap: balance;
      }
      .lead {
        margin: 0.5rem 0 0;
        color: var(--ink-soft);
        font-size: 0.9375rem;
        line-height: 1.7;
        /* Break Japanese between phrases, not in the middle of a word, where the browser can. */
        word-break: auto-phrase;
        text-wrap: balance;
      }
      button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        width: 100%;
        height: 3.5rem;
        margin-top: 1.5rem;
        padding: 0 1.75rem;
        border: 2.5px solid var(--ink);
        border-radius: 999px;
        background: var(--brand);
        box-shadow: 0 4px 0 0 var(--shadow);
        color: var(--on-brand);
        font: inherit;
        font-size: 1.125rem;
        font-weight: 900;
        cursor: pointer;
        user-select: none;
        -webkit-user-select: none;
        transition:
          transform 120ms cubic-bezier(0.34, 1.56, 0.64, 1),
          box-shadow 120ms ease-out;
      }
      button:active:not(:disabled) {
        transform: translateY(3px);
        box-shadow: 0 1px 0 0 var(--shadow);
      }
      button:disabled {
        cursor: progress;
        opacity: 0.6;
      }
      button:focus-visible {
        outline: 3px solid var(--brand);
        outline-offset: 3px;
      }
      .status {
        min-height: 1.4em;
        margin: 0.875rem 0 0;
        color: var(--ink-soft);
        font-size: 0.8125rem;
        font-weight: 700;
        line-height: 1.4;
      }
      .shake {
        animation: shake 360ms ease-in-out;
      }
      /* Only the text of the page's language is there (the script fills <html lang>). */
      :root[lang="ja"] [lang="en"],
      :root[lang="en"] [lang="ja"] {
        display: none;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }
      /* ドパガキ度 0 and the system setting: nothing moves. */
      :root[data-dopa="0"] * {
        animation: none !important;
        transition: none !important;
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
          transition: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="blob blob-brand" aria-hidden="true"></div>
    <div class="blob blob-lime" aria-hidden="true"></div>
    <div class="blob blob-pink" aria-hidden="true"></div>

    <main class="card" id="card">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="34" r="26" fill="#c6f24e" stroke="#17122b" stroke-width="3" />
          <path
            d="M32 8c-9.400 0-17 7.400-17 16.600 0 11.700 13.600 24.300 15.800 26.200a1.800 1.800 0 0 0 2.400 0C35.400 48.900 49 36.300 49 24.600 49 15.400 41.400 8 32 8Z"
            fill="#7c5cff"
            stroke="#17122b"
            stroke-width="3"
            stroke-linejoin="round"
          />
          <circle cx="32" cy="24.500" r="6.500" fill="#fff" stroke="#17122b" stroke-width="3" />
        </svg>
        <!-- No signal: three arcs, crossed out. -->
        <svg class="signal" viewBox="0 0 44 44" aria-hidden="true">
          <circle cx="22" cy="22" r="19.500" fill="#ffd23f" stroke="#17122b" stroke-width="3" />
          <g fill="none" stroke="#17122b" stroke-width="3.200" stroke-linecap="round">
            <path d="M11.500 18.500a15 15 0 0 1 21 0" />
            <path d="M15.500 23.500a9.300 9.300 0 0 1 13 0" />
            <path d="M12 32 32 11" />
          </g>
          <circle cx="22" cy="29" r="2.600" fill="#17122b" />
        </svg>
      </div>

      <h1>
        <span lang="ja">オフラインみたい…</span>
        <span lang="en">You're offline</span>
      </h1>
      <p class="lead">
        <span lang="ja">電波がとどいてないかも。つながったら自動でもどるから、ちょっと待っててね！</span>
        <span lang="en">Looks like the connection dropped. We'll bring you right back as soon as it returns!</span>
      </p>
      <button type="button" id="retry">
        <span lang="ja">もう一度ためす</span>
        <span lang="en">Try again</span>
      </button>
      <p class="status" id="status" role="status" aria-live="polite"></p>
    </main>

    <script>
      (() => {
        var TEXT = {
          ja: { checking: "つながるかチェック中…", still: "まだつながらないみたい。電波のいい場所でためしてね" },
          en: { checking: "Checking the connection…", still: "Still no connection. Try somewhere with a better signal." },
        };
        var text = TEXT[document.documentElement.lang] || TEXT.ja;
        var button = document.getElementById("retry");
        var status = document.getElementById("status");
        var card = document.getElementById("card");
        /** A check that is under way. */
        var checking = false;
        /** The person tapped the button and waits for the answer. */
        var asked = false;

        // This page stands in for the one that was asked for, so loading it again is the retry.
        // Asking for a small file first tells whether that would work, without a flash of this page.
        function retry(byHand) {
          if (byHand) {
            asked = true;
            button.disabled = true;
            status.textContent = text.checking;
          }
          if (checking) return;
          checking = true;
          // A connection that accepts the request and then says nothing counts as none.
          var timeout = new AbortController();
          var timer = setTimeout(() => {
            timeout.abort();
          }, 8000);
          fetch("/icon.svg", { cache: "no-store", signal: timeout.signal }).then(
            () => {
              location.reload();
            },
            () => {
              clearTimeout(timer);
              checking = false;
              if (!asked) return;
              asked = false;
              button.disabled = false;
              status.textContent = text.still;
              card.classList.remove("shake");
              void card.offsetWidth;
              card.classList.add("shake");
            },
          );
        }

        button.addEventListener("click", () => {
          retry(true);
        });
        // Back by itself: when the device reports a connection, when the page is looked at again,
        // and every few seconds (a weak connection never announces that it is back).
        addEventListener("online", () => {
          retry(false);
        });
        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "visible") retry(false);
        });
        setInterval(() => {
          if (document.visibilityState === "visible") retry(false);
        }, 8000);
      })();
    </script>
  </body>
</html>
