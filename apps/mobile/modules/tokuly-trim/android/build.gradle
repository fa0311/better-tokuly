plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'app.tokuly'
version = '0.1.0'

android {
  namespace "app.tokuly.trim"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
}

dependencies {
  // The Media3 version expo-video uses (expo-video/android/build.gradle): one Media3 in the app.
  def media3Version = "1.9.1"
  implementation "androidx.media3:media3-common:${media3Version}"
  implementation "androidx.media3:media3-transformer:${media3Version}"
}
