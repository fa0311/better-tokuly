appId: app.tokuly.mobile
name: Turn down the system's offer to save the password
---
# iOS offers to keep a password that was just typed in (a system sheet over
# the app) on the way out of a sign-in or sign-up form. Android does not.
- runFlow:
    when: { platform: iOS }
    commands:
      - extendedWaitUntil:
          visible: "(Not Now|今はしない)"
          timeout: 5000
          optional: true
      - runFlow:
          when:
            visible: "(Not Now|今はしない)"
          commands:
            - tapOn: "(Not Now|今はしない)"
