appId: app.tokuly.mobile
name: Open a tab
---
# TAB is the tab's id (`tab-<name>`). Right after signing in, the map can take
# the tab back (seen on the emulator): the tab is tapped until it is the one shown.
- tapOn: { id: "${TAB}" }
- repeat:
    while:
      notVisible: { id: "${TAB}", selected: true }
    times: 3
    commands:
      - tapOn: { id: "${TAB}" }
