appId: app.tokuly.mobile
name: Tap an element, scrolled into view first
---
# ID is the element's test ID. Center it before tapping so iOS cannot hit the
# tab bar when a nested scroll view exposes a partially clipped child.
- scrollUntilVisible:
    element: { id: "${ID}" }
    centerElement: true
    timeout: 20000
- tapOn: { id: "${ID}" }
