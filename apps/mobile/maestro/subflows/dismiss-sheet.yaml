appId: app.tokuly.mobile
name: Close a screen presented as a sheet
---
# Android's back button, or on iOS the sheet pulled down by its top.
- runFlow:
    when: { platform: Android }
    commands:
      - back
- runFlow:
    when: { platform: iOS }
    commands:
      - swipe:
          start: 50%, 12%
          end: 50%, 95%
          duration: 400
      - waitForAnimationToEnd:
          timeout: 3000
