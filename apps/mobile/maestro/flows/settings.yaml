appId: app.tokuly.mobile
name: Change the account's settings on native screens
env:
  PASSWORD: tokuly-e2e-pass
---
- runScript: ../scripts/web-account.js
- addMedia:
    - "../fixtures/story.jpg"
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: "welcome-screen" }
    timeout: 60000
- tapOn: { id: "welcome-sign-in" }
- tapOn: { id: "sign-in-identifier" }
- inputText: ${output.handle}
- tapOn: { id: "sign-in-password" }
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn: { id: "sign-in-submit" }
- extendedWaitUntil:
    visible: { id: "map-screen" }
    timeout: 30000
- runFlow:
    file: ../subflows/open-hub.yaml
    env: { ENTRY: settings }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 15000

# Profile: a new bio is saved and shows when the screen opens again.
- tapOn: { id: "settings-profile" }
- extendedWaitUntil:
    visible: { id: "profile-edit" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 19-profile
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: profile-bio }
- inputText: "ramen and maps"
- hideKeyboard
# The save button is below the form.
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: profile-save }
- tapOn: "OK"
- back
- tapOn: { id: "settings-profile" }
- assertVisible: "ramen and maps"

# The avatar is cropped by the system, scaled down on the phone and goes up.
- tapOn: { id: "profile-avatar-change" }
- runFlow: ../subflows/pick-first-media.yaml
- runFlow:
    when:
      visible: { id: "app.tokuly.mobile:id/crop_image_menu_crop" }
    commands:
      - tapOn: { id: "app.tokuly.mobile:id/crop_image_menu_crop" }
- runFlow:
    when: { platform: iOS }
    commands:
      - tapOn: "(Choose|選択)"
- extendedWaitUntil:
    visible: "(Picture updated!|アイコンを変えました！)"
    timeout: 30000
- tapOn: "OK"
- back

# Privacy: a choice and a switch save at once, and are still there when the screen opens again.
- tapOn: { id: "settings-privacy" }
- extendedWaitUntil:
    visible: { id: "privacy-screen" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 20-privacy
- tapOn: { id: "privacy-friendRequestsFrom" }
- tapOn: { id: "privacy-friendRequestsFrom-NOBODY" }
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: privacy-shareBattery }
- back
- tapOn: { id: "settings-privacy" }
- extendedWaitUntil:
    visible: { id: "privacy-screen" }
    timeout: 15000
- assertVisible: "だれにも|Nobody"
- back

# Notifications: what a push shows on the lock screen, and a pause that can be ended at once.
- tapOn: { id: "settings-notifications" }
- extendedWaitUntil:
    visible: { id: "push-preview-hidden" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 21-notification-settings
- tapOn: { id: "push-preview-senderOnly" }
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: push-pause-1h }
- tapOn: "OK"
- assertVisible: { id: "push-resume" }
- tapOn: { id: "push-resume" }
- tapOn: "OK"
- back

# Security: this phone among the signed-in devices; two-step verification starts with a key
# (no screenshot: that screen is hidden from capture).
- tapOn: { id: "settings-security" }
- extendedWaitUntil:
    visible: { id: "session-row" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 22-security
- tapOn: { id: "totp-enable" }
- extendedWaitUntil:
    visible: { id: "totp-secret" }
    timeout: 15000
- back
- back
