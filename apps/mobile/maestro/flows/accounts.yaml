appId: app.tokuly.mobile
name: Add a second account and switch between them
env:
  PASSWORD: tokuly-e2e-pass
---
- runScript: ../scripts/two-accounts.js
- runFlow: ../subflows/launch.yaml
- tapOn: { id: "welcome-sign-in" }
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ACCOUNT: ${output.main}
      PASSWORD: ${PASSWORD}

# A second account beside the first.
- runFlow:
    file: ../subflows/open-hub.yaml
    env: { ENTRY: settings }
- extendedWaitUntil:
    visible: { id: "settings-screen" }
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 10-settings
- tapOn: { id: "settings-accounts" }
- tapOn: { id: "accounts-add" }
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ACCOUNT: ${output.second}
      PASSWORD: ${PASSWORD}
- tapOn: { id: "tab-me" }
- extendedWaitUntil:
    visible: ${'@' + output.second}
    timeout: 15000

# Back to the first, without its password.
- runFlow:
    file: ../subflows/open-hub.yaml
    env: { ENTRY: settings }
- tapOn: { id: "settings-accounts" }
- tapOn: { id: "${'switch-' + output.main}" }
- extendedWaitUntil:
    visible: { id: "map-screen" }
    timeout: 30000
- tapOn: { id: "tab-me" }
- extendedWaitUntil:
    visible: ${'@' + output.main}
    timeout: 15000

# Signing out keeps the parked account on the device: continue as it.
- runFlow:
    file: ../subflows/open-hub.yaml
    env: { ENTRY: settings }
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: settings-sign-out }
# The button of the question, not the row behind it of the same name.
- extendedWaitUntil:
    visible: "(Sign this account out of this device.*|このアカウントをこの端末から.*)"
    timeout: 15000
- tapOn: "(Sign out|ログアウト)"
- extendedWaitUntil:
    visible: { id: "welcome-screen" }
    timeout: 15000
- tapOn: { id: "${'switch-' + output.second}" }
- extendedWaitUntil:
    visible: { id: "map-screen" }
    timeout: 30000
