appId: app.tokuly.mobile
name: Collect a finished mission's reward once, see the badges, and the quest card on the own profile
env:
  PASSWORD: tokuly-e2e-pass
---
- runScript: ../scripts/quest-missions.js
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: "welcome-screen" }
    timeout: 60000
- tapOn: { id: "welcome-sign-in" }
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ACCOUNT: ${output.me}
      PASSWORD: ${PASSWORD}

# Quests, from the last tab: the mission the script finished waits with its reward.
- runFlow:
    file: ../subflows/open-hub.yaml
    env: { ENTRY: quest }
- extendedWaitUntil:
    visible: { id: "quest-screen" }
    timeout: 15000
- assertVisible: { id: "quest-level" }
- extendedWaitUntil:
    visible: { id: "${'mission-claim-' + output.mission}" }
    timeout: 20000
- takeScreenshot: 40-quest
# A double tap sends one claim: one reward, one message.
- doubleTapOn: { id: "${'mission-claim-' + output.mission}" }
- extendedWaitUntil:
    visible: "OK"
    timeout: 15000
- tapOn: "OK"
- assertNotVisible: "OK"
- extendedWaitUntil:
    visible: { id: "${'mission-claimed-' + output.mission}" }
    timeout: 15000
- assertVisible: { id: "quest-coins" }
- takeScreenshot: 41-quest-claimed

# The collection, and one badge with the friends who have it.
- scrollUntilVisible:
    element: { id: "quest-badges" }
- tapOn: { id: "quest-badges" }
- extendedWaitUntil:
    visible: { id: "quest-badge-count" }
    timeout: 15000
- takeScreenshot: 42-quest-badges
- scrollUntilVisible:
    element: { id: "badge-chatter_bronze" }
- tapOn: { id: "badge-chatter_bronze" }
- extendedWaitUntil:
    visible: { id: "quest-badge-name" }
    timeout: 15000
- takeScreenshot: 43-quest-badge
- runFlow: ../subflows/back.yaml
- runFlow: ../subflows/back.yaml
- runFlow: ../subflows/back.yaml

# The own profile carries the level and invites to show badges.
- tapOn: { id: "tab-me" }
- scrollUntilVisible:
    element: { id: "quest-profile" }
    centerElement: true
- takeScreenshot: 44-quest-profile
