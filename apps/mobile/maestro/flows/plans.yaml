appId: app.tokuly.mobile
name: Answer a friend's plan and see its place on the map; make a plan and invite the friend
env:
  PASSWORD: tokuly-e2e-pass
---
- runScript: ../scripts/plan-friends.js
- clearKeychain
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: { id: "welcome-screen" }
    timeout: 60000
- tapOn: { id: "welcome-sign-in" }
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ACCOUNT: ${output.me}
      PASSWORD: ${PASSWORD}

# The plans, from the last tab: the friend's invitation waits under 未回答.
- runFlow:
    file: ../subflows/open-hub.yaml
    env: { ENTRY: plans }
- extendedWaitUntil:
    visible: { id: "plans-screen" }
    timeout: 15000
- tapOn: { id: "plans-filter-invited" }
- extendedWaitUntil:
    visible: ${output.title}
    timeout: 15000
- waitForAnimationToEnd
- takeScreenshot: 27-plans
- tapOn: ${output.title}

# Its screen: when, where on the map, the reminders. Going!
- extendedWaitUntil:
    visible: { id: "plan-time" }
    timeout: 15000
- assertVisible: { id: "plan-place-map" }
- assertVisible: { id: "plan-reminders" }
- tapOn: { id: "plan-rsvp-going" }
- extendedWaitUntil:
    visible: { id: "plan-rsvp-going", selected: true }
    timeout: 10000
- extendedWaitUntil:
    visible: { id: "plan-rsvp-comment" }
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: 28-plan

# A plan of their own: a day of next month, a place, the friend invited.
- runFlow: ../subflows/back.yaml
- tapOn: { id: "plans-new" }
- tapOn: { id: "plan-form-title" }
- inputText: "e2e movie"
- hideKeyboard
- tapOn: { id: "plan-when-date" }
- tapOn: { id: "plan-form-date" }
- tapOn: { id: "plan-day-next" }
- tapOn: { id: "plan-day-${output.day}" }
- tapOn: { id: "plan-form-place" }
- inputText: "Shinjuku"
- hideKeyboard
- scrollUntilVisible:
    element: { id: "plan-form-invite" }
- tapOn: { id: "plan-form-invite" }
- tapOn: { id: "plan-friend-${output.friend}" }
- tapOn: { id: "plan-friend-confirm" }
- waitForAnimationToEnd
- takeScreenshot: 29-plan-form
- scrollUntilVisible:
    element: { id: "plan-create" }
- tapOn: { id: "plan-create" }
- extendedWaitUntil:
    visible: { id: "plan-screen" }
    timeout: 15000
- assertVisible: "e2e movie"
- assertVisible: "Shinjuku"
- takeScreenshot: 30-plan-created
