appId: app.tokuly.mobile
name: Sign up, sign out, sign in again
env:
  PASSWORD: tokuly-e2e-pass
---
- runFlow: ../subflows/launch.yaml
- evalScript: ${output.handle = 'm' + Date.now().toString(36)}
- tapOn: { id: "welcome-sign-up" }
- tapOn: { id: "sign-up-display-name" }
- inputText: "Maestro"
- hideKeyboard
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: sign-up-handle }
- inputText: ${output.handle}
- hideKeyboard
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: sign-up-email }
- inputText: ${output.handle + '@e2e.tokuly.test'}
- hideKeyboard
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: sign-up-password }
- inputText: ${PASSWORD}
- hideKeyboard
- runFlow:
    file: ../subflows/tap-in-view.yaml
    env: { ID: sign-up-birthdate }
- inputText: "2008-04-01"
- hideKeyboard
- scrollUntilVisible:
    element: { id: "sign-up-submit" }
- tapOn: { id: "sign-up-terms" }
- tapOn: { id: "sign-up-submit" }
- runFlow: ../subflows/save-password-not-now.yaml
- extendedWaitUntil:
    visible: { id: "map-screen" }
    timeout: 30000

- tapOn: { id: "tab-me" }
- extendedWaitUntil:
    visible: ${'@' + output.handle}
    timeout: 15000
- runFlow:
    file: ../subflows/open-hub.yaml
    env: { ENTRY: settings }
- tapOn: { id: "settings-sign-out" }
- tapOn: "(Sign out|ログアウト)"
- extendedWaitUntil:
    visible: { id: "welcome-screen" }
    timeout: 15000

- tapOn: { id: "welcome-sign-in" }
- runFlow:
    file: ../subflows/sign-in.yaml
    env:
      ACCOUNT: ${output.handle}
      PASSWORD: ${PASSWORD}
