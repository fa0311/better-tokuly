# Maestro end-to-end flows of the phone app, against a running stack.
#
#   maestro test apps/mobile/maestro --env SERVER=http://localhost
#
# SERVER is the stack's edge as Maestro's scripts reach it: they run on the
# host, not on the device. The app is built for the address the device sees:
# in CI http://localhost too, with `adb reverse` forwarding the emulator's
# ports to the host (.github/workflows/mobile.yml). Every flow makes its own
# accounts through the API.
flows:
  - flows/*.yaml
executionOrder:
  continueOnFailure: true
