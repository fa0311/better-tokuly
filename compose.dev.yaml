# Backing services for development and CI, with the ports and credentials that
# `tools/dev/infra.sh env` describes. Use this when Docker is available; use
# `tools/dev/infra.sh up` to run the same services natively when it is not.
#
#   docker compose -f compose.dev.yaml up -d --wait
#   eval "$(tools/dev/infra.sh env)"
#   (cd backend && cargo test -p tokuly-identity)
#
# Development credentials only. The real stack is compose.yaml.

name: tokuly-dev

services:
  postgres:
    # PostgreSQL with PostGIS for amd64 and arm64; built here when the registry cannot be reached.
    image: ghcr.io/fa0311/better-tokuly/postgres:edge
    build:
      context: infra/postgres
    pull_policy: missing
    environment:
      POSTGRES_USER: tokuly
      POSTGRES_DB: tokuly
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "max_connections=400", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokuly -d tokuly"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15.3-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: tokuly
      RUSTFS_SECRET_KEY: tokuly-secret
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || curl -fsS -o /dev/null http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine
    environment:
      # The `default` user without a password, reachable from the host.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["8123:8123"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 60

  search:
    image: getmeili/meilisearch:v1.57.0
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: tokuly-meili-key
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports: ["1025:1025", "8025:8025"]

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "tokulydev: tokuly-livekit-dev-secret-0123456789"
      # Signs the webhook declared in infra/livekit/livekit.yaml; must name the key above.
      LIVEKIT_WEBHOOK_API_KEY: tokulydev
    # The webhook goes to `api:8081`: here that is the API on the host
    # (`cargo run -p tokuly-server`, TOKULY_API_LISTEN's default port). While
    # no API runs, LiveKit logs a failed delivery and carries on.
    extra_hosts: ["api:host-gateway"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro

  # The media server for live streams. On request only, because the live
  # domain's own test starts one on the same ports:
  #   docker compose -f compose.dev.yaml --profile live up -d
  #   TOKULY_DEV_MEDIAMTX=1 eval "$(tools/dev/infra.sh env)"
  mediamtx:
    profiles: [live]
    image: bluenviron/mediamtx:1.21.4
    # Your own user, so the API on the host can delete what this records.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      # The hook of the API on the host, with the development hook secret.
      MTX_AUTHHTTPADDRESS: http://mediamtx:tokuly-live-hook-dev-secret-0123456789@api:8081/hooks/live/auth
      MTX_WEBRTCADDITIONALHOSTS: localhost
    extra_hosts: ["api:host-gateway"]
    # The control API (9997) only on this machine: the API on the host reads it.
    ports: ["1935:1935", "8890:8890/udp", "8888:8888", "8889:8889", "8189:8189/udp", "9996:9996", "127.0.0.1:9997:9997"]
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ${TOKULY_DEV_HOME:-${HOME}/tokuly-dev}/data/mediamtx/recordings:/recordings
