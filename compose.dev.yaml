# Backing services for development and CI, with the ports and credentials that
# `tools/dev/infra.sh env` describes. Use this when Docker is available; use
# `tools/dev/infra.sh up` to run the same services natively when it is not.
#
#   docker compose -f compose.dev.yaml up -d --wait
#   eval "$(tools/dev/infra.sh env)"
#   (cd backend && cargo test -p tokuly-identity)
#
# Development credentials only. The real stack is compose.yaml.

name: tokuly-dev

services:
  postgres:
    image: postgis/postgis:18-3.7
    environment:
      POSTGRES_USER: tokuly
      POSTGRES_DB: tokuly
      POSTGRES_HOST_AUTH_METHOD: trust
    command: ["postgres", "-c", "max_connections=400", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tokuly -d tokuly"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.2-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15.3-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports: ["4222:4222", "8222:8222"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  storage:
    image: rustfs/rustfs:1.0.6
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_ACCESS_KEY: tokuly
      RUSTFS_SECRET_KEY: tokuly-secret
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["9000:9000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9000/health || curl -fsS -o /dev/null http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  clickhouse:
    image: clickhouse/clickhouse-server:26.9-alpine
    environment:
      # The `default` user without a password, reachable from the host.
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    ports: ["8123:8123"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8123/ping"]
      interval: 2s
      timeout: 3s
      retries: 60

  search:
    image: getmeili/meilisearch:v1.57.0
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: tokuly-meili-key
      MEILI_NO_ANALYTICS: "true"
    ports: ["7700:7700"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:7700/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports: ["1025:1025", "8025:8025"]

  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "tokulydev: tokuly-livekit-dev-secret-0123456789"
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
    volumes:
      - ./infra/livekit/livekit.yaml:/etc/livekit.yaml:ro
