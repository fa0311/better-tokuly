# The Rust toolchain of backend/rust-toolchain.toml, or another one (the MSRV check).
name: Set up Rust
description: Installs the backend's pinned Rust toolchain.
inputs:
  toolchain:
    description: A toolchain other than the pinned one.
    default: ""
runs:
  using: composite
  steps:
    - id: version
      env:
        WANTED: ${{ inputs.toolchain }}
      run: echo "toolchain=${WANTED:-$(sed -n 's/^channel = "\(.*\)"/\1/p' backend/rust-toolchain.toml)}" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master, 2026-11-15
      with:
        toolchain: ${{ steps.version.outputs.toolchain }}
