# A build cache too big for the Actions cache, kept in GHCR as ci-cache:<name> (see
# cache.sh). Restore anywhere; save on main only, so pull requests read main's cache and
# nothing piles up per branch. Overwritten versions lose their tag and are removed by
# ci-cleanup.yml. The workflow needs `packages: write` to save, `packages: read` to restore.
name: GHCR cache
description: Restore or save a build cache kept in the GitHub Container Registry.
inputs:
  mode:
    description: "`restore` or `save`."
    required: true
  name:
    description: The kind of cache, the tag in ci-cache (one per kind, no hashes in it).
    required: true
  key:
    description: What the cache was built from; a restore reports a hit when the saved key is the same.
    required: true
  path:
    description: Paths to cache, one per line (relative to the workspace, or starting with ~/).
    required: true
outputs:
  hit:
    description: "`true` when the restored cache was saved under the same key."
    value: ${{ steps.cache.outputs.hit }}
runs:
  using: composite
  steps:
    - uses: oras-project/setup-oras@5e2f2482b30b0cb3e14e67f89a80c88c659a7c63 # v2.0.3
    - id: cache
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
        KEY: ${{ inputs.key }}
        CACHE_PATHS: ${{ inputs.path }}
        TOKEN: ${{ github.token }}
        ACTOR: ${{ github.actor }}
        REPOSITORY: ${{ github.repository }}
      run: |
        oras login ghcr.io -u "$ACTOR" --password-stdin <<<"$TOKEN" >/dev/null
        paths=()
        while IFS= read -r path; do [ -z "$path" ] || paths+=("$path"); done <<<"$CACHE_PATHS"
        ref="ghcr.io/$(tr '[:upper:]' '[:lower:]' <<<"$REPOSITORY")/ci-cache:$NAME"
        "$GITHUB_ACTION_PATH/cache.sh" "$MODE" "$ref" "$KEY" "${paths[@]}" >>"$GITHUB_OUTPUT"
