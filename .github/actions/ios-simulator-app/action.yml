# The phone app built for the iOS simulator: `expo prebuild`, `pod install`
# and an xcodebuild for the runner's own architecture (Apple silicon). No
# certificates and no secrets: signed "to run locally" (ad hoc), which is
# what gives the app its entitlements on the simulator (without them the
# keychain, where the sessions are kept, refuses it). The step prints errors,
# the build result and project warnings; the full log is kept on failure.
# Expects the JavaScript workspace (setup-js) to be set up, and `packages: write`
# for the caches in GHCR.
name: iOS simulator app
description: Generate, install the pods and build the app for the simulator.
inputs:
  configuration:
    description: "`Debug` (waits for a dev server, in the dev client's launcher) or `Release` (carries its JS bundle)."
    required: true
  server-url:
    description: The Tokuly server the build talks to (EXPO_PUBLIC_TOKULY_URL); empty for the app's default.
    default: ""
outputs:
  app:
    description: Path of the built Tokuly.app.
    value: ${{ steps.build.outputs.app }}
runs:
  using: composite
  steps:
    # DerivedData and simulator apps are tied to this toolchain, not just the source tree.
    - name: Simulator toolchain
      id: toolchain
      shell: bash
      run: |
        xcode="$(xcodebuild -version | awk 'NR == 1 { version = $2 } NR == 2 { build = $3 } END { printf "%s-%s", version, build }')"
        sdk="$(xcrun --sdk iphonesimulator --show-sdk-version)"
        echo "key=${xcode}-ios${sdk}" >> "$GITHUB_OUTPUT"

    # The address is read at build time (app.config.ts, and the JS bundle).
    - name: Generate the native project
      shell: bash
      working-directory: apps/mobile
      env:
        SERVER_URL: ${{ inputs.server-url }}
      run: |
        [ -z "$SERVER_URL" ] || export EXPO_PUBLIC_TOKULY_URL="$SERVER_URL"
        pnpm exec expo prebuild --platform ios --no-install

    # Pods depend on the generated Podfile and on the JS packages that bring native code. The
    # pods and Xcode's build products are kept in GHCR (ghcr-cache): too big for the Actions cache.
    - name: CocoaPods
      id: pods
      uses: ./.github/actions/ghcr-cache
      with:
        mode: restore
        name: ios-pods
        key: ${{ hashFiles('apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json', 'pnpm-lock.yaml', 'apps/mobile/modules/*/ios/*.podspec') }}
        path: |
          ~/Library/Caches/CocoaPods
          apps/mobile/ios/Pods
    - name: Install the pods
      shell: bash
      working-directory: apps/mobile/ios
      run: pod install
    - if: github.ref == 'refs/heads/main' && steps.pods.outputs.hit != 'true'
      uses: ./.github/actions/ghcr-cache
      with:
        mode: save
        name: ios-pods
        key: ${{ hashFiles('apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json', 'pnpm-lock.yaml', 'apps/mobile/modules/*/ios/*.podspec') }}
        path: |
          ~/Library/Caches/CocoaPods
          apps/mobile/ios/Pods

    # Xcode's build products, per configuration and toolchain: written by every run on main,
    # read everywhere.
    - name: DerivedData
      uses: ./.github/actions/ghcr-cache
      with:
        mode: restore
        name: ios-derived-data-${{ inputs.configuration }}-${{ steps.toolchain.outputs.key }}
        key: ${{ github.sha }}
        path: apps/mobile/ios/build

    - name: Build for the simulator
      id: build
      shell: bash
      working-directory: apps/mobile/ios
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        SERVER_URL: ${{ inputs.server-url }}
      run: |
        set -o pipefail
        [ -z "$SERVER_URL" ] || export EXPO_PUBLIC_TOKULY_URL="$SERVER_URL"
        xcodebuild build \
          -workspace Tokuly.xcworkspace \
          -scheme Tokuly \
          -configuration "$CONFIGURATION" \
          -sdk iphonesimulator \
          -destination 'generic/platform=iOS Simulator' \
          -derivedDataPath "$PWD/build" \
          ARCHS=arm64 \
          ONLY_ACTIVE_ARCH=YES \
          CODE_SIGN_IDENTITY=- \
          COMPILER_INDEX_STORE_ENABLE=NO \
          | tee "$RUNNER_TEMP/xcodebuild.log" \
          | awk '
              index($0, ": error:") || index($0, "** BUILD") { print; next }
              index($0, ": warning:") {
                if (index($0, "/node_modules/") || index($0, "/Pods/") || index($0, "XCFrameworkIntermediates/") || index($0, "/Build/Products/")) next
                if (index($0, "libtool: warning: ") && index($0, " has no symbols")) next
                print
              }
            ' || true
        grep -q 'BUILD SUCCEEDED' "$RUNNER_TEMP/xcodebuild.log"
        echo "app=$PWD/build/Build/Products/$CONFIGURATION-iphonesimulator/Tokuly.app" >> "$GITHUB_OUTPUT"

    - if: github.ref == 'refs/heads/main'
      uses: ./.github/actions/ghcr-cache
      with:
        mode: save
        name: ios-derived-data-${{ inputs.configuration }}-${{ steps.toolchain.outputs.key }}
        key: ${{ github.sha }}
        path: apps/mobile/ios/build

    - name: Keep the build log
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: xcodebuild-log-${{ inputs.configuration }}
        path: ${{ runner.temp }}/xcodebuild.log
        retention-days: 7
