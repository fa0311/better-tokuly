# pnpm, Node, the workspace's dependencies and the generated API client: what
# every job that runs the web app, the phone app or the client packages needs.
name: Set up the JavaScript workspace
description: pnpm install and the generated API client.
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
    - uses: actions/setup-node@v7
      with:
        node-version: 26
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
    - name: Generate the API client
      run: pnpm proto:gen
      shell: bash
