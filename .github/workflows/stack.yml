# Builds the Docker images, brings the whole Compose stack up the way a
# self-hoster would, and checks it end to end (tools/ci/smoke.sh): sign-up,
# mail, an upload through object storage and the worker, map tiles, realtime.
# When that passes on a long-lived branch, the images are published to GHCR.
name: Stack

on:
  workflow_dispatch:
  push:
    branches: [main, feat/tokuly-rebuild]
    paths:
      - compose.yaml
      - infra/**
      - .env.example
      - .dockerignore
      - tools/init-env.sh
      - tools/ci/smoke.sh
      - .github/workflows/stack.yml

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  compose:
    name: Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Write .env
        run: |
          tools/init-env.sh
          # A few city blocks instead of greater Tokyo: the check needs tiles to exist, not a real map.
          sed -i 's/^TOKULY_MAP_REGION_BBOX=.*/TOKULY_MAP_REGION_BBOX=139.695,35.655,139.705,35.665/; s/^TOKULY_MAP_REGION_MAXZOOM=.*/TOKULY_MAP_REGION_MAXZOOM=12/' .env

      - name: Build the images
        run: docker compose build

      - name: Start the stack
        run: docker compose up -d

      - name: Wait until every service is healthy
        run: |
          deadline=$((SECONDS + 900))
          while :; do
            states="$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Health}} {{.ExitCode}}')"
            # Anything that exited is a failure, except the one-shot migration finishing cleanly.
            if grep -Ev '^migrate exited  ?0$' <<<"$states" | grep -q ' exited '; then
              echo "$states"; echo "a service exited"; exit 1
            fi
            if ! grep -Eq ' (starting|unhealthy) ' <<<"$states" && grep -q '^migrate exited' <<<"$states"; then
              echo "$states"; break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then echo "$states"; echo "timed out"; exit 1; fi
            sleep 5
          done

      - name: End-to-end checks
        run: tools/ci/smoke.sh http://localhost

      - name: Data survives a restart
        run: |
          docker compose down
          docker compose up -d
          for _ in $(seq 1 60); do curl -fsS -o /dev/null http://localhost/api/readyz 2>/dev/null && break; sleep 5; done
          tools/ci/smoke.sh http://localhost

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 120

      - name: Publish the images
        if: github.event_name == 'push' && success()
        env:
          REGISTRY: ghcr.io/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="$(tr '/' '-' <<<"$BRANCH")"
          for image in backend web tiles; do
            for target in "$REGISTRY/$image:$tag" "$REGISTRY/$image:sha-${GITHUB_SHA::12}"; do
              docker tag "tokuly/$image:local" "$target"
              docker push "$target"
            done
          done
