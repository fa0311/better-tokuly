# Builds the Docker images and checks the whole Compose stack end to end, on
# amd64 and arm64 (see images.yml). When that passes on main, the images are
# published to the GitHub Container Registry as `edge` — what
# `docker compose up` pulls by default.
name: Stack

on:
  workflow_dispatch:
  # Every night (04:00 JST), in case a base image moved.
  schedule:
    - cron: "0 19 * * *"
  # Whenever something that ends up in an image changes, so `edge` follows main
  # (a newer push replaces a run that is still going).
  push:
    branches: [main]
    paths:
      - backend/**
      - proto/**
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - compose.yaml
      - infra/**
      - .env.example
      - .dockerignore
      - tools/init-env.sh
      - tools/ci/smoke.sh
      - tools/ci/stack-up.sh
      - .github/workflows/stack.yml
      - .github/workflows/images.yml

concurrency:
  group: stack-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  images:
    uses: ./.github/workflows/images.yml
    with:
      tags: ${{ github.ref_name == 'main' && 'edge' || '' }}
