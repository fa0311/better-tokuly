# Removes what CI leaves behind.
#
# In the GitHub Container Registry: the images built for testing one commit
# (ci-<image>:sha-<commit>, see e2e.yml), the layer caches of pull requests
# (ci-cache:*-pr-<number>) and the DerivedData of a toolchain no longer in use
# (ci-cache:ios-derived-data-*, see ghcr-cache), once they are two weeks old, and
# versions that lost their tag to a newer build. Only packages named ci-* are
# touched: never the published images (backend, web, tiles, postgres with their
# release, `latest` and `edge` tags), and never a cache of main or of the release
# builds that is still tagged.
#
# In the Actions cache (10 GB per repository, the oldest entries are evicted
# beyond it): the caches of a pull request as soon as it is closed, and every
# night those of closed pull requests and deleted branches the close missed.
name: CI cleanup

on:
  workflow_dispatch:
  schedule:
    - cron: "30 18 * * *"
  pull_request:
    types: [closed]

permissions:
  actions: write
  packages: write

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  pull-request:
    name: Caches of the closed pull request
    # A fork's pull request gets a read-only token; the nightly run covers it.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REF: refs/pull/${{ github.event.pull_request.number }}/merge
    steps:
      - name: Delete the caches
        run: |
          ids="$(gh api --paginate "repos/$GH_REPO/actions/caches?ref=$REF&per_page=100" --jq '.actions_caches[].id')"
          for id in $ids; do gh api -X DELETE "repos/$GH_REPO/actions/caches/$id"; done
          echo "$REF: deleted $(wc -w <<<"$ids") caches"

  cleanup:
    name: Old CI images and caches
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      DAYS: 14
    steps:
      - name: Delete old versions
        run: |
          owner_kind="$(gh api "users/$OWNER" --jq 'if .type == "Organization" then "orgs" else "users" end')"
          cutoff="$(date -u -d "$DAYS days ago" +%Y-%m-%dT%H:%M:%SZ)"
          for name in ci-backend ci-web ci-tiles ci-postgres ci-cache; do
            package="$(jq -rn --arg p "$REPO/$name" '$p | @uri')"
            versions="$(gh api --paginate "$owner_kind/$OWNER/packages/container/$package/versions" 2>/dev/null || true)"
            [ -n "$versions" ] || { echo "$name: no such package"; continue; }
            # Old, and either untagged or tagged only for one commit, one pull request or one toolchain.
            old="$(jq -r --arg cutoff "$cutoff" '
              .[] | select(.updated_at < $cutoff)
              | select(.metadata.container.tags | all(startswith("sha-") or test("-pr-[0-9]+$") or startswith("ios-derived-data-")))
              | .id' <<<"$versions")"
            count=0
            for id in $old; do
              gh api -X DELETE "$owner_kind/$OWNER/packages/container/$package/versions/$id" && count=$((count + 1))
            done
            echo "$name: deleted $count old versions"
          done

      - name: Delete the Actions caches of closed pull requests and deleted branches
        run: |
          caches="$(gh api --paginate "repos/$GH_REPO/actions/caches?per_page=100" --jq '.actions_caches[] | "\(.id) \(.ref)"')"
          declare -A gone
          count=0
          while read -r id ref; do
            [ -n "$id" ] || continue
            if [ -z "${gone[$ref]+set}" ]; then
              case "$ref" in
                refs/pull/*/merge)
                  number="${ref#refs/pull/}"; number="${number%/merge}"
                  [ "$(gh api "repos/$GH_REPO/pulls/$number" --jq .state)" = open ] && gone[$ref]=0 || gone[$ref]=1 ;;
                refs/heads/*)
                  branch="$(jq -rn --arg b "${ref#refs/heads/}" '$b | @uri')"
                  gh api "repos/$GH_REPO/branches/$branch" --silent 2>/dev/null && gone[$ref]=0 || gone[$ref]=1 ;;
                *) gone[$ref]=0 ;;
              esac
            fi
            if [ "${gone[$ref]}" = 1 ]; then
              gh api -X DELETE "repos/$GH_REPO/actions/caches/$id" && count=$((count + 1))
            fi
          done <<<"$caches"
          echo "Actions cache: deleted $count entries"
