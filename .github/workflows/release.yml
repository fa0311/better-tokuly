# A tag `vX.Y.Z` (or `vX.Y.Z-something` for a pre-release) makes a release:
# the images are built for amd64 and arm64, checked end to end, published to
# the GitHub Container Registry under that version, and a GitHub Release is
# created with notes and what a self-hoster needs to run it without a checkout.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  version:
    name: Version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # 1.2.3-beta.1 is a pre-release; 1.2.3 is not, and also becomes `latest`.
          case "$version" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT"; echo "tags=$version" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT"; echo "tags=$version latest" >> "$GITHUB_OUTPUT" ;;
          esac

  images:
    needs: version
    uses: ./.github/workflows/images.yml
    with:
      tags: ${{ needs.version.outputs.tags }}

  release:
    name: GitHub Release
    needs: [version, images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: tokuly-*
          path: binaries

      - name: Package what self-hosters need
        run: |
          mkdir -p dist
          # The server binary, for people who run it without Docker.
          for pair in amd64:x86_64 arm64:aarch64; do
            chmod +x "binaries/tokuly-${pair%%:*}/tokuly"
            tar -C "binaries/tokuly-${pair%%:*}" -czf "dist/tokuly-$VERSION-linux-${pair##*:}.tar.gz" tokuly
          done
          # The Compose stack pinned to this version: unpack, run tools/init-env.sh, docker compose up -d.
          kit="tokuly-selfhost-$VERSION"
          mkdir -p "dist/$kit/tools" "dist/$kit/infra" "dist/$kit/config"
          cp compose.yaml LICENSE tokuly.example.toml "dist/$kit/"
          cp config/README.md "dist/$kit/config/"
          sed "s/^TOKULY_VERSION=.*/TOKULY_VERSION=$VERSION/" .env.example > "dist/$kit/.env.example"
          cp tools/init-env.sh "dist/$kit/tools/"
          cp -r infra/caddy infra/livekit "dist/$kit/infra/"
          tar -C dist -czf "dist/$kit.tar.gz" "$kit" && rm -r "dist/$kit"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          ls -la dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--title "Tokuly $VERSION" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS "${flags[@]}"
