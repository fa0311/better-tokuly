# A tag `vX.Y.Z` (or `vX.Y.Z-something` for a pre-release) makes a release:
# the images are built, checked end to end, published to the GitHub Container
# Registry under that version, and a GitHub Release is created with notes and
# what a self-hoster needs to run it without a checkout.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, check and publish
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Version from the tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "TOKULY_VERSION=$version" >> "$GITHUB_ENV"
          # 1.2.3-beta.1 is a pre-release; 1.2.3 is not.
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      - name: Build the images
        run: |
          tools/init-env.sh
          sed -i 's/^TOKULY_MAP_REGION_BBOX=.*/TOKULY_MAP_REGION_BBOX=139.695,35.655,139.705,35.665/; s/^TOKULY_MAP_REGION_MAXZOOM=.*/TOKULY_MAP_REGION_MAXZOOM=12/' .env
          docker compose build

      - name: Check the release candidate end to end
        run: |
          tools/ci/stack-up.sh
          tools/ci/smoke.sh http://localhost

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 120

      - name: Publish the images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in backend web tiles; do
            docker push "$REGISTRY/$image:$VERSION"
            if [ "$PRERELEASE" = false ]; then
              docker tag "$REGISTRY/$image:$VERSION" "$REGISTRY/$image:latest"
              docker push "$REGISTRY/$image:latest"
            fi
          done

      - name: Package what self-hosters need
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          # The server binary, for people who run it without Docker.
          container="$(docker create "$REGISTRY/backend:$VERSION")"
          docker cp "$container:/usr/local/bin/tokuly" dist/tokuly
          docker rm "$container" >/dev/null
          tar -C dist -czf "dist/tokuly-$VERSION-linux-x86_64.tar.gz" tokuly && rm dist/tokuly
          # The Compose stack pinned to this version: unpack, run tools/init-env.sh, docker compose up -d.
          kit="tokuly-selfhost-$VERSION"
          mkdir -p "dist/$kit/tools" "dist/$kit/infra"
          cp compose.yaml "dist/$kit/"
          sed "s/^TOKULY_VERSION=.*/TOKULY_VERSION=$VERSION/" .env.example > "dist/$kit/.env.example"
          cp tools/init-env.sh "dist/$kit/tools/"
          cp -r infra/caddy infra/livekit "dist/$kit/infra/"
          tar -C dist -czf "dist/$kit.tar.gz" "$kit" && rm -r "dist/$kit"
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)
          ls -la dist

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--title "Tokuly $VERSION" --generate-notes)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS "${flags[@]}"
