# Checks every pull request and every push to main.
#
# Each job runs only when the files it is about changed. The backend job
# builds and tests against real backing services (compose.dev.yaml), for the
# crates the change touches — see tools/ci/backend-packages.sh.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request replaces its run. On main a run that has started
# finishes, so every result is seen; only runs still waiting are replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      packages: ${{ steps.packages.outputs.flags }}
      touched: ${{ steps.packages.outputs.touched }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            proto:
              - 'proto/**'
              - 'buf.yaml'
            backend:
              - 'backend/**'
              - 'tokuly.example.toml'
              - 'proto/**'
              - 'buf.yaml'
              - 'compose.dev.yaml'
              - 'tools/ci/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'proto/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
      - name: Choose the crates to build and test
        id: packages
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then flags="$(tools/ci/backend-packages.sh "$BASE")"; else flags="$(tools/ci/backend-packages.sh)"; fi
          echo "flags=$flags" >> "$GITHUB_OUTPUT"
          echo "Crates: ${flags:-none}"
          # The crates the pull request itself edits: each is also checked on its own.
          if [ -n "$BASE" ]; then touched="$(ONLY_TOUCHED=1 tools/ci/backend-packages.sh "$BASE")"; else touched=""; fi
          echo "touched=$touched" >> "$GITHUB_OUTPUT"

  proto:
    name: API contract
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - run: buf lint
      - run: buf build -o /dev/null

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' && needs.changes.outputs.packages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PACKAGES: ${{ needs.changes.outputs.packages }}
      TOUCHED: ${{ needs.changes.outputs.touched }}
      CARGO_INCREMENTAL: "0"
      # The generated API crate is enormous; without debug info it builds faster and in less memory.
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          cache-on-failure: true
      - name: Install ffmpeg (media pipeline tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg
      # The build comes before the backing services: the compiler of the generated API crate
      # needs most of the runner's memory for a few minutes, and with the databases running
      # next to it the runner was killed (exit 143, "lost communication with the server").
      - name: Build
        working-directory: backend
        run: |
          free -m | sed -n 1,2p; df -h / | tail -1
          cargo build --locked --all-targets $PACKAGES
          free -m | sed -n 1,2p; df -h / | tail -1
      # Built together, the crates share the API packages one of them enables (cargo unifies
      # features), so a crate that forgot one of its own still compiles. Alone it does not:
      # every crate the pull request edits is checked by itself.
      - name: Each edited crate on its own
        if: env.TOUCHED != ''
        working-directory: backend
        run: |
          for crate in $(printf '%s\n' $TOUCHED | grep '^tokuly-'); do
            [ -f "crates/${crate#tokuly-}/src/lib.rs" ] || continue
            echo "::group::cargo check -p $crate --lib"
            cargo check --locked -p "$crate" --lib
            echo "::endgroup::"
          done
      - name: Start the backing services
        run: docker compose -f compose.dev.yaml up -d --wait --wait-timeout 300
      - name: Test
        working-directory: backend
        run: |
          eval "$(../tools/dev/infra.sh env)"
          cargo test --locked $PACKAGES
      - name: Service logs
        if: failure()
        run: docker compose -f compose.dev.yaml logs --tail 80

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the API client
        run: pnpm proto:gen
      # Formatting, import order and lint errors of the web app and the client packages
      # (`pnpm format:web` fixes what can be fixed).
      - name: Format and lint
        run: pnpm lint:web
      - name: Client packages
        run: pnpm --filter "./packages/*" run --if-present test
      - name: Client packages type check
        run: pnpm --filter "./packages/*" run --if-present typecheck
      # The build comes first: it writes the route tree the type check needs.
      - name: Build
        run: pnpm --filter @tokuly/web build
      - name: Type check
        run: pnpm --filter @tokuly/web typecheck
      - name: Unit tests
        run: pnpm --filter @tokuly/web test
