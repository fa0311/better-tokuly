# The phone app on iOS, on macOS runners of its own.
#
#   ios-app ─────────┬─▶ ios-e2e
#   backend-macos ───┘
#
# ios-app (every run): `expo prebuild`, `pod install` and an unsigned release
# build for the simulator. No signing and no secrets: it proves that the
# generated project, the config plugins, the pods and our own Swift
# (modules/tokuly-trim) build, and the build carries its JS bundle.
#
# ios-e2e (pushes to main, nightly, and on request; not on pull requests: it
# is slow): the Maestro flows of apps/mobile/maestro on an iPhone simulator,
# against a stack of the same commit. GitHub's macOS runners have no Docker,
# so the stack runs natively (tools/ci/native-stack.sh), with a backend built
# for macOS by backend-macos. The simulator shares the runner's network: the
# app reaches the edge as http://localhost:8080, the address it is built for.
name: iOS

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 03:00 in Japan
  pull_request:
    paths:
      - apps/mobile/**
      - packages/**
      - proto/**
      - pnpm-lock.yaml
      - .github/workflows/ios.yml
      - .github/actions/**
  push:
    branches: [main]

# A newer push to a pull request replaces its run. On main a run that has started
# finishes, so every result is seen; only runs still waiting are replaced.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The edge as the app on the simulator and Maestro's scripts both reach it.
  SERVER: http://localhost:8080
  # Pull requests only compile the app; everything else also tests it.
  END_TO_END: ${{ github.event_name != 'pull_request' }}

jobs:
  ios-app:
    name: iOS app (simulator build)
    runs-on: macos-26
    timeout-minutes: 90
    env:
      DERIVED_DATA: ${{ github.workspace }}/apps/mobile/ios/build
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js

      # The address is read at build time (app.config.ts, and the JS bundle).
      - name: Generate the native project
        working-directory: apps/mobile
        env:
          EXPO_PUBLIC_TOKULY_URL: ${{ env.SERVER }}
        run: pnpm exec expo prebuild --platform ios --no-install

      # Pods depend on the generated Podfile and on the JS packages that bring native code.
      - name: CocoaPods
        uses: actions/cache@v6
        with:
          path: |
            ~/Library/Caches/CocoaPods
            apps/mobile/ios/Pods
          key: ios-pods-${{ runner.os }}-${{ hashFiles('apps/mobile/ios/Podfile', 'apps/mobile/ios/Podfile.properties.json', 'pnpm-lock.yaml', 'apps/mobile/modules/*/ios/*.podspec') }}
          restore-keys: ios-pods-${{ runner.os }}-
      - name: Install the pods
        working-directory: apps/mobile/ios
        run: pod install

      # Xcode's build products: written on main, read everywhere (a pull request's
      # cache is its own; main's is what every branch starts from).
      - name: DerivedData
        id: derived-data
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-derived-data-release-${{ runner.os }}-${{ github.sha }}
          restore-keys: ios-derived-data-release-${{ runner.os }}-

      # A release build: it carries its JS bundle (a debug build waits for a dev server, in
      # the dev client's launcher). The runner is Apple silicon: only its simulator's
      # architecture is built. The step's output is the errors and warnings; the whole log is
      # kept when it fails.
      - name: Build for the simulator
        working-directory: apps/mobile/ios
        env:
          EXPO_PUBLIC_TOKULY_URL: ${{ env.SERVER }}
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Tokuly.xcworkspace \
            -scheme Tokuly \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED_DATA" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee "$RUNNER_TEMP/xcodebuild.log" \
            | grep -E '(: (error|warning):|\*\* BUILD)' || true
          grep -q 'BUILD SUCCEEDED' "$RUNNER_TEMP/xcodebuild.log"

      - if: github.ref == 'refs/heads/main' && steps.derived-data.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.DERIVED_DATA }}
          key: ios-derived-data-release-${{ runner.os }}-${{ github.sha }}

      # An archive keeps the bundle's symlinks and modes (an artifact alone does not).
      - name: Pack the app for the end-to-end job
        if: env.END_TO_END == 'true'
        run: ditto -c -k --keepParent "$DERIVED_DATA/Build/Products/Release-iphonesimulator/Tokuly.app" "$RUNNER_TEMP/Tokuly.app.zip"
      - if: env.END_TO_END == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/Tokuly.app.zip
          retention-days: 3
          compression-level: 0

      - name: Keep the build log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          retention-days: 7

  # The backend of the stack under test, for the runner the flows run on.
  backend-macos:
    name: Backend for macOS
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: macos-ci-profile
          cache-on-failure: true
      # The `ci` profile, as the images under test (backend/Cargo.toml).
      - name: Build
        working-directory: backend
        run: |
          cargo build --profile ci --locked -p tokuly-server
          mkdir -p "$RUNNER_TEMP/backend"
          tar -C target/ci -cf "$RUNNER_TEMP/backend/tokuly.tar" tokuly
      - uses: actions/upload-artifact@v7
        with:
          name: backend-macos
          path: ${{ runner.temp }}/backend/tokuly.tar
          retention-days: 3

  ios-e2e:
    name: iOS end to end
    needs: [ios-app, backend-macos]
    if: github.event_name != 'pull_request'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/app
      - uses: actions/download-artifact@v8
        with:
          name: backend-macos
          path: ${{ runner.temp }}/backend

      # The service binaries of tools/dev/infra.sh depend on nothing but its pinned versions.
      - name: Service binaries
        uses: actions/cache@v6
        with:
          path: ~/tokuly-dev/bin
          key: native-services-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/dev/infra.sh') }}
      # PostgreSQL, PostGIS and Valkey come from Homebrew (infra.sh install); ffmpeg is the
      # backend's own for the media pipeline (the image has a static one).
      - name: Install the services
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          TOKULY_DEV_EDGE: "1"
          TOKULY_DEV_LIVEKIT: "0"
        run: |
          brew install --quiet ffmpeg
          tools/dev/infra.sh install
      # No calls in the flows: LiveKit stays off.
      - name: Start the stack
        env:
          TOKULY_DEV_LIVEKIT: "0"
        run: |
          tar -C "$RUNNER_TEMP/backend" -xf "$RUNNER_TEMP/backend/tokuly.tar"
          tools/ci/native-stack.sh "$RUNNER_TEMP/backend/tokuly"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The newest iPhone of the newest iOS the runner has.
      - name: Boot an iPhone simulator
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")])
          phones = [d for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')"
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Install the app
        run: |
          ditto -x -k "$RUNNER_TEMP/app/Tokuly.app.zip" "$RUNNER_TEMP/app"
          xcrun simctl install "$UDID" "$RUNNER_TEMP/app/Tokuly.app"

      # On failure, also what the simulator shows and what the app logged.
      - name: Maestro flows
        run: |
          maestro test apps/mobile/maestro --platform ios --device "$UDID" --env SERVER="$SERVER" \
            --format junit --output "$RUNNER_TEMP/maestro.xml" --debug-output "$RUNNER_TEMP/maestro" || {
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/maestro-screen.png"
            xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate 'process == "Tokuly"' > "$RUNNER_TEMP/maestro-app-log.txt" || true
            exit 1
          }

      - name: Keep the Maestro output
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          path: ${{ runner.temp }}/maestro*
          retention-days: 7
      - name: Keep the stack's logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-stack-logs
          path: ~/tokuly-dev/logs
          retention-days: 7
