# The phone app's iOS side, compiled: `expo prebuild`, `pod install` and an
# ad-hoc signed build for the simulator, on a macOS runner of its own. No
# certificates and no secrets: it proves that the generated project, the config plugins, the
# pods and our own Swift (modules/tokuly-trim) build, nothing more.
#
# The Maestro flows on an iPhone simulator are ios-e2e.yml.
name: iOS

on:
  workflow_dispatch:
  # Not on pull requests: they merge without waiting for it (docs/agents/rules.md); main covers it
  # (a newer push cancels the older run), and a pull request can still start it by hand.
  push:
    branches: [main]

# A newer push replaces the run of the same branch, on main too: only the newest commit's
# result matters before a release (docs/agents/rules.md), and the runners stay free.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-app:
    name: iOS app (simulator build)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-js
      - uses: ./.github/actions/ios-simulator-app
        with:
          configuration: Debug
