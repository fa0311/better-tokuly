# The Maestro flows of apps/mobile/maestro on an iPhone simulator, against a
# stack of the same commit.
#
#   app ──────┬─▶ maestro
#   backend ──┘
#
# GitHub's macOS runners have no Docker, so the stack runs natively on the
# runner (tools/ci/native-stack.sh), with a backend built for macOS. The
# simulator shares the runner's network: the app reaches the edge as
# http://localhost:8080, the address its release build is made for.
#
# Slow, so a workflow of its own: its result never holds up the others, and it
# is not a required check (a pull request can merge before it ends). A newer
# push to a pull request cancels the run in progress.
name: iOS end to end

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 03:00 in Japan
  pull_request:
    paths:
      - apps/mobile/**
      - packages/**
      - proto/**
      - backend/**
      - pnpm-lock.yaml
      - .github/workflows/ios-e2e.yml
      - .github/actions/**
      - tools/dev/infra.sh
      - tools/ci/native-stack.sh
      - infra/caddy/**
  push:
    branches: [main]

concurrency:
  group: ios-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The edge as the app on the simulator and Maestro's scripts both reach it.
  SERVER: http://localhost:8080

jobs:
  app:
    name: iOS app (release, for the simulator)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # The app depends on nothing but these files (and the address it is built for; the
      # flows are not part of it): when they are unchanged, the one built for them is reused.
      - name: An app built from the same files
        id: cached
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/Tokuly.app.zip
          key: ios-simulator-app-${{ hashFiles('apps/mobile/**', '!apps/mobile/maestro/**', 'packages/**', 'proto/**', 'pnpm-lock.yaml', 'package.json', 'pnpm-workspace.yaml', '.github/actions/ios-simulator-app/**') }}-localhost-8080
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ./.github/actions/setup-js
      - if: steps.cached.outputs.cache-hit != 'true'
        id: build
        uses: ./.github/actions/ios-simulator-app
        with:
          configuration: Release
          server-url: ${{ env.SERVER }}
      # An archive keeps the bundle's symlinks and modes (an artifact alone does not).
      - name: Pack the app
        if: steps.cached.outputs.cache-hit != 'true'
        env:
          APP: ${{ steps.build.outputs.app }}
        run: ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/Tokuly.app.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/Tokuly.app.zip
          retention-days: 3
          compression-level: 0

  # The `ci` profile, as the images under test (backend/Cargo.toml).
  backend:
    name: Backend for macOS
    runs-on: macos-26
    # About an hour without the cache (which the repository's cache limit can evict).
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
          shared-key: macos-ci-profile
          cache-on-failure: true
      - name: Build
        working-directory: backend
        run: |
          cargo build --profile ci --locked -p tokuly-server
          mkdir -p "$RUNNER_TEMP/backend"
          tar -C target/ci -cf "$RUNNER_TEMP/backend/tokuly.tar" tokuly
      - uses: actions/upload-artifact@v7
        with:
          name: backend-macos
          path: ${{ runner.temp }}/backend/tokuly.tar
          retention-days: 3

  maestro:
    name: iOS end to end
    needs: [app, backend]
    runs-on: macos-26
    # Every step has a limit of its own too: nothing here may wait forever (a simulator that
    # never boots, a driver that never answers). The flows take most of the time.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 3
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: ios-simulator-app
          path: ${{ runner.temp }}/app
      - uses: actions/download-artifact@v8
        timeout-minutes: 5
        with:
          name: backend-macos
          path: ${{ runner.temp }}/backend

      # The service binaries of tools/dev/infra.sh depend on nothing but its pinned versions.
      # Saved as soon as they are installed: a job that fails later (the flows) keeps them.
      - name: Service binaries
        id: services
        timeout-minutes: 5
        uses: actions/cache/restore@v6
        with:
          path: ~/tokuly-dev/bin
          key: native-services-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/dev/infra.sh') }}
      # PostgreSQL, PostGIS and Valkey come from Homebrew (infra.sh install); ffmpeg is the
      # backend's own, for the media pipeline (the image carries a static one). No calls in
      # the flows: LiveKit stays off.
      - name: Install the services
        timeout-minutes: 15
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
          TOKULY_DEV_EDGE: "1"
          TOKULY_DEV_LIVEKIT: "0"
        run: |
          brew install --quiet ffmpeg
          tools/dev/infra.sh install
      - if: steps.services.outputs.cache-hit != 'true'
        timeout-minutes: 5
        uses: actions/cache/save@v6
        with:
          path: ~/tokuly-dev/bin
          key: ${{ steps.services.outputs.cache-primary-key }}
      - name: Start the stack
        timeout-minutes: 8
        env:
          TOKULY_DEV_LIVEKIT: "0"
        run: |
          tar -C "$RUNNER_TEMP/backend" -xf "$RUNNER_TEMP/backend/tokuly.tar"
          tools/ci/native-stack.sh "$RUNNER_TEMP/backend/tokuly"

      - uses: actions/setup-java@v5
        timeout-minutes: 5
        with:
          distribution: temurin
          java-version: 17
      - name: Install Maestro
        timeout-minutes: 5
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # The newest iPhone of the newest iOS the runner has.
      - name: Boot an iPhone simulator
        timeout-minutes: 10
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          ios = sorted((r for r in runtimes if ".iOS-" in r), key=lambda r: [int(p) for p in r.rsplit(".iOS-", 1)[1].split("-")])
          phones = [d for d in runtimes[ios[-1]] if d["name"].startswith("iPhone")]
          print(phones[-1]["udid"])
          ')"
          xcrun simctl list devices | grep "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "UDID=$udid" >> "$GITHUB_ENV"
      - name: Install the app
        timeout-minutes: 5
        run: |
          ditto -x -k "$RUNNER_TEMP/app/Tokuly.app.zip" "$RUNNER_TEMP/app"
          codesign --display --entitlements - "$RUNNER_TEMP/app/Tokuly.app"
          xcrun simctl install "$UDID" "$RUNNER_TEMP/app/Tokuly.app"

      # On failure, also what the simulator shows and what the app logged.
      # Maestro's driver (an XCTest runner it installs on the simulator) takes a while to
      # start on these runners; its default wait is too short.
      - name: Maestro flows
        timeout-minutes: 25
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          maestro test apps/mobile/maestro --platform ios --device "$UDID" --env SERVER="$SERVER" \
            --format junit --output "$RUNNER_TEMP/maestro.xml" --debug-output "$RUNNER_TEMP/maestro" || {
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/maestro-screen.png"
            xcrun simctl spawn "$UDID" log show --last 30m --style compact --predicate 'process == "Tokuly"' > "$RUNNER_TEMP/maestro-app-log.txt" || true
            exit 1
          }

      - name: Keep the Maestro output
        timeout-minutes: 5
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios
          # Maestro keeps each flow's commands and a screenshot of each failure under ~/.maestro/tests.
          path: |
            ${{ runner.temp }}/maestro*
            ~/.maestro/tests
          retention-days: 7
      - name: Keep the stack's logs
        timeout-minutes: 5
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: native-stack-logs
          path: ~/tokuly-dev/logs
          retention-days: 7
