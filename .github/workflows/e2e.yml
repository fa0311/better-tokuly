# Runs the browser tests (apps/web/e2e, Playwright) against the real Compose
# stack: every flow a person can do in the web app, on a phone-sized and a
# desktop-sized screen.
#
# The web image is always built from the commit under test. The backend and
# tile images are built too when the change touches them; otherwise the `edge`
# images (the newest build of main that passed the Stack workflow) are pulled,
# which keeps a web-only pull request fast.
name: Browser tests

on:
  workflow_dispatch:
  # Pull requests that change what runs in the browser. (A backend-only change is covered by
  # its own tests in the CI workflow; the stack as a whole by the Stack workflow on main.)
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/e2e.yml

# A newer push to a pull request replaces its run. On main a run that has started
# finishes, so every result is seen; only runs still waiting are replaced.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: Playwright on the Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKULY_VERSION: edge
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            server:
              - 'backend/**'
              - 'proto/**'
              - 'infra/**'
              - 'compose.yaml'

      - name: Write .env
        run: |
          tools/init-env.sh
          # A few city blocks instead of greater Tokyo, the address of an admin account the tests
          # sign up as (and verify through Mailpit; see adminAccount in apps/web/e2e/support.ts),
          # and no request limits: the tests create hundreds of accounts from one address.
          sed -i 's/^TOKULY_MAP_REGION_BBOX=.*/TOKULY_MAP_REGION_BBOX=139.695,35.655,139.705,35.665/; s/^TOKULY_MAP_REGION_MAXZOOM=.*/TOKULY_MAP_REGION_MAXZOOM=12/' .env
          echo 'TOKULY_ADMIN_USER=e2e-admin@e2e.tokuly.test' >> .env
          echo 'TOKULY_RATE_LIMITS=false' >> .env

      - name: Build the images this change touches
        run: |
          if [ "${{ steps.changed.outputs.server }}" = true ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            # The backend alone first (see images.yml: in parallel with the web build it ran out of memory).
            docker compose build --build-arg CARGO_BUILD_JOBS=4 migrate
            docker compose build
          else
            docker compose build web
          fi

      - name: Start the stack
        run: tools/ci/stack-up.sh
      # The API runs in a container: a stand-in server a test starts on this machine (the
      # local AI of chat-ai.spec.ts) is reached at the gateway of the API's network, not loopback.
      - name: Find this machine's address as the API sees it
        run: |
          gateway="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.Gateway}}{{end}}' "$(docker compose ps -q api)")"
          echo "TOKULY_E2E_HOST_FROM_API=$gateway" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the API client
        run: pnpm proto:gen
      - name: Install the browser
        run: pnpm --filter @tokuly/web exec playwright install --with-deps chrome

      - name: Browser tests
        env:
          TOKULY_WEB_URL: http://localhost
          TOKULY_MAILPIT_URL: http://localhost:8025
        run: pnpm --filter @tokuly/web e2e --workers=2

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 200 api realtime worker web edge
