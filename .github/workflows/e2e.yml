# Runs the browser tests (apps/web/e2e, Playwright) against the real Compose
# stack: every flow a person can do in the web app, on a phone-sized and a
# desktop-sized screen.
#
# The web image is always built from the commit under test. The backend and
# tile images are built too when the change touches them; otherwise the `edge`
# images (the newest build of main that passed the Stack workflow) are pulled,
# which keeps a web-only pull request fast.
name: Browser tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/web/**
      - packages/**
      - proto/**
      - pnpm-lock.yaml
      - compose.yaml
      - infra/**
      - tools/ci/**
      - .github/workflows/e2e.yml
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - .github/workflows/e2e.yml

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  e2e:
    name: Playwright on the Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TOKULY_VERSION: edge
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: dorny/paths-filter@v4
        id: changed
        with:
          filters: |
            server:
              - 'backend/**'
              - 'proto/**'
              - 'infra/**'
              - 'compose.yaml'

      - name: Write .env
        run: |
          tools/init-env.sh
          # A few city blocks instead of greater Tokyo, an admin account the tests can sign up as,
          # and no request limits: the tests create hundreds of accounts from one address.
          sed -i 's/^TOKULY_MAP_REGION_BBOX=.*/TOKULY_MAP_REGION_BBOX=139.695,35.655,139.705,35.665/; s/^TOKULY_MAP_REGION_MAXZOOM=.*/TOKULY_MAP_REGION_MAXZOOM=12/; s/^TOKULY_ADMIN_USER=.*/TOKULY_ADMIN_USER=tokuly_admin/' .env
          echo 'TOKULY_RATE_LIMITS=false' >> .env

      - name: Build the images this change touches
        run: |
          if [ "${{ steps.changed.outputs.server }}" = true ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            docker compose build
          else
            docker compose build web
          fi

      - name: Start the stack
        run: tools/ci/stack-up.sh

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate the API client
        run: pnpm proto:gen
      - name: Install the browser
        run: pnpm --filter @tokuly/web exec playwright install --with-deps chrome

      - name: Browser tests
        env:
          TOKULY_WEB_URL: http://localhost
          TOKULY_MAILPIT_URL: http://localhost:8025
        run: pnpm --filter @tokuly/web e2e --workers=2

      - name: Keep the traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/web/test-results
          retention-days: 7

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 200 api realtime worker web edge
