# Builds the Docker images for amd64 and arm64, each on a machine of that
# architecture, brings the whole Compose stack up the way a self-hoster would
# and checks it end to end (tools/ci/smoke.sh): sign-up, mail, an upload
# through object storage and the worker, map tiles, realtime.
#
# When a caller asks for tags, the images that passed are published to the
# GitHub Container Registry under those tags for both architectures.
# Used by the Stack workflow (`edge`) and the Release workflow (a version).
name: Images

on:
  workflow_call:
    inputs:
      tags:
        description: Tags to publish once the checks pass, separated by spaces. Empty builds and checks only.
        type: string
        default: ""

jobs:
  stack:
    name: Compose stack (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      # The images are built under this tag locally and renamed when published.
      TOKULY_VERSION: candidate
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Write .env
        run: |
          tools/init-env.sh
          # A few city blocks instead of greater Tokyo: the check needs tiles to exist, not a real map.
          sed -i 's/^TOKULY_MAP_REGION_BBOX=.*/TOKULY_MAP_REGION_BBOX=139.695,35.655,139.705,35.665/; s/^TOKULY_MAP_REGION_MAXZOOM=.*/TOKULY_MAP_REGION_MAXZOOM=12/' .env

      - name: Build the images
        # The backend first, alone: compiling the generated API crate in release mode next to the web
        # build ran the 16 GB amd64 runner out of memory. The second command reuses its layers.
        run: |
          docker compose build --build-arg CARGO_BUILD_JOBS=4 migrate
          docker compose build

      - name: Start the stack
        run: tools/ci/stack-up.sh

      - name: End-to-end checks
        run: tools/ci/smoke.sh http://localhost

      - name: Data survives a restart
        run: |
          docker compose down
          tools/ci/stack-up.sh
          tools/ci/smoke.sh http://localhost

      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --tail 120

      # The server binary, for people who run it without Docker (attached to releases).
      - name: Keep the server binary
        run: |
          container="$(docker create "$REGISTRY/backend:candidate")"
          docker cp "$container:/usr/local/bin/tokuly" tokuly
          docker rm "$container" >/dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: tokuly-${{ matrix.arch }}
          path: tokuly
          retention-days: 3

      - name: Push this architecture's images
        if: inputs.tags != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for image in backend web tiles postgres; do
            docker tag "$REGISTRY/$image:candidate" "$REGISTRY/$image:sha-${GITHUB_SHA::12}-${{ matrix.arch }}"
            docker push "$REGISTRY/$image:sha-${GITHUB_SHA::12}-${{ matrix.arch }}"
          done

  publish:
    name: Publish for both architectures
    needs: stack
    if: inputs.tags != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
      TAGS: ${{ inputs.tags }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - name: Join the two architectures under each tag
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          sha="sha-${GITHUB_SHA::12}"
          for image in backend web tiles postgres; do
            names=()
            for tag in "$sha" $TAGS; do names+=(-t "$REGISTRY/$image:$tag"); done
            docker buildx imagetools create "${names[@]}" "$REGISTRY/$image:$sha-amd64" "$REGISTRY/$image:$sha-arm64"
          done
